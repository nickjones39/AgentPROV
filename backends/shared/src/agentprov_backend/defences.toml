# The live defence registry (D-670; docs/reports/defence-backends/design.md §3.2). Data only.
#
# One `[[defence]]` per defence the live harness can build. The worker reads this file from the installed
# `agentprov_backend` package; T0 reads the repository copy and checks that both have the same sha256, and a live
# profile names the ids it allows (`[family.agentdojo.live] defences`; profiles v1 allow none, so every defended run is
# refused until the class-1 profiles v2 land, D-677). Third-party defence code is never copied into the repository: a
# `provisioned` entry names its pinned files, which `agentprov backends build --defence-assets ID` copies from the bare
# fetch cache into `<env>/agentprov_defences/<id>/`.
#
# Members (closed; `agentprov_backend.defences.load_registry` validates them):
#   id              the --defence value: the arm name the method's own code uses (D-670), equal to imported suffixes
#   title           one line
#   backends        backend ids that may build it
#   provider        builtin (the installed benchmark builds it) | provisioned (pinned third-party code) | port (pinned
#                   code run through a harness port, agentprov_backend/ports/<port>.py; D-674)
#   port            a port entry's harness port
#   benchmark_name  builtin: the `PipelineConfig.defense` string of the installed benchmark
#   licence         {spdx, basis}
#   guarded         {qualified name: sha256 of inspect.getsource}; the worker refuses on any difference
#   elements        the defence's pipeline elements: {match = qualified class, recorder, where?, observe?}
#                   recorder: prompt_wrapper | tool_list_filter | output_filter | executor_gate | llm_detector
#                   (llm_detector: match = "llm", the loop's model step replaced by the port's detector)
#   system_suffix   builtin spotlighting: the sentence it appends to the system message (recorded, never changed)
#   formatter       "stock" | "delimited" (the tool-output formatter the defence installs)
#   aux_llm         none | agent_endpoint (its model calls use the agent's client) | defence_endpoint (D-675)
#   requires_llm    an element class the agent's LLM element must be (stock tool_filter needs OpenAILLM)
#   suites          suite names, or ["*"]
#   assets          {python = [modules that must import]}: a missing module refuses the entry
#   [[defence.weights]] pinned model files {hub, repo, revision, licence, hosts, files = [{path, sha256, size,
#                   git_blob_sha1}]}, provisioned into the environment's offline Hugging Face cache
#   code            provisioned: {repo, commit, files = [{path, blob_sha1, sha256}], entry, kwargs}
#   denials         executor_gate: matchers over a not-executed call's error text (`hooks/defence_denial.py` schema)
#   cost            {extra_calls_per_step}: a declared prior for the GUI estimate, never a measured claim
format = "agentprov-defence-registry/0.1"

[[defence]]
id = "repeat_user_prompt"
title = "AgentDojo: repeat the user prompt after every tool batch"
backends = ["agentdojo"]
provider = "builtin"
benchmark_name = "repeat_user_prompt"
licence = { spdx = "MIT", basis = "agentdojo 0.1.35 LICENSE, (c) 2024 Debenedetti et al." }
guarded = { "agentdojo.agent_pipeline.agent_pipeline.AgentPipeline.from_config" = "c76edb55cdfe58f4ad9193f39691cf8bfde21d1c54e13fc43d9ef21704a74336", "agentdojo.agent_pipeline.basic_elements.InitQuery.query" = "edb15c15d715fe635688d74c57de304dfa39b779b421dec9cd73b0b405183188" }
elements = [{ match = "agentdojo.agent_pipeline.basic_elements.InitQuery", where = "loop", recorder = "prompt_wrapper" }]
formatter = "stock"
aux_llm = "none"
suites = ["*"]
cost = { extra_calls_per_step = 0.0 }

