# MELON (D-671, D-674): xwsdid/MELON's detectors, provisioned by digest and run through the harness port
# agentprov_backend/ports/melon.py (its client, call order and file writes; never its decision logic). Each queries the
# agent's model twice per tool batch (the real step, then the masked re-run) and embeds tool calls with OpenAI
# text-embedding-3-large through the defence endpoint (--defence-endpoint, D-675). melon_r is not built: in recovery
# mode it inserts a system message at position 0 and replaces tool messages by sanitised copies, which the recorders
# cannot attribute without shifting positions; melon_rp is absent at the pin.
[[defence]]
id = "melon"
title = "MELON: masked re-execution and tool-call embedding comparison (xwsdid/MELON)"
backends = ["agentdojo"]
provider = "port"
port = "melon"
licence = { spdx = "MIT", basis = "the LICENSE kept by the fork (upstream AgentDojo text); the fork adds no licence of its own" }
guarded = {}
elements = [{ match = "llm", where = "loop", recorder = "llm_detector" }]
formatter = "stock"
aux_llm = "defence_endpoint"
suites = ["*"]
assets = { python = ["numpy", "torch"] }
code = { repo = "https://github.com/xwsdid/MELON", commit = "71d99dfff5ef98ffb25bac451909f3e10af9e27f", files = [{ path = "src/agentdojo/agent_pipeline/pi_detector.py", blob_sha1 = "17a70c6e32ee46a79548e83a5263147231363f83", sha256 = "439d4b76344225b9e3b2e03f434e3f6e8449bfd805763e21ff239f5109da1f7d" }], entry = "src/agentdojo/agent_pipeline/pi_detector.py:MELON", kwargs = {} }
cost = { extra_calls_per_step = 1.0, embedding_calls_per_step = 2.0 }

