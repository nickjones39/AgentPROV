[project]
name = "agentprov-backend-inspect"
version = "0.1.0"
description = "AgentPROV live Inspect harness (D-660..D-669): worker ops, run plans, catalogue, identity and wire recording for Inspect benchmarks. Runs inside the per-benchmark Python 3.12 environments under envs/; imports inspect_ai only there; never imports agentprov."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Nicholas Jones" }]
dependencies = [
    "agentprov-capture",              # path source below
    "agentprov-backend",              # path source below (worker framing, transports, redactor, netguard)
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.22"        # as core (DECISIONS D-6)
exclude-newer = "2026-10-07T00:00:00Z"  # fixed RFC 3339 timestamp (G.7.1(4)); moved deliberately
default-groups = ["dev"]

[tool.uv.sources]
agentprov-capture = { path = "../../capture" }
agentprov-backend = { path = "../shared" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
