agentprov-capture = { path = "../../../../capture" }
agentprov-backend = { path = "../../../shared" }
agentprov-backend-inspect = { path = "../.." }

# D-663: the pinned dataset `agentprov backends build inspect-agentharm` provisions into <env>/share/agentprov/datasets,
# offline from AgentPROV's fetch cache (fetched 2026-10-22 with the user's consent; acquisitions.jsonl). The revision is
# the one inspect_evals 0.20.0 pins (AGENTHARM_DATASET_REVISION); agentprov_backend_inspect.benchmarks.agentharm holds the
# same digests (a backend test compares them).
[tool.agentprov.dataset]
kind = "hf"
repo = "ai-safety-institute/AgentHarm"
revision = "e23b3fe60a0da9037314b88e5ee3a0c054970dad"
