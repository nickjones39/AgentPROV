[project]
name = "agentprov-backend-inspect-agentharm"
version = "0.1.0"
description = "AgentPROV live backend environment inspect-agentharm: inspect_ai 0.3.263 + inspect_evals 0.20.0 (D-661)"
requires-python = "==3.12.*"
dependencies = [
    "agentprov-capture",              # path source below
    "agentprov-backend",              # path source below
    "agentprov-backend-inspect",      # path source below
    "inspect-ai==0.3.263",            # D-661: the kexin-xu-01-agentharm producer band
    "inspect-evals==0.20.0",          # D-661: the benchmark code of that band
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.uv]
package = false
required-version = ">=0.12.22"        # as core (DECISIONS D-6)
exclude-newer = "2026-10-07T00:00:00Z"  # fixed RFC 3339 timestamp (G.7.1(4)); shared by every backend lock
default-groups = ["dev"]
# wheels only (G.7.1(5)): every registry package of uv.lock, derived from the lock (all carry wheels); `no-build = true`
# cannot be used because the path packages are source trees.
no-build-package = [
    "agent-client-protocol",
    "aioboto3",
    "aiobotocore",
    "aiofiles",
    "aiohappyeyeballs",
    "aiohttp",
    "aioitertools",
    "aiosignal",
    "annotated-doc",
    "annotated-types",
    "anyio",
    "attrs",
    "backoff",
    "beautifulsoup4",
    "boto3",
    "botocore",
    "certifi",
    "charset-normalizer",
    "click",
    "colorama",
    "datasets",
    "debugpy",
    "dill",
    "docstring-parser",
    "fastapi",
    "filelock",
    "frozenlist",
    "fsspec",
    "h11",
