# Input of tools/gen_readme_corpora.py: one [[part]] per registry (source, part), with the execution count recorded in a
# committed file, and short curated caveats. Data, not code; the README block generated from it is never hand-edited.
#
# - count, unit, basis, evidence: the number, what it counts (Inspect samples, AgentDojo-family logs, runs, ... are one
#   execution each), how it was obtained (full import, census, trial import, mapped in memory, spec) and the
#   repo-relative file that records it. With `pointer` (RFC 6901) the JSON value must equal `count`; without it the
#   text file must state the number (1234 or 1,234). The generator and tests/repo/test_readme_corpora.py check both.
# - where: instead of a count, when no committed file records one (say where it can be found).
# - notes: caveats the profile data does not carry (decision ids). Withholding rules, copyleft, licence policy and use
#   restrictions are read from the registry and the profiles, so they are not repeated here.
# - [use]: a short label for a licence use restriction (other than copyleft), for every part of the source or, as
#   {text, parts}, for the parts it applies to.
# - [paper.<source>]: a paper the profile does not identify, found by a web search (arxiv, title, relation = describes |
#   preprint | builds_on, found = how it was matched to the source and when). The README marks it "found by web search".
# Never read a corpus or AGENTPROV_HOME for a number: the README must be the same on every machine.

[use]
agentharm = "AgentHarm's clause, use only to improve AI safety and security"
agent-security-tools-survey = { text = "AgentHarm's clause, use only to improve AI safety and security", parts = ["agentharm"] }
kexin-xu-01-agentharm = "AgentHarm's clause, use only to improve AI safety and security"
fragfuse-agentharm = "AgentHarm's clause, use only to improve AI safety and security"

[paper.openagentsafety]
arxiv = "2507.06134"
title = "OpenAgentSafety: A Comprehensive Framework for Evaluating Real-World AI Agent Safety"
relation = "describes"
found = "web search 2026-10-14: same name and task set; the first author is the repository owner (sani903); the README's citation says 'coming soon'"

[paper.whistlebench]
arxiv = "2511.17085"
title = "Why Do Language Model Agents Whistleblow?"
relation = "describes"
found = "web search 2026-10-14: the repository README links this arXiv paper"

[paper.craibench-agentdojo]
arxiv = "2503.16248"
title = "Real AI Agents with Fake Memories: Fatal Context Manipulation Attacks on Web3 Agents"
relation = "describes"
found = "web search 2026-10-14: the paper introduces CrAIBench, built on AgentDojo; its first author matches the repository owner (AthaSSiN); the repository's CITATION.bib is AgentDojo's"

[paper.seagent-agentdojo]
arxiv = "2509.22256"
title = "Secure and Efficient Access Control Framework for Computer-Use Agents via Context Space"
relation = "preprint"
found = "web search 2026-10-14: the same four authors (Gong, Li, Chang, Shen; Zhejiang University) as the Zenodo artefact of the ACSAC 2026 SEAgent paper, on intent-aware static access control (the preprint calls the system CSAgent)"

[paper.melon-agentdojo]
arxiv = "2502.05174"
title = "MELON: Provable Defense Against Indirect Prompt Injection Attacks in AI Agents"
relation = "builds_on"
found = "web search 2026-10-14: the repository README names this paper (ICML 2025) as the original its variants build on"

