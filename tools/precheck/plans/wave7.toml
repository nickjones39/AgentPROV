# Kavach: one corpus, three snapshots in the profile's part order (D-253); each part's commit is its own pin.
# The three parts share one scratch cache (~/.agentprov/migration-work/precheck/kavach-agentdojo/cache), seeded once.
[[part]]
corpus_id = "kavach-agentdojo"
source = "kavach-agentdojo"
part = "main"
l1 = ["--git", "~/.agentprov/staging/10c/kavach/Kavach.git"]

[[part]]
corpus_id = "kavach-agentdojo"
source = "kavach-agentdojo"
part = "nav-fixer2"
l1 = ["--git", "~/.agentprov/staging/10c/kavach/Kavach.git"]

[[part]]
corpus_id = "kavach-agentdojo"
source = "kavach-agentdojo"
part = "rearch-forcedformat-fix"
l1 = ["--git", "~/.agentprov/staging/10c/kavach/Kavach.git"]

# EnvironmentOptim: the 6,016 local-Qwen logs are select.redaction_pending (D-255) and the 84,360 copies
# select.owned_elsewhere: L1 classifies them excluded and never reads them; the sample frame drops whatever the
# profile's redaction_pending globs match (expected 0 rows), and l2_import refuses a sample holding one.
[[part]]
corpus_id = "environmentoptim-agentdojo"
source = "environmentoptim-agentdojo"
part = "head"
l1 = ["--git", "~/.agentprov/staging/10c/environmentoptim/EnvironmentOptim.git"]
sample = ["--exclude-profile-code", "select.redaction_pending"]

[[part]]
corpus_id = "drift1-agentdojo"
source = "drift1-agentdojo"
part = "drift"
l1 = ["--git", "~/.agentprov/staging/10c/drift-1/drift-1.git"]
