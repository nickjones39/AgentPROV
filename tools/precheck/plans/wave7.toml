# Wave 7: the six phase-10j corpora merged into main after the pre-check began (9 parts; D-250..D-258,
# docs/reports/phase10j/). Raw from the phase-10c staging copies, read only (deposit zips verified against their pins;
# bare partial clones read with lazy fetch off). L2 trees are the phase-10j trial driver's (l2_import.py kind
# "phase10j": tools/agentdojo/phase10j_trial.py _tree, git pins from a scratch cache seeded by its seed). The wave-7
# pre-registration (prereg/<corpus_id>.md, incl. the proposed STRATA keys in l1_families.py) must be committed first.
# Queue with --mem-gib 4 (largest input: authority-caps, 40 MB zip with 19,186 nested members).

[[part]]
corpus_id = "authority-caps-agentdojo"
l1_09 = true
source = "authority-caps-agentdojo"
part = "head"
l1 = ["--input", "~/.agentprov/staging/10c/zenodo-23138310/agent-authority-caps-v2.0.0.zip"]
# 21,999 selected members collapse to 18,739 executions on import (3,260 re-packed byte copies, D-250): a sampled
