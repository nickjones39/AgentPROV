[[statement]]
id = "agentharm-bundled-file-tools-fail"
item = "pre-check PC-ast-survey-agentharm-01 (source defect; inspect_evals issue 2439)"
corpora = ["ast-survey-agentharm"]
section = "known_issues"
decided = "DRAFT for the user (pre-release checks 2026-10-28); the pre-check asked for this disclosure"
source = "docs/reports/precheck/ast-survey-agentharm.md PC-ast-survey-agentharm-01; re-counted from the AER (docs/reports/release/pre-release-checks.md, check 5)"
text = "AgentHarm's file tools `read_file` and `convert_pdf_to_text` resolve the benchmark's bundled files relative to the working directory of the process, and in the survey's runs every call that named a bundled file failed with file not found (`inspect_evals` issue {{f:issue}}, which names only the benign tools; the harmful tools share the defect). {{f:samples}} of {{f:total}} samples hold at least one such failed call ({{f:benign}} benign and {{f:harmful}} harmful, of {{f:per_arm}} each). Their scores rest on a broken tool environment. The data is kept as recorded and nothing is rescored or excluded."

[statement.figures]
issue = { value = "#2439", source = "UKGovernmentBEIS/inspect_evals issue tracker" }
samples = { value = "63", source = "AER re-count 2026-10-28 (read_file error type file_not_found, 84 calls; convert_pdf_to_text not-found marker, 62 calls)" }
total = { value = "1,056", source = "corpus executions" }
benign = { value = "40", source = "AER re-count 2026-10-28" }
harmful = { value = "23", source = "AER re-count 2026-10-28" }
per_arm = { value = "528", source = "corpus executions per arm" }
