source = "docs/architecture/DECISIONS.md D-771; profile survey-runs@3 [withhold]; seal dry run plan (docs/reports/release/pre-release-checks.md, check 5)"
text = "{{f:objects}} raw context files of the survey repository (console logs of the benchmark runs) name a workstation account in a home-directory path. They are withheld from this release by a rule of the source profile (reason personal data); `WITHHELD.json` lists each with its pinned origin, from which it can be fetched again. No AER, SEM or PROV record holds the path, so no execution is withheld."

[statement.figures]
