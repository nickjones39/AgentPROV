[[statement]]
id = "checker-outcome-inferred"
item = "D-359 (Option A kept, user 2026-10-28); pre-check PC-mandate-agentdojo-eval-04"
corpora = ["mandate-agentdojo-eval", "agentdojo-upstream-head"]
section = "known_issues"
decided = "DRAFT for the user (pre-release checks 2026-10-28)"
source = "docs/architecture/DECISIONS.md D-359; docs/reports/regeneration/option-b-deferred.md; re-counted from the SEM layer (docs/reports/release/pre-release-checks.md, check 5)"
text = "The rule that reads AgentDojo's own checker result (`agentdojo.checker_outcome@1`) lists only the AgentDojo commit at which its code was verified. These logs were produced at other AgentDojo commits, so they cite the rule's unverified twin, and every security outcome that rests on it is recorded as inferred (class I) rather than derived from observed evidence (class D): {{f:mandate}} security outcomes in `mandate-agentdojo-eval` and {{f:head}} in `agentdojo-upstream-head`. A read-only comparison of the checker code at those commits found no change in how the result is computed or stored. The outcome values are as logged; only their evidence class differs. Analyses that keep only class D outcomes drop these security outcomes."

[statement.figures]
mandate = { value = "369", source = "SEM census, p10 to rg1 (D-359; re-counted 2026-10-28)" }
head = { value = "11,236", source = "SEM census, p10 to rg1, v1.k14 logs (D-359; re-counted 2026-10-28)" }

[[statement]]
id = "survey-console-logs-withheld"
item = "D-771 (pre-check PC-ast-survey-agentdojo-13; user decision (a), 2026-10-23)"
