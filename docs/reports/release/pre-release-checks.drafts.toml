text = "In {{f:logs}} of the survey's Inspect `.eval` logs, the header member records the dataset location as a path in a workstation account's home directory. Those header members and the `.eval` archives that hold them ({{f:objects}} raw objects) are withheld from this release by a rule of the source profile (reason personal data); `WITHHELD.json` lists each with its pinned origin. The samples are released: no AER, SEM or PROV record holds the path, so no execution is withheld."

