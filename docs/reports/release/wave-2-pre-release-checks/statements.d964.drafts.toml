[[statement]]
id = "release-scan-review-withheld-atia-benchmark"
item = "D-964 (C-8); decision 11 of the wave-2 pre-release checks"
corpora = ["atia-benchmark"]
section = "known_issues"
decided = "the orchestrator under the user's delegation of decision 11 (2026-10-29); APPROVAL PENDING for this wording"
source = "docs/reports/release/wave-2-pre-release-checks.md (decision 11); ~/.agentprov/migration-work/wave-2/secret-review/decisions.toml; seal dry run at 54719b06"
text = "A one-time review of the release scan's secret findings could not show {{f:findings}} credential-like values in this corpus to be benchmark data, model output or something other than a credential. They are withheld from this release, reason `secret`, with the raw objects that hold them ({{f:objects}} raw objects). {{f:executions}} executions whose records or primary raw object hold one are withheld too; the other executions stay released. The corpus spec lists the objects by digest and the executions by id, `WITHHELD.json` lists each with its pinned origin, and no withheld value is recorded."

[statement.figures]
findings = { value = "3", source = "secret-review group G12; seal dry run at 54719b06 (rule secret-withheld)" }
objects = { value = "3", source = "secret-review group G12; seal dry run at 54719b06 (rule secret-withheld)" }
executions = { value = "3", source = "secret-review group G12; seal dry run at 54719b06 (rule secret-withheld)" }

