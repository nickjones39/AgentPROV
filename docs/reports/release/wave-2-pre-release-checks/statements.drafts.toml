source = "docs/architecture/DECISIONS.md D-344; profile controlarena-persistent@4 [withhold]; seal dry run plan (docs/reports/release/wave-2-pre-release-checks.md, check 5)"
text = "Every sample of this AI-control setting holds a generated API key in its metadata, which the records carry, and the setting plants further credentials in its tasks. By the profile's withholding rules (reason `secret`) every execution is withheld with its derived records, and so are the raw logs that hold such values: this release holds no execution. It holds the corpus manifest, this datasheet, the rules and the ledger `WITHHELD.json`, which lists each of the {{f:executions}} withheld executions and {{f:objects}} withheld raw objects with its pinned origin, from which they can be fetched again. No withheld value is recorded."

