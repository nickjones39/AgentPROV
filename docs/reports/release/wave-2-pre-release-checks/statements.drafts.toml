[[statement]]
id = "what-surrounds-benchmark-home-path"
item = "pre-check PC-what-surrounds-04 (CC-03); wave-2 pre-release checks, check 4"
corpora = ["what-surrounds"]
section = "known_issues"
decided = "user, 2026-10-29 (wave-2 pre-release checks, batch 1; approved in the session window)"
source = "docs/reports/precheck/what-surrounds.md PC-what-surrounds-04; release-scan forecast at main 9a44a2b7 (docs/reports/release/wave-2-pre-release-checks.md, check 4)"
text = "The study's runs quote a passage of the MCPTox benchmark that holds a home-directory path (`/home/<name>`). It names no workstation account of the study: it is benchmark text, also quoted in the deposit's paper. The quote is kept verbatim in the raw logs and in the source-quote field of {{f:executions}} execution records (`/ext/wirelog/meta/source_quote`), and the release scan triages its {{f:findings}} account-path findings as synthetic-benchmark findings."

[statement.figures]
executions = { value = "916", source = "release-scan forecast at main 9a44a2b7 (account ordinal #1: 916 AER execution records); pre-check H-13 (P1 120 + P2 796)" }
findings = { value = "1,849", source = "release-scan forecast at main 9a44a2b7 (916 AER + 933 raw-object account-path findings, one name)" }

[[statement]]
id = "credleak-canary-runs-withheld"
item = "D-265 (phase 10k withholding policy) and D-605 (account paths, applying D-604)"
corpora = ["credleak-p15b"]
section = "known_issues"
decided = "user, D-265 (2026-10-13) and D-605 (2026-10-21); disclosure approved 2026-10-29 (wave-2 pre-release checks, batch 1)"
source = "docs/architecture/DECISIONS.md D-265, D-605; profile credleak-p15b@2 [withhold]; seal dry run plan at main 9a44a2b7 (docs/reports/release/wave-2-pre-release-checks.md, check 5)"
text = "The study planted canary credentials in its tasks. Every raw object that holds one is withheld from this release (reason `secret`): {{f:cells}} raw cells, the collector log and the deposit archive, together with the {{f:canary_executions}} executions whose derived records hold a canary value. A further {{f:account_cells}} raw cells and {{f:account_executions}} executions are withheld because they hold a workstation account path (reason personal data). In all {{f:executions}} of the deposit's {{f:total}} runs are withheld; `WITHHELD.json` lists each withheld object and execution with its pinned origin, and no withheld value is recorded."

[statement.figures]
cells = { value = "325", source = "D-265 census; seal dry run plan (326 secret objects by profile rule = 325 cells + the collector log)" }
canary_executions = { value = "5,422", source = "D-265 census (derived-hit escalation, D-235); profile credleak-p15b@2 census note" }
account_cells = { value = "21", source = "D-605 census; seal dry run plan (21 personal_data objects by profile rule)" }
account_executions = { value = "7", source = "D-605 census (profile credleak-p15b@2 note)" }
executions = { value = "5,429", source = "seal dry run plan (withheld executions)" }
total = { value = "19,636", source = "corpus.json counts.executions of the working tree" }
[[statement]]
id = "fictional-benchmark-personas-agentdyn-b"
item = "D-810 (release-scan-email-design.md section 13)"
corpora = ["agentdyn-b"]
section = "known_issues"
decided = "user via the orchestrator, 2026-10-28 (D-810; release-scan-email-design.md section 13); statement 4 worded for D-961/D-962; figures counted 2026-10-29 by the wave-2 pre-release checks; APPROVAL PENDING"
source = "docs/reports/release/release-scan-email-design.md sections 12 to 14; seal dry run and release-scan forecast at main 9a44a2b7 or later (wave-2 pre-release checks 2026-10-29); D-962 origins pass"
text = "The benchmark invents people, and this corpus quotes their e-mail addresses verbatim wherever the benchmark, the agent or a tool wrote them: {{f:upstream}} distinct addresses occur in the benchmark's own published data at its pinned commit, and {{f:input}} more are first supplied in the logged runs by the benchmark's prompts, tool results, injections or defences. They belong to the benchmark's scenarios, not to anyone the runs involved, and were not checked one by one. The release scan triages each by its digest (the corpus's persona files, which never hold an address) as synthetic-benchmark; addresses at the domains reserved for documentation and testing are triaged as false positives."

[statement.figures]
