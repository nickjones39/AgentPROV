reason = "coding-agent operating notes (P-3a)"

[[exclude]]
path = ".claude/"
reason = "coding-agent permission settings of the development checkout (P-3a)"

[[exclude]]
path = "AGENTS.md"
reason = "coding-agent project memory (P-3a)"

[[exclude]]
path = "docs/agents/"
reason = "coding-agent session briefs and history (P-3a)"

[[exclude]]
path = "docs/mac-studio-handoff.md"
reason = "machine hand-over notes for coding agents (P-3a)"

[[exclude]]
path = "docs/user-guide/_go-live.md"
reason = "internal orchestration checklists of the user guide (Q14, user 2026-10-30)"

[[exclude]]
path = "docs/user-guide/_findings.md"
reason = "internal orchestration checklists of the user guide (Q14, user 2026-10-30)"

[[exclude]]
