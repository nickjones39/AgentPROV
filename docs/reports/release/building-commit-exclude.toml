# What the building-commit snapshots of the Zenodo software record leave out, beyond the private fixtures (U-06, D-943).
# Read by tools/building_commit_snapshots.py build --exclude-list (format of public-export.toml's [[exclude]] tables).
# The user's decision of 2026-10-30 (public-repo plan P-3a, relayed by the orchestrator): "yes only in the new repo,
# also when making the software doi make sure to exclude these files too for this in zenodo". The coding-agent
# instruction and memory files stay in the development repository; no file here is in any stage scope. The two
# user-guide checklists follow the public export (Q14; the user's yes of 2026-10-30, relayed by the orchestrator).
# The review and workflow files follow the public export too (D-1004; the user's yes of 2026-10-30, "add them to the
# snapshot exclusions and rebuild").

[[exclude]]
