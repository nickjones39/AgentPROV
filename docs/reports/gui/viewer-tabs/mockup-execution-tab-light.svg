  <line x1="0" y1="52" x2="1360" y2="52" stroke="#dcdcde"/>
  <circle cx="20" cy="20" r="6" fill="#ff5f57"/><circle cx="40" cy="20" r="6" fill="#febc2e"/><circle cx="60" cy="20" r="6" fill="#28c840"/>
  <text x="240" y="23" font-weight="600" font-size="13">AgentPROV</text>
  <text x="240" y="40" font-size="11" fill="#6e6e73">corpus-x · working · 38,281 executions</text>
  <g fill="#6e6e73" font-size="12">
    <text x="1060" y="31">⟲</text><text x="1088" y="31">＋</text><text x="1118" y="31">0 jobs</text>
    <rect x="1170" y="16" width="170" height="22" rx="6" fill="#ececee"/><text x="1182" y="31">⌕  Search</text>
  </g>

  <!-- sidebar -->
  <rect x="0.5" y="52" width="220" height="827" fill="#efeff2"/>
  <line x1="220.5" y1="52" x2="220.5" y2="880" stroke="#dcdcde"/>
  <g font-size="12">
    <text x="16" y="78" font-size="10" font-weight="600" fill="#8e8e93">CORPORA</text>
    <rect x="8" y="86" width="204" height="22" rx="5" fill="#d9d9de"/><text x="18" y="101">Viewer</text>
    <text x="16" y="128" font-size="10" font-weight="600" fill="#8e8e93">JOBS</text>
    <text x="18" y="148">Runs</text><text x="18" y="170">Logs</text><text x="18" y="192">System</text>
