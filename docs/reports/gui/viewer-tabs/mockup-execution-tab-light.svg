    <text x="18" y="238">Licences</text><text x="18" y="260">Package</text>
  </g>

  <!-- document tab bar: the first tab is the corpus browser, then one closable tab per opened execution -->
  <rect x="221" y="53" width="1139" height="38" fill="#e8e8eb"/>
  <line x1="221" y1="91" x2="1360" y2="91" stroke="#d1d1d6"/>
  <g font-size="12">
    <!-- Corpora (fixed, not closable) -->
    <rect x="230" y="59" width="104" height="26" rx="6" fill="#e8e8eb"/>
    <text x="248" y="76" fill="#3a3a3c">▤  Corpora</text>
    <line x1="340" y1="64" x2="340" y2="80" stroke="#c7c7cc"/>
    <!-- active execution tab -->
    <rect x="346" y="59" width="172" height="26" rx="6" fill="#ffffff" filter="url(#sh)"/>
