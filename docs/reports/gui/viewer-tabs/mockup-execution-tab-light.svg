    <text x="896" y="352" fill="#3a3a3c">apv:evidenceClass</text><text x="1120" y="352">apv:Observed</text>
    <text x="896" y="370" fill="#3a3a3c">apv:rule</text><text x="1120" y="370">ns.rule_a@1</text>
    <text x="896" y="388" fill="#3a3a3c">apv:sourcePointer</text><text x="1120" y="388">aer:c3</text>
    <text x="866" y="406">▸ wasGeneratedBy (14)</text>
    <text x="866" y="424">▸ used (11)</text>
    <text x="852" y="442">▸ bundle  xd:bundle.inf.…</text><text x="1120" y="442" fill="#6e6e73">inference</text>
    <text x="852" y="460">▸ bundle  xd:bundle.assess.…</text><text x="1120" y="460" fill="#6e6e73">assessment</text>
