    <ellipse cx="580" cy="420" rx="62" ry="18" fill="#fffc87" stroke="#8a8600"/><text x="580" y="424">e2 «ToolCall»</text>
    <rect x="520" y="500" width="120" height="34" fill="#9fb1fc" stroke="#3d55b0"/><text x="580" y="521">t1 «ToolExecution»</text>
    <ellipse cx="580" cy="610" rx="62" ry="18" fill="#fffc87" stroke="#8a8600"/><text x="580" y="614">e3 «ToolResult»</text>
    <rect x="390" y="680" width="120" height="34" fill="#9fb1fc" stroke="#d70015" stroke-width="2.5"/><text x="450" y="701">m2 «ModelInvocation»</text>
    <ellipse cx="450" cy="790" rx="62" ry="18" fill="#fffc87" stroke="#8a8600"/><text x="450" y="794">e4 «Message»</text>
  </g>
  <g stroke="#6e6e73" fill="none" marker-end="url(#arr)">
    <line x1="450" y1="320" x2="450" y2="274"/>
    <line x1="400" y1="354" x2="338" y2="402"/>
    <line x1="560" y1="402" x2="500" y2="356"/>
    <line x1="580" y1="500" x2="580" y2="440"/>
    <line x1="580" y1="592" x2="580" y2="536"/>
    <line x1="470" y1="680" x2="565" y2="628"/>
    <line x1="450" y1="772" x2="450" y2="716"/>
  </g>
  <rect x="560" y="808" width="100" height="32" rx="6" fill="#ffffff" stroke="#c7c7cc"/>
