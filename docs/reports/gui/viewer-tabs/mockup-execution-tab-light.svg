    <text x="534" y="76" fill="#3a3a3c">ex_0007</text>
    <text x="588" y="76" fill="#8e8e93" font-size="11">corpus-x</text>
    <line x1="694" y1="64" x2="694" y2="80" stroke="#c7c7cc"/>
    <text x="708" y="76" fill="#3a3a3c">ex_0002</text>
    <text x="762" y="76" fill="#8e8e93" font-size="11">corpus-y</text>
    <line x1="868" y1="64" x2="868" y2="80" stroke="#c7c7cc"/>
