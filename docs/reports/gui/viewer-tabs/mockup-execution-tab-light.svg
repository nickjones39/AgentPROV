  <!-- execution title row -->
  <text x="236" y="118" font-size="14" font-weight="600">ex_0002</text>
  <text x="300" y="118" font-size="12" fill="#6e6e73">src-a · ! with issues · known_incomplete · corpus-x (working, read-only)</text>
