    <rect x="674" y="258" width="142" height="16" fill="#dbe6ff"/><text x="680" y="270">m2 · activity</text>
    <text x="680" y="286" fill="#6e6e73">e1 · entity</text><text x="680" y="302" fill="#6e6e73">e2 · entity</text>
