<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="880" viewBox="0 0 1360 880" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f">
  <title>AgentPROV Viewer: an execution open in its own tab (design proposal D-840..D-845; placeholders only)</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/>
    </marker>
    <filter id="sh" x="-5%" y="-20%" width="110%" height="160%">
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- window -->
  <rect x="0.5" y="0.5" width="1359" height="879" rx="10" fill="#ffffff" stroke="#c6c6c8"/>
  <!-- toolbar / title -->
