<svg xmlns="http://www.w3.org/2000/svg" viewBox="200 187 640 640" width="640" height="640">
  <title>AgentPROV concept B: Lineage</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3A4DB8"/><stop offset="1" stop-color="#141A52"/></linearGradient>
    <radialGradient id="sheen" cx="512" cy="40" r="620" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="ent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF19A"/><stop offset="1" stop-color="#FFD84D"/></linearGradient>
    <linearGradient id="act" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B4C2FF"/><stop offset="1" stop-color="#7B90FF"/></linearGradient>
    <linearGradient id="agt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFCB73"/><stop offset="1" stop-color="#FFA63D"/></linearGradient>
    <filter id="contact" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="clipBowl"><path clip-rule="evenodd" d="M300 400 A236 166 0 1 1 772 400 A236 166 0 1 1 300 400 Z M488 400 A72 56 0 1 0 632 400 A72 56 0 1 0 488 400 Z"/></clipPath>
  </defs>
  <!-- bowl: an entity ellipse with its counter cut out -->
  <path fill="url(#ent)" fill-rule="evenodd" d="M300 400 A236 166 0 1 1 772 400 A236 166 0 1 1 300 400 Z M488 400 A72 56 0 1 0 632 400 A72 56 0 1 0 488 400 Z"/>
  <!-- stem: three hash-chained blocks (activities) -->
  <g fill="url(#act)">
    <rect x="268" y="232" width="156" height="164" rx="42"/>
    <rect x="268" y="420" width="156" height="164" rx="42"/>
    <rect x="268" y="608" width="156" height="164" rx="42"/>
  </g>
  <!-- glass where the stem crosses the bowl -->
  <g opacity="0.5" fill="#FFFFFF" clip-path="url(#clipBowl)">
    <rect x="268" y="232" width="156" height="164" rx="42"/>
    <rect x="268" y="420" width="156" height="164" rx="42"/>
    <rect x="268" y="608" width="156" height="164" rx="42"/>
  </g>
  <!-- chain links between the blocks -->
  <g class="edge" fill="none" stroke="#1F2A6E" stroke-width="18" stroke-linecap="round">
    <path d="M346 380 V436"/>
    <path d="M346 568 V624"/>
  </g>
  <!-- the agent the record is attributed to -->
  <path class="edge" d="M600 572 V626" stroke="#1F2A6E" stroke-opacity="0.9" stroke-width="18" stroke-linecap="round"/>
  <path d="M600 640 L690 700 V752 Q690 772 670 772 H530 Q510 772 510 752 V700 Z" fill="url(#agt)" stroke="url(#agt)" stroke-width="22" stroke-linejoin="round"/>
</svg>
