<svg xmlns="http://www.w3.org/2000/svg" viewBox="163 180 640 640" width="640" height="640">
  <title>AgentPROV concept A: Triad</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3A4DB8"/><stop offset="1" stop-color="#141A52"/></linearGradient>
    <radialGradient id="sheen" cx="512" cy="40" r="620" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="ent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF19A"/><stop offset="1" stop-color="#FFD84D"/></linearGradient>
    <linearGradient id="act" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B4C2FF"/><stop offset="1" stop-color="#7B90FF"/></linearGradient>
    <linearGradient id="agt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFCB73"/><stop offset="1" stop-color="#FFA63D"/></linearGradient>
    <filter id="contact" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="clipEnt"><ellipse cx="380" cy="612" rx="196" ry="138"/></clipPath>
    <clipPath id="clipAct"><rect x="490" y="500" width="300" height="236" rx="58"/></clipPath>
  </defs>
  <!-- contact shadow under the foreground group -->
  <!-- agent (PROV pentagon), entity (ellipse), activity (rectangle) -->
  <path d="M512 262 L640 352 V496 Q640 524 612 524 H412 Q384 524 384 496 V352 Z" fill="url(#agt)" stroke="url(#agt)" stroke-width="24" stroke-linejoin="round"/>
  <ellipse cx="380" cy="612" rx="196" ry="138" fill="url(#ent)"/>
  <rect x="490" y="500" width="300" height="236" rx="58" fill="url(#act)"/>
  <!-- overlaps read as glass -->
  <g fill="#FFFFFF" opacity="0.5">
    <g clip-path="url(#clipEnt)"><path d="M512 262 L640 352 V496 Q640 524 612 524 H412 Q384 524 384 496 V352 Z" stroke="#FFFFFF" stroke-width="24" stroke-linejoin="round"/></g>
    <g clip-path="url(#clipAct)"><path d="M512 262 L640 352 V496 Q640 524 612 524 H412 Q384 524 384 496 V352 Z" stroke="#FFFFFF" stroke-width="24" stroke-linejoin="round"/></g>
    <g clip-path="url(#clipEnt)"><rect x="490" y="500" width="300" height="236" rx="58"/></g>
  </g>
</svg>
