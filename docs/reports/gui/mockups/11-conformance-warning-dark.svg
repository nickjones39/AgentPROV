<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="880" viewBox="0 0 1360 880" role="img" aria-labelledby="t d">
<title id="t">AgentPROV macOS mockup: 11-conformance-warning (dark)</title>
<desc id="d">New Import Job with the PROV conformance-check warning alert (D-432, design §8.3a). Placeholder data only.</desc>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif} text.m{font-family:'SF Mono', Menlo, Monaco, monospace}</style>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/></filter><filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.16"/></filter><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<defs><linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#20232B"/><stop offset="1" stop-color="#14161B"/></linearGradient></defs><rect x="0" y="0" width="1360" height="880" rx="0" fill="url(#bd)" /><rect x="120" y="40" width="1120" height="800" rx="16" fill="#1E1E1E" stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.18" filter="url(#shadow)"/><circle cx="142" cy="67" r="6.5" fill="#FF5F57" stroke="#000" stroke-opacity=".12" stroke-width=".5"/><circle cx="162" cy="67" r="6.5" fill="#FEBC2E" stroke="#000" stroke-opacity=".12" stroke-width=".5"/><circle cx="182" cy="67" r="6.5" fill="#28C840" stroke="#000" stroke-opacity=".12" stroke-width=".5"/><text x="212" y="72" font-size="15" font-weight="700" fill="#F2F2F7">New Import Job</text><rect x="330" y="59" width="26" height="16" rx="4" fill="#0091FF" fill-opacity="0.2" /><text x="343" y="71" font-size="10.5" font-weight="700" fill="#0091FF" text-anchor="middle">R1</text><line x1="120" y1="96" x2="1240" y2="96" stroke="#38383A" stroke-width="1"/><text x="154" y="128" font-size="11" font-weight="600" fill="#98989D">Import</text><rect x="150" y="136" width="1060" height="150" rx="10" fill="#323234" /><text x="162" y="155.5" font-size="13" fill="#F2F2F7">Source</text><text x="1198" y="155.5" font-size="13" fill="#98989D" text-anchor="end">src-c · part-1 · profile v2</text><line x1="162" y1="166" x2="1198" y2="166" stroke="#38383A" stroke-width="1"/><text x="162" y="185.5" font-size="13" fill="#F2F2F7">Input</text><text x="1198" y="185.5" font-size="13" fill="#98989D" text-anchor="end">‹input dir›  (verify against pin)</text><line x1="162" y1="196" x2="1198" y2="196" stroke="#38383A" stroke-width="1"/><text x="162" y="215.5" font-size="13" fill="#F2F2F7">Corpus</text><text x="1198" y="215.5" font-size="13" fill="#98989D" text-anchor="end">‹AGENTPROV_HOME›/migration-work/scratch-z</text><line x1="162" y1="226" x2="1198" y2="226" stroke="#38383A" stroke-width="1"/><text x="162" y="245.5" font-size="13" fill="#F2F2F7">Mode</text><text x="1198" y="245.5" font-size="13" fill="#98989D" text-anchor="end">scratch (dev)</text><line x1="162" y1="256" x2="1198" y2="256" stroke="#38383A" stroke-width="1"/><text x="162" y="275.5" font-size="13" fill="#F2F2F7">Jobs</text><text x="1198" y="275.5" font-size="13" fill="#98989D" text-anchor="end">12</text><text x="154" y="316" font-size="11" font-weight="600" fill="#98989D">Validation</text><rect x="150" y="324" width="1060" height="56" rx="10" fill="#323234" /><rect x="162" y="336" width="15" height="15" rx="4" fill="#3A3A3C" stroke="#4A4A4D" stroke-width="1" /><text x="184" y="348" font-size="13" font-weight="600" fill="#F2F2F7">Run the W3C PROV conformance check (tier 4)</text><text x="184" y="366" font-size="11.5" fill="#98989D">Tier 4 is 70–90 % of import CPU. Unticking it is a dev-mode convenience only.</text><text x="154" y="408" font-size="11" font-weight="600" fill="#98989D">Command</text><rect x="150" y="416" width="1060" height="52" rx="10" fill="#323234" /><text x="162" y="438" class="m" font-size="11.5" fill="#F2F2F7">agentprov import src-c --input ‹input dir› --verify-against-pin --corpus ‹…›/scratch-z \</text><text x="162" y="456" class="m" font-size="11.5" fill="#F2F2F7">  --jobs 12 --skip-prov-conformance --progress-file ‹job dir›/progress.jsonl</text><rect x="120" y="40" width="1120" height="800" rx="16" fill="#000000" fill-opacity="0.35" /><rect x="470.0" y="190" width="420" height="330" rx="22" fill="#2C2C2E" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.15" filter="url(#shadow)"/><g transform="translate(660.0,216) scale(2.857142857142857)"><path d="M7 .8l6.6 11.6H.4z" fill="#FF9230" stroke="#FF9230" stroke-linejoin="round" stroke-width="1"/><path d="M7 4.6v3.8" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><circle cx="7" cy="10.3" r=".95" fill="#fff"/></g><text x="680" y="286" font-size="15" font-weight="700" fill="#F2F2F7" text-anchor="middle">Skip the W3C PROV conformance check?</text><text x="680" y="314" font-size="12.5" fill="#98989D" text-anchor="middle">Not advisable. The PROV bundles of this run will not be</text><text x="680" y="332" font-size="12.5" fill="#98989D" text-anchor="middle">checked against the W3C PROV constraints. The corpus will</text><text x="680" y="350" font-size="12.5" fill="#98989D" text-anchor="middle">be marked unvalidated, cannot be sealed or released until</text><text x="680" y="368" font-size="12.5" fill="#98989D" text-anchor="middle">validate --corpus passes on it, and its results should not</text><text x="680" y="386" font-size="12.5" fill="#98989D" text-anchor="middle">be reported.</text><text x="680" y="416" font-size="11.5" fill="#98989D" text-anchor="middle">This choice is logged in job.json and in Logs.</text><rect x="494.0" y="436" width="372" height="30" rx="7" fill="#0A84FF" filter="url(#soft)"/><text x="680" y="455.5" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="middle">Keep the Check</text><rect x="494.0" y="474" width="372" height="30" rx="7" fill="#3A3A3C" stroke="#4A4A4D" stroke-width="0.8" filter="url(#soft)"/><text x="680" y="493.5" font-size="13" font-weight="500" fill="#FF4245" text-anchor="middle">Skip the Check</text>
</svg>
