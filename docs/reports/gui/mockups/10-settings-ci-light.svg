ll="#0A60FF" stroke="#C9C9CE" stroke-width="0"/><circle cx="341.5" cy="199.5" r="3" fill="#FFFFFF"/><text x="356" y="204" font-size="13" font-weight="600" fill="#1D1D1F">Local (default)</text><text x="356" y="224" font-size="11.5" fill="#6E6E73">tools/ci_local.py on this Mac, through the job queue. No GitHub minutes. Shown in Runs as a job.</text><line x1="332" y1="242" x2="1028" y2="242" stroke="#E1E1E1" stroke-width="1"/><circle cx="341.5" cy="263.5" r="7.5" fill="#FFFFFF" stroke="#C9C9CE" stroke-width="1"/><text x="356" y="268" font-size="13" font-weight="600" fill="#1D1D1F">GitHub-hosted</text><rect x="464.95" y="255" width="26" height="16" rx="4" fill="#FF8D28" fill-opacity="0.2" /><text x="477.95" y="267" font-size="10.5" font-weight="700" fill="#FF8D28" text-anchor="middle">R2</text><text x="356" y="288" font-size="11.5" fill="#6E6E73">gh workflow run ci.yml --ref ‹branch›. Network; spends Actions minutes (private repository).</text><line x1="332" y1="306" x2="1028" y2="306" stroke="#E1E1E1" stroke-width="1"/><circle cx="341.5" cy="327.5" r="7.5" fill="#FFFFFF" stroke="#C9C9CE" stroke-width="1"/><text x="356" y="332" font-size="13" font-weight="600" fill="#1D1D1F">Mac Studio (self-hosted)</text><rect x="900" y="318" width="126" height="20" rx="10" fill="#8E8E93" fill-opacity="0.18" /><text x="963" y="332" font-size="11.5" font-weight="600" fill="#6E6E73" text-anchor="middle">Not configured</text><text x="356" y="352" font-size="11.5" fill="#6E6E73">Sets CI_RUNNER to the runner label. Windows leg stays GitHub-hosted.</text><text x="324" y="400" font-size="11" font-weight="600" fill="#6E6E73">GitHub</text><rect x="320" y="408" width="720" height="60" rx="10" fill="#E7E6E5" /><text x="332" y="427.5" font-size="13" fill="#1D1D1F">Run CI on every push (CI_ON_PUSH)</text><rect x="996" y="414" width="32" height="18" rx="9" fill="#E5E5EA" /><circle cx="1005" cy="423" r="7.5" fill="#FFFFFF" filter="url(#soft)"/><line x1="332" y1="438" x2="1028" y2="438" stroke="#E1E1E1" stroke-width="1"/><text x="332" y="457.5" font-size="13" fill="#1D1D1F">Last known billing status</text><text x="1028" y="457.5" font-size="13" fill="#6E6E73" text-anchor="end">minutes exhausted (2026-10-09)</text><text x="324" y="490" font-size="11.5" fill="#6E6E73">Changing the toggle sets a repository variable (tier R2, explicit confirmation).</text><text x="324" y="520" font-size="11" font-weight="600" fill="#6E6E73">Repository variables (read with gh variable list)</text><rect x="320" y="528" width="720" height="60" rx="10" fill="#E7E6E5" /><text x="332" y="547.5" font-size="13" fill="#1D1D1F">CI_ON_PUSH</text><text x="1028" y="547.5" class="m" font-size="12.5" fill="#6E6E73" text-anchor="end">false</text><line x1="332" y1="558" x2="1028" y2="558" stroke="#E1E1E1" stroke-width="1"/><text x="332" y="577.5" font-size="13" fill="#1D1D1F">CI_RUNNER</text><text x="1028" y="577.5" class="m" font-size="12.5" fill="#6E6E73" text-anchor="end">(unset)</text><text x="324" y="610" font-size="11.5" fill="#6E6E73">The GUI never stores a GitHub token.</text>
