# G5 clean-machine tests: every image by digest, and the tool versions the runs were made with (D-861).
# Changing a pin, a package list or a size here means rebuilding that platform's base (driver.py base <platform>).

[tools]
lima = "2.2.1"   # brew install lima (Apache-2.0), installed 2026-10-28 with the user's yes
utm = "5.0.8"    # brew install --cask utm (Apache-2.0), installed 2026-10-28 with the user's yes

[platform.linux-arm64]
tool = "lima"
arch = "aarch64"
# Ubuntu 24.04: PySide6 6.12's manylinux_2_39_aarch64 wheels need glibc 2.39 (D-865)
image = "https://cloud-images.ubuntu.com/releases/noble/release-20260926/ubuntu-24.04-server-cloudimg-arm64.img"
digest = "sha256:1d6bffe64b848468ac97f821d369a4846d983de1800ccf6b5ec8853e85cefc55"
size = 620224512
cpus = 4
memory_gib = 8
disk_gib = 30
glibc_floor = "2.39"
# What a desktop user is told to have (the guide's prerequisite list): Qt's xcb platform plugin's libraries that a
# server image lacks, and one font. Grown only when a run shows a library missing (D-865): libxcb-icccm4 and
# libxcb-keysyms1 after run linux-arm64-20261028T040733Z (ldd of libqxcb.so: libxcb-icccm.so.4, libxcb-keysyms.so.1
# not found; Qt's own message blamed libxcb-cursor0, which was installed).
prerequisites = ["libxcb-cursor0", "libxcb-icccm4", "libxcb-keysyms1", "libxkbcommon-x11-0", "libegl1",
                 "libfontconfig1", "fonts-dejavu-core"]
# The harness's own tools, not prerequisites: a headless X server, the window list and the screenshot (xwd), and a
# Secret Service for step 5's allowed variant.
harness = ["xvfb", "x11-utils", "x11-apps", "dbus-x11", "gnome-keyring", "libsecret-tools"]

# Building the Linux arm64 bundle in a clone of the base (D-865), as .github/workflows/bundles.yml does on a runner:
# uv's standalone binary (no install script), uv's CPython 3.14 and the locked GUI environment, then gen_notices.py
# and build_bundle.py. PyInstaller needs objdump (binutils) on Linux; it is installed in the build clone only.
[platform.linux-arm64.build]
uv_version = "0.13.5"
uv_url = "https://github.com/astral-sh/uv/releases/download/0.13.5/uv-aarch64-unknown-linux-gnu.tar.gz"
uv_digest = "sha256:4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403"
packages = ["binutils"]

# Windows 11 ARM64 in UTM (D-867). The ISO is the user's own download from Microsoft's page (the link Microsoft
# generates expires after 24 h, so the pin is the file and its sha256, which Microsoft publishes on that page). The
# install is unattended and unactivated (the user's choice, 2026-10-28); no product key is handled.
[platform.windows-arm64]
tool = "utm"
arch = "aarch64"
image = "https://www.microsoft.com/en-us/software-download/windows11arm64 (Windows11_Client_arm64_en-us_26300_9457.iso)"
digest = "sha256:8992f2d2cfd2fa647e579e9eb31fc21f34da8333c29b6170fde17d2ed6623e9c"
size = 8528523264
cpus = 6
memory_gib = 12
disk_gib = 64
guest_tools = "https://github.com/utmapp/qemu/releases/download/v10.0.2-utm/utm-guest-tools-0.1.271.iso"
guest_tools_digest = "sha256:65b6a69b392ee01dd314c10f3dad9ebbf9c4160be43f5f0dd6bb715944d9095b"

[platform.windows-arm64.build]
uv_version = "0.13.5"
uv_url = "https://github.com/astral-sh/uv/releases/download/0.13.5/uv-aarch64-pc-windows-msvc.zip"
uv_digest = "sha256:09f47edf90726084a70f9426f6e3ca4f46e9bf7cbf23b1716ec64d60b055fae3"

# Windows x86_64, tested under Windows 11 ARM64's own x64 emulation in the same base VM (the user's choice,
# 2026-10-29: no x86_64 hardware here). The x64 uv makes every interpreter it installs x64 (core, GUI and the
# backend's 3.12), as on an x86_64 PC; the report and the guide say "under emulation".
[platform.windows-x64]
tool = "utm"
arch = "x86_64 (emulated by Windows 11 ARM64)"
image = "https://www.microsoft.com/en-us/software-download/windows11arm64 (Windows11_Client_arm64_en-us_26300_9457.iso)"
digest = "sha256:8992f2d2cfd2fa647e579e9eb31fc21f34da8333c29b6170fde17d2ed6623e9c"
size = 8528523264
cpus = 6
memory_gib = 12
disk_gib = 64
guest_tools = "https://github.com/utmapp/qemu/releases/download/v10.0.2-utm/utm-guest-tools-0.1.271.iso"
guest_tools_digest = "sha256:65b6a69b392ee01dd314c10f3dad9ebbf9c4160be43f5f0dd6bb715944d9095b"

[platform.windows-x64.build]
uv_version = "0.13.5"
uv_url = "https://github.com/astral-sh/uv/releases/download/0.13.5/uv-x86_64-pc-windows-msvc.zip"
uv_digest = "sha256:a38b8d1902b7cfbc76b423ba1bb456f623f42064cdc72628b6075b89afd1019a"

# Linux x86_64 under QEMU emulation on the Mac Studio (the user's choice, 2026-10-29: no x86_64 hardware here).
# brew install qemu lima-additional-guestagents (GPL-2.0, Apache-2.0), installed 2026-10-29 with the user's yes.
# Ubuntu 22.04 is the x86_64 floor (glibc 2.35, G5 note §1). Built and tested under emulation: the report says so.
[platform.linux-x86_64]
tool = "lima"
arch = "x86_64"
vm_type = "qemu"
timeout_factor = 6
image = "https://cloud-images.ubuntu.com/releases/jammy/release-20261020/ubuntu-22.04-server-cloudimg-amd64.img"
digest = "sha256:2099e63da0b822ef8e05e3d596c1b402eaaae658fc08ab919cb8495bfcdc488b"
size = 730529792
cpus = 8
memory_gib = 12
disk_gib = 30
glibc_floor = "2.35"
prerequisites = ["libxcb-cursor0", "libxcb-icccm4", "libxcb-keysyms1", "libxkbcommon-x11-0", "libegl1",
                 "libfontconfig1", "fonts-dejavu-core"]
harness = ["xvfb", "x11-utils", "x11-apps", "dbus-x11", "gnome-keyring", "libsecret-tools"]

[platform.linux-x86_64.build]
uv_version = "0.13.5"
uv_url = "https://github.com/astral-sh/uv/releases/download/0.13.5/uv-x86_64-unknown-linux-gnu.tar.gz"
uv_digest = "sha256:f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
packages = ["binutils"]
