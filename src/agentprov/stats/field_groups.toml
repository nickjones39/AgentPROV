spec = "O.3.5; C.3.16 row checker; C.3.2 version, code; C.3.10 actor"
[[group.alternative]]
[[group.alternative.occurrence]]
id = "checker.actor.version"
record = "actor"
named_by = { record = "judgement", absent = ["revises"], pointer = "/actor" }
pointer = "/version"
[[group.alternative.occurrence]]
id = "checker.actor.code"
record = "actor"
named_by = { record = "judgement", absent = ["revises"], pointer = "/actor" }
pointer = "/code"
