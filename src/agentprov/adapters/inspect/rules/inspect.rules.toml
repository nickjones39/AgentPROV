[[rule]]
id = "inspect.value_redacted"
version = 1
class = "D"
status = "active"
statement = "A value of the source that holds a workstation account path is replaced by the label its profile's [[family.inspect.redact]] rule specifies (D-182): a whole observed model id wherever the mapper copies it (scope model_id), or the matched span of a harness-written field the mapper copies into ext or params (scope harness_text: the sample error and its traceback, kept error and logger events, sample_metadata, task_args, revision, model_generate_config, eval.metadata). The label is literal text with {span12} (12 hex digits of SHA-256 over the profile id, NUL and the span) and {leaf} (a last path segment the rule allows). The pointer's locator stays on the raw field; ext.inspect.redacted names the rule; the original and its full digest are never recorded. Messages, tool calls, tool results, fixtures and judgements are content and never redacted. A deterministic transformation by AgentPROV specified by the profile, independent of the producing code."
premises = ["/eval/model", "/eval/model_roles", "/events/*/model", "/error", "/metadata", "/eval/metadata"]
assumptions = []
evidence = ["docs/reports/phase10h/redaction-design.md", "DECISIONS D-182", "docs/reports/phase10p/README.md R-10p-3 (e898057)", "regen-batch D-182"]
tests = ["tests/adapters/inspect/test_r10p.py::test_model_ids_and_harness_text_are_redacted"]
since = "0.1.0"

