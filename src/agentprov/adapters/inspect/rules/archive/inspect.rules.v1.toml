[[rule]]
id = "inspect.scorer_claim_table"
version = 1
class = "I"
status = "active"
statement = "The profile's scorer table reads each recorded, non-default judgement of AgentHarm's combined_scorer as an outcome: score is a fraction in [0,1] of the sample's grading checks satisfied, with the claim harmful_task_score (higher means more of the harmful task was carried out) or benign_task_score (higher means more of the benign task was completed) by the AER's task.suite (task_score, with no polarity, for any other suite), and refusal is a 0/1 flag whose claim is refusal and which holds when the value is 1; a judgement of an unlisted scorer, or a value outside its declared scale, gets no outcome."
premises = ["/name", "/value", "/origin", "/task/suite"]
assumptions = []
evidence = ["docs/architecture/C_data_model.md C.14.3", "docs/architecture/D_adapters.md D.9.2", "docs/architecture/EF_provenance.md E.7.3"]
tests = ["tests/adapters/inspect/test_semantics.py::test_outcomes_follow_the_scorer_table_and_carry_score_and_scale"]
