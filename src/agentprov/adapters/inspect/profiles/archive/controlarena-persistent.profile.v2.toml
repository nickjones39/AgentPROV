# Source profile `controlarena-persistent`: HF dataset idacy/control-arena-persistent-state-eval-archive-2026-07-30 @
# 84d39e0a (MIT, card), the final local archive of the AI-control study "Distributed Attacks in Persistent-State AI
# Control" (Inspect .eval logs of the control_arena vibe_coding_persistent setting; phase 10p; phase-10e card §3.6,
# D-144, D-145 rank 13; docs/reports/phase10p/README.md).
#
# Data, not code. No status lives here: the registry is the only status store (R-38, R-45). Any byte change bumps
# `version` (AD-18): version 2 adds D-345's exact-path holds (code select.redaction_pending, D-324) and the nested zips
# ([[import.nested]], D-382). The [family.inspect] table is checked against
# ../family.schema.json (closed schema, D.4.1). Observed counts are the phase-10p census of every log the pins reach
# (nested zips included) (~/.agentprov/migration-work/phase10p/census/; docs/reports/phase10p/README.md §3).
#
# Decisions (user-approved 2026-10-13): D-340 an execution is one sample of a log with a header in the band; attack and
# honest, errored and tool-less samples alike (never an outcome rule). D-341 one corpus, one part per pinned container
# (D-202 snapshots; D-108 one pin per part). D-342 exclusions by rule (below). D-343 band and family values. D-344
# [withhold] pattern rules: every sample carries a generated key at /metadata/API_KEY that reaches its AER, so a release
# seal withholds every execution (a public release holds metadata only). D-345 the account-path logs stay out of every
# import until the D-182 redaction covers their pointer classes: exact-path excludes with `select.redaction_pending`
# (D-324, R-10p-5) in [import] below.
#
# Not pinned (D-342), with the reason recorded here and in the screening record: the two loose logs under
# logs_20260315_unique/ (unfinished: no header.json; a single-file HF pin is an archive input whose candidates would be
# the log's own members, D-200); apr2026_backup_public_only_data-20260423.tar.zst (its 227 logs, inside nested zips, are
# byte duplicates of the split zips' logs or empty); link_tracker_rescore_finals-20260730.tar.zst, logs_march_rescored/,
# logs_Josh3_analysis_csvs/, the analysis CSVs and paper_figures/ (rescore results and analysis: outcome-only records,
# EX-NOLOG, D-141); xx_working_dir_delta_data-20260730.tar.zst (no log). In the auditor tar, the agentic auditor's own
# records (commands with outputs and a final response, without the model's per-step input) are a partial trajectory in
# another format (EX-FMT, D-141); only the auditor's one input log is selected.
#
# Inside the pinned split zips, five nested zips hold 928 logs / 3,475 samples found nowhere else:
# logs/gradual_f3m1.zip, logs/2026-01-15_last-two-days.zip, logs/honest_all.zip and logs/run_2.zip in zip-3-001;
# logs/positional_f3m1.zip in zip-3-002 (312 MB to 2.09 GB). Version 2 declares them as [[import.nested]] (D-382;
# R-10p-1, ingest-formats-3): each is stored as its own member object (D-381), streamed when over the global member
# bound (D-383), and its .eval logs open at level 3. 358 .eval members are empty (172) or truncated (186; a local header and no central
# directory): the import records the code the Inspect reader gives them (279 of the 406 such files in the archive have a
# complete copy inside the nested zips).

