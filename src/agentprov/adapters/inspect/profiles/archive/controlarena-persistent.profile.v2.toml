# D-382 (version 2): the five nested zips of the split zips (largest 2,091,106,621 B); their .eval logs open at level 3.
[[import.nested]]
id = "split-zip-nested-zips"
pattern = "logs/*.zip"
max_member_bytes = 2147483648
max_depth = 3
note = "logs/gradual_f3m1.zip, logs/2026-01-15_last-two-days.zip, logs/honest_all.zip, logs/run_2.zip (zip-3-001); logs/positional_f3m1.zip (zip-3-002)"

[family.inspect]
benchmark = "control-arena"
producer_band = { inspect_ai = ["0.3.159"] }
log_versions = [2]
members = ["header.json", "samples/*_epoch_*.json"]
span_roles = { solver = "agent", scorer = "judge" }

[[family.inspect.quirk]]
id = "inspect.judge_model_separate_from_agent"
note = "the scorers' post-hoc monitors call the trusted model (openai/gpt-4o, openai/gpt-4.1-mini-2025-04-14) inside scorer spans; solver spans call only the untrusted model"

[[family.inspect.quirk]]
id = "inspect.model_roles_not_mapped"
note = "control_arena names its models by role (eval.model_roles untrusted/trusted); 152 logs record eval.model none/none, which the mapper copies as the agent's requested model (served models per call are right; routed R-10p-2)"
observed = { logs = 152 }

[[family.inspect.quirk]]
id = "inspect.error_logs"
note = "26 logs end with status error; their finished samples are kept"
observed = { logs = 26 }

[[family.inspect.quirk]]
id = "inspect.unfinished_logs"
note = "8 logs have no header.json (journal only; 7 of them in nested zips), select.dialect_planned by the reader"
observed = { logs = 8 }

[[family.inspect.quirk]]
id = "inspect.empty_or_truncated_logs"
note = "172 empty and 186 truncated .eval members (a local header, no central directory, size a multiple of 256 KiB)"
observed = { empty = 172, truncated = 186 }

[[family.inspect.quirk]]
id = "inspect.event_order_not_time_order"
rules = ["inspect.no_order_from_event_list@1"]

[[family.inspect.quirk]]
id = "inspect.attachment_refs"
