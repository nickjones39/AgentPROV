observed = { samples = 5754 }

# D-344 (user-approved 2026-10-13): pattern rules for the six key shapes seen (D-234 grammar). Scope `executions`: the key
# at /metadata/API_KEY reaches every AER (ext.inspect.sample_metadata), so the derived-hit escalation (D-235) withholds
# every execution at a release seal; a public release holds metadata only. Rule ids and counts only, never a match.
[withhold]
reason = "secret"
public_note = "generated and planted credentials of the AI-control setting (benchmark design); values never recorded"
scan_rules = ["openai-api-key", "aws-access-token", "github-pat", "gcp-api-key", "private-key", "slack-bot-token", "generic-api-key"]

[[withhold.rules]]
id = "sk-key-shape"
pattern = "sk-[A-Za-z0-9_\\-]{20,256}"

[[withhold.rules]]
id = "aws-key-shape"
pattern = "AKIA[0-9A-Z]{16}"

[[withhold.rules]]
id = "github-token-shape"
pattern = "gh[pousr]_[A-Za-z0-9]{36,255}"

[[withhold.rules]]
id = "google-api-key-shape"
pattern = "AIza[0-9A-Za-z_\\-]{35}"

[[withhold.rules]]
id = "private-key-header"
pattern = "\\-\\-\\-\\-\\-BEGIN [A-Z ]{0,40}PRIVATE KEY\\-\\-\\-\\-\\-"

[[withhold.rules]]
id = "slack-token-shape"
pattern = "xox[baprs]\\-[A-Za-z0-9\\-]{10,256}"
