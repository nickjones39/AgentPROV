# Source profile `fragfuse-agentharm`: zixin22/fragfuse_agentharm, 168 Inspect .eval logs inside an inspect_evals working
# copy: plain AgentHarm runs (logs_archive/) and two attack experiments under
# src/inspect_evals/agentharm/tasks10_outputs/ (memory-bank retrieval with injected memories, 136 one-sample logs;
# carrier injection, 4 one-sample logs) (phase 10h; docs/reports/systematic-search/candidates/phase10e-candidates.md §3.4,
# D-144, D-145).
#
# Data, not code. No status lives here: the registry is the only status store (R-38, R-45). Any byte change bumps
# `version` (AD-18); nothing is released yet, so it is still 1. The [family.inspect] table is checked against
# ../family.schema.json (closed schema, D.4.1). The observed counts are the phase-10h census of every log at the pin
# (docs/reports/phase10h/README.md; ~/.agentprov/migration-work/phase10h/census/).
#
# Restricted use (LIC 3): the logs embed AgentHarm task data (MIT with an AI-safety use clause), so the corpus is its own
# restricted-use corpus, never mixed into a permissive one (D-144).
#
# Attack (phase-10h proposal D-184): one profile covers both the plain runs and the attack experiments, so `no_attack`
# is not set and task.attack_id stays unrecorded for every sample. The attack arm is visible only in eval.task, the
# solver plan (inject_memory_from_bank) and the sample metadata (kept in ext.inspect.sample_metadata).
#
# Mock runs (proposal D-183): four logs_archive logs ran the `none/none` model (Inspect's no-model provider; 12 samples,
# all errored before any generation). They are not executions (D-142: mock-model samples are not counted) and are
# excluded by exact path with select.not_execution_artefact, as DTap's synthetic trajectories are (D-29).
#
# Workstation account names (D-146; proposal D-182, not applied): no model id carries a path, but every log records a
# /Users/<account>/ path somewhere (dataset.location, the memory-bank solver parameter, error tracebacks, and
# metadata.carrier_query_path in 4 samples); the mapper copies sample errors and metadata into ext. Never print or quote
# these paths: refer to them by pointer and count only.

[profile]
id = "fragfuse-agentharm"
version = 1
format = "agentprov-source-profile/0.1"
source_id = "fragfuse-agentharm"
family = "inspect"
parts = ["logs"]
title = "zixin22/fragfuse_agentharm: AgentHarm Inspect .eval logs and memory/carrier attack runs (restricted-use corpus fragfuse-agentharm)"
evidence = ["docs/reports/systematic-search/candidates/phase10e-candidates.md §3.4", "docs/reports/phase10h/README.md"]

[source]
canonical_repo = "https://github.com/zixin22/fragfuse_agentharm"
paper = "none found in the repository (phase 10e)"
note = "an inspect_evals working copy (not a GitHub fork); the logs are spread over logs_archive/ and task output folders"

# The pin covers the whole commit: the logs sit in two top-level trees (logs_archive/ and src/), and one pin per corpus
# is the rule (D-108). Only the include globs below are read as executions.
[[source.pins]]
role = "git"
part = "logs"
primary = true
kind = "git"
repo = "https://github.com/zixin22/fragfuse_agentharm"
commit = "24cc8aea1b9906bee20fb585007410a5d885933a"
date = "2026-05-24"
expected_files = 3847
expected_bytes = 318827530
note = "the default branch at 2026-10-12 (phase 10e); 168 .eval logs, 1,759 samples (1,747 real-model samples)"

[licence]
spdx = "MIT"
holders = ["UK AI Security Institute (LICENSE copyright line, inherited from inspect_evals)"]
data_licence = "MIT"
policy = "include"
restrictions = ["AgentHarm task data: MIT License with an additional clause (use only to improve AI safety and security)"]
basis = "MIT LICENSE at the pin (blob 72fc8774, sha256 c593c2af...; GitHub detects MIT); AgentHarm data per HF ai-safety-institute/AgentHarm @ e23b3fe6 card"
attribution = [
  "zixin22/fragfuse_agentharm (MIT), commit 24cc8aea1b9906bee20fb585007410a5d885933a",
  "AgentHarm (c) 2024 Gray Swan AI and UK AI Safety Institute, MIT License with an additional clause",
  "inspect_evals (MIT, (c) 2024 UK AI Security Institute)",
]
unassessed = ["model-provider terms on redistributing model outputs"]

[lineage]
built_on = [
  "inspect_evals working copy at the pin (agentharm, agentharm_benign, tasks10 retrieve and carrier tasks; no inspect_evals version in the headers)",
  "inspect_ai 0.3.154.dev37+g1289c1ad, 0.3.158 and 0.3.159.dev20+g3ddd7997 (log headers)",
]
vendored = []
duplicates = []
cited_by = []
content_dedup = "never"

[import]
dialect = "inspect.eval"
mapper = "inspect.eval"
variants = ["v2"]
include = ["logs_archive/**/*.eval", "src/inspect_evals/agentharm/tasks10_outputs/**/*.eval"]
exclude = [
  { glob = "**/.DS_Store", code = "select.not_execution_artefact" },
  { glob = "**/._*", code = "select.not_execution_artefact" },
  { glob = "logs_archive/2025-12-30T22-06-25+00-00_agentharm-benign_KGn46FpufqVFoqh8omxcQa.eval", code = "select.not_execution_artefact", note = "model none/none (3 samples, no generation); D-183" },
  { glob = "logs_archive/2025-12-30T22-06-25+00-00_agentharm_cXghW9ubBnVHXWDUAUbjEb.eval", code = "select.not_execution_artefact", note = "model none/none (3 samples, no generation); D-183" },
  { glob = "logs_archive/2025-12-30T22-07-17+00-00_agentharm-benign_KGn46FpufqVFoqh8omxcQa.eval", code = "select.not_execution_artefact", note = "model none/none (3 samples, no generation); D-183" },
  { glob = "logs_archive/2025-12-30T22-07-17+00-00_agentharm_cXghW9ubBnVHXWDUAUbjEb.eval", code = "select.not_execution_artefact", note = "model none/none (3 samples, no generation); D-183" },
]
context_artefacts = [
  "src/inspect_evals/agentharm/tasks10_outputs/retrieve_test_logs_memory/**/guardrail_decision.json",
  "src/inspect_evals/agentharm/tasks10_outputs/bank_*/*.jsonl",
]
layout = "logs_archive[/<run>]/<timestamp>_<task>_<id>.eval | src/inspect_evals/agentharm/tasks10_outputs/{retrieve_test_logs_memory,Agentharm/carrier_inject_eval}/task_[test_]<n>-<m>/<timestamp>_<task>_<id>.eval"

[family.inspect]
benchmark = "agentharm"
producer_band = { inspect_ai = ["0.3.154.dev37+g1289c1ad", "0.3.158", "0.3.159.dev20+g3ddd7997"] }
log_versions = [2]
members = ["header.json", "samples/*_epoch_*.json"]
span_roles = { solver = "agent", scorer = "judge" }
ground_truth_metadata = ["target_functions", "grading_function"]

[[family.inspect.quirk]]
