# Source profile `kexin-xu-01-agentharm`: Kexin-xu-01/agentharm, 68 Inspect .eval logs of AgentHarm (harmful and benign
# splits) on eleven agent models, three of them local fine-tuned Qwen3-14B checkpoints served by vLLM (phase 10h;
# docs/reports/systematic-search/candidates/phase10e-candidates.md §3.3, D-144, D-145, D-146).
#
# Data, not code. No status lives here: the registry is the only status store (R-38, R-45). Any byte change bumps
# `version` (AD-18); nothing is released yet, so it is still 1. The [family.inspect] table is checked against
# ../family.schema.json (closed schema, D.4.1). The observed counts are the phase-10h census of every log at the pin
# (docs/reports/phase10h/README.md; ~/.agentprov/migration-work/phase10h/census/).
#
# Restricted use (LIC 3): the logs embed AgentHarm task data (MIT with an AI-safety use clause), so the corpus is its own
# restricted-use corpus, never mixed into a permissive one (D-144), as ast-survey-agentharm is.
#
# Workstation account names (D-146; phase-10h proposal D-182, not applied): 18 logs name a local checkpoint by an
# absolute path under /workspace/ whose job directory carries the account, and all 66 finished logs (and the 2 unfinished
# ones) record the dataset cache under /home/<account>/. The Inspect mapper copies the model id into the AER verbatim
# (actor model, served model, message ext); redaction needs a mapper and profile-schema change that goes to the
# regeneration batch. Until it is applied this profile carries no redaction table and these logs are not imported
# outside scratch corpora. Never print or quote these paths: refer to them by pointer and count only.

[profile]
id = "kexin-xu-01-agentharm"
version = 1
format = "agentprov-source-profile/0.1"
source_id = "kexin-xu-01-agentharm"
family = "inspect"
parts = ["logs"]
title = "Kexin-xu-01/agentharm: AgentHarm Inspect .eval logs (restricted-use corpus kexin-xu-01-agentharm)"
evidence = ["docs/reports/systematic-search/candidates/phase10e-candidates.md §3.3", "docs/reports/phase10h/README.md"]

[source]
canonical_repo = "https://github.com/Kexin-xu-01/agentharm"
paper = "none found (the README is the inspect_evals README; phase 10e)"
note = "a personal working copy of inspect_evals with run logs added under logs/ (not a GitHub fork; phase 10e)"

# The pin covers logs/: the 68 .eval logs, nothing else (phase 10h census of the pinned tree as recorded in phase 10e).
[[source.pins]]
role = "git"
part = "logs"
primary = true
kind = "git"
repo = "https://github.com/Kexin-xu-01/agentharm"
commit = "859c34f411fdf8d6a01670da2d2460d21e739e7e"
date = "2026-09-26"
tree = "logs"
expected_files = 68
expected_bytes = 36467328
note = "the default branch at 2026-10-12 (phase 10e); 68 .eval logs, 2,825 samples (2,797 in the 66 finished logs)"

[licence]
spdx = "MIT"
holders = ["UK AI Security Institute (LICENSE copyright line, inherited from inspect_evals)"]
data_licence = "MIT"
policy = "include"
restrictions = ["AgentHarm task data: MIT License with an additional clause (use only to improve AI safety and security)"]
basis = "MIT LICENSE at the pin (blob 72fc8774, sha256 c593c2af...; GitHub detects MIT); AgentHarm data per HF ai-safety-institute/AgentHarm @ e23b3fe6 card"
attribution = [
  "Kexin-xu-01/agentharm (MIT), commit 859c34f411fdf8d6a01670da2d2460d21e739e7e",
  "AgentHarm (c) 2024 Gray Swan AI and UK AI Safety Institute, MIT License with an additional clause",
  "inspect_evals (MIT, (c) 2024 UK AI Security Institute)",
]
unassessed = ["model-provider terms on redistributing model outputs"]

[lineage]
built_on = ["inspect_evals 0.20.0 (agentharm, agentharm_benign; log headers)", "inspect_ai 0.3.263 (log headers)"]
vendored = []
duplicates = []
cited_by = []
content_dedup = "never"

[import]
dialect = "inspect.eval"
mapper = "inspect.eval"
variants = ["v2"]
include = ["logs/**/*.eval"]
exclude = [
  { glob = "**/.DS_Store", code = "select.not_execution_artefact" },
  { glob = "**/._*", code = "select.not_execution_artefact" },
]
context_artefacts = []
layout = "logs[/patched-judge|/patched-judge-v2|/patched-judge-v3]/<timestamp>_<task>_<id>.eval"

[family.inspect]
benchmark = "agentharm"
no_attack = true
producer_band = { inspect_ai = ["0.3.263"] }
log_versions = [2]
members = ["header.json", "samples/*_epoch_*.json"]
span_roles = { solver = "agent", scorer = "judge" }
ground_truth_metadata = ["target_functions", "grading_function"]

[[family.inspect.quirk]]
id = "inspect.judge_model_separate_from_agent"
note = "the semantic and refusal judge is openai/gpt-4o-2024-08-06 in every finished log; for the gpt-4o agent logs the judge model equals the agent model and is separated by spans"

[[family.inspect.quirk]]
id = "inspect.unfinished_log"
note = "2 logs hold only _journal/ members and samples, no header.json (28 samples): the reader registers them select.dialect_planned"
observed = { logs = 2, samples = 28 }

[[family.inspect.quirk]]
id = "inspect.patched_judge_reruns"
note = "logs/patched-judge*/ hold new runs of the same models and splits (every sample uuid and message id differs from logs/); 230 message lists are equal in text to another sample's (deterministic tools and identical refusals), none is a copy"

[[family.inspect.quirk]]
id = "inspect.local_path_model_id"
note = "18 logs (792 samples) name the agent model by a local checkpoint path; never quoted; redaction proposal D-182"
observed = { logs = 18, samples = 792 }

[[family.inspect.quirk]]
id = "inspect.event_order_not_time_order"
rules = ["inspect.no_order_from_event_list@1"]

[[family.inspect.quirk]]
id = "inspect.attachment_refs"
rules = ["inspect.model_event_is_call@1"]

[[family.inspect.quirk]]
id = "inspect.sample_limit"
rules = ["inspect.sample_limit@1"]
observed = { samples = 298 }
note = "message limits"

[[family.inspect.quirk]]
