# Source profile `agentharm-live`: AgentHarm (inspect_evals `agentharm`, `agentharm_benign`) run live through the Inspect
# harness (backends/inspect/envs/agentharm; docs/reports/inspect-harness/design.md; DECISIONS D-660..D-669).
#
# Data, not code. No status lives here: the registry is the only status store (R-38, R-45). Any byte change bumps
# `version` (AD-18); nothing is released yet, so it is still 1. The [family.inspect] table, its `live` table included, is
# checked against ../family.schema.json (closed schema, D.4.1).
#
# Run, then import (D-665): the cell's Inspect `.eval` log, written in T2 by inspect_ai, is mapped by the unchanged
# `inspect.eval` reader and mapper. Its AER says `mode: import` and its evidence is `O` by `source`, Inspect's own record
# of the run; the index row says `mode: live` with the campaign's attempt (a live corpus, H.1.1(2)). The session's
# capture/0.1 wire log is stored beside it as a supporting raw object and not mapped (D-665 (b)). The producer identity is
# verified by T0 (the [family.inspect.live] pins, the task-files digest and the dataset digests), not only claimed by the
# log's eval.packages.
#
# Restricted use (LIC 3; D-668, user decision 2026-10-22): the samples are AgentHarm's harmful requests and the model's
# completions; the corpus is its own restricted-use corpus, private, with no public release without a separate decision.
# The raw `.eval` names the workstation's T2 home path (RH-2); a private corpus keeps it, as decided.

[profile]
id = "agentharm-live"
version = 1
format = "agentprov-source-profile/0.1"
source_id = "agentharm"
family = "inspect"
parts = ["live"]
title = "AgentHarm run live through the Inspect harness (inspect_evals 0.20.0 on inspect_ai 0.3.263; restricted-use corpus)"
evidence = ["docs/reports/inspect-harness/design.md", "DECISIONS D-660..D-669"]

[source]
canonical_repo = "https://github.com/UKGovernmentBEIS/inspect_evals"
paper = "arXiv:2410.09024 (AgentHarm)"

# The dataset the environment provisions (backends/inspect/envs/agentharm [tool.agentprov.dataset]; the revision
# inspect_evals 0.20.0 itself pins). The wheels are pinned in [family.inspect.live] below.
[[source.pins]]
role = "agentharm_dataset"
part = "live"
kind = "hf"
dataset = "ai-safety-institute/AgentHarm"
revision = "e23b3fe60a0da9037314b88e5ee3a0c054970dad"
gated = false
note = "8 files, 347,661 B, fetched 2026-10-22 with the user's consent (acquisitions.jsonl); the six benchmark/*.json are provisioned"

[licence]
spdx = "MIT"
holders = ["UK AI Security Institute (inspect_evals)", "Gray Swan AI and UK AI Safety Institute (AgentHarm)"]
data_licence = "MIT"
policy = "include"
restrictions = [
  "AgentHarm task data: MIT License with an additional clause (use only to improve AI safety and security)",
  "D-668: restricted-use corpus, private; no public release without a separate user decision",
]
basis = "the user's own runs of inspect_evals (MIT) on the AgentHarm dataset (MIT with an AI-safety use clause, HF ai-safety-institute/AgentHarm @ e23b3fe6 card); D-668"
attribution = [
  "AgentHarm (c) 2024 Gray Swan AI and UK AI Safety Institute, MIT License with an additional clause",
  "inspect_evals (MIT, (c) 2024 UK AI Security Institute)",
]
unassessed = ["model-provider terms on redistributing model outputs (agent and judge models)"]

[lineage]
built_on = ["inspect_evals 0.20.0 (agentharm, agentharm_benign)", "inspect_ai 0.3.263"]
vendored = []
duplicates = []
cited_by = []
content_dedup = "never"

[import]
dialect = "inspect.eval"
mapper = "inspect.eval"
variants = ["v2"]
include = ["raw/inspect/*.eval"]
exclude = []
layout = "raw/inspect/<timestamp>_<task>_<id>.eval (one per cell attempt, in the session's staging)"

[family.inspect]
benchmark = "agentharm"
no_attack = true
producer_band = { inspect_ai = ["0.3.263"] }
log_versions = [2]
members = ["header.json", "samples/*_epoch_*.json"]
span_roles = { solver = "agent", scorer = "judge" }
ground_truth_metadata = ["target_functions", "grading_function"]

[family.inspect.live]
backend = "inspect-agentharm"
project = "backends/inspect/envs/agentharm"
pins = { distribution = "inspect-ai", version = "0.3.263", wheel_sha256 = "503e7ff509d77fcdf65989027a19fea966fb668deb88a234468c3290964fd86a" }
distribution_pins = [
  { distribution = "inspect-evals", version = "0.20.0", wheel_sha256 = "6db2e849144bac3c3b0e05cc976a829bc2fae94a72d0d1d091d970ea202b1d82" },
]
dataset = { repo = "ai-safety-institute/AgentHarm", revision = "e23b3fe60a0da9037314b88e5ee3a0c054970dad" }
# agentprov_backend_inspect.worker INSTRUMENTATION and SCRIPTED_ITEM (design §4.3)
instrumentation_accepted = [
  "inspect.harness_settings@2",
  "inspect.recording_http_client@1",
  "inspect.dataset_offline@1",
  "inspect.transport_scripted@1",
]

[[family.inspect.quirk]]
id = "inspect.judge_model_separate_from_agent"
note = "the refusal and semantic judges are separate models (--judge ROLE=MODEL, at the agent's endpoint), separated by scorer spans"

[[family.inspect.quirk]]
id = "inspect.bundled_file_tools_cwd"
note = "inspect_evals 0.20.0's read_file opens benchmark/harmful_tools/content/... relative to the working directory, which is the session staging: every bundled-file read fails, as in the survey logs (inspect_evals #2439, D-582)"

[[family.inspect.quirk]]
id = "inspect.event_order_not_time_order"
rules = ["inspect.no_order_from_event_list@1"]

[[family.inspect.quirk]]
id = "inspect.attachment_refs"
rules = ["inspect.model_event_is_call@1"]

[[family.inspect.quirk]]
id = "inspect.sample_limit"
rules = ["inspect.sample_limit@1"]
note = "the plan's message, token and time limits (mandatory, D-667)"

[[family.inspect.quirk]]
id = "inspect.tool_span_separate_from_tool_event"
rules = ["inspect.no_order_from_event_list@1"]
