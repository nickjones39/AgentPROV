# Source profile `survey-agentharm`: the survey's AgentHarm Inspect logs (docs/architecture D.4.4, D.9; I.1.1 row 11).
#
# Data, not code. No status lives here: the registry is the only status store (R-38, R-45). Any byte change bumps
# `version` (AD-18). Version 2 adds the [withhold] table (D-811); version 1, the bytes the stored corpora and the
# regeneration round's kept ast-survey-agentharm-rg1 recorded, ships under archive/ (D-31: a recorded profile bumps with
# archive). The [family.inspect] table is checked against ../family.schema.json (closed schema, D.4.1).

