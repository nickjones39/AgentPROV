# D-811 (post-check PC-ast-survey-agentharm S2, user decision 2026-10-24, option (a); D-604 object scope, as kexin's
# rule, item 107): the header.json member of each of the 6 .eval logs records Inspect's eval.dataset.location, a
# dataset cache under one named third-party account's home directory. The value is in raw only: no AER, SEM or PROV
# file holds it (D-235). Such a member is withheld at seal with its digest kept in WITHHELD.json, its .eval archive with
# it (container closure, AD-12); every execution stays released (object scope). The pattern is anchored on the header
# key and names no account; the 7-character floor skips a generic system account. Census at the pin (the stored rg1
# corpus): exactly the 6 header members, 1 match each; 0 sample members, 0 derived files.
[withhold]
reason = "personal_data"
public_note = "raw log headers whose dataset location names a third-party account's home directory; withheld, digest kept"

[[withhold.rules]]
id = "dataset-location-home"
pattern = "\"location\":\"/home/[a-z0-9_\\-]{7,32}/"
scope = "object"
public_note = "dataset location in a third-party account's home (census at the pin: 6 of 6 headers)"
