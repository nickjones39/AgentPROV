# Artefact catalogue of the `inspect` family (docs/architecture D.15.2, D.15.6; DECISIONS D-12).
#
# Data, not code: read by the shared layer agentprov.artefacts. Any byte change bumps `version`. Counts are per pinned
# snapshot and are regression expectations, never gates that hide data; they come from the full-snapshot import of
# 2026-10-08 (tests/full_corpus/test_inspect_survey.py; D.9.5). Descriptions hold no source content.
#
# The corpus pre-check, wave 1 (docs/reports/precheck/ast-survey-agentharm.md, 2026-10-15; D-581, D-582, regeneration-
# batch item 109) added the last three entries. Version stays 1: D-31 owner ruling 2026-10-21, in place, no corpus records
# the artefact catalogue (its bytes enter only the family's adapter_code_sha256, a code digest).

version = 1
family = "inspect"
namespaces = ["inspect"]

