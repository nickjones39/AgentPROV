[[artefact]]
id = "inspect.art.message_copies_share_calls"
title = "Message copies share their calls"
description = "Inspect copies a message with its id and tool calls (react's submit removal, the reasoning history re-sent to the model), so one call can be held by several messages. The call is the copy the model produced; the other copies' call parts are declared unexecuted under this rule, never counted as separate calls. The entry claims the unexecuted_tool_call hits that cite this rule only; a call with no tool event that is not a copy is another finding."
