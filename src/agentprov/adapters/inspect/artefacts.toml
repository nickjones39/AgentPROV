[[artefact]]
id = "inspect.art.bundled_file_not_found"
title = "Bundled-content file tools fail with file not found"
description = "AgentHarm's read_file and convert_pdf_to_text (benign_tools and harmful_tools alike) resolve bundled files relative to the process working directory. The survey ran the benchmark from the inspect_evals checkout root (inferred), so every call naming a bundled file failed: read_file with error type file_not_found, convert_pdf_to_text with a file-not-found result text (no structured error, counted by the pre-check scan). The scores of the affected samples rest on a broken tool environment (inspect_evals #2439, which names the benign tools only). All samples are kept."
scope = { sources = ["agent-security-tools-survey"], parts = ["agentharm"], profiles = ["survey-agentharm"] }
cause = "upstream_harness"
detector = { rule = "inspect.tool_error_status@1", class = "D" }
recorded_as = {}
handling = { class = "FO" }
expected = [
  { snapshot = "git:89c4db2c949797fbb38c5bfed85dc82780ddbfe3", count = 63, basis = "pre-check PC-ast-survey-agentharm-01: samples with at least one harness-failed call (coder_benign 13, coder_harmful 9, gptoss_benign 15, gptoss_harmful 2, qwen14_benign 12, qwen14_harmful 12; benign 40, harmful 23)", unit = "samples", status = "verified" },
  { snapshot = "git:89c4db2c949797fbb38c5bfed85dc82780ddbfe3", count = 84, basis = "pre-check PC-ast-survey-agentharm-01: read_file calls on allowlisted bundled files, all failed (93 read_file calls in all; 7 invalid names, 2 directories)", unit = "calls", status = "verified" },
  { snapshot = "git:89c4db2c949797fbb38c5bfed85dc82780ddbfe3", count = 62, basis = "pre-check PC-ast-survey-agentharm-01: convert_pdf_to_text calls with the file-not-found result (of 63; 1 unmatched path)", unit = "calls", status = "verified" },
]
manuscript = true
refs = ["docs/reports/precheck/ast-survey-agentharm.md PC-ast-survey-agentharm-01", "https://github.com/UKGovernmentBEIS/inspect_evals/issues/2439", "https://github.com/UKGovernmentBEIS/inspect_evals/pull/2455"]

