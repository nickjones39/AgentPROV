recorded_as = { issues = ["inspect.sample_limit"] }
handling = { class = "CR", rule = "inspect.sample_limit@1" }
expected = [
  { snapshot = "git:89c4db2c949797fbb38c5bfed85dc82780ddbfe3", count = 54, basis = "sample_limit events: coder_benign 9, gptoss_benign 33, qwen14_benign 6, qwen14_harmful 6" },
