[[artefact]]
id = "inspect.art.times_not_recorded"
title = "Times the log does not record, or records contradictorily"
description = "A sample without started_at or completed_at leaves its run scope's start or end not recorded; a model event without a completion time leaves the call's end not recorded; a tool-output truncation decision carries no time. In whistlebench some records at one local offset have a start later than their end: both stay verbatim in t.raw, declared ambiguous, and take no part in time edges. No time is filled."
