# Semantics profile inspect.atia@1: the tool policy and the scorer table for the ATIA Inspect logs (docs/architecture
# D.9.15, D.9.10, C.14.3; DECISIONS D-307 addendum, orchestrator request 2026-10-21; fail-closed like D-601's
# inspect.whistlebench@1). Data, not code: read by agentprov.adapters.inspect.semantics.atia. Its annotations cite the
# inspect rule catalogue at version 2 (H.2.5).
#
# Tool table. EMPTY ON PURPOSE. The pin covers logs/ only. The code that ran is not available at a pinned identity: the
# logs' header revisions are not in the public history, and the task, solver and scorer files at the pinned commit lie
# outside the pinned tree and were committed after the logs were written (D.9.10). The samples' metadata lists each
# sample's harmful and benign tools, but that is a benchmark label, not tool code, and it is not read. So this version
# knows no tool, and every tool is fail-closed (C.14.3, rule inspect.untabulated_tool@1, class I):
#   - the tool_call parts and the tool_executions get role ["unknown"];
#   - the tool_result parts get integrity "unknown" (never "trusted"), and no channel.
# There is no taint policy: with every request role unknown, a policy would mark every pair and say nothing.
[tool_policy]
known_tools = []
role = ["unknown"]
integrity = "unknown"

# Scorer table. EMPTY ON PURPOSE. The one scorer, harmful_tool_invoked, records C or I. Its meaning is set by scorer
# code that is not available at a pinned identity, and the pre-check found its polarity inverted in the two status-error
# logs (PC-atia-benchmark-01: 36 of 36 scored samples), so no single polarity holds for the corpus. No claim is read
# from a scorer name or an observed value, so no judgement gets an outcome annotation. The judgements stay in the AER
# and the PROV. A later version adds [[scorer]] entries only once the run-time scorer code is read at a pinned identity.
