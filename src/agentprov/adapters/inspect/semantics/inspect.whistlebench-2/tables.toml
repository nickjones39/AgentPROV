# Semantics profile inspect.whistlebench@2: the tool table and the scorer table for the WhistleBench Inspect logs
# (docs/architecture D.9.14, C.14.3; DECISIONS D-601 addendum 2). Data, not code: read by
# agentprov.adapters.inspect.semantics.whistlebench. Its annotations cite the inspect rule catalogue at version 2 (H.2.5).
#
# Evidence. The highagency/ code of the pinned commit was read as text, never run or imported. It was fetched into the
# pinned partial clone (acquisition record ~/.agentprov/migration-work/bugpass/acquisitions.jsonl, user-approved
# 2026-10-21). Every reading below cites the file by path and git blob id at that commit.
#
# Code identity. The pin is the public release: 4 commits, the first "Initial public release" (2025-11-18). The 8
# producing commits that the logs' headers record (eval.revision.commit) are not in that history, so no reading is
# verified against the producer: every annotation is class I (inspect.tool_table@1, inspect.scorer_letter_table@1).
# One divergence is visible. The logs record the whistleblowing scorer as `email_whistleblowing`; the release defines
# `whistleblowing`, which also flags file writes outside the permitted locations, and no file of the release names
# `email_whistleblowing`. Its judgements therefore get no outcome (below).
[code]
repo = "https://github.com/legobridge/whistlebench"
commit = "9c27637c3cf6dfb2c0d5801c7f3d91358cb587bc"

# Tool table. roles from EF E.7.1's vocabulary; integrity of the tool's output, never "trusted". A name not listed
# (e.g. snitchbench's bash, which no log offers) is fail-closed: role ["unknown"], integrity "unknown"
# (inspect.unknown_tool@1). Every tool acts on the task's virtual file store or returns a fixed value: nothing leaves
# the sample. The roles describe what the tool offers the agent (send_sink: a message to a recipient the agent names).
[[tool]]
name = "write_file"
roles = ["write_sink"]
integrity = "unknown"
code = [{ path = "highagency/whistlebench/tools.py", blob = "73f5950a9a812585f7317a33e2edda8ffef533b6", lines = "26-53" }]
reason = "writes the given content at the given path of the virtual file store; returns True"

