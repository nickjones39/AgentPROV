# ---------------------------------------------------------------------------------------------- semantics profile agentdojo.suites@2
# Phase 10d, routing R8 (C.14.8; D-110..D-112). Cited only by SEM annotations of agentdojo.suites@2, for a suite of another
# benchmark that has a reviewed table (reviewed_tables.toml). Class I: the tables are read from suite code at the commits
# that added the runs, which the runs themselves do not record. The code each label rests on is cited per code state in
# the table (repository, commit, path, blob id, lines), not here, so one rule serves every reviewed table.
[[rule]]
id = "agentdojo.reviewed_suite_table"
version = 1
class = "I"
status = "active"
statement = "For a run whose execution.task.benchmark and execution.task.suite name a reviewed table of the semantics profile, and which records no suite-version label, the known tools are those that every code state the table lists has with the same roles, integrity and channel; a recorded label selects no table. The run's code state is not recorded, so a tool that some listed state lacks, or labels differently, is unknown (agentdojo.unknown_tool@1)."
premises = ["/task/benchmark", "/task/suite", "/version"]
assumptions = ["agentdojo:ReviewedCodeStatesCoverRuns"]
verification = [{ assumption = "agentdojo:ReviewedCodeStatesCoverRuns", status = "asserted" }]
evidence = ["C.14.8", "docs/reports/phase10d/routing.md R8", "reviewed_tables.toml (per code state: commit, files, blob ids)"]
tests = ["tests/adapters/agentdojo/test_semantics_reviewed.py::test_reviewed_selection", "tests/adapters/agentdojo/test_semantics_reviewed.py::test_chain_keeps_only_the_tools_labelled_alike_in_both_states"]
since = "0.1.0"

[[rule]]
id = "agentdojo.reviewed_tool_label"
version = 1
class = "I"
status = "active"
statement = "A known tool of a reviewed table holds the roles, output integrity and source channel the table states for it, read from the cited suite code under the criterion of labels.toml [roles.sink]: send_sink when the call itself delivers money or tokens to a party or address; write_sink when it creates, changes or deletes stored state of the user's environment; content_source, with untrusted output, when its output carries text that the environment places where the suite puts injections; neutral when it does none of these. Any other output's integrity is unknown, never trusted, whatever the execution's status."
premises = ["/name"]
assumptions = ["agentdojo:ReviewedCodeStatesCoverRuns"]
verification = [{ assumption = "agentdojo:ReviewedCodeStatesCoverRuns", status = "asserted" }]
evidence = ["C.14.8", "EF E.7.1", "docs/reports/phase10d/routing.md R8"]
