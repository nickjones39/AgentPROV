[[rule]]
id = "agentdojo.lone_surrogate_replaced"
version = 1
class = "D"
status = "active"
statement = "A lone UTF-16 surrogate in the source (an escaped \\ud800-\\udfff code unit the strict loader keeps, e.g. an emoji cut in half) is replaced by U+FFFD where the AER needs a Unicode scalar string: a typed string field, or an object key. A $utf16 value in a Json field is kept. The pointer cites this rule and the seal lists the records under the info issue agentdojo.lone_surrogate_replaced; the original stays in the raw store (regeneration-batch item 7, escaping audit F-01, DECISIONS D-23 and D-378). A text transformation by AgentPROV, independent of the producing code."
premises = []
assumptions = []
evidence = ["docs/reports/analysis/research/A4-escaping.md F-01", "DECISIONS D-23", "DECISIONS D-378", "regen-batch item 7"]
tests = ["tests/adapters/test_item7_surrogates.py::test_scrub_record_replaces_typed_positions_and_keeps_json_values"]
since = "0.1.0"


[[rule]]
id = "agentdojo.yaml_norm"
version = 2
class = "D"
status = "active"
statement = "Normaliser (agentdojo.suites@2 on; regeneration-batch item 8, F-10): agentdojo.yaml_norm@1 reading only the escapes YAML defines (the single-character escapes 0 a b t n v f r e N _ L P, space, double quote, slash, backslash and tab, the hex forms \\xNN, \\uNNNN and \\UNNNNNNNN, and line folding) and the escaped apostrophe of a Python repr (the readings serve repr outputs too). Any other escape, such as \\q or a short \\u12, keeps its backslash instead of decoding to its letter, so it cannot make a payload present that differs from the output in that letter. The decoded reading and the fallbacks are unchanged."
premises = []
assumptions = []
code = [
  { repo = "https://github.com/nickjones39/agentdojo-prov", commit = "579a908354b93361efe0905ffb7623256aa96a06", path = "agentdojo_prov/build_prov.py", lines = "144-285", note = "the v2.3 readings, with the escape grammar narrowed to YAML's in agentprov.adapters.agentdojo.semantics.markers" },
]
evidence = ["C.14.3", "docs/reports/analysis/research/A4-escaping.md F-10", "regen-batch item 8", "DECISIONS D-379"]
tests = ["tests/adapters/agentdojo/test_items_4_6_8.py::test_an_invalid_escape_keeps_its_backslash_under_version_2", "tests/adapters/agentdojo/test_items_4_6_8.py::test_yaml_escapes_are_still_read"]
since = "0.1.0"

