[[rule]]
id = "agentdojo.defence_authored_message"
version = 1
class = "I"
status = "active"
statement = "In a file whose defence a profile quirk names, a system message, or an agent assistant message without tool calls, whose text has a digest that the quirk lists for that defence was written by the defence, not by the harness or the model. A system message of that kind is the defence's insert (MELON-R's security warnings). An assistant message of that kind is the defence's replacement of the model's reply after a detection (base MELON's stop message, MELON-R's block message): the model call stays, a decision by the defence (verdict terminate; the reply, the decision's original, overwritten) generates the message, and the model call generates nothing. Class I: the texts are recognised by the digest of the logged text; the pinned code holds the stop and block texts verbatim and a longer form of the warning, and the code that wrote the logs is not verified (pre-check PC-melon-agentdojo-03/04, D-586)."
premises = ["/messages"]
assumptions = []
code = [
  { repo = "https://github.com/xwsdid/MELON", commit = "71d99dfff5ef98ffb25bac451909f3e10af9e27f", path = "src/agentdojo/agent_pipeline/pi_detector.py", lines = "643-656", note = "MELON: the stop message replaces updated_messages[-1], the model's reply" },
  { repo = "https://github.com/xwsdid/MELON", commit = "71d99dfff5ef98ffb25bac451909f3e10af9e27f", path = "src/agentdojo/agent_pipeline/pi_detector.py", lines = "1510-1530", note = "MELON-R BLOCK: the blocked message replaces the last message" },
  { repo = "https://github.com/xwsdid/MELON", commit = "71d99dfff5ef98ffb25bac451909f3e10af9e27f", path = "src/agentdojo/agent_pipeline/pi_detector.py", lines = "1551-1569", note = "MELON-R RECOVERY: a system message inserted at index 0 (a longer text than the logged one)" },
]
evidence = ["docs/reports/precheck/melon-agentdojo.md PC-melon-agentdojo-03, PC-melon-agentdojo-04", "DECISIONS D-586"]
tests = ["tests/adapters/agentdojo/test_melon.py::test_the_stop_message_is_a_terminate_decision_by_the_defence", "tests/adapters/agentdojo/test_melon.py::test_a_recovery_insert_is_the_defence_and_the_default_prompt_stays_the_harness"]
since = "0.1.0"

