status = "active"
statement = "In a file defended by the SEAgent guard (an identity defence the profile's quirk names), a tool message that answers a call whose logged name is a tool name followed by the quirk's suffix (BLOCKED_BY_SEAGENT) records the guard's block, not an execution: the guard renamed the call before dispatch and answered it with an empty tool message, so no tool ran. It is a deny decision by that defence about the renamed call (its name kept verbatim), with the reason not recorded, and the tool message is generated by it. The guard also dropped the other calls of that batch: each is a call that was never executed (unexecuted_tool_call, warning, wherever it stands in the batch), not a lost result (D-592). Class I: the reading rests on the logs (960 renamed calls, each answered by one empty tool message and followed by a user-role warning) and the profile, not on verified SEAgent code (pre-check PC-seagent-agentdojo-02, D-591)."
premises = ["/messages"]
assumptions = []
evidence = ["docs/reports/precheck/seagent-agentdojo.md PC-seagent-agentdojo-01, PC-seagent-agentdojo-02", "DECISIONS D-591"]
tests = ["tests/adapters/agentdojo/test_seagent_guard.py::test_a_renamed_call_is_a_deny_decision_by_the_guard", "tests/adapters/agentdojo/test_seagent_guard.py::test_the_dropped_calls_of_a_blocked_batch_are_unexecuted_not_lost"]
