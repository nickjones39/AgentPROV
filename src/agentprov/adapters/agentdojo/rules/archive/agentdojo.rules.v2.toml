id = "agentdojo.committed_no_later_than_unverified"
version = 1
class = "I"
status = "active"
statement = "The reading of agentdojo.committed_no_later_than@1 where it cites no code, only documentary evidence (D-27 c6), so it is inferred, not derived (D.5.4 \"Citation of D rules\"): The committer date of the commit that introduced a log's blob at its path is an upper bound on the log's run time: a file can be in a commit only after it was written. The introducing commit is the one the git origin carries (introduced_in_commit): the earliest by (committer date, commit id) among the commits reachable from the pinned commit whose tree holds the blob at the path and none of whose parents does (full history, all parents, no rename following). The date is a claim of the committer's clock, written to ext only: never a PROV time, never the timestamp of any record, and neither a lower bound nor an estimate of the run time. Written only when the origin carries the commit and the profile's history table lists it; otherwise the field is absent."
premises = []
assumptions = []
evidence = ["sources/agentdojo-inspect.md §7", "sources/agentdojo.md §8.1", "D.6.16", "D.5.4", "DECISIONS D-27 c6"]
tests = ["tests/adapters/test_code_verification.py::test_every_twin_restates_its_d_rule"]
since = "0.1.0"

