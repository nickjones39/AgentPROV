]
evidence = ["C.3.5 sent transforms", "C.6.6 error-substituted tool result", "audit/capture.md §3"]
tests = ["tests/adapters/agentdojo/test_capture_mapper.py::test_error_substitution_is_a_sent_transform", "tests/adapters/agentdojo/test_capture_mapping.py::test_missing_input_at_aligns_under_cap_rule"]
since = "0.1.0"

