# ---------------------------------------------------------------------------------------------- semantics profile agentdojo.suites@1
# Phase 7 (C.14; EF E.7; D.5.4 last paragraph). Cited only by SEM annotations of the semantics profile
# agentdojo.suites@1 (src/agentprov/adapters/agentdojo/semantics/), never by AER records. The tool tables come from
# AgentDojo-PROV v2.3 at the frozen baseline 579a908 (copied into the profile's labels.toml) and from the AgentDojo
# suite code read as AST (suite_tools.toml, tools/agentdojo/gen_suite_tools.py). Table readings are class I (EF F.1.8:
# they fail T-D4); the marker and outcome readings are D (deterministic functions of recorded values under cited code).
[[rule]]
id = "agentdojo.suite_tool_table"
version = 1
class = "I"
status = "active"
statement = "The tools a run could call are those of the applicable suite tool table: execution.task.suite of benchmark agentdojo at the suite version named by the benchmark actor's recorded version label (the key of load_suites._SUITES); a recorded label naming no known version selects no table; with no recorded label, a tool is known only if it is in the suite's table at every known code state and version (the intersection). A tool outside the table is unknown (agentdojo.unknown_tool@1)."
premises = ["/task/benchmark", "/task/suite", "/version"]
assumptions = ["agentdojo:RunCodeAmongKnownStates"]
verification = [{ assumption = "agentdojo:RunCodeAmongKnownStates", status = "asserted" }]
code = [
  { repo = "https://github.com/ethz-spylab/agentdojo", commit = "089ed468cf3ed0322acc66b0211f26d9d90dbf60", path = "src/agentdojo/task_suite/load_suites.py", lines = "1-86", note = "_SUITES: version label -> suites; get_new_version deep-copies the v1 suite" },
  { repo = "https://github.com/ethz-spylab/agentdojo", commit = "089ed468cf3ed0322acc66b0211f26d9d90dbf60", path = "src/agentdojo/task_suite/task_suite.py", lines = "134-137", note = "get_new_version changes only benchmark_version" },
  { repo = "https://github.com/ethz-spylab/agentdojo", commit = "c274885610efaaafec38b6d3eb07152ba7ff3f94", path = "src/function_calling_pi/task_suites/__init__.py", lines = "1-21", note = "SUITES of the June-2024 code (unversioned)" },
]
evidence = ["C.14.1", "D.6.5 benchmark version label", "suite_tools.toml (generated)"]
tests = ["tests/adapters/agentdojo/test_semantics.py::test_suite_table_selection", "tests/adapters/agentdojo/test_semantics.py::test_suite_tools_table_is_generated"]
since = "0.1.0"

