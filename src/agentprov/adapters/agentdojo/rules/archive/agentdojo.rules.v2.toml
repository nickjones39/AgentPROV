# ---------------------------------------------------------------------------------- assumptions of engine rules (EF E.10 item 21)
# I twins (AD-05): the code below does what the assumptions say, but the AgentDojo-family sources record no commit or
# wheel hash of the producing code (June-2024 logs are an unpinned range; transcript/v1 records a version string only),
# so the assumptions are asserted, never verified, and the statements resting on them go to inference bundles. A
# source whose harness identity is pinned (live capture, phase 8) cites a D twin with a verified entry instead.
[[rule]]
id = "agentdojo.auto_execution_unverified"
version = 1
class = "I"
status = "active"
statement = "The FunctionsRuntime dispatches every tool call the model requests, without confirmation, on behalf of the agent (apv:AutoExecution): ToolsExecutor loops over the last assistant message's tool calls and runs each. Asserted for the producing code, which the source does not identify."
premises = ["/on_behalf_of"]
assumptions = ["apv:AutoExecution"]
verification = [{ assumption = "apv:AutoExecution", status = "asserted" }]
