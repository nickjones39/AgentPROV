[[rule]]
id = "agentdojo.system_prompt_variant_digest"
version = 1
class = "D"
status = "active"
statement = "The system message's text (a string, or the texts of its text blocks joined by a newline) has the SHA-256 that the profile pins for a system-prompt variant of the harness code, so the message carries that variant's label (ext.agentdojo.system_prompt_variant). A text with no pinned digest among the variants declared for the file is reported as agentdojo.system_prompt_unrecognised; no label is guessed."
premises = ["/messages/0/content"]
assumptions = []
code = [
  { repo = "https://github.com/ethz-spylab/agentdojo", commit = "089ed468cf3ed0322acc66b0211f26d9d90dbf60", path = "src/agentdojo/data/system_messages.yaml", lines = "1-9", note = "default" },
  { repo = "https://github.com/ethz-spylab/agentdojo", commit = "089ed468cf3ed0322acc66b0211f26d9d90dbf60", path = "src/agentdojo/agent_pipeline/agent_pipeline.py", lines = "52-57", note = "load_system_message" },
]
evidence = ["D.6.6 system row", "D.6.12"]
tests = ["tests/adapters/agentdojo/test_v1_import.py::test_system_prompt_variant_label"]
since = "0.1.0"

[[rule]]
id = "agentdojo.functions_runtime"
version = 1
class = "D"
status = "active"
statement = "Tools run in AgentDojo's FunctionsRuntime: the tool-runtime actor exists. Its acting on behalf of the agent without confirmation is agentdojo.auto_execution_unverified@1."
premises = []
assumptions = []
evidence = ["C.16.1"]
tests = ["tests/adapters/adprov/test_mapping.py::test_c16_2_vector_is_reproduced", "tests/adapters/agentdojo/test_mapper.py::test_c16_1_vector_is_reproduced"]
since = "0.1.0"

[[rule]]
id = "agentdojo.environment_loaded_with_injections"
version = 1
class = "D"
status = "active"
statement = "The suite loads the task environment with the run's injections before the agent runs: run_task_with_pipeline calls load_and_inject_default_environment(injections) once, before the passes, with the injections the log records. The run therefore used every injection payload: an agentdojo:load_environment activity of the run scope, performed by the benchmark, has the payload fixtures as inputs (regeneration-batch item 5, user decision C2)."
premises = ["/injections"]
assumptions = []
code = [
  { repo = "https://github.com/ethz-spylab/agentdojo", commit = "c274885610efaaafec38b6d3eb07152ba7ff3f94", path = "src/function_calling_pi/task_suites/task_suite.py", lines = "134-135, 237-248", note = "load_and_inject_default_environment before the passes" },
  { repo = "https://github.com/ethz-spylab/agentdojo", commit = "089ed468cf3ed0322acc66b0211f26d9d90dbf60", path = "src/agentdojo/task_suite/task_suite.py", lines = "139-140, 339-366", note = "the same" },
  { repo = "https://github.com/ethz-spylab/agentdojo", commit = "a75aba7631d3ca5fb7ab938965c97ead2f9ff84b", path = "src/agentdojo/task_suite/task_suite.py", lines = "139-140, 339-366", note = "the 0.1.35 wheel; byte-identical to 089ed468's file" },
]
evidence = ["docs/reports/analysis/phase10-corpus-analysis.md C2", "regen-batch item 5", "DECISIONS D-370"]
tests = ["tests/adapters/agentdojo/test_item5_environment.py::test_the_environment_load_uses_every_payload"]
since = "0.1.0"

[[rule]]
id = "agentdojo.environment_loaded_with_injections_unverified"
version = 1
class = "I"
status = "active"
statement = "The reading of agentdojo.environment_loaded_with_injections@1 where the code that wrote the record is not among the commits it cites (D-24), so it is inferred, not derived (D.5.4 \"Citation of D rules\"): The suite loads the task environment with the run's injections before the agent runs: run_task_with_pipeline calls load_and_inject_default_environment(injections) once, before the passes, with the injections the log records. The run therefore used every injection payload: an agentdojo:load_environment activity of the run scope, performed by the benchmark, has the payload fixtures as inputs (regeneration-batch item 5, user decision C2)."
premises = ["/injections"]
assumptions = []
evidence = ["docs/reports/analysis/phase10-corpus-analysis.md C2", "regen-batch item 5", "DECISIONS D-370", "D.5.4", "DECISIONS D-24"]
tests = ["tests/adapters/test_code_verification.py::test_every_twin_restates_its_d_rule"]
since = "0.1.0"

[[rule]]
id = "agentdojo.payload_attributed_to_attacker"
