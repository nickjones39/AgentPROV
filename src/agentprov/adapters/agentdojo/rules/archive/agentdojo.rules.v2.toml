[[rule]]
id = "agentdojo.committed_no_later_than"
version = 1
class = "D"
status = "active"
statement = "The committer date of the commit that introduced a log's blob at its path is an upper bound on the log's run time: a file can be in a commit only after it was written. The introducing commit is the one the git origin carries (introduced_in_commit): the earliest by (committer date, commit id) among the commits reachable from the pinned commit whose tree holds the blob at the path and none of whose parents does (full history, all parents, no rename following). The date is a claim of the committer's clock, written to ext only: never a PROV time, never the timestamp of any record, and neither a lower bound nor an estimate of the run time. Written only when the origin carries the commit and the profile's history table lists it; otherwise the field is absent."
premises = []
assumptions = []
evidence = ["sources/agentdojo-inspect.md §7", "sources/agentdojo.md §8.1", "D.6.16"]
tests = ["tests/adapters/agentdojo/test_history_fields.py::test_the_date_of_the_introducing_commit_is_written_as_an_ext_field", "tests/unit/raw/test_history.py::test_every_blob_gets_its_earliest_introducing_commit"]
since = "0.1.0"

[[rule]]
id = "agentdojo.benchmark_era_from_commit"
version = 1
class = "I"
status = "active"
statement = "For a file that records no benchmark version, the candidate version is the benchmark version in force in the tree of the commit that introduced the file's blob (rule committed_no_later_than): the newest default_suites/<vN> directory present there. AgentDojo registers a version by importing that directory in load_suites.py, and the label is the directory name with '_' read as '.'. A commit whose tree has no version directory predates the label (basis pre_versioning); its suites are the ones the commit e1bc6171 ('Add benchmark versioning') labelled v1. The version registered next is recorded with the date of its cut commit, because versions were cut from the working tree: a file committed shortly before a cut, or on a branch that did not hold it yet, may come from the suite state that became the next version (the 2024-07-16/17 travel re-runs are such files). A candidate, not a finding: per file, never per pipeline directory; suites edited in place between two cuts are not told apart. Written only when the file records no version, its origin carries the commit and the profile's history table lists it."
premises = []
assumptions = []
code = [
  { repo = "https://github.com/ethz-spylab/agentdojo", commit = "e1bc6171c8179446d954f3c43a9d0aedbb165ee6", path = "src/agentgym/task_suites/load_suites.py", note = "Add benchmark versioning (2024-06-10): the registry is introduced with version v1" },
