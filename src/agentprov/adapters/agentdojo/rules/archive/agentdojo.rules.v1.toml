# ---------------------------------------------------------------------------------------------- declared assumptions
[[assumption]]
id = "agentdojo:ToolNameDeterminesLabel"
statement = "A tool's integrity, roles and source channel follow from its name within the applicable suite tool table: the function registered under that name behaves at the run's code state as the cited table says (the v2.3 tables, written against the v1.2.2 suites)."

[[assumption]]
id = "agentdojo:NormaliserRejectionIsContainment"
statement = "A tool output in which the opening of a registered payload is visible, but which the YAML normaliser rejects and no fallback reading decodes, is read as possibly containing the payload: the rejection is taken as a containment claim of unknown truth (marker ambiguous), never as absence."

[[assumption]]
id = "agentdojo:RunCodeAmongKnownStates"
statement = "A run without a recorded suite-version label used the suite code of one of the code states and versions in suite_tools.toml (the June-2024 code at c274885 or a version of the head pin)."
