class = "D"
status = "active"
statement = "Added in phase 8. The stock OpenAI element builds the AgentDojo message from the reply's content and tool calls only (_openai_to_assistant_message); a refusal and provider reasoning text (reasoning, reasoning_content, else the text of reasoning_details) reach only the response blob. They belong to the message the kept call generated (agentdojo.capture_reply_appended@1) and are appended after its native parts as refusal and reasoning parts, their content O by the provider, unless the native message already holds a part of that kind. The native TraceLogger log cannot express them, so the live-versus-native projection omits them."
