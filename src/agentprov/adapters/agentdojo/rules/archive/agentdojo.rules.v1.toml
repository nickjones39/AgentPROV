since = "0.1.0"

# ---------------------------------------------------------------------------------------------- attempts and order
[[rule]]
id = "agentdojo.log_holds_last_pass"
version = 1
class = "D"
status = "active"
statement = "A TraceLogger file holds only the message list of the final pipeline pass of its cell: run_task_with_pipeline runs up to 3 passes on the same environment and TraceLogger.log replaces the stored messages each time, so the index of the logged pass is lost."
premises = ["/messages"]
assumptions = []
emits = ["scope(kind=attempt).unk./index=lost", "seal.issue:earlier_attempts_unobservable"]
code = [
  { repo = "https://github.com/ethz-spylab/agentdojo", commit = "c274885610efaaafec38b6d3eb07152ba7ff3f94", path = "src/function_calling_pi/task_suites/task_suite.py", lines = "264-279", note = "up to 3 passes on the same environment" },
  { repo = "https://github.com/ethz-spylab/agentdojo", commit = "c274885610efaaafec38b6d3eb07152ba7ff3f94", path = "src/function_calling_pi/logging.py", lines = "270-285", note = "log() replaces self.messages, then save()" },
  { repo = "https://github.com/ethz-spylab/agentdojo", commit = "a75aba7631d3ca5fb7ab938965c97ead2f9ff84b", path = "src/agentdojo/logging.py", lines = "265-278", note = "same in 0.1.35" },
]
evidence = ["sources/agentdojo.md §3.1", "verify/agentdojo.md §3", "audit/legacy_replay.md §2.2"]
tests = ["tests/adapters/agentdojo/test_mapper.py::test_attempt_scope_and_the_retry_rule"]
since = "0.1.0"

[[rule]]
id = "agentdojo.null_final_implies_three_passes"
version = 1
class = "D"
status = "active"
statement = "A final assistant content of null with no run error means the logged pass is the 3rd of 3 (passes 1 and 2 unobserved) and the environment it started from was not the initial one: the retry loop breaks only on a non-null model output."
premises = ["/messages", "/error"]
assumptions = []
code = [
  { repo = "https://github.com/ethz-spylab/agentdojo", commit = "c274885610efaaafec38b6d3eb07152ba7ff3f94", path = "src/function_calling_pi/task_suites/task_suite.py", lines = "66-71", note = "model_output_from_messages" },
  { repo = "https://github.com/ethz-spylab/agentdojo", commit = "c274885610efaaafec38b6d3eb07152ba7ff3f94", path = "src/function_calling_pi/task_suites/task_suite.py", lines = "264-279", note = "for _ in range(3): ... if model_output is not None: break" },
]
evidence = ["verify/agentdojo.md §3", "verify/rope.md §4"]
tests = ["tests/adapters/agentdojo/test_mapper.py::test_attempt_scope_and_the_retry_rule"]
since = "0.1.0"

[[rule]]
id = "agentdojo.messages_append_ordered"
version = 1
class = "D"
status = "active"
statement = "Message array order is append order within the logged pass (pipeline elements append sequentially)."
premises = ["/messages"]
assumptions = []
code = [
  { repo = "https://github.com/ethz-spylab/agentdojo", commit = "c274885610efaaafec38b6d3eb07152ba7ff3f94", path = "src/function_calling_pi/agent_pipeline/basic_elements.py", lines = "21-35", note = "AgentPipeline runs its elements in order" },
  { repo = "https://github.com/ethz-spylab/agentdojo", commit = "c274885610efaaafec38b6d3eb07152ba7ff3f94", path = "src/function_calling_pi/agent_pipeline/tool_execution.py", lines = "108", note = "results appended after the calling message" },
]
evidence = ["landscape/trace_formats.md §6.8"]
tests = ["tests/adapters/adprov/test_mapping.py::test_c16_2_vector_is_reproduced", "tests/adapters/agentdojo/test_mapper.py::test_message_order_and_context"]
since = "0.1.0"

[[rule]]
id = "agentdojo.messages_append_ordered_unverified"
version = 1
class = "I"
status = "active"
statement = "The reading of agentdojo.messages_append_ordered where the producing harness code is not verified (profiles rope, agentdyn, survey-runs); the I twin required by D.5.3."
premises = ["/messages"]
assumptions = []
evidence = ["sources/rope.md §4.3", "EF F.2.1 row 15"]
tests = ["tests/adapters/agentdojo/test_mapper.py::test_rule_twins_follow_the_profile"]
since = "0.1.0"

[[rule]]
id = "agentdojo.first_user_msg_is_task_prompt"
version = 1
class = "D"
status = "active"
statement = "The first user message is the task PROMPT, or the injection GOAL in pre-pass runs."
premises = ["/messages"]
assumptions = []
code = [
  { repo = "https://github.com/ethz-spylab/agentdojo", commit = "c274885610efaaafec38b6d3eb07152ba7ff3f94", path = "src/function_calling_pi/task_suites/task_suite.py", lines = "257-260", note = "prompt = PROMPT or GOAL" },
