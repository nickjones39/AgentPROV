# ---------------------------------------------------------------------------------------------- live capture (phase 8)
# The capture mapper `agentdojo.capture` (D.10.4, D.10.4a) maps capture/0.1 sessions of backends/agentdojo, which runs the
# stock agentdojo 0.1.35 wheel (profile agentdojo-live). Code citations name the release commit of that wheel; the line
# numbers are those of the wheel's sources (src/agentdojo/... at a75aba76). Facts the capture records are O by capture and
# need no rule; these rules justify the links and readings the mapper derives from them, and the capture issues.
[[rule]]
id = "agentdojo.capture_status"
version = 1
class = "D"
status = "active"
statement = "Added in phase 8. The run scope's status is the session.end status (complete -> ok, errored -> error, aborted -> aborted; incomplete has no scope value and is declared ambiguous with issue incomplete_run). A log with no verifiable session.end (unsealed, C.13.2) or with a fatal error event ended in error: status error, issue capture_unsealed or capture_error. A pass whose pass.end says aborted is an aborted attempt (issue aborted_attempt), and so is a session that ended aborted."
premises = ["/data/status", "/data/fatal", "/data/aborted"]
assumptions = []
evidence = ["C.13.2", "C.13.7 rows error and session.end", "D.10.4"]
tests = ["tests/adapters/agentdojo/test_capture_mapper.py::test_unsealed_log_maps_the_verifiable_prefix", "tests/adapters/agentdojo/test_capture_mapper.py::test_parent_appended_abort", "tests/adapters/agentdojo/test_capture_mapper.py::test_multi_pass_with_an_aborted_pass"]
since = "0.1.0"

[[rule]]
id = "agentdojo.capture_last_pass_scored"
version = 1
class = "D"
status = "active"
statement = "Added in phase 8. The benchmark scores the output of the last pass of a cell: run_task_with_pipeline runs the pipeline up to three times, keeping the messages of an aborted pass, and stops at the first pass whose final model output is not None; the scored model output and environment are those of the last pass run. The last attempt scope is scored: true, every earlier one scored: false."
premises = ["/data/aborted"]
assumptions = []
code = [
  { repo = "https://github.com/ethz-spylab/agentdojo", commit = "a75aba7631d3ca5fb7ab938965c97ead2f9ff84b", path = "src/agentdojo/task_suite/task_suite.py", lines = "383-395", note = "for _ in range(3): query, AbortAgentError keeps e.messages, break on model output" },
]
evidence = ["audit/capture.md §3", "C.3.3 scored"]
tests = ["tests/adapters/agentdojo/test_capture_mapper.py::test_multi_pass_with_an_aborted_pass"]
since = "0.1.0"

[[rule]]
id = "agentdojo.capture_reply_appended"
version = 1
class = "D"
status = "active"
statement = "Added in phase 8. The stock LLM element appends exactly one assistant message, built from the kept response, to the message list it was given: the reply of a kept or cached agent-role call is the assistant message at position n_messages of the pass's native message dump (in call order when n_messages is not recorded), provided the dump's message agrees with the decoded response (text and tool-call names); otherwise no link is made (issue agentdojo.capture_reply_mismatch)."
premises = ["/data/n_messages", "/data/messages", "/data/response"]
assumptions = []
code = [
  { repo = "https://github.com/ethz-spylab/agentdojo", commit = "a75aba7631d3ca5fb7ab938965c97ead2f9ff84b", path = "src/agentdojo/agent_pipeline/llms/openai_llm.py", lines = "188-202", note = "OpenAILLM.query: output = _openai_to_assistant_message(...); messages = [*messages, output]" },
]
evidence = ["C.13.7", "D.10.4"]
tests = ["tests/adapters/agentdojo/test_capture_mapper.py::test_c13_8_vector_maps_and_validates", "tests/adapters/agentdojo/test_capture_mapper.py::test_discarded_reply_and_retry"]
since = "0.1.0"

