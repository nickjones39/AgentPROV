  { repo = "https://github.com/ethz-spylab/agentdojo", commit = "c0cc91e6010f00b70092594e22d060a50239ade3", path = "src/agentdojo/default_suites/v1_1_1/__init__.py", note = "v1.1.1 (2024-11-07, after 7eee7284 'Move to new benchmark versioning')" },
  { repo = "https://github.com/ethz-spylab/agentdojo", commit = "bc5a5c30300e914e76520c501e4f2e1aaab7c9ab", path = "src/agentdojo/default_suites/v1_1_2/__init__.py", note = "v1.1.2 (2025-01-15)" },
  { repo = "https://github.com/ethz-spylab/agentdojo", commit = "0c7c4d565e594675041fad79bf8f6b3164ea3a04", path = "src/agentdojo/default_suites/v1_2/__init__.py", note = "v1.2 (2025-01-16); the directory name held the v1.1.1 bug-fix state from 2024-11-04 to 2024-11-07" },
