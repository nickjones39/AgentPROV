[[rule]]
id = "agentdojo.capture_sent_form"
version = 1
class = "D"
status = "active"
statement = "Added in phase 8. Item i of a call's input was sent as message i of the decoded wire request. The stock 0.1.35 OpenAI rendering is not a transform (system as developer or system, content blocks as text parts or one string, tool-call args as a JSON string); differences from the recorded message are declared transforms: error_substitution when a tool message with a non-null error was sent as its error text (_message_to_openai: content = message['error'] or ...), role_rewrite when a system message was sent as system under the declared agentdojo.role_rewrite_developer_to_system@1 instrumentation, reasoning_passback when the sent assistant message carries reasoning members. sent_sha256 is the SHA-256 of the JCS bytes of the decoded wire message. A difference none of these explains is reported (agentdojo.capture_sent_form_unexplained) and no transform is claimed."
premises = ["/data/request", "/data/messages", "/data/input_at"]
assumptions = []
code = [
  { repo = "https://github.com/ethz-spylab/agentdojo", commit = "a75aba7631d3ca5fb7ab938965c97ead2f9ff84b", path = "src/agentdojo/agent_pipeline/llms/openai_llm.py", lines = "77-108", note = "_message_to_openai" },
