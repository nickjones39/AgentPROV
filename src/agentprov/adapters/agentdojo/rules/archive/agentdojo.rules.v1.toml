# Rule catalogue `agentdojo` (docs/architecture D.5.1-D.5.4, D.6, D.6.11; C.16.1-C.16.2; EF E.10 item 21).
#
# Data, not code: loaded through importlib.resources by agentprov.aer.rules (no __init__.py in this directory). Rules
# are immutable once released: a change of statement, class or behaviour mints @n+1 and bumps `version` (AD-18).
# Nothing is released yet (v0.1 is in development), so this file is still version 1.
#
# Phase 4 seeded the 17 rules that the transcript/v1 mapping cites (C.16.2) and phase 5 added the two I twins of the
# engine assumptions. Phase 6 completes the catalogue for the TraceLogger mapper (adapter `agentdojo.tracelogger`,
# D.6): every rule of the D.5.4 index in the `agentdojo` namespace, plus the rules marked "added in phase 6" (D.6.11).
# Phase 7 adds the rules of the semantics profile agentdojo.suites@1 (cited only by SEM annotations, C.14) and the
# two adapter assumptions they assert; `injection_marker_yaml` is no longer reserved.
# Phase 8 adds the rules of the capture mapper `agentdojo.capture` (D.10.4a) and its three issue codes; the version stays
# 1 (nothing is released), so the catalogue digest inside the golden PROV-JSON changes and those pins are regenerated.
# Phase 9 (live AutoDojo, D.11.9) adds `capture_backend_identity` and states `run_error_imposed_outcome` with the values
# the profile's quirk supplies (it named upstream's (False, True) only); the version stays 1 and the pins are regenerated.
# Phase 10 (TraceLogger breadth, D.6.12) maps v1.k14 for imports: it adds `system_prompt_variant_digest` (D) and
# `version_label_semantics` (I), and cites code at the head pin 089ed468 for the v1.k14 rules; the version stays 1 and
# the pins are regenerated. The history part (D.6.16) states `committed_no_later_than` and `benchmark_era_from_commit`
# as implemented (the version-cut commits are cited in the latter's `code` list) and adds the issue code
# `history_commit_unlisted`; same version, pins regenerated.
#
# Code citations point at ethz-spylab/agentdojo. The June-2024 logs (`2024-06` pin, c274885) record no code identity
# (no commit, no wheel hash; `code_identity = "unpinned"`), so no rule here declares a `verified` assumption: AER-V34
# would require that identity in the AER, and the core validator does not yet check a code-range verification
# (D.6.11 item 3). D rules rest on the cited writer and runner code, which is the same at every commit introducing a
# 2024-06 log as far as the citations go; assumptions that are not shown are stated on I rules as `asserted`.

[catalogue]
id = "agentdojo"
version = 1
format = "agentprov-rule-catalogue/0.1"
issue_codes = [
  "pipeline_name_mismatch",
  "local_parse_drop_possible",
  "multi_block_tool_content",
  "unknown_top_level_key",
  "undeclared_quirk",
  "unknown_message_shape",
  "path_field_mismatch",
  "mixed_content_forms",
  "system_prompt_unrecognised",
  "instrumentation_unrecognised",
  "capture_reply_mismatch",
  "capture_sent_form_unexplained",
  "history_commit_unlisted",
]
subtypes = []
types = []

# ---------------------------------------------------------------------------------------------- dialect and layout
[[rule]]
id = "agentdojo.benchmark_from_dialect"
version = 1
class = "D"
status = "active"
statement = "A TraceLogger file was written by the AgentDojo benchmark runner (benchmark.py constructs the TraceLogger around each task run), so the checker and the supplier of the default system prompt is the agentdojo benchmark."
premises = ["/suite_name", "/user_task_id"]
assumptions = []
code = [
  { repo = "https://github.com/ethz-spylab/agentdojo", commit = "c274885610efaaafec38b6d3eb07152ba7ff3f94", path = "src/function_calling_pi/benchmark.py", lines = "100-142", note = "TraceLogger around run_task_with_pipeline" },
]
evidence = ["C.16.1", "D.6.5 Step 2"]
tests = ["tests/adapters/agentdojo/test_mapper.py::test_c16_1_vector_is_reproduced", "tests/adapters/agentdojo/test_mapper.py::test_header_and_task"]
since = "0.1.0"

[[rule]]
id = "agentdojo.tracelogger_record_shape"
version = 1
class = "D"
status = "active"
statement = "Added in phase 6. A TraceLogger record has the key set of its dialect variant (D.6.2) and its messages the ChatMessage key sets of their role ({role, content}, {role, content, tool_calls}, {role, content, tool_call_id, tool_call, error}). A top-level key outside the variant's set is kept verbatim in ext.agentdojo.extra; a message of another shape is kept verbatim as an `other` part; a file mixing string and block content raises an info issue. Nothing is dropped or reinterpreted."
premises = ["", "/messages"]
assumptions = []
code = [
  { repo = "https://github.com/ethz-spylab/agentdojo", commit = "c274885610efaaafec38b6d3eb07152ba7ff3f94", path = "src/function_calling_pi/logging.py", lines = "204-263", note = "TraceLogger.save writes the record" },
  { repo = "https://github.com/ethz-spylab/agentdojo", commit = "c274885610efaaafec38b6d3eb07152ba7ff3f94", path = "src/function_calling_pi/types.py", lines = "1-60", note = "ChatMessage TypedDicts" },
]
evidence = ["D.6.2", "D.6.3", "D.6.6 last row"]
tests = ["tests/adapters/agentdojo/test_mapper.py::test_unknown_shapes_are_kept_verbatim", "tests/adapters/agentdojo/test_mapper.py::test_unsupported_variants_seal_degenerate"]
since = "0.1.0"

[[rule]]
id = "agentdojo.log_path_layout"
version = 1
class = "D"
status = "active"
statement = "Added in phase 6. TraceLogger.save writes runs/{pipeline_name with '/' replaced by '_'}/{suite_name}/{user_task_id}/{attack_type}/{injection_task_id or 'none'}.json and logs attack_type 'none' as null, so the path components must agree with the fields (R-PATH). A disagreement is reported, never corrected."
premises = ["/suite_name", "/pipeline_name", "/user_task_id", "/attack_type", "/injection_task_id"]
assumptions = []
code = [
  { repo = "https://github.com/ethz-spylab/agentdojo", commit = "c274885610efaaafec38b6d3eb07152ba7ff3f94", path = "src/function_calling_pi/logging.py", lines = "239-255", note = "directory and file name; attack_type 'none' -> null" },
]
evidence = ["D.6.3 R-PATH"]
tests = ["tests/adapters/agentdojo/test_mapper.py::test_path_fields_must_agree"]
since = "0.1.0"

# ---------------------------------------------------------------------------------------------- identity
[[rule]]
id = "agentdojo.pipeline_dir_is_model_identity"
version = 1
class = "I"
status = "active"
statement = "The model is resolved from the run directory and the profile's identity table, not from pipeline_name (the directory replaces '/' by '_' and carries the defence suffix)."
premises = ["/pipeline_name"]
assumptions = []
code = [
  { repo = "https://github.com/ethz-spylab/agentdojo", commit = "c274885610efaaafec38b6d3eb07152ba7ff3f94", path = "src/function_calling_pi/agent_pipeline/make_pipeline.py", lines = "33-63", note = "ModelsEnum and providers" },
  { repo = "https://github.com/ethz-spylab/agentdojo", commit = "c274885610efaaafec38b6d3eb07152ba7ff3f94", path = "src/function_calling_pi/logging.py", lines = "239", note = "pipeline_name.replace('/', '_')" },
]
evidence = ["sources/agentdojo.md §3.2"]
tests = ["tests/adapters/adprov/test_mapping.py::test_converted_identity_is_not_split", "tests/adapters/agentdojo/test_identity.py::test_model_and_defence_from_the_directory"]
since = "0.1.0"

[[rule]]
id = "agentdojo.local_dir_model_identity"
version = 1
class = "I"
status = "active"
statement = "The Hugging Face model id for local* run directories comes from the directory name plus the claim of upstream PR #96/#97."
premises = ["/pipeline_name"]
assumptions = []
evidence = ["sources/agentdojo.md §5.3"]
tests = ["tests/adapters/agentdojo/test_identity.py::test_identity_table_rows"]
since = "0.1.0"

[[rule]]
id = "agentdojo.defence_suffix"
version = 1
class = "I"
status = "active"
statement = "The defence is parsed from the directory suffix list. Class I until the naming convention is verified over the producing code range (R-09)."
premises = ["/pipeline_name"]
assumptions = []
code = [
  { repo = "https://github.com/ethz-spylab/agentdojo", commit = "c274885610efaaafec38b6d3eb07152ba7ff3f94", path = "src/function_calling_pi/agent_pipeline/make_pipeline.py", lines = "112-199", note = "DEFENSES; pipeline.name = f'{model_name}-{defense_name}'" },
]
evidence = ["sources/agentdojo.md §8.2"]
tests = ["tests/adapters/adprov/test_mapping.py::test_converted_identity_is_not_split", "tests/adapters/agentdojo/test_identity.py::test_model_and_defence_from_the_directory"]
since = "0.1.0"

