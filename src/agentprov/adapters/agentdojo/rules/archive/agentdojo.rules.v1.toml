[[rule]]
id = "agentdojo.empty_assistant_text_ambiguous"
version = 1
class = "D"
status = "active"
statement = "Added in phase 6. An assistant content of \"\" is the logged content: whether the model returned an empty text or no text is not recorded (the provider adapters map both to ''), so the empty text is declared ambiguous (C.7.1, C.19 item 4; D.7.5 item 10)."
