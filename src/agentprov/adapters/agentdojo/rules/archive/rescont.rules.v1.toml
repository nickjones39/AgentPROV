# Rule catalogue `rescont` (docs/architecture D.5.1, D.5.4, D.6.20; DECISIONS D-470..D-479; phase 10q).
#
# Data, not code: loaded through importlib.resources by agentprov.aer.rules, homed in the agentdojo family (D.5.1,
# CATALOGUE_HOMES). Rules are immutable once released: a change of statement, class or behaviour mints @n+1 and bumps
# `version` (AD-18). Nothing is released yet, so this file is version 1.
#
# Code citations point at memo-ozdincer/agentdojo at the pin 7c331d978acca38534a3d42951f28a25ba26901b. No results container names the code that wrote
# it, and their key sets show at least four writer versions, so the profile has verified_code = [] and cites each D rule
# through its _unverified twin (D-24, D-472). value_redacted cites no code: it is a computation over the logged value,
# cited directly (D-476). Generated by a one-off script; each twin restates its D rule in full.

[catalogue]
id = "rescont"
version = 1
format = "agentprov-rule-catalogue/0.1"
issue_codes = ["value_redacted", "injection_map_not_recorded", "request_not_recorded", "melon_calls_not_recorded", "n_results_mismatch", "attack_unrecorded"]
subtypes = []
types = []

[[rule]]
id = "rescont.checker_is_agentdojo_suites"
version = 1
class = "D"
status = "active"
statement = "The rows are runs of AgentDojo task suites loaded by get_suite, and their utility and security come from those suites' user and injection tasks (utility(_from_traces), security(_from_traces)): the benchmark, and the checker of the two outcomes, is agentdojo."
premises = ["/suite", "/results"]
assumptions = []
code = [
  { repo = "https://github.com/memo-ozdincer/agentdojo", commit = "7c331d978acca38534a3d42951f28a25ba26901b", path = "scripts/eval_lorra_multiturn.py", lines = "1393-1411", note = "run_single_task: the two checks" },
  { repo = "https://github.com/memo-ozdincer/agentdojo", commit = "7c331d978acca38534a3d42951f28a25ba26901b", path = "scripts/eval_lorra_multiturn.py", lines = "2034", note = "get_suite" },
]
evidence = ["docs/reports/phase10q/README.md §2-§4", "D.6.20"]
tests = ["tests/adapters/agentdojo/test_rescont.py::test_header_task_and_benchmark"]
since = "0.1.0"

[[rule]]
id = "rescont.container_fields_apply_to_rows"
version = 1
class = "D"
status = "active"
statement = "A results container is written once per evaluation call, after every row of it has run: its label, suite, model, adapter, defense, attack, mode, base_url and port are the call's command-line values (the model name auto-detected from the server when none was given) and hold for every row of its results list. The aggregate member is a summary the script computes from the rows."
premises = ["/label", "/suite", "/model", "/adapter", "/defense", "/attack", "/mode", "/base_url", "/port"]
assumptions = []
code = [
  { repo = "https://github.com/memo-ozdincer/agentdojo", commit = "7c331d978acca38534a3d42951f28a25ba26901b", path = "scripts/eval_lorra_multiturn.py", lines = "2033-2087", note = "main: suite loop, pipeline, run_eval, the output dict" },
  { repo = "https://github.com/memo-ozdincer/agentdojo", commit = "7c331d978acca38534a3d42951f28a25ba26901b", path = "scripts/eval_benign_utility.py", lines = "1003-1063", note = "main: the output dict per suite" },
  { repo = "https://github.com/memo-ozdincer/agentdojo", commit = "7c331d978acca38534a3d42951f28a25ba26901b", path = "scripts/eval_baseline_defenses.py", lines = "205-262", note = "main: the output dict per defence and suite" },
]
evidence = ["docs/reports/phase10q/README.md §2-§4", "D.6.20"]
tests = ["tests/adapters/agentdojo/test_rescont.py::test_container_fields_reach_every_row"]
since = "0.1.0"

[[rule]]
id = "rescont.messages_serialised"
version = 1
class = "D"
status = "active"
statement = "The rows' messages are serialize_messages(ChatMessage): content flattened to text by get_text_content_as_str, a null content written as the empty string; an assistant's tool calls as {function, args} without the call id, the key absent when there were none; a tool message's call as {function, args} without the call id, its error, and its raw_output when the message has one. No tool_call_id, timestamp or injection map is written."
premises = ["/results"]
assumptions = []
code = [
  { repo = "https://github.com/memo-ozdincer/agentdojo", commit = "7c331d978acca38534a3d42951f28a25ba26901b", path = "scripts/eval_lorra_multiturn.py", lines = "1226-1258", note = "serialize_messages" },
]
evidence = ["docs/reports/phase10q/README.md §2-§4", "D.6.20"]
tests = ["tests/adapters/agentdojo/test_rescont.py::test_calls_have_no_provider_id_and_link_positionally"]
since = "0.1.0"

[[rule]]
id = "rescont.null_content_serialised_empty"
version = 1
class = "D"
status = "active"
statement = "An empty assistant text in a row may have been a null content: serialize_messages writes both as the empty string, so the logged empty text is ambiguous."
premises = ["/results"]
assumptions = []
code = [
  { repo = "https://github.com/memo-ozdincer/agentdojo", commit = "7c331d978acca38534a3d42951f28a25ba26901b", path = "scripts/eval_lorra_multiturn.py", lines = "1230-1234", note = "content None -> \"\"" },
]
evidence = ["docs/reports/phase10q/README.md §2-§4", "D.6.20"]
tests = ["tests/adapters/agentdojo/test_rescont.py::test_empty_assistant_text_is_ambiguous"]
since = "0.1.0"

[[rule]]
id = "rescont.exception_imposes_outcome"
version = 1
class = "D"
status = "active"
statement = "A row with an empty messages list is the exception path of the evaluation loop: when run_single_task raises, the script records utility = false, security = true and no messages. Both outcomes are defaults imposed by the script, not checker results, and security = true would read as an attack success."
premises = ["/results"]
assumptions = []
code = [
  { repo = "https://github.com/memo-ozdincer/agentdojo", commit = "7c331d978acca38534a3d42951f28a25ba26901b", path = "scripts/eval_lorra_multiturn.py", lines = "1449-1456", note = "run_eval, sequential: the exception defaults" },
  { repo = "https://github.com/memo-ozdincer/agentdojo", commit = "7c331d978acca38534a3d42951f28a25ba26901b", path = "scripts/eval_lorra_multiturn.py", lines = "1482-1489", note = "run_eval, concurrent: the exception defaults" },
  { repo = "https://github.com/memo-ozdincer/agentdojo", commit = "7c331d978acca38534a3d42951f28a25ba26901b", path = "scripts/eval_benign_utility.py", lines = "372-380", note = "_run_one_benign: the exception defaults" },
  { repo = "https://github.com/memo-ozdincer/agentdojo", commit = "7c331d978acca38534a3d42951f28a25ba26901b", path = "scripts/eval_benign_utility.py", lines = "481-489", note = "_run_one_attack: the exception defaults" },
]
evidence = ["docs/reports/phase10q/README.md §2-§4", "D.6.20"]
tests = ["tests/adapters/agentdojo/test_rescont.py::test_an_empty_row_is_outcome_only_with_imposed_outcomes"]
since = "0.1.0"

