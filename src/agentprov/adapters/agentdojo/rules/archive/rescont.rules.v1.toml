  { repo = "https://github.com/memo-ozdincer/agentdojo", commit = "7c331d978acca38534a3d42951f28a25ba26901b", path = "scripts/eval_lorra_multiturn.py", lines = "1935-1937", note = "--workers default 8" },
]
evidence = ["docs/reports/phase10q/README.md §2-§4", "D.6.20"]
tests = ["tests/adapters/agentdojo/test_rescont.py::test_run_scope_has_the_duration_and_no_times"]
since = "0.1.0"

[[rule]]
id = "rescont.last_pass_kept"
version = 1
class = "D"
status = "active"
statement = "run_single_task runs the pipeline up to three times on the reassigned task environment while the model output is None and keeps the last pass's messages. Because a null final content is serialised as the empty string, the log cannot show whether earlier passes ran: the attempt index is lost."
premises = ["/results"]
assumptions = []
code = [
  { repo = "https://github.com/memo-ozdincer/agentdojo", commit = "7c331d978acca38534a3d42951f28a25ba26901b", path = "scripts/eval_lorra_multiturn.py", lines = "1375-1385", note = "the retry loop" },
  { repo = "https://github.com/memo-ozdincer/agentdojo", commit = "7c331d978acca38534a3d42951f28a25ba26901b", path = "scripts/eval_lorra_multiturn.py", lines = "1230-1234", note = "None -> \"\"" },
]
evidence = ["docs/reports/phase10q/README.md §2-§4", "D.6.20"]
tests = ["tests/adapters/agentdojo/test_rescont.py::test_attempt_index_is_lost"]
since = "0.1.0"

