[[rule]]
id = "rescont.duration_scope"
version = 1
class = "D"
status = "active"
statement = "A row's duration is time.time() taken around run_single_task: environment load, up to three passes and the utility and security checks, wall clock. Rows of a call run concurrently in a thread pool by default, so the time includes waiting for the shared model server."
premises = ["/results"]
assumptions = []
code = [
  { repo = "https://github.com/memo-ozdincer/agentdojo", commit = "7c331d978acca38534a3d42951f28a25ba26901b", path = "scripts/eval_lorra_multiturn.py", lines = "1447-1457", note = "sequential" },
