[[rule]]
id = "rescont.melon_block_message"
version = 1
class = "D"
status = "active"
statement = "With the melon or melon_aug defence, MELONDetector makes the agent's model call and a masked call itself; when a tool call of the original turn is similar to the masked bank above the threshold it drops that turn and appends its own assistant message 'Potential prompt injection detected, stopping execution.' with no tool calls, which ends the run. Neither model call nor the embedding calls are logged."
premises = ["/results"]
assumptions = []
code = [
  { repo = "https://github.com/memo-ozdincer/agentdojo", commit = "7c331d978acca38534a3d42951f28a25ba26901b", path = "scripts/eval_lorra_multiturn.py", lines = "1049-1186", note = "MELONDetector" },
  { repo = "https://github.com/memo-ozdincer/agentdojo", commit = "7c331d978acca38534a3d42951f28a25ba26901b", path = "scripts/eval_lorra_multiturn.py", lines = "1723-1731", note = "build_pipeline: melon, melon_aug" },
]
evidence = ["docs/reports/phase10q/README.md §2-§4", "D.6.20"]
tests = ["tests/adapters/agentdojo/test_rescont.py::test_a_melon_block_is_a_defence_decision"]
since = "0.1.0"

