version = 1
class = "D"
status = "active"
statement = "A logged string that a profile redaction rule matches (a workstation account path in a model label or a pipeline name) is replaced wherever the AER holds it by the rule's label: literal text, a salted 12-hex digest of the span and the path leaf. The original and its full digest are not recorded; the source locator still points at the raw field, whose bytes are unchanged."
premises = ["/model", "/pipeline_name"]
assumptions = []
evidence = ["docs/reports/phase10q/README.md §2-§4", "D.6.20", "DECISIONS D-182", "DECISIONS D-476", "DECISIONS D-186"]
tests = ["tests/adapters/agentdojo/test_rescont.py::test_redaction_covers_values_keys_and_pointers"]
since = "0.1.0"

[[rule]]
id = "rescont.checker_is_agentdojo_suites_unverified"
version = 1
