statement = "Each model call's request is built by the script's LLM element from the messages so far: tool schemas in the system prompt, tool results as user turns, and, for the prompting and Qwen formats, trimmed client-side to a token budget (content cut from the front of long messages, then the oldest non-system messages dropped). The request is not logged, so which earlier messages a call received is inferred."
premises = ["/results"]
assumptions = []
code = [
  { repo = "https://github.com/memo-ozdincer/agentdojo", commit = "7c331d978acca38534a3d42951f28a25ba26901b", path = "scripts/eval_lorra_multiturn.py", lines = "263-323", note = "_fit_openai_messages_to_budget" },
