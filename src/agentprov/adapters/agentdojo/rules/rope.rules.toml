[[assumption]]
id = "rope:GuardDeniesBeforeDispatch"
statement = "In the code state that wrote a log, a ROPE denial was returned by the guard in place of the tool call (as guarded_run_function does at 64495e16), so the denied tool did not run."

[[assumption]]
id = "rope:ReleaseDirectoryNamesModel"
statement = "The hand-named release directory (runs/<model_dir>, or the gpt-4o-mini ablation and router arms) names the agent model that produced the logs below it; call-id styles corroborate it (call_* OpenAI via OpenRouter, chatcmpl-tool-* vLLM, tool_* or null Gemini)."

[[assumption]]
id = "rope:EveryReleasedArmDefended"
statement = "Every arm of the ROPE release ran with the ROPE guard active; arms are homogeneous in their defence."

[[assumption]]
id = "rope:HarnessIsAgentDojoFork"
statement = "The logs were written by an AgentDojo 0.1.35 fork whose TraceLogger, task suites and tool executor behave as the vendored copies at the release commit, apart from the recorded system prompt."
