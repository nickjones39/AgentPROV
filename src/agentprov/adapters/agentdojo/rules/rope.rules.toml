class = "I"
status = "active"
statement = "The reading of rope.denial_query_echo_variant@1 where the code that wrote the record is not among the commits it cites (D-24), so it is inferred, not derived (D.5.4 \"Citation of D rules\"): A denial text ending in \"user task: None.\" was written by the pre-fix enforcer, which interpolated an unset query; any other denial text echoes the real user query (the fix interpolates self.user_query). ext.rope.query_echo is none or query accordingly. The two variants are behaviourally different (the text is fed back to the model) and are not labelled in the logs."
