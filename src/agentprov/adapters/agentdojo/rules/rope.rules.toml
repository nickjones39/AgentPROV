statement = "The reading of rope.benchmark_from_suite@1 where the code that wrote the record is not among the commits it cites (D-24), so it is inferred, not derived (D.5.4 \"Citation of D rules\"): In the ROPE release banking, slack and travel are AgentDojo suites and github, shopping and dailylife are AgentDyn suites (the profile's suite table); the benchmark_version label of an AgentDyn-suite log is not a suite version (the fork registers the AgentDyn suites under every version)."
premises = ["/suite_name"]
assumptions = []
evidence = ["sources/rope.md §5.2, §8.2", "verify/rope.md §7", "D.5.4", "DECISIONS D-24"]
tests = ["tests/adapters/test_code_verification.py::test_every_twin_restates_its_d_rule"]
since = "0.1.0"

