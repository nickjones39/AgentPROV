[[rule]]
id = "agentdyn.nondeterministic_tool_state"
version = 1
class = "D"
status = "active"
statement = "AgentDyn's tool clients read the random generator and the clock inside tool calls: one-time passcodes (shopping, github, dynamic banking), order ids (shopping), order dates (shopping) and the timestamps of emails, comments and drive files. The values enter the environment state and, for the passcode flows, the tool results; a re-run of the same task, model and attack does not reproduce them. A recorded value is what that run produced; nothing in a log determines another run's value."
premises = ["/messages"]
assumptions = []
code = [
  { repo = "https://github.com/SaFo-Lab/AgentDyn", commit = "5353cf7615b135cace8d07c8f12dac53a16b6db3", path = "src/agentdojo/default_suites/v1/tools/shopping_client.py", lines = "150", note = "OTP: random.choices" },
  { repo = "https://github.com/SaFo-Lab/AgentDyn", commit = "5353cf7615b135cace8d07c8f12dac53a16b6db3", path = "src/agentdojo/default_suites/v1/tools/shopping_client.py", lines = "646", note = "order date: datetime.date.today()" },
  { repo = "https://github.com/SaFo-Lab/AgentDyn", commit = "5353cf7615b135cace8d07c8f12dac53a16b6db3", path = "src/agentdojo/default_suites/v1/tools/shopping_client.py", lines = "798", note = "order date: datetime.date.today()" },
  { repo = "https://github.com/SaFo-Lab/AgentDyn", commit = "5353cf7615b135cace8d07c8f12dac53a16b6db3", path = "src/agentdojo/default_suites/v1/tools/shopping_client.py", lines = "818", note = "order id: random.randint" },
  { repo = "https://github.com/SaFo-Lab/AgentDyn", commit = "5353cf7615b135cace8d07c8f12dac53a16b6db3", path = "src/agentdojo/default_suites/v1/tools/github_client.py", lines = "119", note = "OTP: random.choices" },
  { repo = "https://github.com/SaFo-Lab/AgentDyn", commit = "5353cf7615b135cace8d07c8f12dac53a16b6db3", path = "src/agentdojo/default_suites/v1/tools/github_client.py", lines = "517", note = "comment timestamp: datetime.datetime.now()" },
  { repo = "https://github.com/SaFo-Lab/AgentDyn", commit = "5353cf7615b135cace8d07c8f12dac53a16b6db3", path = "src/agentdojo/default_suites/v1/tools/dynamic_banking_client.py", lines = "48", note = "OTP: random.choices" },
  { repo = "https://github.com/SaFo-Lab/AgentDyn", commit = "5353cf7615b135cace8d07c8f12dac53a16b6db3", path = "src/agentdojo/default_suites/v1/tools/dynamic_email_client.py", lines = "39", note = "email timestamp: datetime.datetime.now()" },
  { repo = "https://github.com/SaFo-Lab/AgentDyn", commit = "5353cf7615b135cace8d07c8f12dac53a16b6db3", path = "src/agentdojo/default_suites/v1/tools/dynamic_email_client.py", lines = "70", note = "email timestamp: datetime.datetime.now()" },
  { repo = "https://github.com/SaFo-Lab/AgentDyn", commit = "5353cf7615b135cace8d07c8f12dac53a16b6db3", path = "src/agentdojo/default_suites/v1/tools/cloud_drive_client.py", lines = "41", note = "file last_modified: datetime.datetime.now()" },
  { repo = "https://github.com/SaFo-Lab/AgentDyn", commit = "5353cf7615b135cace8d07c8f12dac53a16b6db3", path = "src/agentdojo/default_suites/v1/tools/cloud_drive_client.py", lines = "62", note = "file last_modified: datetime.datetime.now()" },
]
