[[rule]]
id = "agentdyn.malformed_tool_call_dropped"
version = 1
class = "D"
status = "active"
statement = "Added for the AgentDyn live backend (D-685 (b)). Under a live profile that declares the quirk agentdojo.malformed_tool_call_dropped, AgentDyn's _openai_to_assistant_message drops every wire tool call that _openai_to_tool_call cannot convert, which is exactly a call with no function or whose arguments do not decode to a JSON object (json.loads, then FunctionCall validation). The reply of a kept agent call is matched with its assistant message on the calls that remain, and the dropped calls are listed in the message's ext.agentdojo.dropped_calls (their index in the reply's tool_calls, name, raw arguments and provider id, src into the response blob). A dropped call is not part of the message and was never dispatched: no tool execution, no relation and no taint comes from it."
premises = ["/data/response", "/data/messages"]
assumptions = []
code = [
  { repo = "https://github.com/SaFo-Lab/AgentDyn", commit = "5353cf7615b135cace8d07c8f12dac53a16b6db3", path = "src/agentdojo/agent_pipeline/llms/openai_llm.py", lines = "125-154", note = "_openai_to_tool_call: json.loads(arguments) into FunctionCall; _openai_to_assistant_message: a failing conversion is skipped (except Exception: continue)" },
]
evidence = ["docs/reports/agentdyn-backend/README.md section 5", "DECISIONS D-685"]
tests = ["tests/adapters/agentdojo/test_agentdyn.py::test_a_dropped_call_is_recognised_only_under_the_quirk"]
since = "0.1.0"
