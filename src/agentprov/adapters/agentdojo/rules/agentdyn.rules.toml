[[rule]]
id = "agentdyn.suite_benchmark"
version = 1
class = "D"
status = "active"
statement = "In a live session of the AutoDojo fork, a cell whose suite is shopping, github or dailylife runs AgentDyn's own suite: the fork's task suites and tool clients for those suites are byte-identical to AgentDyn's (the same blob ids), while the harness names every cell's benchmark agentdojo. So the execution's benchmark is agentdyn, as the source profile's suites map says (D.6.5 step 1); the cell's value is kept as recorded."
premises = ["/task/suite", "/task/benchmark"]
assumptions = []
code = [
  { repo = "https://github.com/SaFo-Lab/AgentDyn", commit = "5353cf7615b135cace8d07c8f12dac53a16b6db3", path = "src/agentdojo/default_suites/v1/shopping/task_suite.py", lines = "-", note = "blob c406bfd5; the AutoDojo fork at aa458794 has the same blob" },
  { repo = "https://github.com/SaFo-Lab/AgentDyn", commit = "5353cf7615b135cace8d07c8f12dac53a16b6db3", path = "src/agentdojo/default_suites/v1/github/task_suite.py", lines = "-", note = "blob 8313cfae; the AutoDojo fork at aa458794 has the same blob" },
  { repo = "https://github.com/SaFo-Lab/AgentDyn", commit = "5353cf7615b135cace8d07c8f12dac53a16b6db3", path = "src/agentdojo/default_suites/v1/dailylife/task_suite.py", lines = "-", note = "blob 35dca8e1; the AutoDojo fork at aa458794 has the same blob" },
