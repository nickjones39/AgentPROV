# Rule catalogue `defence` (docs/architecture D.10.11; DECISIONS D-670..D-679; docs/reports/defence-backends/design.md).
#
# Data, not code: loaded through importlib.resources by agentprov.aer.rules, homed in the agentdojo family (D.5.1,
# CATALOGUE_HOMES; the one-line home entry is the invariant-5 note of D-677, as D-472 did for `rescont`). It holds the
# rules the capture mapper cites for a live defended pipeline, kept apart from the shared `agentdojo` catalogue so that
# imported corpora's catalogue digests do not move (D-677). Rules are immutable once released: a change of statement,
# class or behaviour mints @n+1 and bumps `version` (AD-18). Nothing is released yet.
#
# Code citations point at this repository's harness (backends/shared/src/agentprov_backend/defences.py), which writes
# the notes these rules read; the harness is not a benchmark producer, so no `verified` assumption is declared.

[catalogue]
id = "defence"
version = 1
format = "agentprov-rule-catalogue/0.1"
issue_codes = []
subtypes = []
types = []

[[rule]]
id = "defence.message_by_defence"
version = 1
class = "D"
status = "active"
statement = "A message the defence recorder saw its element append (capture note agentdojo/defence_message {at, actor, role, call?}) is authored by that defence actor, whatever its role: role is not authorship (C.3.4). When the note names an auxiliary model call of the same actor whose kept reply agrees with the message, that call generated it. The defence's messages are not agent output, so the agent-call accounting does not pair them."
premises = ["/data/payload/at", "/data/payload/actor", "/data/payload/call"]
assumptions = []
evidence = ["D.10.11", "docs/reports/defence-backends/design.md §3.4, §3.6 item 1"]
tests = ["tests/adapters/agentdojo/test_capture_defence.py::test_tool_filter_messages_are_the_defence_s"]
since = "0.1.0"

[[rule]]
id = "defence.denial_declared_text"
version = 1
class = "D"
status = "active"
statement = "A tool call that a defence's own executor never ran (no runtime call was observed for it) and whose tool-message error matches one of the defence's declared denial texts (registry `denials`, the matcher schema of agentdojo.defence_denial_message) is a denial by that defence: a decision with verdict deny, its reason the error text, and no tool execution. The non-execution is observed; the attribution to the defence rests on the declared text."
premises = ["/data/payload/occ", "/data/payload/matcher"]
assumptions = []
evidence = ["D.10.11", "docs/reports/defence-backends/design.md §3.4 (executor_gate), §3.6 item 3"]
tests = ["tests/adapters/agentdojo/test_capture_defence.py::test_a_gate_denial_is_a_decision_with_no_execution"]
since = "0.1.0"

[[rule]]
id = "defence.detached_input"
version = 1
class = "D"
status = "active"
statement = "A defence's model call that its recorder names as detached (capture note agentdojo/defence_detached_input {calls}) was built from the defence's own conversation, not from the pass's message list (MELON's masked re-run: its few-shot turns and a summary of the tool outputs): its input holds no message of the pass. The request blob is the full record of what was sent."
premises = ["/data/payload/calls"]
assumptions = []
evidence = ["D.10.11", "docs/reports/defence-backends/design.md §4.3"]
tests = ["tests/adapters/agentdojo/test_capture_defence.py::test_melon_block_maps_the_masked_run_and_the_replaced_reply"]
since = "0.1.0"

[[rule]]
id = "defence.reply_replaced"
version = 1
class = "D"
status = "active"
statement = "An agent call whose reply a defence replaced (a modify decision whose subject is the call) never answered in the message list: the call is discarded with reason replaced_by_defence, its reply is a discarded message generated by it, and the assistant message the defence put in its place (a defence_message note naming the replaced call) is generated by the decision and authored by the defence."
premises = ["/data/subject/call", "/data/payload/replaces"]
assumptions = []
evidence = ["D.10.11", "docs/reports/defence-backends/design.md §4.3"]
tests = ["tests/adapters/agentdojo/test_capture_defence.py::test_melon_block_maps_the_masked_run_and_the_replaced_reply"]
since = "0.1.0"

[[rule]]
id = "defence.sent_before_decision"
version = 1
class = "D"
status = "active"
statement = "A tool message that a defence redacted or modified after a model call was sent (the decision follows the call in the capture and keeps the content before it as original) was sent to that call as the original content: the input entry names the message with the sent form other, and the decision's original is where that form is recorded."
premises = ["/data/original", "/data/subject/occ"]
assumptions = []
evidence = ["D.10.11", "docs/reports/defence-backends/design.md §4.3"]
tests = ["tests/adapters/agentdojo/test_capture_defence.py::test_melon_block_maps_the_masked_run_and_the_replaced_reply"]
since = "0.1.0"
