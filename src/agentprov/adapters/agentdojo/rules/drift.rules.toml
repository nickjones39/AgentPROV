[[rule]]
id = "drift.call_error_user_is_validator"
version = 1
class = "D"
status = "active"
statement = "A user message whose content is the wrapper '</function_error>\\n' + repr of a user message holding '[CALL ERROR]' + '\\n</function_error>' is DRIFT's dynamic validator refusing the calls of the immediately preceding assistant turn: the validator empties that turn's tool_calls, so the refused calls were never executed and exist only in its text, and appends this message. It is authored by the drift defence, not by the user."
premises = ["/conversations", "/messages"]
assumptions = []
code = [
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "6fd3df4763fad77398c3c273c2a4fe14dd50f7ea", path = "DRIFTLLM.py", lines = "440-523", note = "trajectory_constraint_validation" },
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "6fd3df4763fad77398c3c273c2a4fe14dd50f7ea", path = "DRIFTLLM.py", lines = "525-560", note = "checklist_constraint_validation" },
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "6fd3df4763fad77398c3c273c2a4fe14dd50f7ea", path = "DRIFTLLM.py", lines = "683-693", note = "the wrapper and the returned messages" },
]
evidence = ["sources/drift.md §3.4, §5.1", "verify/drift.md §4", "D.6.6", "DECISIONS D-273"]
tests = ["tests/adapters/agentdojo/test_drift.py::test_call_error_is_a_validator_denial"]
since = "0.1.0"

[[rule]]
id = "drift.call_error_check"
version = 1
class = "D"
status = "active"
statement = "The CALL ERROR text names the check that refused the calls: 'does not align with original planned trajectory' (trajectory_constraint_validation) or 'parameters are not aligned with checklist' (checklist_constraint_validation)."
premises = ["/conversations", "/messages"]
assumptions = []
code = [
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "6fd3df4763fad77398c3c273c2a4fe14dd50f7ea", path = "DRIFTLLM.py", lines = "503", note = "the trajectory text" },
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "6fd3df4763fad77398c3c273c2a4fe14dd50f7ea", path = "DRIFTLLM.py", lines = "547", note = "the checklist text" },
]
