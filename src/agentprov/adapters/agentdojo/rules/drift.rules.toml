status = "active"
statement = "DRIFT writes no injections map: the injection payloads the attack placed in the environment are not in the log, so no payload fixture can be emitted."
premises = [""]
assumptions = []
code = [
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "6fd3df4763fad77398c3c273c2a4fe14dd50f7ea", path = "pipeline_main.py", lines = "159-162", note = "the written keys" },
