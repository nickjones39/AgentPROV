tests = ["tests/adapters/agentdojo/test_drift.py::test_call_error_is_a_validator_denial"]
since = "0.1.0"

[[rule]]
id = "drift.assistant_reserialised"
version = 1
class = "D"
status = "active"
statement = "An assistant text that is exactly '<function_thought>...</function_thought>\\n\\n<function_call>...</function_call>\\n\\n<final_answer>...</final_answer>' is DRIFT's re-serialisation of the parsed completion (any text outside the three tags was dropped); any other assistant text is the completion as returned (no call tag, the 20-message cap, or failed parses)."
premises = ["/conversations", "/messages"]
assumptions = []
code = [
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "6fd3df4763fad77398c3c273c2a4fe14dd50f7ea", path = "DRIFTLLM.py", lines = "35-101", note = "_parse_model_output builds the template" },
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "6fd3df4763fad77398c3c273c2a4fe14dd50f7ea", path = "DRIFTLLM.py", lines = "651-666", note = "the raw paths" },
]
evidence = ["sources/drift.md §3.4", "verify/drift.md §3", "D.6.6"]
tests = ["tests/adapters/agentdojo/test_drift.py::test_assistant_text_form_and_unrecorded_prompt"]
since = "0.1.0"

[[rule]]
id = "drift.agent_prompt_not_logged"
version = 1
class = "D"
status = "active"
statement = "The prompt DRIFT sends for each agent turn is not the logged message list: DRIFTLLM converts tool messages, prepends its own system prompt (TOOL_CALLING_PROMPT) and passes the plan state to the client; none of it is logged, nor are the parse-retry messages."
premises = ["/conversations", "/messages"]
assumptions = []
code = [
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "6fd3df4763fad77398c3c273c2a4fe14dd50f7ea", path = "DRIFTLLM.py", lines = "579-650", note = "query builds the agent's prompt" },
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "6fd3df4763fad77398c3c273c2a4fe14dd50f7ea", path = "DRIFTLLM.py", lines = "660-666", note = "parse retries" },
]
evidence = ["sources/drift.md §5.2", "D.6.6", "DECISIONS D-275"]
tests = ["tests/adapters/agentdojo/test_drift.py::test_assistant_text_form_and_unrecorded_prompt"]
since = "0.1.0"

[[rule]]
id = "drift.calls_in_text_not_executed"
version = 1
class = "D"
status = "active"
statement = "A final assistant turn whose <function_call> text is not empty and whose tool_calls list is empty proposed calls that were not executed: DRIFTLLM dropped every proposed call that repeated an earlier executed call (de-duplication, which ends the run), or the turn was returned raw (the 20-message cap or failed parses)."
premises = ["/conversations", "/messages"]
assumptions = []
code = [
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "6fd3df4763fad77398c3c273c2a4fe14dd50f7ea", path = "DRIFTLLM.py", lines = "651-666", note = "the raw paths" },
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "6fd3df4763fad77398c3c273c2a4fe14dd50f7ea", path = "DRIFTLLM.py", lines = "668-674", note = "de-duplication against _load_previous_calls" },
]
evidence = ["verify/drift.md §4", "D.6.6", "DECISIONS D-277"]
tests = ["tests/adapters/agentdojo/test_drift.py::test_final_text_calls_not_executed_raise_the_issue"]
since = "0.1.0"

[[rule]]
id = "drift.tool_output_post_isolation"
version = 1
class = "D"
status = "active"
statement = "With injection_isolation on, the last tool message of each call batch passed DRIFT's isolation step before the next agent turn: the injection detector read it and injection_isolate deleted the detected sentences from its content in place. The logged content is the text after that step; whether anything was deleted, and what, is not logged. Earlier tool messages of a batch were never inspected (both functions read messages[-1] only)."
premises = ["/conversations", "/messages"]
assumptions = []
code = [
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "6fd3df4763fad77398c3c273c2a4fe14dd50f7ea", path = "DRIFTLLM.py", lines = "614-637", note = "detection and isolation of messages[-1]" },
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "6fd3df4763fad77398c3c273c2a4fe14dd50f7ea", path = "DRIFTLLM.py", lines = "380-438", note = "injection_isolate edits messages[-1] in place" },
]
evidence = ["sources/drift.md §5.1", "verify/drift.md §3", "docs/reports/phase10l/census.md §5", "C.5.5", "DECISIONS D-274"]
tests = ["tests/adapters/agentdojo/test_drift.py::test_isolation_decision_on_the_last_result_of_each_batch"]
since = "0.1.0"

