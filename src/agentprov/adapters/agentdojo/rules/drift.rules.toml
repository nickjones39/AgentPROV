# Rule catalogue `drift` (docs/architecture D.5.1, D.5.4, D.6.4-D.6.8, D.6.19; DECISIONS D-270..D-279; phase 10l).
#
# Data, not code: loaded through importlib.resources by agentprov.aer.rules, homed in the agentdojo family (D.5.1). Rules
# are immutable once released: a change of statement, class or behaviour mints @n+1 and bumps `version` (AD-18). Nothing
# is released yet, so this file is version 1.
#
# Code citations point at SaFo-Lab/DRIFT at the head pin 6fd3df4763fad77398c3c273c2a4fe14dd50f7ea (and at the history pin
# 53dbc6c58d5d1f044f3a68636be30b060bb86d34 for the end-of-run plan fields). No DRIFT log names the code that wrote it
# (the head runs were produced by earlier code states, AgentDyn's variant C before 1af2672), so every profile of DRIFT logs
# has verified_code = [] and cites each D rule through its _unverified twin (D-24, D-272). Generated by a one-off script;
# each twin restates its D rule in full.

[catalogue]
id = "drift"
version = 1
format = "agentprov-rule-catalogue/0.1"
issue_codes = ["injection_map_not_recorded", "agent_prompt_not_recorded", "calls_in_text_not_executed", "plan_semantics_contradicted", "call_error_unrecognised", "quirk_hook_not_applied"]
subtypes = ["drift.isolation_pass"]
types = []

[[rule]]
id = "drift.defence_from_keyset"
version = 1
class = "D"
status = "active"
statement = "A run log with the DRIFT key set (D.6.2 KD18_BASE: build_constraints, injection_isolation, dynamic_validation, adaptive_attack, tool_permission, initial_trajectory, initial_checklist, total_tokens) is written by DRIFT's pipeline_main.py, whose pipeline is InitQuery, DRIFTLLM and DRIFTToolsExecutionLoop: the run was defended by DRIFT, a defence actor named drift. The four flags record which DRIFT modules were on; they are kept verbatim."
premises = ["/build_constraints", "/injection_isolation", "/dynamic_validation"]
assumptions = []
code = [
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "6fd3df4763fad77398c3c273c2a4fe14dd50f7ea", path = "pipeline_main.py", lines = "66-81", note = "the DRIFT pipeline" },
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "6fd3df4763fad77398c3c273c2a4fe14dd50f7ea", path = "pipeline_main.py", lines = "159-162", note = "json.dump of the attacked run" },
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "6fd3df4763fad77398c3c273c2a4fe14dd50f7ea", path = "pipeline_main.py", lines = "195-198", note = "json.dump of the benign run" },
]
evidence = ["sources/drift.md §3.1", "verify/drift.md §3", "D.6.2", "D.6.19"]
tests = ["tests/adapters/agentdojo/test_drift.py::test_the_drift_defence_comes_from_the_key_set"]
since = "0.1.0"

[[rule]]
id = "drift.single_pass"
version = 1
class = "D"
status = "active"
statement = "A DRIFT run has exactly one pass: DRIFTTaskSuite.model_output_from_messages never returns None, so the up-to-three-pass loop of run_task_with_pipeline stops after the first pass and no earlier attempt exists. The logged message list is the whole scored attempt (index 0)."
premises = ["/conversations", "/messages"]
assumptions = []
code = [
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "6fd3df4763fad77398c3c273c2a4fe14dd50f7ea", path = "DRIFTTaskSuite.py", lines = "100-106", note = "model_output_from_messages returns a text block, never None" },
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "6fd3df4763fad77398c3c273c2a4fe14dd50f7ea", path = "DRIFTTaskSuite.py", lines = "129-218", note = "run_task_with_pipeline" },
]
evidence = ["sources/drift.md §3.1", "verify/drift.md §3", "D.6.5 Step 3"]
tests = ["tests/adapters/agentdojo/test_drift.py::test_one_attempt_index_zero_and_no_retry_issue"]
since = "0.1.0"

[[rule]]
id = "drift.duration_scope"
version = 1
class = "D"
status = "active"
statement = "duration is time.time() taken around DRIFTTaskSuite.run_task_with_pipeline: environment load, the one pass and the checker, wall clock; it excludes the attack's payload generation and the file write."
premises = ["/duration"]
assumptions = []
code = [
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "6fd3df4763fad77398c3c273c2a4fe14dd50f7ea", path = "pipeline_main.py", lines = "156-158", note = "attacked run" },
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "6fd3df4763fad77398c3c273c2a4fe14dd50f7ea", path = "pipeline_main.py", lines = "192-194", note = "benign run" },
]
evidence = ["sources/drift.md §3.3", "D.6.19"]
tests = ["tests/adapters/agentdojo/test_drift.py::test_header_keeps_drift_fields_verbatim_with_their_readings"]
since = "0.1.0"

[[rule]]
id = "drift.total_tokens_scope"
version = 1
class = "D"
status = "active"
statement = "total_tokens is the difference of the DRIFT client's cumulative token counter over the run: every LLM call DRIFT makes in the run (secure planner, injection detector, checklist formatter, alignment judge, the agent, parse retries, and privilege assignment in the first task of a process), not the agent's calls alone."
premises = ["/total_tokens"]
assumptions = []
code = [
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "6fd3df4763fad77398c3c273c2a4fe14dd50f7ea", path = "pipeline_main.py", lines = "134", note = "pre_total_tokens, attacked run" },
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "6fd3df4763fad77398c3c273c2a4fe14dd50f7ea", path = "pipeline_main.py", lines = "173", note = "pre_total_tokens, benign run" },
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "6fd3df4763fad77398c3c273c2a4fe14dd50f7ea", path = "pipeline_main.py", lines = "159-162", note = "total_tokens = llm.client.total_tokens - pre_total_tokens" },
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "6fd3df4763fad77398c3c273c2a4fe14dd50f7ea", path = "client.py", lines = "87", note = "the counter adds every response's usage" },
]
evidence = ["sources/drift.md §3.3, §5.2", "D.6.19"]
tests = ["tests/adapters/agentdojo/test_drift.py::test_header_keeps_drift_fields_verbatim_with_their_readings"]
since = "0.1.0"

[[rule]]
id = "drift.tool_permission_per_process"
version = 1
class = "D"
status = "active"
statement = "tool_permission is DRIFT's Read/Write/Execute privilege label per tool, assigned by an LLM call once per process (the first DRIFTLLM.query of a suite invocation, while the map is empty) and reused for every later task of that process; it is not assigned per run and is not an integrity label."
premises = ["/tool_permission"]
assumptions = []
code = [
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "6fd3df4763fad77398c3c273c2a4fe14dd50f7ea", path = "DRIFTLLM.py", lines = "155-185", note = "function_privilege_assignment" },
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "6fd3df4763fad77398c3c273c2a4fe14dd50f7ea", path = "DRIFTLLM.py", lines = "599-602", note = "assigned only while the map is empty" },
]
evidence = ["sources/drift.md §3.3, §5.4", "verify/drift.md §6", "D.6.19"]
tests = ["tests/adapters/agentdojo/test_drift.py::test_header_keeps_drift_fields_verbatim_with_their_readings"]
since = "0.1.0"

[[rule]]
id = "drift.plan_fields_semantics"
version = 1
class = "D"
status = "active"
statement = "The plan fields initial_trajectory and initial_checklist hold DRIFT's initial plan (llm.initial_function_trajectory and initial_node_checklist, the planner's raw checklist text) where pipeline_main.py writes those attributes (from 1af2672 and 5f7c1a9 on), and the end-of-run plan state (llm.function_trajectory, extended during the run, and node_checklist, reformatted as JSON) where it writes the live attributes (53dbc6c and earlier). Which reading applies is declared per part by the profile; raw planner text under the end-of-run reading contradicts it."
premises = ["/initial_trajectory", "/initial_checklist"]
assumptions = []
code = [
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "6fd3df4763fad77398c3c273c2a4fe14dd50f7ea", path = "pipeline_main.py", lines = "159-162", note = "initial_function_trajectory / initial_node_checklist" },
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "53dbc6c58d5d1f044f3a68636be30b060bb86d34", path = "pipeline_main.py", lines = "159-160", note = "function_trajectory / node_checklist" },
]
evidence = ["verify/drift.md §5", "docs/reports/phase10l/census.md §4", "DECISIONS D-276"]
tests = ["tests/adapters/agentdojo/test_drift.py::test_plan_semantics_follow_the_profile_and_are_checked"]
since = "0.1.0"

[[rule]]
id = "drift.no_system_message"
version = 1
class = "D"
status = "active"
statement = "DRIFT's pipeline has no SystemMessage element (InitQuery, DRIFTLLM, DRIFTToolsExecutionLoop), so the logged message list holds no system message; the prompts DRIFT sends to the model are built inside DRIFTLLM and are not logged."
premises = ["/conversations", "/messages"]
assumptions = []
code = [
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "6fd3df4763fad77398c3c273c2a4fe14dd50f7ea", path = "pipeline_main.py", lines = "75-81", note = "the pipeline without SystemMessage" },
  { repo = "https://github.com/SaFo-Lab/DRIFT", commit = "6fd3df4763fad77398c3c273c2a4fe14dd50f7ea", path = "DRIFTLLM.py", lines = "639-646", note = "the system prompt is set inside query" },
]
evidence = ["sources/drift.md §3.1, §5.2", "D.6.19"]
tests = ["tests/adapters/agentdojo/test_drift.py::test_header_keeps_drift_fields_verbatim_with_their_readings"]
since = "0.1.0"

