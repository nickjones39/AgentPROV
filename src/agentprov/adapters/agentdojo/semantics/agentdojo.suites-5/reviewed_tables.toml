# Reviewed tool tables of the semantics profile agentdojo.suites@2 (docs/architecture C.14.8; phase-10d routing R8;
# D-110..D-112). Data, not code; part of the profile digest.
#
# A table covers one (benchmark, suite) of a benchmark other than agentdojo whose suite code is not upstream AgentDojo's.
# It lists every code state the suite's runs may have used, each with the files read (as text, never run; blob ids at
# the cited commit) and a label for every tool of that state's TOOLS list. The runs record no code state, so a tool is
# known only when every state has it with the same roles, integrity and channel (rule agentdojo.reviewed_suite_table@1);
# its label is then the reviewed one (agentdojo.reviewed_tool_label@1). Every other tool is unknown (fail-closed,
# agentdojo.unknown_tool@1).
#
# Label criterion, as in labels.toml [roles.sink], applied to each state's code: send_sink when the call itself delivers
# money or tokens to a party or address (named in its arguments, or fixed in the code); write_sink when it creates,
# changes or deletes stored state of the user's environment (the wallet's transaction list, positions, orders); a tool
# that does neither and returns no externally authored content is neutral. content_source when the output carries text
# the environment places where the suite puts injections; its integrity is untrusted. Every other output's integrity is
# unknown, never trusted: these tools return a hard-coded value or echo the call's own arguments, and nothing here
# verifies that. Evidence lines are those of the blob named in the state's files.

