# Semantics profile agentdojo.suites, version 3 (docs/architecture C.14, C.14.8; D.1 "Semantics profile"; EF E.7).
#
# Version 3 is version 2 plus the reviewed tool tables of AgentDyn's own suites shopping, github and dailylife
# (reviewed_tables.toml; regeneration-batch item 27 (b), routed from phase 9b R-9b-2). Every other file is a byte copy of
# version 2's, and for every other (benchmark, suite) it annotates exactly as version 2. Version 2 is unchanged, so no
# corpus read with it moves; a source profile selects version 3 by its own change. The version 2 header below still
# applies: data, not code; the directory's files make the profile digest; every rule cited is declared in the agentdojo
# catalogue at version 1.
#
# (Version 2's header:) Version 2 is version 1 plus reviewed tool tables for suites of other benchmarks
# (reviewed_tables.toml; phase-10d routing R8, D-110..D-112). For benchmark agentdojo it annotates exactly as version 1.

[profile]
id = "agentdojo.suites"
version = 3
format = "agentprov-sem-profile/0.1"
rules = { agentdojo = 2 }

# ------------------------------------------------------------------------------------------------ table selection
# agentdojo.suite_tool_table@1. The suite is execution.task.suite and applies only when execution.task.benchmark is
# "agentdojo". The suite version is the label on the benchmark actor's `version` (O by source; the AgentDojo meaning is
# `version_label_semantics = "suite_version"`, i.e. the key of load_suites._SUITES). Then:
#   * a recorded label that names a version of suite_tools.toml selects that version's table;
#   * a recorded label naming no known version selects no table: every tool is unknown (fail-closed; the source says
#     the run used suite code this profile has no table for);
#   * no recorded label (June-2024 v0.k11 logs and the converted transcripts made from them): a tool is known only
#     when it is in the suite's table at EVERY known code state and version (the intersection), so a tool that some
#     candidate code lacks is unknown (fail-closed over the unrecorded version).
[selection]
benchmark = "agentdojo"
label_tables = "versions"
unrecorded_label = "intersection"
# agentdojo.reviewed_suite_table@1 (C.14.8). A run whose (execution.task.benchmark, execution.task.suite) names a table of
# reviewed_tables.toml is read with that table instead, and only when it records no suite-version label (the review
# covers unlabelled runs only; a recorded label selects no table, fail-closed). The run's code state is not recorded, so
# a tool is known only when every code state the table lists has it with the same label; any other tool is unknown.
reviewed_tables = "reviewed_tables.toml"
reviewed_code_states = "same_label_in_every_state"

# ------------------------------------------------------------------------------------------------ outcomes
[outcomes]
# agentdojo-upstream profile [family.agentdojo.benchmark] dos_attacks (benchmark.py l. 138-139 at c274885:
# `if attacker.is_dos_attack: security = not utility`); agentdojo.dos_security_rule@1.
dos_attacks = ["dos", "captcha_dos", "felony_dos", "offensive_email_dos", "swearwords_dos"]
# ext.agentdojo.task_kind of a solvability pre-pass (agentdojo.injection_task_as_user_task@1): the utility checker
# scored the injection task's goal given as the user prompt, so the claim is not user_task_solved.
prepass_task_kind = "injection_task_as_user_task"
prepass_claim = "agentdojo.injection_task_solved_as_user_task"
# Judgement origins whose value is a checker's (or a source's recomputation): only these carry an outcome. Never
# harness_default (C.14.3); harness_rule only for security under a DoS attack.
checker_origins = ["checker", "recomputed"]

# ------------------------------------------------------------------------------------------------ injection markers
[marker]
# Every tool_result part is paired with every fixture of these kinds, in AER order (C.14.3; EF E.7.3 item 3: absent
# and gap give no PROV statement but are counted, so SEM carries them for the census).
fixture_kinds = ["injection_payload"]
# The order in which normalisers are consulted (agentprov.adapters.agentdojo.semantics.markers); build_prov.py l. 238
# _PREFIX = 40 is the fast-path trigger of the YAML-decoded reading.
# Regeneration-batch items 8, 6 and 4 (D-379, D-371, D-377) are version 2's and so this version's: the strict YAML reading
# (agentdojo.yaml_norm@2) and the namespaced annotations agentdojo.partial_payload and
# agentdojo.success_without_visible_payload.
normalisers = ["agentdojo.yaml_norm@2", "agentdojo.pyrepr_norm@1", "agentdojo.json_norm@1"]
prefix_chars = 40
# agentdojo.autodojo_payload_unescape@1 (regeneration-batch item 1, B1; C.14.3): a payload whose fixture carries an AutoDojo
# cache link (ext.autodojo.cache_match, autodojo.payload_cache_link@1) was written by AutoDojo's _yaml_escape, which the
# environment decodes; when the payload as logged is not present, it is read again with that escape undone, under the
# same output readings, citing the link as a premise. Fixtures without the link are never unescaped.
payload_unescape = "agentdojo.autodojo_payload_unescape@1"
payload_unescape_link = ["exact", "wrapped"]

# ------------------------------------------------------------------------------------------------ taint policy
# EF E.7.3 items 1-2: a request whose roles meet the sink roles (or unknown, fail-closed) exposed to a context member
# whose integrity is untrusted or unknown is apv:PotentiallyInfluencedBy it (the v2.3 R6 reading).
[taint]
rule = "agentdojo.taint_sink_untrusted@1"
subject_roles = ["execute_sink", "send_sink", "unknown", "write_sink"]
object_integrity = ["unknown", "untrusted"]
