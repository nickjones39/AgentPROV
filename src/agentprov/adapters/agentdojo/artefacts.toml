[[artefact]]
id = "agentdyn.art.malformed_tool_call_dropped"
title = "AgentDyn drops a tool call whose arguments are not JSON"
description = "AgentDyn's _openai_to_assistant_message swallows a failed tool-call conversion: a call whose arguments do not parse is in the wire reply but not in the agent's assistant message, and it is never dispatched (stock 0.1.35 raises; AutoDojo re-requests). In a live session under a profile that declares the quirk agentdojo.malformed_tool_call_dropped, the capture mapper links the reply to the message and lists each dropped call in ext.agentdojo.dropped_calls with a pointer into the wire response (D-685 (b)); in imported AgentDyn logs the dropped call is not observable at all, since no wire reply is logged (design F-5)."
