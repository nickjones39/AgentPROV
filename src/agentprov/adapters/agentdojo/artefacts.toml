# Artefact catalogue of the `agentdojo` adapter family (docs/architecture D.15.2, D.15.5; DECISIONS D-12).
#
# Data, not code, read by the shared layer `agentprov.artefacts` (D.15.3). Seeded from the D.15.5 table (the AgentDojo
# legacy runs: the pinned `2024-06` snapshot, profile `agentdojo-upstream`), plus one entry found by the phase-6 full
# import (`agentdojo.art.calls_derived_from_messages`). Each entry declares exactly one handling class (D.15.1): CR
# correct representation, DR derived reconstruction, RJ recomputed judgement, FO flag only, NR not recoverable.
#
# `detector.rule` and `handling.rule` are rule ids of shipped catalogues or generic detectors `artefact.generic.<name>`.
# Of the semantics-profile rules these entries name, `agentdojo.injection_marker_yaml` is active since phase 7 (the
# semantics profile agentdojo.suites@1); `agentdojo.account_confound`, `.text_tool_call`, `.unwinnable_cell` and
# `.scoring` stay `reserved` in the `agentdojo` rule catalogue. `claims` lists the generic detector hits an entry wholly
# accounts for.
#
# `expected` counts are regression expectations per pinned snapshot, never gates that hide data (D.15.4). `verified`
# rows were measured by the phase-6 full import of the 18,241 pinned blobs (docs/reports/agentdojo/import-2024-06.json)
# and, for the `head` snapshot, by the phase-10 census and full import of the 36,679 head blobs (import-cli-head.json);
# `unverified` rows are the D.15.5 seed counts over the 18,234-file baseline copy, not yet re-measured on the pin.
#
# Any byte change bumps `version` (AD-18); nothing is released yet, so it is still 1. The phase-10 corpus analysis (B4,
# 2026-10-11) widened the scopes of the generic entries to the phase-10 profiles (rope, autodojo-via-rope, agentdyn,
# mandate-agentdojo-eval, survey-runs) and added the section "phase-10 corpora" below. The catalogue digest enters no
# AER, SEM or PROV file and is not recorded in any corpus.json yet, so no corpus is affected.
#
# The corpus pre-check, wave 1 (docs/reports/precheck/, 2026-10-15; D-581..D-585, regeneration-batch item 109) added
# the section "corpus pre-check, wave 1" below, extended `validity_defects` (CC-07) and `defence_benign_intervention`,
# and corrected the three ROPE entries that described agentdojo.suites@1 behaviour (D-584). Version stays 1: D-31 owner
# ruling 2026-10-21, in place, no corpus records the artefact catalogue (its bytes enter only the family's
# adapter_code_sha256, a code digest). Entries whose finding is a recount against a paper or README, with no per-trace
# detector, cite as `detector` the existing rule whose output the recount reads (D-581); a count the pre-check
# measured over the whole population is `verified`, a lower bound or a sample-based figure `unverified`, and a
# pre-registered estimate gets no row.
# Identical trajectories (manuscript artefact row 7) have no entry, since the `cross_origin_duplicate` detector is not
# implemented. The two definitions differ (pre-check CC-01, rope.md PC-rope-05): ROPE head has 53 groups / 396
# executions when provider call ids are part of the fingerprint (only null-id providers then group) and 235 / 1,042
# without them; 0 files are byte-identical. A count must name its definition.

version = 1
family = "agentdojo"
# The family also holds the entries of its sources ROPE, AgentDyn, Mandate, the survey runs and Geryon (D.15.8 item 2).
namespaces = ["agentdojo", "rope", "agentdyn", "mandate", "survey", "geryon", "drift", "rescont"]

