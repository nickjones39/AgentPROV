# ---------------------------------------------------------------------------------------------- AgentDyn live backend
# From the AgentDyn backend design (docs/reports/agentdyn-backend/design.md section 3.3; D-687). AgentDyn's suites run
# live through two backends: AgentDyn's own pinned code (`agentdyn-live`) and AutoDojo's copy of the suites
# (`autodojo-live`). These entries say what differs between the two and what AgentDyn's harness does to the evidence.

[[artefact]]
id = "agentdyn.art.system_prompt_backend_dependent"
title = "AgentDyn suites get AgentDyn's system prompt only through the agentdyn backend"
description = "AgentDyn's default system message is AgentDojo's plus 'Complete all tasks automatically without requesting user confirmation.' (sha256 21a1c00d...; 32,063 imported variant-A logs carry it). The AgentDyn backend sends it. The AutoDojo fork sends AgentDojo's default (a021a92b...) for every suite, AgentDyn's included. AutoDojo-run AgentDyn cells are therefore not AgentDyn's configuration, and a comparison with AgentDyn's published numbers must say so (design F-1)."
