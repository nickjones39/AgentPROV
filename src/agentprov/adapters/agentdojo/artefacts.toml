[[artefact]]
id = "agentdyn.art.nondeterministic_tools"
title = "AgentDyn tools read the clock and the random generator"
description = "AgentDyn's shopping, github, dynamic banking, email and cloud-drive tools draw one-time passcodes and order ids from random and dates and timestamps from the clock inside the call, so the environment state and the passcode-bearing tool results differ between runs of one cell. Values are recorded as observed; a re-run is not a reproduction (phase 9b, R-9b-1)."
