handling = { class = "CR", rule = "agentdojo.no_execution_observed@1" }
expected = [
  { snapshot = "2024-06", count = 207, basis = "phase-6 full import", status = "verified" },
  { snapshot = "head", count = 207, basis = "phase-10 full import of the head pin (census): outcome-only logs", status = "verified" },
  { snapshot = "rope:head", count = 2, basis = "phase-10 analysis, section 2: ROPE logs with empty messages and no outcomes (unit outcome_only)", status = "verified" },
]
manuscript = true
refs = ["D.15.5", "sources/agentdojo.md section 4.4", "J.4.3 R4", "docs/reports/analysis/phase10-corpus-analysis.md"]

