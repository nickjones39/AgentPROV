# Source profile `shreeyavarma-llm-safety`: ShreeyaVarma/llm_safety, an AgentDojo fork with 672 new TraceLogger logs on
# the workspace suite: gpt-4o-2024-05-13 with the tool_knowledge attack and benign (614), and local Qwen agents (58)
# (phase 10d; shortlist row 20; sources/agentdojo-format-candidates.md §3.21).
#
# The local logs name no model (pipeline_name `local` or `Local model`; the result directories say only qwen or
# qwen2): they are sealed identity_unresolved with unk /model not_recorded (D-92). The fork carries upstream's runs/ of
# an older state (24,914 files, byte-identical): registered select.owned_elsewhere (owner agentdojo).
#
# Data, not code. No status lives here: the registry is the only status store (R-38, R-45). Any byte change bumps
# `version` (AD-18); nothing is released yet, so it is still 1. The quirks' `observed` counts are the phase-10d census over
# the full pinned snapshot (tools/agentdojo/phase10d_trial.py census; docs/reports/phase10d/), reconciled with the phase-10c
# census (~/.agentprov/migration-work/phase10c/census/shreeyavarma@78d22e4a3daa.*).

