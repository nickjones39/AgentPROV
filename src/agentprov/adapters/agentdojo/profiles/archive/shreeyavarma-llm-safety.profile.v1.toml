version = 1
format = "agentprov-source-profile/0.1"
source_id = "shreeyavarma-llm-safety"
family = "agentdojo"
parts = ["head"]
title = "llm_safety: AgentDojo 0.1.34 workspace logs of gpt-4o and local Qwen agents (ShreeyaVarma/llm_safety)"
evidence = ["sources/agentdojo-format-candidates.md §1, §2", "verify/agentdojo-format-candidates.md §1"]

[source]
