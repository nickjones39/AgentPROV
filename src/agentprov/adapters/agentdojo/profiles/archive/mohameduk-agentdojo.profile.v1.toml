# Source profile `mohameduk-agentdojo`: branch ubag-gateway-defense of mohameduk/agentdojo, an AgentDojo fork with the UBAG
# authorization gateway (`-ubag`, `-ubag_behavioral`) on gemini-2.5-flash and gpt-4o-mini-2024-07-18: 3,630 new TraceLogger
# logs, 726 per arm (phase 10d; shortlist row 8; sources/agentdojo-format-candidates.md §3.9).
#
# Data, not code. No status lives here: the registry is the only status store (R-38, R-45). Any byte change bumps
# `version` (AD-18); nothing is released yet, so it is still 1. The quirks' `observed` counts are the phase-10d census over
# the full pinned snapshot (tools/agentdojo/phase10d_trial.py census; docs/reports/phase10d/), reconciled with the phase-10c
# census (~/.agentprov/migration-work/phase10c/census/mohameduk@3f9d69a1ea96.*).
#
# The fork carries upstream AgentDojo's runs/ byte-identically (36,679 files in 29 pipeline directories): registered
# select.owned_elsewhere (owner agentdojo), never mapped here. benchmark_version is null in all 3,145 attacked logs and
# 'v1' in the 485 benign ones: a null label is `unk /version not_recorded`, never filled (there is no history table for
# this fork, so version_when_absent has nothing to apply; D-102). UBAG's denials and holds, logged as tool
# errors 'ubag-blocked: BLOCK' / 'ubag-blocked: REVIEW', are defence decisions (verdict deny: a held call was not run;
# quirk agentdojo.defence_denial_message, routing R1, D-113).

[profile]
id = "mohameduk-agentdojo"
version = 1
format = "agentprov-source-profile/0.1"
source_id = "mohameduk-agentdojo"
family = "agentdojo"
parts = ["head"]
title = "UBAG gateway on AgentDojo: AgentDojo fork logs of an authorization-gateway defence (mohameduk/agentdojo)"
evidence = ["sources/agentdojo-format-candidates.md §1, §2", "verify/agentdojo-format-candidates.md §1"]

[source]
canonical_repo = "https://github.com/mohameduk/agentdojo"
paper = "none found (phase 10c)"
package = { name = "agentdojo", vendored = "the fork itself: ethz-spylab/agentdojo 089ed468 plus the UBAG commits 27206776 and 9de3e23a", version_identifies_code = false }

# The pin covers the repository root (40,492 files, 464,094,691 bytes; all fetched): the fork's code, the 3,630 new logs
# and the 36,679 upstream copies under runs/. Against its parent 089ed468 the fork changes only
# src/agentdojo/agent_pipeline/{__init__,agent_pipeline}.py, src/agentdojo/models.py and a results script, and adds
# src/agentdojo/agent_pipeline/ubag_gateway.py and its test (phase-10d tree comparison).
[[source.pins]]
role = "head"
part = "head"
primary = true
kind = "git"
commit = "3f9d69a1ea96b75e8695653ceee8c3ff088db9b3"
date = "2026-09-03"
expected_files = 40492
expected_bytes = 464094691
note = "branch ubag-gateway-defense at 2026-10-11 (phase 10c); the 45 other branches and tags hold only upstream runs"

[licence]
spdx = "MIT"
holders = ["Edoardo Debenedetti, Jie Zhang, Mislav Balunovic, Luca Beurer-Kellner, Marc Fischer, and Florian Tramèr (the upstream LICENSE kept by the fork)", "mohameduk (fork owner; no own copyright line)"]
data_licence = "none"
policy = "include"
basis = "MIT LICENSE at the pin (upstream text, (c) 2024 Debenedetti et al.); the fork adds no licence of its own"
attribution = [
  "mohameduk/agentdojo (MIT), branch ubag-gateway-defense, commit 3f9d69a1ea96b75e8695653ceee8c3ff088db9b3",
  "AgentDojo (MIT, (c) 2024 Debenedetti et al.): the benchmark text embedded in the logs and the forked code",
]
unassessed = ["model-provider terms on redistributing model outputs"]

[lineage]
built_on = ["ethz-spylab/agentdojo@089ed468cf3ed0322acc66b0211f26d9d90dbf60 plus the UBAG commits of the fork (the runs are committed after the code; the working state that produced them is not recorded)"]
vendored = ["ethz-spylab/agentdojo runs/ (36,679 files, byte-identical to the upstream head pin)"]
duplicates = [
  { of = "agentdojo", part = "head", path = "runs/{the 29 upstream pipeline directories}/**", relation = "byte_identical", owner = "agentdojo" },
]
cited_by = []
content_dedup = "never"

