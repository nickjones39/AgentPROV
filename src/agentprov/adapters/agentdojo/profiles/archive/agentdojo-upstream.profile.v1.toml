[licence]
spdx = "MIT"
holders = ["Edoardo Debenedetti", "Jie Zhang", "Mislav Balunovic", "Luca Beurer-Kellner", "Marc Fischer", "Florian Tramèr"]
data_licence = "none"
policy = "include"
basis = "MIT by repository; data licence not separately stated"
attribution = ["LICENSE (MIT, (c) 2024 Debenedetti et al.)", "CITATION.bib: arXiv:2406.13352"]
unassessed = ["model-provider terms on redistributing model outputs", "Llama 3.3 / Meta-SecAlign output licences"]

[lineage]
built_on = []
vendored = []
duplicates = [
  { of = "agentdojo-inspect", path = "runs/**", relation = "mirror", owner = "agentdojo" },
  { of = "adprov-v1", part = "converted-legacy", path = "corpus-og-agentdojo-runs-prov/**", relation = "derived_conversion", owner = "agentdojo" },
  { of = "agent-security-tools-survey", part = "zenodo-bundled-runs", path = "zenodo:codesafe/agentdojo/agentdojo/runs/**", relation = "mirror", owner = "agentdojo" },
]
content_dedup = "never"

[import]
dialect = "agentdojo.tracelogger"
mapper = "agentdojo.tracelogger"
variants = ["v0.k11", "v1.k14", "v1.k14.incomplete"]
rules = { aer = 1, agentdojo = 1 }
include = ["runs/**/*.json"]
exclude = [
  { glob = "**/.DS_Store", code = "select.not_execution_artefact" },
  { glob = "**/._*", code = "select.not_execution_artefact" },
]
layout = "runs/{pipeline_dir}/{suite}/{task_dir}/{attack_dir}/{file}.json"
layout_depth = 5
path_must_agree = ["suite_name", "user_task_id", "attack_type", "injection_task_id"]
opt_in_parts = [
  { part = "history", note = "11,173 superseded blob versions in git history; per-blob commit provenance; never mixed silently with head" },
]

[family.agentdojo.identity]
model_from = "pipeline_dir"
pipeline_name_policy = "verbatim_unreliable_when_differs"
defence_suffixes = ["repeat_user_prompt", "spotlighting_with_delimiting", "tool_filter", "transformers_pi_detector"]
on_dir_name_mismatch = "issue:agentdojo.pipeline_name_mismatch"

[[family.agentdojo.identity.dir]]
pipeline_dir = "Meta-SecAlign-70B*"
pipeline_name = ["local", "local-repeat_user_prompt"]
model = "facebook/Meta-SecAlign-70B"
rule = "agentdojo.local_dir_model_identity@1"
basis = "directory name; HF id claimed in upstream PR #96/#97"

[[family.agentdojo.identity.dir]]
pipeline_dir = "meta-llama_Llama-3.3-70B-Instruct*"
pipeline_name = ["local", "local-repeat_user_prompt"]
model = "meta-llama/Llama-3.3-70B-Instruct"
rule = "agentdojo.local_dir_model_identity@1"
basis = "directory name; HF id claimed in upstream PR #96/#97"

[[family.agentdojo.identity.dir]]
pipeline_dir = "meta-llama_Llama-3-70b-chat-hf"
pipeline_name = ["meta-llama_Llama-3-70b-chat-hf"]
model = "meta-llama/Llama-3-70b-chat-hf"
rule = "agentdojo.pipeline_dir_is_model_identity@1"
basis = "ModelsEnum.LLAMA_3 at c274885 (make_pipeline.py l. 33-47); TraceLogger.save replaces '/' by '_' (logging.py l. 239)"

[[family.agentdojo.identity.dir]]
pipeline_dir = "mistralai_Mixtral-8x7B-Instruct-v0.1"
pipeline_name = ["mistralai_Mixtral-8x7B-Instruct-v0.1"]
model = "mistralai/Mixtral-8x7B-Instruct-v0.1"
rule = "agentdojo.pipeline_dir_is_model_identity@1"
basis = "ModelsEnum.MISTRALAI_MIXTRAL_8X7B_INSTRUCT_V0_1 at c274885 (make_pipeline.py l. 33-47); TraceLogger.save replaces '/' by '_' (logging.py l. 239)"

[family.agentdojo.identity.id_style_corroboration]
"call_*" = "openai"
"toolu_*" = "anthropic"
"tool_call_??????????" = "client_generated_random"

[family.agentdojo.benchmark]
benchmark = "agentdojo"
suites = { workspace = "agentdojo", travel = "agentdojo", banking = "agentdojo", slack = "agentdojo" }
version_field = "benchmark_version"
version_label_semantics = "suite_version"
version_when_absent = { rule = "agentdojo.benchmark_era_from_commit@1" }
# Phase 10 (D.6.16): the table that turns a git origin's `introduced_in_commit` into the two history fields. Generated by
# tools/agentdojo/history_table.py from the blobless full history of the two pins (head 089ed468, 2024-06 c274885); an
# origin without `introduced_in_commit` (no history index at import time) gets neither field.
history = { repo = "https://github.com/ethz-spylab/agentdojo", table = { path = "tables/agentdojo-history.table.toml", sha256 = "e1ab8f4617e2d8e5693e15434b8d540d12ffb3fb8e4f97b221087201222b87a0" } }
dos_attacks = ["dos", "captcha_dos", "felony_dos", "offensive_email_dos", "swearwords_dos"]
semantics_profile = { id = "agentdojo.suites", version = 1 }

[family.agentdojo.harness]
code_identity = "unpinned"
retry_semantics = "agentdojo.final_content_none_max3"
tool_output_format = "yaml"
# "D" cites the structural D rules (C.16.1); "I" would cite their `_unverified` twins (D.5.4 I twins).
structural_rule_class = "D"
# Phase 10 (D.6.12 item 9): the default prompt of the head code, pinned by the SHA-256 of its text (the `default` value
# of system_messages.yaml at the head pin, read with the safe YAML loader; 469 characters). It labels the `v1.k14`
# logs only, which the 0.1.30+ code family writes (D.6.1); the `v0.k11` logs come from June-2024 and later 0.1.29 code
# that no pin covers, so they stay unlabelled and unflagged as in phase 6 (D.6.11 item 9). The text is kept verbatim
# either way.
system_prompt_variants = [
  { label = "agentdojo_default", source = "ethz-spylab/agentdojo@089ed468cf3ed0322acc66b0211f26d9d90dbf60:src/agentdojo/data/system_messages.yaml", key = "default", sha256 = "a021a92b114c523250d0e52b18adc0aa7b41db7c7628b579b2b8db1df9361837", applies = { variant = ["v1.k14", "v1.k14.incomplete"] } },
]

