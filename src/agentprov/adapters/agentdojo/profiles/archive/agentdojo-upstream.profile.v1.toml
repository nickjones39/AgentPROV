# Source profile `agentdojo-upstream`: ethz-spylab/agentdojo native TraceLogger run logs (docs/architecture D.4.3;
# D.6; I.1.1 rows agentdojo · head and agentdojo · 2024-06; J.4.1).
#
# Data, not code. No status lives here: the registry is the only status store (R-38, R-45). Any byte change bumps
# `version` (AD-18); nothing is released yet, so it is still 1. The `[family.agentdojo]` part is checked against the
# closed schema `family.schema.json` of this family (D.4.1).
#
# Phase 6 maps the `2024-06` part (`v0.k11`); phase 10 maps the `head` part (`v0.k11`, `v1.k14`, `v1.k14.incomplete`;
# D.6.12). The quirks' `observed` counts are per part and are measured over the full pinned snapshot of the part
# (D.6.10 item 3; tools/agentdojo/profile_census.py, tests/full_corpus/test_profile_census.py; docs/reports/agentdojo/).
# Every `head` count of the investigation was reproduced; two of its keys were renamed to the generic quantities they
# count (gemini_logs_with_colliding_empty_ids = logs_with_colliding_empty_ids, gpt_logs_with_duplicate_ids =
# logs_with_repeated_ids: all such logs are in those pipelines).

[profile]
id = "agentdojo-upstream"
version = 1
format = "agentprov-source-profile/0.1"
source_id = "agentdojo"
family = "agentdojo"
parts = ["head", "2024-06"]
title = "AgentDojo upstream native TraceLogger run logs (ethz-spylab/agentdojo runs/)"
evidence = ["sources/agentdojo.md", "verify/agentdojo.md", "audit/legacy_replay.md §2", "landscape/trace_formats.md §3.10"]

[source]
canonical_repo = "https://github.com/ethz-spylab/agentdojo"
paper = "arXiv:2406.13352"
concept_doi = "10.5281/zenodo.12528188"
package = { name = "agentdojo", pypi_latest = "0.1.35", version_identifies_code = false }

