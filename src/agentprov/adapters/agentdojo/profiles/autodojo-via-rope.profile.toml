# Source profile `autodojo-via-rope`: the AutoDojo-attack slice of the ROPE release (docs/architecture D.4.4; D.3.3 row
# autodojo · rope-slice; D.6.13).
#
# Data, not code. No status lives here: the registry is the only status store (R-38, R-45). Any byte change bumps
# `version` (AD-18); nothing is released yet, so it is still 1.
#
# The only released AutoDojo-attack executions are the 2,847 `runs/<model>/<suite>/user_task_*/autodojo/` logs inside
# ROPE (3 models × 949 cells) [sources/autodojo.md §3.1; verify/autodojo.md #5]. They are owned, selected and mapped by
# the `rope` profile (`via = "rope"`), so this profile has no [import] table. Its one family table is the payload
# provenance the ROPE mapping consults for `attack_dir = "autodojo"` cells (quirk agentdojo.autodojo_payload_cache_link of
# the `rope` profile): the AutoDojo optimiser caches at the fork pin (150 cells) and the three `routed` caches ROPE ships
# (`autodojo/variant_generation/variants/{github,shopping,dailylife}/openai/gpt-4o-mini/routed/injections.json`).
# Neither the cache nor the variant index is logged, so the link is class I (`autodojo.payload_cache_link@1`): an exact
# variant-0 match, stored with its ambiguity set [verify/autodojo.md #16]. The digests of the variant-0 texts are
# precomputed from both pins by tools/agentdojo/autodojo_cache_table.py into the table pinned below, so the profile digest
# covers them.

