applies = { attack_dir = ["none"] }
rules = ["agentdojo.benign_security_constant@1"]
observed = { main = { files = 13, origin_rule_applied = 12 }, nav-fixer2 = { files = 98, origin_rule_applied = 95 }, rearch-forcedformat-fix = { files = 98, origin_rule_applied = 95 } }

[[family.agentdojo.quirk]]
