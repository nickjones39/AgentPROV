# Identity table `kavach_run_dirs` (docs/architecture D.4.5): one row per run directory of Ishani018/Kavach across the
# three pinned branches (main 53df9545, nav-fixer2 f2dd7efa, rearch-forcedformat-fix 6b31a554): 13 directories under
# benchmarks/, keyed by the path from benchmarks/ to the pipeline directory (D-104).
#
# The logged pipeline_name is `local` (the undefended arm) or `local-kavach` (the Kavach defence arm) everywhere: AgentDojo's
# OpenAI-compatible client pointed at a local Ollama server. A model is asserted only where a harness-written run summary
# in the directory records it (`model_id = gemma4:26b`, an Ollama tag; REPRODUCIBILITY.md says "Gemma4 27B via Ollama",
# which conflicts, so the run record's id is used). Six directories have no such record and resolve no model
# (identity_unresolved, unk /model not_recorded; D-92, D-105, D-253). Asserted under
# `agentdojo.pipeline_dir_is_model_identity@1` (class I).

[[dir]]
name = "agentdojo_live/banking_qwen25_7b/local"
defence = "none"
pipeline_name = "local"
basis = "no record names the model; the directory label (banking_qwen25_7b) and run_agentdojo_banking.ps1's log path are labels, not statements (D-92, D-105)"

