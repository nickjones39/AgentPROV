# Identity table `linyxus_pipeline_dirs` (docs/architecture D.4.5): one row per pipeline directory of Linyxus/agentdojo,
# branch lacuna-exp, at the pinned commit 698d7ff29cac4bb5dccb5ed2d06f5e8364547a97 (8 directories, 9,068 logs under
# {runs-0..4,lacuna-runs-0..1}/<pipeline dir>/).
#
# The directory is the OpenRouter route `openrouter/<vendor>/<model>` with '/' written as '_', plus `-tacit` for the Tacit
# defence of this fork. The model is the OpenRouter model id, the provider openrouter (class I). The logged pipeline_name
# is the slash form in most logs and the underscore form in some: `pipeline_name` below is the slash form, so the others
# disclose agentdojo.pipeline_name_mismatch (never used to correct the identity). Where a log has the extra top-level key
# `model` (1,701 logs), it names the same route. Asserted under `agentdojo.pipeline_dir_is_model_identity@1` (class I).

[[dir]]
name = "openrouter_anthropic_claude-sonnet-4-tacit"
model = "anthropic/claude-sonnet-4"
defence = "tacit"
provider = "openrouter"
provider_evidence = "I"
pipeline_name = "openrouter/anthropic/claude-sonnet-4-tacit"
basis = "directory = the OpenRouter route openrouter/anthropic/claude-sonnet-4-tacit with / written as _ (528 logs)"

