# Identity table `gate_pipeline_dirs` (docs/architecture D.4.5): the pipeline directories of dafarusd/gate at the pinned
# commit 925b99260beec53d94bd48b587b0bdc33614e3df whose model is named (3,655 of the 3,870 logs; AGPL-3.0-only source).
#
# The directory equals the logged pipeline_name: `local-` (AgentDojo's OpenAI-compatible client, pointed at Ollama or at
# Venice per the README) + the model label + `-gate-<arm>`. `gate-off` is the undefended arm; `gate-all` the gate of this
# repository with every check on (src/run_defended.py); `gate-gatellm` and `gate-gatellm-echo` the follow-on gatellml
# runtime (gatellml/). The model is the label between, verbatim (an Ollama tag for qwen3-coder-32k:latest); no provider
# is asserted. Deliberately incomplete (D-92): the 215 logs of the directory `local` (results/p1-*, results/runs*) name
# no model and resolve nothing. Asserted under `agentdojo.pipeline_dir_is_model_identity@1` (class I).

