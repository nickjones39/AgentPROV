# Identity table `seagent_run_dirs` (docs/architecture D.4.5): one row per run directory of the SEAgent artefact, Zenodo
# record 23218779 (seagent-acsac2026-ae-v2.zip, sha256 e15a8f0fc869151ad3c8fab23bbb37384315745669b0aab7a5a0760c825764bd),
# 40 directories, 5,342 logs under seagent-ae/artifact/results/raw_data/agentdojo/<kind>/<arm>/<run dir>/<pipeline dir>/.
#
# Keyed by the run directory because the defence is a property of the arm, not of the pipeline name: the pvagent,
# seagent and seagent-RF arms all log `deepseek-v3-250324-seagent_mcp` (D-104). In all 5,342 logs the pipeline directory
# equals the logged pipeline_name (phase-10f census). The model is the logged name before the defence suffix, verbatim:
# `deepseek-v3-250324` or, in 336 logs, `deepseek-v3` without a version date (recorded as written, never completed).
# `kind` security holds the attacked runs and their utility pre-passes; perf holds benign timing runs. Every value is
# asserted under `agentdojo.pipeline_dir_is_model_identity@1` (class I).

