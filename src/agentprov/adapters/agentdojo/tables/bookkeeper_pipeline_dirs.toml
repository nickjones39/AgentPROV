defence = "munim-cap2-g3"
basis = "directory = logged pipeline_name (32 logs)"

[[dir]]
name = "glm-5.3-flash-munim-g4-cap2"
model = "glm-5.3-flash"
defence = "munim-g4-cap2"
basis = "directory = logged pipeline_name (63 logs)"

[[dir]]
