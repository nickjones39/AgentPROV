# Identity table `bookkeeper_pipeline_dirs` (docs/architecture D.4.5): one row per pipeline directory of sricursion/bookkeeper
# at the pinned commit 0fe09bb6e8c0c864cee5daa9451f2647c2c846be (12 directories, 570 logs; GPL-3.0-or-later source).
#
# The directory equals the logged pipeline_name: the model label + `-munim[...]` (the Munim money gate of this repository)
# or `-none[...]` (the undefended arm, runs/agentdojo/none/). The configuration labels after the arm (cap2, g2, g3, g4)
# are kept verbatim in the defence id; the repository does not explain them. Asserted under
# `agentdojo.pipeline_dir_is_model_identity@1` (class I).

[[dir]]
name = "glm-5.3-flash-munim"
model = "glm-5.3-flash"
defence = "munim"
basis = "directory = logged pipeline_name (36 logs)"

[[dir]]
name = "glm-5.3-flash-munim-cap2-g2"
model = "glm-5.3-flash"
defence = "munim-cap2-g2"
basis = "directory = logged pipeline_name (63 logs)"

[[dir]]
name = "glm-5.3-flash-munim-cap2-g3"
