# Identity table `authority_caps_pipeline_dirs` (docs/architecture D.4.5): one row per pipeline directory of the
# agent-authority-caps deposit, Zenodo record 23138310 (concept 22973265, v2.1.0; zip agent-authority-caps-v2.0.0.zip,
# sha256 1dce0380...), at level 1 (original-study/experiments/{current_models,pilot}/runs/) and inside the three nested
# tars (runs_exp4, runs_exp5, runs_exp7; their members are runs/<pipeline dir>/...). 21 directories, 18,739 distinct logs.
#
# The directory equals the logged pipeline_name in every log. It is the API model id plus a condition suffix: -capA3 and
# -capA4 (the enforced authority caps, a runtime tool filter), -noegress (the no-egress filter), -autoconfirm (a harness
# setting: confirmations answered automatically; not a defence) and -rep1..3 (repetitions). The model is the directory
# without the suffix, verbatim: gpt-6-luna and gpt-6-sol carry no snapshot date in the logs. RESULTS_new_models.md states
# that GPT-6 Luna and Sol ran with reasoning_effort=none. Asserted under `agentdojo.pipeline_dir_is_model_identity@1`
# (class I; D-250).

[[dir]]
name = "claude-haiku-4-5-20251001"
model = "claude-haiku-4-5-20251001"
defence = "none"
pipeline_name = "claude-haiku-4-5-20251001"
basis = "directory = logged pipeline_name; model = the directory without its condition suffix"

[[dir]]
name = "claude-haiku-4-5-20251001-autoconfirm"
model = "claude-haiku-4-5-20251001"
defence = "none"
