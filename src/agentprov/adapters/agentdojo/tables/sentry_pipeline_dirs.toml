# Identity table `sentry_pipeline_dirs` (docs/architecture D.4.5): the pipeline directories of vinhqdang/SENTRY at the
# pinned commit 938e8be757f4d8168bc7ee5b23f767e431df873f whose model is named (602 of the 674 logs; AGPL-3.0 source).
#
# The directory equals the logged pipeline_name: the model label + `-local` (AgentDojo's OpenAI-compatible client); the
# README states the agents were served by OpenRouter (provider, class I). SENTRY is a post-hoc monitor, not a defence in
# the loop. Deliberately incomplete (D-92): the 72 logs of `openrouter-free-router-local` went through OpenRouter's free
# router, which picks the model per call and logs none; they resolve nothing. Asserted under
# `agentdojo.pipeline_dir_is_model_identity@1` (class I).

[[dir]]
name = "deepseek-v4-flash-local"
model = "deepseek-v4-flash"
defence = "none"
provider = "openrouter"
provider_evidence = "I"
basis = "directory = logged pipeline_name (344 logs); README: OpenRouter-served agents"

[[dir]]
name = "gpt-4o-mini-local"
model = "gpt-4o-mini"
defence = "none"
provider = "openrouter"
