# Identity table `dca_run_dirs` (docs/architecture D.4.5): one row per <group>/<run directory>/<pipeline directory> under
# results/logs/ of the DCA AgentDojo artefact v1 (Figshare 10.6084/m9.figshare.32657856, file 65496114,
# DCA_AgentDojo_artifact_v1_20260612.zip, sha256 ed500ca3...): 22 directories, 16,221 logs (13,374 v1.k14, 2,847 DRIFT).
#
# The model and its route come from the deposit README (D-92): it names every model of the reported runs. Where the
# logged pipeline_name names no model (`local`, `local-causal_budgeted`, the Qwen directories behind Ollama) the row
# asserts the README's model, class I with that basis; the logged name is kept in `pipeline_name`. Defences: `camel` and
# `camel_secpol` (CaMeL and CaMeL+secpol, code/camel_runner/), `causal_budgeted` (DCA, registered under that name by
# code/dca_core/sitecustomize.py) and `drift` (code/drift_runner/; the DRIFT build adds it from the key set, never twice).
# `provider` is the README's route (openai, openrouter, ollama), class I. Asserted under
# `agentdojo.pipeline_dir_is_model_identity@1` (class I; D-252).

