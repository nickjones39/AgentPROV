# Identity table `environmentoptim_run_dirs` (docs/architecture D.4.5): the run directories of omseeth/EnvironmentOptim at the
# pinned commit febf82d8d1d8344d6c19e9fd172b51e52d68416a (D-254, D-255), keyed by the experiment path above the pipeline
# directory (D-104; D-254 addendum, user 2026-10-21: option (a)).
#
# * gpt-5.4-2026-03-05 (104 logs; no experiment path, keyed by its directory through model_dir_fallback): the directory
#   equals the logged pipeline_name, an OpenAI API snapshot.
# * 133 arm paths of the local Qwen3.5 runs (5,912 logs; one is the 13 doubly nested logs' path, bug pass NF-2) and
#   qwen3_5-9B_baseline_train (104): each row is one condition
#   (arm, sub-arm, checkpoint or prompt), so statistics group by arm directly. The agent is Qwen3.5-9B by the README;
#   the -2B/-4B baselines are Qwen3.5-2B/4B from the logged model path's leaf (D-254). checkpoint_N is a checkpoint of the
#   trained payload, never a model id.
# * Their pipeline directory and logged pipeline_name carry a cluster home path with an account segment. The profile's
#   [[family.agentdojo.redact]] rule rewrites them (regeneration-batch items 105, 106; D-476, D-510 (A)), and this table
#   lists only the redacted label `_cluster_home_{span12}_{leaf}` (salt: the profile id), so no account enters Git. The
#   rows were generated from the pinned tree listing by a script that refuses to write an account span. The raw logs and
#   their pinned git paths ship as they are (D-510 addendum, user decision 2026-10-21: release logs, keep D-510).
# Asserted under `agentdojo.pipeline_dir_is_model_identity@1` (class I).

