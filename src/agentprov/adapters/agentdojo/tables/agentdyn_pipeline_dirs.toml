# Identity table `agentdyn_pipeline_dirs` (docs/architecture D.4.5): one row per pipeline directory of AgentDyn `runs/`
# at the pinned commit 5353cf7615b135cace8d07c8f12dac53a16b6db3 (76 directories, 47,723 logs).
#
# Basis: publisher-asserted directory label. The directory names are curation labels, not logger output: in 3,626
# variant A logs the directory differs from `pipeline_name`, and in all of B and C [verify/agentdyn.md §5]. Every value
# below is asserted under `agentdyn.pipeline_dir_registry@1` (class I); `pipeline_name` is the value the logs in that
# directory carry (compared by the mapper, never used for identity). `provider` is inferred from the model id family and
# the call-id style of the directory's logs (OpenAI `call_`; OpenRouter `tool_<function>_`, `chatcmpl-tool-`; the Google
# client logs a null id; the local SecAlign client logs a null id); it is omitted for variant C, whose DRIFT code
# generates its own call ids. `variant` is the AgentDyn letter of D.6.2 (A v1.k14, B v0.k11, C drift.k18.messages).
# `model` is the requested model name: OpenAI ids as logged; Gemini without the vendor prefix (the Google client and
# OpenRouter serve the same nominal model); OpenRouter-routed Llama and Qwen as vendor/name.

