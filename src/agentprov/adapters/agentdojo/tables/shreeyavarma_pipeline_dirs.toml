# Identity table `shreeyavarma_pipeline_dirs` (docs/architecture D.4.5): the pipeline directories of ShreeyaVarma/llm_safety
# at the pinned commit 78d22e4a3daa5e76c77b75076c30ceb1faab22c1 whose model is recorded (614 of the 672 new logs).
#
# Deliberately incomplete (D-92): the 58 logs under the directories `local` and `Local model` (my_runs_qwen_agent,
# my_runs_qwen2_agent_no_attack, my_runs_hf_qwen_agent, qwen_hf_unattacked) were written by a local client that logs no
# model, and the result-directory names say only "qwen" or "qwen2", which is a model family, not a model. A directory
# without a row resolves nothing: those logs are sealed with `identity_unresolved` and `unk /model not_recorded`.
# Asserted under `agentdojo.pipeline_dir_is_model_identity@1` (class I).

[[dir]]
name = "gpt-4o-2024-05-13"
model = "gpt-4o-2024-05-13"
