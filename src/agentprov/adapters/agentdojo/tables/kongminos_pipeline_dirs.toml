# Identity table `kongminos_pipeline_dirs` (docs/architecture D.4.5): the one pipeline directory of
# kongminOS/jspace-agentdojo-950 at the pinned commit f341af69498ee36a8d1a2e69040ab70bd8e20a01 (950 logs under
# data/<run set>/local/).
#
# No log names the model: pipeline_name is `local` (AgentDojo's OpenAI-compatible client) everywhere. The README states
# which model produced these runs (l. 9, in Chinese: the attack-side measurements of AgentDojo on the DeepSeek V4-Flash
# model). Under D-92 a document's statement about these runs may be asserted as a class-I identity row with that basis,
# never a code default (precedent: the AgentDyn directory registry). The model is written as the id the other phase-10d
# sources log for it. Asserted under `agentdojo.pipeline_dir_is_model_identity@1` (class I).

[[dir]]
name = "local"
model = "deepseek-v4-flash"
defence = "none"
basis = "README statement (l. 9 at the pin): the runs are AgentDojo measurements on DeepSeek V4-Flash; pipeline_name local names no model"
