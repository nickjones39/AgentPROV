# Container identity table `memo_ozdincer_containers` (docs/architecture D.6.20; DECISIONS D-474): memo-ozdincer/agentdojo
# at 7c331d978acca38534a3d42951f28a25ba26901b, results containers under results/ and runs/results/.
#
# A row applies to a container whose path matches `glob` (fnmatch: `*` also matches `/`) and whose served model name
# (the container's `model`, after the profile's redaction, D-476) equals `served`; the first such row wins. Rows are
# keyed by path and the redacted label, never by a raw model string (D-182: a table keyed by the original id would put
# the workstation account into Git). Each value cites the document of the source that states it (D-92; class I under
# rescont.model_from_identity_table@1, rescont.lora_adapter_is_defence@1, rescont.attack_from_identity_table@1); a code
# default is never a basis. `model = "not_recorded"` keeps the model unresolved where no document states it.
#
# The Llama version (D-474, user decision 2026-10-14, option (a)): the cluster checkpoint `…/models/llama-70b` is
# Llama-3.3-70B-Instruct, as results/full_eval/FULL_EVAL_RESULTS.md l.4, results/baseline_defenses/TRACE_ANALYSIS.md l.4,
# scripts/LLAMA_NATIVE_CLUSTER_HANDOFF.md l.12, agentcontext/docs/ANALYSIS_2026-04-17.md l.5, docs/results/v5_analysis.md
# l.460 and docs/results/fir_gcg_phase1_final_2026-04-22.md l.27 state; results/EVAL_LOG.md l.9 and
# results/MULTITURN_RESULTS.md l.4 (both of 2026-03-27) say "Llama 3.1 70B Instruct". Rows on that checkpoint carry the
# conflict, which the mapper reports as an info issue `identity_conflict`.

# ---------------------------------------------------------------------------------------------- Llama-70B, cluster
[[row]]
glob = "results/baseline_defenses/*.json"
served = "cluster:5d2dbf6fa52a/llama-70b"
model = "meta-llama/Llama-3.3-70B-Instruct"
basis = "results/baseline_defenses/TRACE_ANALYSIS.md l.4: 'Model: Llama-3.3-70B-Instruct via vLLM PromptingLLM XML format'"
conflict = "results/EVAL_LOG.md l.9 and results/MULTITURN_RESULTS.md l.4 name the cluster checkpoint Llama 3.1 70B Instruct"
attack = "training_format"
attack_basis = "results/baseline_defenses/TRACE_ANALYSIS.md l.5: 'Attack: ToolKnowledgeAttack (model_name=\"Llama\")', the scripts' training_format attack"

[[row]]
glob = "results/full_eval/*.json"
served = "cluster:5d2dbf6fa52a/llama-70b"
model = "meta-llama/Llama-3.3-70B-Instruct"
basis = "results/full_eval/FULL_EVAL_RESULTS.md l.4: 'Model: Llama-3.3-70B-Instruct (vLLM)'"
conflict = "results/EVAL_LOG.md l.9 and results/MULTITURN_RESULTS.md l.4 name the cluster checkpoint Llama 3.1 70B Instruct"
attack = "training_format"
attack_basis = "results/full_eval/FULL_EVAL_RESULTS.md l.5 'Attack: ToolKnowledgeAttack' and results/MULTITURN_RESULTS.md l.7 'ToolKnowledgeAttack with model_name=\"Llama\"' (the same baseline runs), the scripts' training_format attack"

[[row]]
glob = "results/*.json"
served = "cluster:5d2dbf6fa52a/llama-70b"
model = "meta-llama/Llama-3.3-70B-Instruct"
basis = "the checkpoint path itself: scripts/LLAMA_NATIVE_CLUSTER_HANDOFF.md l.12 and agentcontext/docs/ANALYSIS_2026-04-17.md l.5 ('Llama-3.3-70B-Instruct at …/models/llama-70b')"
conflict = "results/EVAL_LOG.md l.9 and results/MULTITURN_RESULTS.md l.4 name the cluster checkpoint Llama 3.1 70B Instruct"
note = "api_evals (attacks recorded) and comprehensive_eval (benign smoke)"

