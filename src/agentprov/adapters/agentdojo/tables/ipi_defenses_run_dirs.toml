# Identity table `ipi_defenses_run_dirs` (docs/architecture D.4.5): one row per <run set>/<defence>/<model> directory of
# the three trace tars of the replication package Zenodo 22011266 (v4.0.0; concept 20731176; zip
# AgentSecurity-IPIDefenses-v4.0.zip, sha256 c2370724...). Their members are runs/<run set>/<defence>/<model>/banking/...;
# 19 directories, 169 logs each (3,211).
#
# The defence is the directory above the model directory: AgentDojo's built-in defences (none, spotlighting_with_delimiting,
# repeat_user_prompt, transformers_pi_detector with protectai/deberta-v3-base-prompt-injection-v2 at an unpinned revision,
# and tool_filter for the OpenAI models only), as the README's study summary lists them. The model directory equals the
# logged pipeline_name, the API snapshot the README's model table names. The run set says which of the two runs the
# directory holds (README "Contents"; RUN_MAP.md). Asserted under `agentdojo.pipeline_dir_is_model_identity@1` (class I;
# D-251).

[[dir]]
name = "verify_2026-07/none/claude-sonnet-4-6"
model = "claude-sonnet-4-6"
defence = "none"
pipeline_name = "claude-sonnet-4-6"
basis = "model directory = logged pipeline_name (the README model table); defence directory = none; run 2, frontier models (traces_frontier_verify.tar.gz)"

