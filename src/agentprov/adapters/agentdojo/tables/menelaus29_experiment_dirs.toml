# Identity table `menelaus29_experiment_dirs` (docs/architecture D.4.5): one row per experiment directory of
# Menelaus29/ipi-multidomain-agent-study, branch main, at the pinned commit ec9c9287889ebec339c4304f01a4a4a99500c491
# (22 directories, 857 logs under data/<experiment path>/<pipeline dir>/).
#
# Keyed by the experiment path because the defence is a property of the experiment, not of the pipeline name: the same
# pipeline directory holds undefended and defended runs. The pipeline directory is `<model> [<AgentDojo enum alias>]`
# (the alias routes the request; the model is the part before the bracket, verbatim), except in the built-in spotlighting
# replication, whose logged name is the alias plus `-g4-spotlighting_with_delimiting`; the README states that the defence
# track runs under Gemma 4 (gemma-4-26b-a4b-it) and the directory is under data/defended/g4/. The defence is
# `my_spotlighting` (src/defenses/my_spotlighting.py) where every log carries its 1,331-character system prompt
# (digest 4182a3d3...), `spotlighting_with_delimiting` (src/defenses/builtin_spotlighting.py, AgentDojo's built-in) for
# the builtin replication, and none elsewhere. Asserted under `agentdojo.pipeline_dir_is_model_identity@1` (class I).

[[dir]]
name = "data/adaptive/g4/v1/results/raw/banking"
model = "google-gemma-4-26b-a4b-it"
defence = "my_spotlighting"
pipeline_name = "google-gemma-4-26b-a4b-it [gemini-2.5-flash-preview-04-17]"
basis = "28 logs; model before the bracket of the pipeline directory; defence: every log carries the my_spotlighting system prompt"

