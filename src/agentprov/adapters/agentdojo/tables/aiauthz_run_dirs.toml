# Identity table `aiauthz_run_dirs` (docs/architecture D.4.5): one row per <model dir>/<arm> of
# experiments/agentdojo/runs/ of Sports-Vision-Inc/aiAuthZ at the pinned commit 6eaac86ae5bfd8bf7b8a65786a5c77a7c0bce673
# (12 directories, 174 logs; AGPL-3.0 source).
#
# The logged pipeline_name is a registry tag chosen for the attack prose, never the model (pipeline_name_policy
# config_tag_never_model): experiments/agentdojo/run_benchmark.py (_MODEL_TAGS) sends the OpenRouter model of the
# directory and logs claude-3-5-sonnet-20241022 or gemini-2.0-flash-001. The model is the OpenRouter id the directory
# names ('/' written as '_'); the arm is aiauthz (the aiAuthZ defence, aiauthz_defense.py), spotlighting
# (AgentDojo's spotlighting_with_delimiting) or no_defense, with `_clean` for the benign runs without injections.
# Asserted under `agentdojo.pipeline_dir_is_model_identity@1` (class I).

[[dir]]
name = "anthropic_claude-fable-5/aiauthz"
model = "anthropic/claude-fable-5"
defence = "aiauthz"
provider = "openrouter"
provider_evidence = "I"
pipeline_name = "claude-3-5-sonnet-20241022-aiauthz"
basis = "run_benchmark.py _MODEL_TAGS maps anthropic/claude-fable-5 to the logged tag claude-3-5-sonnet-20241022; arm aiauthz"

