# Identity table `tacit_model_dirs` (docs/architecture D.4.5): one row per model directory of CSSLab/Tacit at the pinned
# commit 995692d3cd42c32e08cf0db8a5fae55fec272f1a (2 directories, 2,076 logs under data/agentdojo/<model dir>/<client dir>/).
#
# The logged pipeline_name is AgentDojo's client label (`local` for the LocalLLM client, `vllm_parsed` for the vLLM client
# with parsed tool calls), never a model, so the model is the directory label, verbatim: the repository does not record the
# exact checkpoint (Hugging Face id, revision or quantisation), so none is asserted. Every value is asserted under
# `agentdojo.pipeline_dir_is_model_identity@1` (class I); `provider` is the client the label names (class I).

[[dir]]
name = "llama3.1-8b-instruct"
model = "llama3.1-8b-instruct"
defence = "none"
provider = "local"
provider_evidence = "I"
pipeline_name = "local"
basis = "directory label above the client directory local (1,046 logs); the checkpoint is not recorded"

[[dir]]
name = "qwen3-4b-instruct"
model = "qwen3-4b-instruct"
defence = "none"
provider = "vllm"
provider_evidence = "I"
pipeline_name = "vllm_parsed"
basis = "directory label above the client directory vllm_parsed (1,030 logs); the checkpoint is not recorded"
