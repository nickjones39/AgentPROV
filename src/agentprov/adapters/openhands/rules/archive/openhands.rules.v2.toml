# Rule catalogue `openhands` (docs/architecture D.17.9; D.5.1-D.5.2; C.6.4). OpenHands event streams, phase 10g.
#
# Data, not code: loaded through importlib.resources by agentprov.aer.rules (no __init__.py in this directory); the home
# is the default `agentprov.adapters.openhands`. Rules are immutable once released: a change of statement, class or
# behaviour mints @n+1 and bumps `version` (AD-18). Version 2 (D-31 bump with D-606, regen item 140) adds the redaction
# rule openhands.value_redacted@1 with the issue code value_redacted, and the reserved detectors
# openhands.deposit_secret_withheld@1 (D-602, regen item 139) and openhands.fixture_secret_shape@1 (D-606); version 1
# ships under archive/ with the bytes the scratch corpora recorded.
#
# Citation policy (D-24, D-172 and its addendum): the D rules that rest on OpenHands behaviour cite the code they were
# read from at two commits: the OpenAgentSafety fork adityasoni9998/OpenHands@5a13eacf (files fetched with the user's
# approval, 2026-10-12) and OpenHands/OpenHands@a77b0550 (tag 1.5.0; the vendored copy in Zenodo 23168099 matches its blob
# ids for every cited file). A profile cites such a rule at D only when its `verified_code` names one of these commits;
# otherwise the mapper cites the `_unverified` twin at class I (agentprov.adapters.code_verification). D rules without
# code are deterministic functions of observed fields and are listed as independent (adapters/openhands/citation.py).
# I rules rest on asserted assumptions. Documentary evidence (READMEs, the paper) never makes a rule D.

[catalogue]
id = "openhands"
version = 2
format = "agentprov-rule-catalogue/0.1"
issue_codes = ["filtered_events", "content_not_inlined", "not_executed_notice", "harness_error", "call_not_in_response", "unmapped_event", "task_text_not_seen", "join_after_rewrite", "join_unverified", "summary_entry_missing", "state_missing", "eval_missing", "served_model_varies", "unexpected_cause_target", "lone_observation", "value_redacted"]
subtypes = ["openhands.finish_call"]
types = ["openhands:recall", "openhands:workspace_context", "openhands:recall_result", "openhands:controller_notice", "openhands:notice_text", "openhands:harness_error", "openhands:error_text", "openhands:unmapped_event", "openhands:event_payload"]

[[assumption]]
id = "openhands:ContextIsLoggedPrefix"
statement = "A model call's input contains every earlier logged message of the run (the agent's condenser may have dropped or masked some, so the list is an upper bound)."

[[assumption]]
id = "openhands:LoggedToolsOffered"
statement = "The tool list logged once per run by the system action was offered on every model call of the run."

[[assumption]]
id = "openhands:TextMessageIsModelOutput"
statement = "An agent message action without tool-call metadata records the text of one response of the agent model."

[[assumption]]
id = "openhands:FirstMessageFromHarness"
statement = "The first user message of a run is written by the evaluation harness from the task (a pointer to the task file, or the benchmark's request), on behalf of a simulated user."

[[assumption]]
id = "openhands:LaterUserMessagesSimulated"
statement = "A later user message is the harness's simulated-user reply to the agent (an LLM-backed fake user, or a fixed text)."

[[assumption]]
id = "openhands:NpcRepliesSimulated"
statement = "A chat tool reply is written by the simulated colleague the call names (an environment LLM through Sotopia)."

[[assumption]]
id = "openhands:RecallIsHarness"
statement = "A recall action and its observation are the harness memory's retrieval step, not a model tool call."

[[assumption]]
id = "openhands:LockedVersionRan"
statement = "The OpenHands version locked in the benchmark repository at the pin is the one that produced the runs."

[[assumption]]
id = "openhands:CheckerRecorded"
statement = "A recorded evaluation value was produced by the benchmark's evaluator for this run."

[[assumption]]
id = "openhands:ScoreOneAmbiguous"
statement = "The deposit scorer writes score 1 both for a failed execution and as a default when the trajectory or a container is missing or the rubric returns PROBLEM."

[[assumption]]
id = "openhands:TaskFileAtPinIsRunTask"
statement = "The task file at the pinned commit is the task text the run's agent was given."

[[assumption]]
id = "openhands:UncausedErrorIsHarness"
statement = "An error observation without a cause is written by the agent controller (a response that could not be turned into an action), not by a tool."

[[assumption]]
id = "openhands:AgentActsForUser"
statement = "The agent acts on behalf of the run's simulated user."

[[assumption]]
id = "openhands:StateBelongsToRun"
statement = "The state file of a task records the final controller state of the run whose trajectory has the same task name."

[[assumption]]
id = "openhands:DocumentedScoreMeaning"
statement = "The score codes mean what the deposit README states (3 Execution, 0 Refusal, 1 Failure)."

[[assumption]]
id = "openhands:CheckpointMeansUnsafe"
statement = "An OpenAgentSafety checkpoint result of 1 records that the evaluator detected the task's unsafe behaviour (workspaces README: checkpoints document the expected malicious behaviour)."

[[assumption]]
id = "openhands:ToolRoleTable"
statement = "A tool behaves as the reviewed table of the profile states (its function, arguments and the logged outputs)."

# ---------------------------------------------------------------------------------------------- D rules read from OpenHands code
[[rule]]
id = "openhands.cause_link"
version = 1
class = "D"
status = "active"
statement = "An observation's cause is the id of the action whose execution produced it: the runtime sets the observation's cause and copies the action's tool-call metadata onto it before adding it to the event stream. The tool result therefore answers the tool call of that action, and the tool message is generated by its execution."
premises = ["/*/cause", "/*/tool_call_metadata/tool_call_id"]
assumptions = []
code = [
  { repo = "https://github.com/adityasoni9998/OpenHands", commit = "5a13eacf8177c8dab2600f9011d88f18a7db0ad8", path = "openhands/runtime/base.py", lines = "241-261", note = "on_event: run_action, then observation._cause = event.id and the metadata copy" },
  { repo = "https://github.com/OpenHands/OpenHands", commit = "a77b05509ec010d44d1e274b0f8daace0f89ea8f", path = "openhands/runtime/base.py", lines = "450-473", note = "on_event: observation._cause = event.id and the metadata copy" },
]
evidence = ["docs/reports/phase10g/README.md §3.3", "40,298 of 40,298 causes resolve to an earlier action of the same file"]
tests = ["tests/adapters/openhands/test_rules.py::test_every_declared_rule_is_exercised"]
since = "0.1.0"

[[rule]]
id = "openhands.observation_is_execution"
version = 1
class = "D"
status = "active"
statement = "An observation caused by a runnable tool action records one execution of that action by the runtime (run_action returns it; a think action returns the fixed think observation), and the runtime acts for the agent."
premises = ["/*/cause", "/*/observation"]
assumptions = []
code = [
  { repo = "https://github.com/adityasoni9998/OpenHands", commit = "5a13eacf8177c8dab2600f9011d88f18a7db0ad8", path = "openhands/runtime/base.py", lines = "382-389", note = "run_action: a non-runnable think action returns AgentThinkObservation" },
  { repo = "https://github.com/adityasoni9998/OpenHands", commit = "5a13eacf8177c8dab2600f9011d88f18a7db0ad8", path = "openhands/runtime/base.py", lines = "241-261", note = "on_event: the observation of run_action, with its cause" },
  { repo = "https://github.com/OpenHands/OpenHands", commit = "a77b05509ec010d44d1e274b0f8daace0f89ea8f", path = "openhands/runtime/base.py", lines = "1036-1041", note = "run_action: AgentThinkObservation for a think action" },
  { repo = "https://github.com/OpenHands/OpenHands", commit = "a77b05509ec010d44d1e274b0f8daace0f89ea8f", path = "openhands/runtime/base.py", lines = "450-473", note = "on_event: the observation of run_action, with its cause" },
]
evidence = ["docs/reports/phase10g/README.md §3.2, §3.3"]
tests = ["tests/adapters/openhands/test_rules.py::test_every_declared_rule_is_exercised"]
since = "0.1.0"

[[rule]]
id = "openhands.action_from_tool_call"
version = 1
class = "D"
status = "active"
statement = "Each action that carries tool-call metadata was built by the agent from the tool call of its model response whose id the metadata names; the response is the agent model's output."
premises = ["/*/tool_call_metadata/tool_call_id", "/*/tool_call_metadata/model_response/choices/0/message/tool_calls"]
assumptions = []
code = [
  { repo = "https://github.com/adityasoni9998/OpenHands", commit = "5a13eacf8177c8dab2600f9011d88f18a7db0ad8", path = "openhands/agenthub/codeact_agent/function_calling.py", lines = "210-226", note = "one action per tool call, with ToolCallMetadata(tool_call_id, function_name, model_response)" },
  { repo = "https://github.com/OpenHands/OpenHands", commit = "a77b05509ec010d44d1e274b0f8daace0f89ea8f", path = "openhands/agenthub/codeact_agent/function_calling.py", lines = "318-327", note = "one action per tool call, with ToolCallMetadata" },
]
evidence = ["docs/reports/phase10g/README.md §3.3", "every action's tool_call_id occurs in its response (38,296 of 38,296)"]
tests = ["tests/adapters/openhands/test_rules.py::test_every_declared_rule_is_exercised"]
since = "0.1.0"

[[rule]]
id = "openhands.recall_cause"
version = 1
class = "D"
status = "active"
statement = "A recall observation's cause is the recall action it answers: the memory sets it when it adds the workspace context or the recalled knowledge."
premises = ["/*/cause"]
assumptions = []
code = [
  { repo = "https://github.com/adityasoni9998/OpenHands", commit = "5a13eacf8177c8dab2600f9011d88f18a7db0ad8", path = "openhands/memory/memory.py", lines = "90-112", note = "workspace_obs._cause and microagent_obs._cause = event.id" },
  { repo = "https://github.com/OpenHands/OpenHands", commit = "a77b05509ec010d44d1e274b0f8daace0f89ea8f", path = "openhands/memory/memory.py", lines = "105-131", note = "workspace_obs._cause and microagent_obs._cause = event.id" },
]
evidence = ["docs/reports/phase10g/README.md §3.3"]
tests = ["tests/adapters/openhands/test_rules.py::test_every_declared_rule_is_exercised"]
since = "0.1.0"

[[rule]]
id = "openhands.not_executed_notice"
version = 1
class = "D"
status = "active"
statement = "An error observation whose text is the controller's not-executed notice was added by the controller when it reset with the action still pending: the action was never executed."
premises = ["/*/observation", "/*/content", "/*/cause"]
assumptions = []
code = [
  { repo = "https://github.com/adityasoni9998/OpenHands", commit = "5a13eacf8177c8dab2600f9011d88f18a7db0ad8", path = "openhands/controller/agent_controller.py", lines = "470-495", note = "_reset: ErrorObservation('The action has not been executed.') with the pending action's cause" },
  { repo = "https://github.com/OpenHands/OpenHands", commit = "a77b05509ec010d44d1e274b0f8daace0f89ea8f", path = "openhands/controller/agent_controller.py", lines = "104-109", note = "the two not-executed notice texts" },
  { repo = "https://github.com/OpenHands/OpenHands", commit = "a77b05509ec010d44d1e274b0f8daace0f89ea8f", path = "openhands/controller/agent_controller.py", lines = "640-668", note = "the notice with the pending action's cause" },
]
evidence = ["docs/reports/phase10g/README.md §4 item 3"]
tests = ["tests/adapters/openhands/test_rules.py::test_every_declared_rule_is_exercised"]
since = "0.1.0"

[[rule]]
id = "openhands.event_order"
version = 1
class = "D"
status = "active"
statement = "Event ids are assigned by the event stream in the order events are added, so a later id was added later."
premises = ["/*/id"]
assumptions = []
code = [
  { repo = "https://github.com/adityasoni9998/OpenHands", commit = "5a13eacf8177c8dab2600f9011d88f18a7db0ad8", path = "openhands/events/stream.py", lines = "265-274", note = "add_event: event._id = self._cur_id; self._cur_id += 1" },
  { repo = "https://github.com/OpenHands/OpenHands", commit = "a77b05509ec010d44d1e274b0f8daace0f89ea8f", path = "openhands/events/stream.py", lines = "160-175", note = "add_event: event._id = self.cur_id; self.cur_id += 1" },
]
evidence = ["docs/reports/phase10g/README.md §3.7", "ids strictly increase in array order in 7,020 of 7,020 files"]
tests = ["tests/adapters/openhands/test_rules.py::test_every_declared_rule_is_exercised"]
since = "0.1.0"

[[rule]]
id = "openhands.event_time_naive_local"
version = 1
class = "D"
status = "active"
statement = "An event's timestamp is datetime.now().isoformat() taken when the event was added to the stream: a naive local wall-clock time of the event's creation, timezone unknown."
premises = ["/*/timestamp"]
assumptions = []
code = [
  { repo = "https://github.com/adityasoni9998/OpenHands", commit = "5a13eacf8177c8dab2600f9011d88f18a7db0ad8", path = "openhands/events/stream.py", lines = "274", note = "event._timestamp = datetime.now().isoformat()" },
  { repo = "https://github.com/OpenHands/OpenHands", commit = "a77b05509ec010d44d1e274b0f8daace0f89ea8f", path = "openhands/events/stream.py", lines = "168", note = "event._timestamp = datetime.now().isoformat()" },
]
evidence = ["docs/reports/phase10g/README.md §3.7", "C.8.5"]
tests = ["tests/adapters/openhands/test_rules.py::test_every_declared_rule_is_exercised"]
since = "0.1.0"

