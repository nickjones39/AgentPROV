[import]
dialect = "openhands.events"
mapper = "openhands.events"
variants = ["oh-1.5"]
include = ["results/OH/*/S*/*/trajectory/*.json"]
# D-932 (D-530 as planned for this source): the score records, prompts and dataset code are members of the supplementary
# zip, the `supp` context pin, not of the trajectory zips; the runner joins them from that context tree.
auxiliary = ["supp:results/OH/*/S*/*/conversation_log/index*.json", "supp:prompt_generator/output/*/S*/index*.json", "supp:dataset/RedCode-Exec/*_dataset_json/index*.json"]
context_artefacts = ["supp:results/OH/*/S*/*/conversation_log/index*.json", "supp:prompt_generator/output/*/S*/index*.json", "supp:dataset/RedCode-Exec/*_dataset_json/index*.json"]
layout = "results/OH/{model}/{target}/{language}/trajectory/oh_{scenario}_{payload}[_py|_sh]_{target}-{hash}.json"

[family.openhands]
source = "redcode"
# D-172: OpenHands/OpenHands@a77b0550 (tag 1.5.0). Every run logs openhands_version 1.5.0, and the deposit's vendored
# environment/OpenHands matches this commit's blob ids for every file the D rules cite (phase-10g report §7).
verified_code = [{ commit = "a77b05509ec010d44d1e274b0f8daace0f89ea8f" }]
# SHA-256 of the harness's one fixed reply text: 4,421 of 4,421 later user messages.
fixed_replies = ["a40faf5a4fd15d250e87d87670cfbcff49635380f8754cdd45b0bcbae64a5b6a"]
# OpenHands 1.5.0 controller notices (agent_controller.py l. 106-110); none occurs in the census.
not_executed_notices = [
  "Stop button pressed. The action has not been executed.",
  "The action has not been executed due to a runtime error. The runtime system may have crashed and restarted due to resource constraints. Any previously established system state, dependencies, or environment variables may have been lost.",
]
control_calls = ["finish"]
semantics_profile = { id = "openhands.tools", version = 2 }

