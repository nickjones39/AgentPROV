# Source profile `redcode-exec-openhands`: the OpenHands part of Zenodo 23168099 ("Which Orders Count? A Behavioral Study
# of Execution Decisions in Autonomous Coding Agents"): 5,460 OpenHands 1.5.0 runs of claude-sonnet-4-6 (S1-S3, python,
# 720 each) and qwen3-coder-30b-a3b-instruct (S1 and S2 python 720 and bash 570 each, S3 python 720) on RedCode-Exec risky
# code requests under three request types, with one sandbox-execution score per run (phase 10g; D-170-D-179;
# docs/reports/systematic-search/candidates/phase10e-candidates.md §3.9). The Qwen Code part (3,300 runs) is not this
# profile (part C of phase 10g).
#
# Data, not code. No status lives here: the registry is the only status store (R-38, R-45). Any byte change bumps
# `version` (AD-18); no corpus records this profile, so it is still 1 (D-31: edited in place for D-602's [withhold] and
# the move to openhands.tools@2 with the catalogue bump of D-606). Counts are from the phase-10g census
# (docs/reports/phase10g/).
#
# Input: the trajectories are members of six deposit zips and the score records, prompts and dataset code members of the
# supplementary zip. Each trajectory zip is a primary pin of its own role (D-932) and is imported as its own snapshot of
# the one corpus: `agentprov import redcode-exec-openhands --pin <role> --snapshot <role> --input <zip>
# --verify-against-pin --context supp=<supplementary zip>`. Without `--pin` the import refuses the part, because it has
# several primary pins. The census (tools/openhands/redcode_census.py) predates the archive inputs of D-156.

