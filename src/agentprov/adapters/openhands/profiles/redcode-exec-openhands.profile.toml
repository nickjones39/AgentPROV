rules = ["openhands.redcode_prompt_join@1"]
observed = { runs = 144 }

[[family.openhands.quirk]]
id = "openhands.score_one"
rules = ["openhands.redcode_score_one_ambiguous@1"]
observed = { runs = 137 }

# D-602 (user decision 2026-10-21; pre-check PC-redcode-exec-openhands-01, CC-13 real-format secret of the source's own
# infrastructure, S0): the supplementary zip holds a real Hugging Face token in one member the profile never selects (a
# shell history under environment/). The decoded scan of sealing (D-450) finds it there and withholds the zip at object
# level: scope object, so no execution follows it through citing(). The census found it in 0 primary logs and 0 stored
# bytes. The runner imports one archive input per snapshot, so the supp zip is not stored today; the rule takes effect
# once the archive context tree lands. The value is never recorded.
[withhold]
reason = "secret"
public_note = "a real-format access token in an unselected member of the deposit's supplementary archive; the archive is withheld, the value is never recorded"

[[withhold.rules]]
id = "hf-token-shape"
pattern = "hf_[A-Za-z0-9]{34}"
scope = "object"
