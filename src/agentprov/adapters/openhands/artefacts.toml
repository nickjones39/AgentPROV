expected = [{ snapshot = "redcode-exec-openhands:head", count = 144, basis = "phase-10g census", unit = "executions", status = "unverified" }]
manuscript = false
refs = ["docs/reports/phase10g/README.md §3.5", "DECISIONS D-178"]

[[artefact]]
id = "openhands.art.deposit_shell_history_token"
title = "Real access token in an unselected deposit member"
description = "The supplementary zip of Zenodo 23168099 holds one shell history under environment/ with a real-format Hugging Face token on two lines (pre-check PC-redcode-exec-openhands-01, CC-13, S0). The member is never selected and reaches no AER; the profile's [withhold] rule (scope object) withholds the zip at sealing once the archive context tree stores it, with 0 executions (D-602). The value is never printed or written."
scope = { sources = ["redcode-exec-openhands"], profiles = ["redcode-exec-openhands"], parts = ["head"] }
cause = "upstream_harness"
detector = { rule = "openhands.deposit_secret_withheld@1", class = "D" }
handling = { class = "FO", rule = "openhands.deposit_secret_withheld@1" }
expected = [{ snapshot = "redcode-exec-openhands:head", count = 1, basis = "D-602 census (decoded members of the supp zip; 2 matches in 1 member, 0 in the 5,460 trajectories)", unit = "archive objects", status = "unverified" }]
manuscript = true
refs = ["DECISIONS D-602", "docs/reports/precheck/redcode-exec-openhands.md PC-01"]

[[artefact]]
id = "openhands.art.third_party_account_paths"
title = "Third-party developer account paths in fetched content"
description = "Pages, issues, build logs and a debug log the agent fetched hold developer workstation paths (/home/<name>, /Users/<name>, ~<name>) of third parties (pre-check PC-openagentsafety-01, CC-12 (b)). The profile's redact rules replace the account segment in tool output with a salted label (D-604, D-606); model-authored text keeps its paths verbatim. Raw bytes are unchanged."
scope = { sources = ["openagentsafety"], profiles = ["openagentsafety"], parts = ["head"] }
cause = "benchmark"
detector = { rule = "openhands.value_redacted@1", class = "D" }
recorded_as = { issues = ["openhands.value_redacted"] }
handling = { class = "FO", rule = "openhands.value_redacted@1" }
expected = [{ snapshot = "openagentsafety:head", count = 9, basis = "D-606 census (78 tool-output texts, 83 path strings of 10 accounts; residue 0 for the 8 CC-12 (b) accounts)", unit = "executions", status = "unverified" }]
manuscript = true
refs = ["DECISIONS D-604", "DECISIONS D-606", "docs/reports/precheck/openagentsafety.md PC-01"]

[[artefact]]
id = "openhands.art.fixture_secret_shapes"
title = "Secret-shaped benchmark fixture values"
description = "Trajectories and state files hold 8 distinct secret-shaped values (7 of the sk- form, 1 bearer token): 5 are fixture credentials of the task definitions, 1 is served by the environment in runs of two models, 1 is a placeholder-like key a model wrote and 1 a bearer token a model wrote into a command. None has an issued-key format (no provider marker, below an issued key's length, no project prefix), so none is a real-format secret of the source's own infrastructure (CC-13 fixtures, pre-check PC-openagentsafety-07). Kept as published (D-179 option A); the 49 holding objects are listed by object digest for the release-scan triage (synthetic-benchmark) in docs/reports/bugpass/d606-oas-secret-objects.json. No value is recorded."
scope = { sources = ["openagentsafety"], profiles = ["openagentsafety"], parts = ["head"] }
cause = "benchmark"
detector = { rule = "openhands.fixture_secret_shape@1", class = "D" }
handling = { class = "NR" }
expected = [{ snapshot = "openagentsafety:head", count = 49, basis = "D-606 census (24 trajectories, 25 state files; 516 occurrences of 8 values)", unit = "raw objects", status = "unverified" }]
manuscript = true
refs = ["DECISIONS D-179", "DECISIONS D-606", "docs/reports/precheck/openagentsafety.md PC-07", "docs/reports/bugpass/d606-oas-secret-objects.json"]

# Wave 2 (D-950; docs/reports/wave-2-artefacts/README.md): openhands.art.not_executed_notice claims the generic
# unexecuted_call hits of its pending call (168 = 168 in the wave-2 census); the entries below cover the times of
# both sources and RedCode's request as the attack.

[[artefact]]
id = "openhands.art.naive_event_times"
title = "Event times are naive local times; observations and judgements carry none"
description = "An event's timestamp is datetime.now() taken when the event entered the stream: a naive local wall-clock time, timezone unknown. The first and last event times bound the logged events, not the run, so the run's slots stay verbatim in t.raw, declared ambiguous; tool executions and judgements record no time of their own (not recorded). No time is typed or filled."
scope = { sources = ["openagentsafety", "redcode-exec-openhands"], profiles = ["openagentsafety", "redcode-exec-openhands"], parts = ["head"] }
cause = "upstream_harness"
detector = { rule = "openhands.event_time_naive_local@1", class = "D" }
claims = ["artefact.generic.sentinel_time#unknown_ambiguous", "artefact.generic.sentinel_time#unknown_not_recorded"]
handling = { class = "NR" }
expected = [
  { snapshot = "openagentsafety:head", count = 1560, basis = "wave-2 census (D-950): every execution", unit = "executions", status = "unverified" },
  { snapshot = "redcode-exec-openhands", count = 5460, basis = "wave-2 census (D-950), six snapshots: every execution", unit = "executions", status = "unverified" },
]
manuscript = false
refs = ["D.16.18 correction 1", "C.8.5"]

[[artefact]]
id = "openhands.art.request_is_the_attack"
title = "No injection payload (RedCode)"
description = "RedCode's attack is the risky code request itself (request types C1-C3, recorded as the task's attack), not a payload injected into tool output: no injection_payload fixture or marker exists, so every run is a payload_not_reaching_agent finding of variant no_marker. It says nothing about what the agent did with the request."
scope = { sources = ["redcode-exec-openhands"], profiles = ["redcode-exec-openhands"], parts = ["head"] }
cause = "benchmark"
detector = { rule = "openhands.redcode_request_type@1", class = "D" }
claims = ["artefact.generic.payload_not_reaching_agent#no_marker"]
handling = { class = "NR" }
expected = [{ snapshot = "redcode-exec-openhands", count = 5460, basis = "wave-2 census (D-950), six snapshots", unit = "executions", status = "unverified" }]
manuscript = false
refs = ["DECISIONS D-571", "qwencode.art.request_is_the_attack (the same benchmark under Qwen Code)"]
