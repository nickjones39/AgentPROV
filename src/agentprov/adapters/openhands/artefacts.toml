# Artefact catalogue `openhands` (docs/architecture D.17.11, D.15.2; DECISIONS D-12, D-170-D-179). Data, not code.
#
# Every source-data problem of the two OpenHands sources found by the phase-10g census, with the rule that detects it,
# how it is recorded and its handling class (D.15.1). The `expected` counts are the census's for the pinned snapshots and
# stay `unverified` until full imports confirm them (D.15.6): a regression expectation, never a gate. Cases that no AER
# field read by the safety net carries (the 145 OpenAgentSafety state files without a trajectory, the secret-like
# strings kept under option A, the LLM-judge label "Label: Label") are recorded in docs/reports/phase10g/README.md only.
# The version is 1: nothing is released, and the catalogue digest enters no AER, SEM or PROV file. The three entries of
# 2026-10-21 (D-602, D-606) are additions at the same version for that reason.

version = 1
family = "openhands"
namespaces = ["openhands"]

[[artefact]]
id = "openhands.art.filtered_events"
title = "Events absent from the saved trajectory"
description = "OpenHands saves the controller's history, which leaves out state-change and null events and hidden events, so event ids have gaps in every file. Only the number of absent ids is recorded; no event is invented."
scope = { sources = ["openagentsafety", "redcode-exec-openhands"], profiles = ["openagentsafety", "redcode-exec-openhands"], parts = ["head"] }
cause = "upstream_harness"
detector = { rule = "openhands.filtered_events@1", class = "D" }
recorded_as = { issues = ["openhands.filtered_events"] }
handling = { class = "NR", rule = "openhands.filtered_events@1" }
expected = [
  { snapshot = "openagentsafety:head", count = 1560, basis = "phase-10g census (3,338 missing ids)", unit = "executions", status = "unverified" },
  { snapshot = "redcode-exec-openhands:head", count = 5460, basis = "phase-10g census (18,519 missing ids)", unit = "executions", status = "unverified" },
]
manuscript = true
refs = ["docs/reports/phase10g/README.md §3.7", "DECISIONS D-175"]

[[artefact]]
id = "openhands.art.not_executed_notice"
title = "Action pending when the run stopped"
description = "The controller adds 'The action has not been executed.' with the pending action's cause when it resets; no execution is mapped, the call is listed as unexecuted and the notice is a harness artefact."
scope = { sources = ["openagentsafety"], profiles = ["openagentsafety"], parts = ["head"] }
cause = "upstream_harness"
detector = { rule = "openhands.not_executed_notice@1", class = "D" }
claims = ["artefact.generic.unexecuted_call"]
recorded_as = { issues = ["openhands.not_executed_notice"] }
handling = { class = "CR", rule = "openhands.not_executed_notice@1" }
expected = [{ snapshot = "openagentsafety:head", count = 168, basis = "phase-10g census (always the last event)", unit = "executions", status = "unverified" }]
manuscript = false
refs = ["docs/reports/phase10g/README.md §4 item 3", "DECISIONS D-175"]

[[artefact]]
id = "openhands.art.harness_error"
title = "Uncaused controller error"
description = "An error observation without a cause (a model response that could not become an action) is a harness activity with its text; a run whose last event it is ends in error."
scope = { sources = ["openagentsafety", "redcode-exec-openhands"], profiles = ["openagentsafety", "redcode-exec-openhands"], parts = ["head"] }
cause = "upstream_harness"
detector = { rule = "openhands.uncaused_error_is_harness@1", class = "I" }
recorded_as = { issues = ["openhands.harness_error"] }
handling = { class = "FO", rule = "openhands.uncaused_error_is_harness@1" }
expected = [
  { snapshot = "openagentsafety:head", count = 2, basis = "phase-10g census", unit = "observations", status = "unverified" },
  { snapshot = "redcode-exec-openhands:head", count = 3, basis = "phase-10g census", unit = "observations", status = "unverified" },
]
manuscript = false
refs = ["docs/reports/phase10g/README.md §3.2", "DECISIONS D-175"]

[[artefact]]
id = "openhands.art.content_not_inlined"
title = "Screenshots and strings over 1 MiB not inlined"
description = "Browser set-of-marks screenshots (base64 PNG) and strings over 1 MiB are recorded by SHA-256 and size; the raw artefact holds them. An import-side blob surface would inline them (routed with D.16.14 R4)."
scope = { sources = ["openagentsafety"], profiles = ["openagentsafety"], parts = ["head"] }
cause = "upstream_harness"
detector = { rule = "openhands.content_not_inlined@1", class = "D" }
recorded_as = { issues = ["openhands.content_not_inlined"] }
handling = { class = "FO", rule = "openhands.content_not_inlined@1" }
expected = [{ snapshot = "openagentsafety:head", count = 322, basis = "phase-10g trial import: 321 runs with a set-of-marks screenshot (7,973 images) and 1 more whose only content not inlined is a tool output over 1 MiB", unit = "executions", status = "unverified" }]
manuscript = false
refs = ["docs/reports/phase10g/README.md §3.9", "DECISIONS D-179"]

[[artefact]]
id = "openhands.art.task_text_not_seen"
title = "Task text not visible in the log"
description = "The OpenAgentSafety harness sends a pointer to /instruction/task.md; the task text is in the log only when the agent read the file. Where it is not, the task-prompt fixture (from the pinned task directory, class I) is the only copy."
scope = { sources = ["openagentsafety"], profiles = ["openagentsafety"], parts = ["head"] }
cause = "benchmark"
detector = { rule = "openhands.task_text_seen@1", class = "D" }
recorded_as = { issues = ["openhands.task_text_not_seen"] }
handling = { class = "FO", rule = "openhands.task_text_seen@1" }
expected = [{ snapshot = "openagentsafety:head", count = 1284, basis = "phase-10g trial import (the whole normalised task text is seen in 276 runs; the part-A census found a 200-character prefix in 420)", unit = "executions", status = "unverified" }]
manuscript = true
refs = ["docs/reports/phase10g/README.md §3.5", "DECISIONS D-178"]

