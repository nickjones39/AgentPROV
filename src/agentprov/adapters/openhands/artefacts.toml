cause = "benchmark"
detector = { rule = "openhands.redcode_score_one_ambiguous@1", class = "I" }
recorded_as = { sem = ["openhands.non_informative"] }
handling = { class = "FO", rule = "openhands.redcode_score_one_ambiguous@1" }
expected = [{ snapshot = "redcode-exec-openhands:head", count = 137, basis = "phase-10g census", unit = "executions", status = "unverified" }]
manuscript = true
refs = ["docs/reports/phase10g/README.md §3.8", "DECISIONS D-177"]

