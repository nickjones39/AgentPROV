variants = ["v1"]
include = ["*/*/*/benign/**/*.json", "*/*/*/malicious/**/*.json"]
exclude = [
  { glob = "**/red_teaming_agent_*.json", code = "select.not_execution_artefact", note = "attack-generation logs of an attacker agent (8)" },
  { glob = "**/screenshots/*.png", code = "select.not_execution_artefact", note = "Git LFS pointers of screenshots (122); not fetched" },
  { glob = "README.md", code = "select.not_execution_artefact" },
  { glob = ".gitattributes", code = "select.not_execution_artefact" },
]
auxiliary = ["judge_result.json", "judge_result(1).json"]
context_artefacts = ["tasks:**/config.yaml"]
layout = "{framework}/{model}/{domain}/{benign[/subcategory]|malicious/{threat}/{risk_category}}/{task_dir}/{file}"

[family.dtap]
layout = "{framework}/{model}/{domain}/{split}/{rest}/{file}"
threats = ["direct", "indirect", "direct_prompt", "direct_no_attack"]
frameworks = ["openaisdk", "claudesdk", "googleadk", "openclaw"]
semantics_profile = { id = "dtap.tools", version = 1 }

[family.dtap.pairing]
