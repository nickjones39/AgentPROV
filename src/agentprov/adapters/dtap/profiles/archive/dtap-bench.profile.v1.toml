openclaw = "dtap.pair_strict_alternation@1"
googleadk = "dtap.pair_contiguous_batch_fifo@1"
claudesdk = "dtap.pair_interleaved_fifo@1"

[family.dtap.matcher]
normaliser = "dtap.alnum_norm@1"
min_needle = 24
window = 40
judge_link_min = 40

