# Artefact catalogue `dtap` (docs/architecture D.16.12, D.15.2; DECISIONS D-12, D-29). Data, not code.
#
# Every source-data problem of DTap-Bench found by the phase-10b census, with the rule that detects it, how it is
# recorded and its handling class (D.15.1). The `expected` counts are the census's for the pinned snapshot and stay
# `unverified` until the step-4 full import confirms them (D.15.6): a regression expectation, never a gate.
#
# Claims are specific (sample check §9.1 b1, user-approved 2026-10-12): an entry claims a safety-net finding only through
# a rule, `claims` item or issue code that belongs to its own case, never through a rule every run cites. Cases that no
# AER field read by the net carries (the timestamp zone, `(1)` copies, appended goal text, `unknown` result names,
# secret-like strings) name a `reserved` detector rule of the `dtap` rule catalogue, so they claim nothing. The entries
# from `event_times_not_recorded` on classify the findings the sample check left unclassified. The version stays 1:
# nothing is released, and the catalogue digest enters no AER, SEM or PROV file.

version = 1
family = "dtap"
namespaces = ["dtap"]

[[artefact]]
id = "dtap.art.synthetic_trajectory"
title = "Synthetic (repaired) trajectory"
description = "A trajectory.json marked synthetic: true is a fabricated 'repaired' refusal, not a run: it is stored and registered select.not_execution_artefact (detail dtap.synthetic), and so is its directory's judge."
scope = { sources = ["dtap"], profiles = ["dtap-bench"], parts = ["head"] }
cause = "benchmark"
detector = { rule = "dtap.synthetic_marker@1", class = "D" }
handling = { class = "FO", rule = "dtap.synthetic_marker@1" }
expected = [{ snapshot = "dtap:head", count = 20, basis = "census c03", unit = "files", status = "unverified" }]
manuscript = false
refs = ["sources/dtap.md §3.7", "DECISIONS D-29 item 1"]

