# ------------------------------------------------------------------------------------------------------------------
# Findings the sample check left unclassified (§9.1 b1, §10.2; user-approved 2026-10-12). No census figure exists for most
# of them, so they carry no `expected` row (D.15.8 item 3: no count is estimated); step 4 measures them.

[[artefact]]
id = "dtap.art.event_times_not_recorded"
title = "Only a run timestamp is logged"
description = "DTap logs one timestamp per run and no time for steps, model calls, tool executions or judgements: those times are unk not_recorded (never invented), the run timestamp's reading as the run end is class I (t.end ambiguous, the value kept in t.raw.end) and durations state no clock (t.dur_s ambiguous)."
scope = { sources = ["dtap"], profiles = ["dtap-bench"], parts = ["head"] }
cause = "upstream_harness"
detector = { rule = "dtap.timestamp_is_run_end_unverified@1", class = "I" }
claims = ["artefact.generic.sentinel_time#unknown_not_recorded", "artefact.generic.sentinel_time#unknown_ambiguous"]
handling = { class = "NR" }
manuscript = false
refs = ["sources/dtap.md §3.5", "docs/architecture D.16.4", "dtap sample check §9.1 b1"]

[[artefact]]
id = "dtap.art.derived_model_calls"
title = "Model calls derived from agent steps"
description = "No model call is logged: each maximal segment of agent steps is one derived model call (class I), so the core check aer.acc.agent_calls_vs_assistant is unverifiable by design."
scope = { sources = ["dtap"], profiles = ["dtap-bench"], parts = ["head"] }
cause = "upstream_harness"
detector = { rule = "dtap.agent_segment_one_turn_unverified@1", class = "I" }
claims = ["artefact.generic.accounting_unverifiable#aer.acc.agent_calls_vs_assistant@1"]
handling = { class = "NR" }
manuscript = false
refs = ["docs/architecture D.16.3", "dtap sample check §5 R01m, §10.2"]

[[artefact]]
id = "dtap.art.no_call_ids"
title = "No provider call ids"
description = "Tool calls carry no call id in any harness: no provider_call_id is written (never synthesised) and results are paired by the per-harness order rules (class I, D.16.7)."
scope = { sources = ["dtap"], profiles = ["dtap-bench"], parts = ["head"] }
cause = "upstream_harness"
detector = { rule = "dtap.pair_strict_alternation@1", class = "I" }
claims = ["artefact.generic.provider_id_anomaly#absent"]
handling = { class = "NR" }
expected = [{ snapshot = "dtap:head", count = 501228, basis = "phase-10b tool census (tools/dtap/tool_census.py): every logged tool call", unit = "tool_calls", status = "unverified" }]
manuscript = false
refs = ["sources/dtap.md §3.8", "docs/architecture D.16.7", "dtap sample check §10.2"]

[[artefact]]
id = "dtap.art.payload_not_observed"
title = "No observed payload marker"
description = "The generic payload_not_reaching_agent detector reads only injection_marker annotations (environment and skill payloads in tool output). For DTap the exposure classes of D.16.6 (dtap.exposure, every channel) are the reading: configured_only, logged_absent, partial_match or no verified configuration (N9, N10, N12)."
scope = { sources = ["dtap"], profiles = ["dtap-bench"], parts = ["head"] }
cause = "benchmark"
detector = { rule = "dtap.exposure_class@1", class = "D" }
claims = ["artefact.generic.payload_not_reaching_agent"]
handling = { class = "FO", rule = "dtap.exposure_class@1" }
manuscript = false
refs = ["docs/architecture D.16.6", "dtap sample check §8A DT04, §10.2"]

[[artefact]]
id = "dtap.art.path_domain_spelling"
title = "Domain spelled differently in the path and task_info"
description = "task_info.domain or risk_category differs from the path facet (customer_service, os, multi_app): the path is the identity; the difference is recorded (dtap.path_field_mismatch, info) and never corrected (N17)."
scope = { sources = ["dtap"], profiles = ["dtap-bench"], parts = ["head"] }
cause = "benchmark"
detector = { rule = "dtap.path_field_check@1", class = "D" }
recorded_as = { issues = ["dtap.path_field_mismatch"] }
handling = { class = "CR", rule = "dtap.path_field_check@1" }
manuscript = true
refs = ["sources/dtap.md §3.6", "dtap sample check §9.4 item 4, §10.1 N17"]

[[artefact]]
id = "dtap.art.harness_default_outcome"
title = "Harness-default judgement"
description = "A judgement value set by the harness, not by a checker: benign attack_success null (not judged), direct_prompt task_success constant true, direct task_success null. Kept with origin harness_default and marked non-informative in SEM; rates exclude them (dtap.rate.non_informative) (N13)."
scope = { sources = ["dtap"], profiles = ["dtap-bench"], parts = ["head"] }
cause = "benchmark"
detector = { rule = "dtap.non_informative@1", class = "I" }
claims = ["artefact.generic.harness_imposed_outcome#harness_default"]
handling = { class = "CR", rule = "dtap.benign_attack_not_judged@1" }
manuscript = true
refs = ["docs/architecture D.16.8", "docs/architecture D.16.10", "dtap sample check §10.1 N13"]

[[artefact]]
id = "dtap.art.additional_user_message"
title = "Additional user step"
description = "A run with more than one user step: every user step is a simulated user's message (class I); the later ones raise unattributed_additional_user_message because their author is not recorded."
scope = { sources = ["dtap"], profiles = ["dtap-bench"], parts = ["head"] }
cause = "upstream_harness"
detector = { rule = "dtap.user_is_simulated_unverified@1", class = "I" }
recorded_as = { issues = ["unattributed_additional_user_message"] }
handling = { class = "FO", rule = "dtap.user_is_simulated_unverified@1" }
manuscript = false
refs = ["docs/architecture D.16.3", "dtap sample check §8A DT07"]

[[artefact]]
id = "dtap.art.host_account_paths"
title = "Harness-host account names in tool output and agent text"
description = "Five workstation accounts of the harness hosts (pre-check PC-01) appear in account paths, ls listings and munged directory names in 1,094 trajectory files: tool output, OpenClaw harness-config state, agent arguments and text, final responses. The profile lists their salted labels and the mapper redacts every occurrence over every AER string (D-607); raw bytes ship unchanged (D-186)."
scope = { sources = ["dtap"], profiles = ["dtap-bench"], parts = ["head"] }
cause = "upstream_harness"
detector = { rule = "dtap.value_redacted@1", class = "D" }
recorded_as = { issues = ["dtap.value_redacted"] }
handling = { class = "FO", rule = "dtap.value_redacted@1" }
expected = [{ snapshot = "dtap:head", count = 1094, basis = "D-607 census", unit = "executions", status = "unverified" }]
manuscript = false
refs = ["docs/reports/precheck/dtap-bench.md PC-01", "DECISIONS D-607", "docs/architecture D.16.19"]

