[[artefact]]
id = "dtap.art.call_never_answered"
title = "Call that no tool step answers"
description = "A claudesdk call that no later tool step answers (D.16.7: 2 calls never answered): the call part stays, no tool execution is written because whether the call was dispatched is not recorded, and unexecuted_tool_call names the call."
scope = { sources = ["dtap"], profiles = ["dtap-bench"], parts = ["head"] }
cause = "upstream_harness"
detector = { rule = "dtap.call_without_result@1", class = "I" }
recorded_as = { issues = ["unexecuted_tool_call"] }
handling = { class = "CR", rule = "dtap.call_without_result@1" }
expected = [{ snapshot = "dtap:head", count = 2, basis = "wave-2 census (D-950), dtap-bench-w2b", unit = "tool_calls", status = "unverified" }]
manuscript = false
refs = ["docs/architecture D.16.7", "sources/dtap.md §3.8"]

[[artefact]]
id = "dtap.art.content_not_inlined"
title = "Strings over 1 MiB not inlined"
description = "A string whose UTF-8 encoding exceeds 1 MiB (one 1.72 MB tool-result text) is replaced in the AER by {not_inlined: {sha256, bytes}} of its bytes under dtap.content_not_inlined@1; the string stays in the raw artefact the record's locator names (D-934)."
scope = { sources = ["dtap"], profiles = ["dtap-bench"], parts = ["head"] }
cause = "upstream_harness"
detector = { rule = "dtap.content_not_inlined@1", class = "D" }
recorded_as = { issues = ["dtap.content_not_inlined"] }
handling = { class = "CR", rule = "dtap.content_not_inlined@1" }
expected = [{ snapshot = "dtap:head", count = 1, basis = "wave-2 census (D-950), dtap-bench-w2b", unit = "executions", status = "unverified" }]
manuscript = false
refs = ["C.2.1 item 6", "DECISIONS D-934"]

[[artefact]]
id = "dtap.art.tool_listing_only"
title = "Trajectory of tool listings only"
description = "An openaisdk trajectory whose only steps are List MCP Tools meta-steps: they are harness activities with a tool-name artefact (D.16.3), so the agent_execution has no message, no user step is logged (dtap.user_step_not_logged) and no agent step follows; why the run logged nothing more is not recorded, and refusal or attack-success readings of these runs may be logging gaps (sample check N16). Judgements are kept."
scope = { sources = ["dtap"], profiles = ["dtap-bench"], parts = ["head"] }
cause = "upstream_harness"
detector = { rule = "dtap.list_mcp_tools_harness_step@1", class = "I" }
claims = ["artefact.generic.empty_execution#no_messages"]
handling = { class = "FO", rule = "dtap.user_step_not_logged@1" }
expected = [{ snapshot = "dtap:head", count = 18, basis = "wave-2 census (D-950), dtap-bench-w2b: all openaisdk", unit = "executions", status = "unverified" }]
manuscript = false
refs = ["docs/architecture D.16.3", "dtap sample check §10.1 N16"]
