# Rule catalogue `dtap` (docs/architecture D.16.11; D.5.1-D.5.2; C.6.4). DTap-Bench, phase 10b.
#
# Data, not code: loaded through importlib.resources by agentprov.aer.rules (no __init__.py in this directory); the home
# is the default `agentprov.adapters.dtap` (no CATALOGUE_HOMES entry). Rules are immutable once released: a change of
# statement, class or behaviour mints @n+1 and bumps `version` (AD-18). Nothing is released yet, so this is version 1.
#
# Citation policy (D-24, D-27 c6): no DTap harness code is verified (SDK versions, the OpenClaw runtime and the sandbox
# images are not recorded; the DTap SDK is not available). Every rule that rests on harness or judge behaviour is class I
# with an `asserted` assumption; the D rules are deterministic functions of observed fields, declare no assumption, cite
# no code and cite the census in `evidence` (sources/dtap.md and verify/dtap.md in the research workspace). Documentary
# evidence (dataset cards, the paper) never makes a rule D.
#
# Rules added in step 3 beyond the D.16.11 table (recorded in D.16.18): dtap.no_params_empty_args, dtap.duration_no_clock,
# dtap.path_field_check, dtap.non_informative. Added by phase-10b follow-up 4 (D.16.9; the catalogue is unreleased, so still
# version 1): dtap.unknown_server_domain_match. Added by the sample-check fix b1 (2026-10-12; still version 1): five
# `reserved` detector names for the artefact catalogue (end of file).
#
# Version 2 (D-607, D-31; 2026-10-21): the scratch corpora record version 1, which ships unchanged as
# rules/archive/dtap.rules.v1.toml. Version 2 adds the rule dtap.value_redacted@1 and the issue code value_redacted
# (the profile redaction of listed account paths); every version-1 rule is unchanged.
# Version 3 (D-934, wave 2): the rule dtap.content_not_inlined@1 and the issue code content_not_inlined; version 2, which
# the wave-2 tree dtap-bench-w2 records, ships unchanged as rules/archive/dtap.rules.v2.toml.

[catalogue]
id = "dtap"
version = 3
format = "agentprov-rule-catalogue/0.1"
issue_codes = ["partial_trajectory", "empty_trajectory", "harness_failure", "judgement_on_failed_run", "pairing_ambiguous_batch", "config_join_unverified", "config_missing", "config_unparseable", "task_info_truncated", "goal_rewritten_at_eval", "user_step_not_logged", "final_response_differs", "source_truncation_marker", "judge_error", "judge_attempt_unresolved", "unjudged_attempt", "path_field_mismatch", "value_redacted", "content_not_inlined"]
subtypes = ["dtap.attack_goal", "dtap.attack_goal_at_eval"]
types = ["dtap:list_mcp_tools", "dtap:harness_error", "dtap:tool_name_list", "dtap:error_text"]

[[assumption]]
id = "dtap:PathNamesModel"
statement = "The model segment of a run's path names the model the agent called (the dataset layout convention); no structured model id exists in the file."

[[assumption]]
id = "dtap:UnknownServerIsFailedMcpCall"
statement = "A harness logs a call with server \"unknown\" (other than its own built-ins) when the MCP call failed; the tool is still the configured MCP server's tool of that name."

[[assumption]]
id = "dtap:PathNamesHarness"
statement = "The framework segment of a run's path names the agent harness that produced the log."

[[assumption]]
id = "dtap:ScriptedUser"
statement = "User steps are issued by the harness from the task, on behalf of a simulated user."

[[assumption]]
id = "dtap:HarnessLogsInOrder"
statement = "The harness appends steps to the trajectory array in the order in which they occurred."

[[assumption]]
id = "dtap:AgentStepIsModelOutput"
statement = "An agent step with a tool name or a send_message_to_user message records output of the agent model."

[[assumption]]
id = "dtap:SegmentIsOneTurn"
statement = "A maximal run of consecutive agent model-output steps was produced by one model call."

[[assumption]]
id = "dtap:ContextIsLoggedPrefix"
statement = "A model call's input contains every earlier logged step of the run."

[[assumption]]
id = "dtap:ToolStepIsExecution"
statement = "A tool step records the result of one execution of a tool by the tool runtime."

[[assumption]]
id = "dtap:ResultAfterOwnCall"
statement = "In a strictly alternating log each tool step is the result of the call immediately before it."

[[assumption]]
id = "dtap:FifoResults"
statement = "Within a batch of outstanding calls the harness logs results in call order (first in, first out)."

[[assumption]]
id = "dtap:SdkListsTools"
statement = "A List MCP Tools step pair is the SDK's own discovery request to an MCP server, not a model call."

[[assumption]]
id = "dtap:ErrorStepIsHarness"
statement = "An agent step with action error records a harness failure, not model output."

[[assumption]]
id = "dtap:LoggedToolListPerRun"
statement = "A tool list logged once per run (debug.tool_descriptions or metadata.mcp_tools) was offered on every model call of the run."

[[assumption]]
id = "dtap:TimestampIsRunEnd"
statement = "traj_info.timestamp records the end of the run."

[[assumption]]
id = "dtap:ConfigAtPinIsRunConfig"
statement = "The configuration at the pinned revision of the tasks dataset is the configuration the run used."

[[assumption]]
id = "dtap:PartialWindowIsContainment"
statement = "A payload of which only a 40-character window is found in the logged text is possibly contained in it (paraphrase or truncation)."

[[assumption]]
id = "dtap:ConfiguredPayloadApplied"
statement = "A payload configured for a run was applied to it and reached the model through its channel."

[[assumption]]
id = "dtap:JudgeIsChecker"
statement = "A judge_result.json value was produced by the DTap judge for the run of its task directory."

[[assumption]]
id = "dtap:JudgeColocated"
statement = "The judge file of a task directory with one trajectory judged that trajectory."

