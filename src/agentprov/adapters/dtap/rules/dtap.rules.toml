version = 1
class = "I"
status = "active"
statement = "The agent model is the path's model segment; free-text model mentions in the file are never used."
premises = ["origin /path"]
assumptions = ["dtap:PathNamesModel"]
verification = [{ assumption = "dtap:PathNamesModel", status = "asserted" }]
code = []
evidence = ["sources/dtap.md §3.6"]
tests = ["tests/adapters/dtap/test_rules.py::test_every_declared_rule_is_exercised"]
since = "0.1.0"

