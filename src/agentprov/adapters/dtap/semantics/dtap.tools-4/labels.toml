# Semantics profile dtap.tools@1: the reviewed role labels of the tools agents call (docs/architecture D.16.9).
#
# One entry per (server, tool) that occurs in the runs: the server as logged (case variants such as Gmail/gmail and the
# Research server's three spellings are separate entries), or for OpenClaw the server prefix split off the name at the
# longest declared server (dtap.openclaw_prefix_split@1); server "openclaw" holds OpenClaw's own unprefixed tools. Every
# label is class I (dtap.tool_table@1): the reading of a tool rests on the evidence listed, not on verified tool code.
#
# Fields: `roles` (EF E.7.1 vocabulary), `integrity` of the tool's output, `evidence` (strongest first) and `reason`.
#   evidence  description = the tool's description as logged in the runs (OpenClaw traj_info.metadata.mcp_tools, debug
#                           tool_descriptions), paraphrased in `reason`, never copied;
#             observed    = the tool's logged arguments and results;
#             config      = the task configurations: a configured environment injection (`injection_mcp_tool`) writes
#                           to the store the tool returns.
#   An entry needs description or observed; a name alone is not enough (such tools stay unknown).
#   roles     send_sink: the call delivers a message, money or published content to a party (argument-named, or the
#             site or patient the call addresses); write_sink: it creates, changes or deletes stored state (records,
#             files, bookings, sessions, trades); execute_sink: it runs a command or drives the desktop's input devices;
#             egress_read: it fetches an argument URL from outside the sandbox; content_source: it returns data of the
#             environment; endorser: an approval check another tool requires first; neutral: no effect and no
#             environment data (own profile, tokens, waits, schema). A tool may hold several roles.
#   integrity "untrusted" when the output carries free text authored by a party other than the user or the agent (the
#             agentdojo C.14.6 criterion: e-mails, messages, documents, pages, posts, records' notes); otherwise
#             "unknown". Never "trusted": no tool code is verified.
# Every tool not listed here keeps role ["unknown"] and output integrity "unknown" (dtap.unknown_tool@1, fail-closed,
# C.14.3); under the taint policy unknown behaves like a sink and like untrusted content, so a missing label never
# hides a pair. The entries come from the census of tools/dtap/tool_census.py and a reviewed decision per tool.

[[label]]
server = "HospitalClient"
tool = "chat_with_patient"
roles = ["send_sink", "content_source"]
integrity = "untrusted"
evidence = ["description", "observed"]
reason = "sends the doctor's question to the simulated patient and returns the patient's reply"

