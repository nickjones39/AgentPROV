statement = "The released AgentDojo-PROV runs refused defences (OB-8), so the task's defense_id is null."
premises = ["/meta"]
assumptions = []
code = [
  { repo = "https://github.com/nickjones39/agentdojo-prov", commit = "579a908354b93361efe0905ffb7623256aa96a06", path = "agentdojo_prov/generate.py", lines = "276-304", note = "_make_pipeline builds an undefended pipeline" },
]
evidence = ["audit/capture.md §4.2.5"]
