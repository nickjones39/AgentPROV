class = "D"
status = "active"
statement = "In transcript/v1 the attack label \"benign\" is a presentation convention for 'no attack' (the converter writes `attack_type or \"benign\"`, the generator labels benign cells \"benign\"): the importer maps it to task.attack_id null, and the views render a null attack_id as \"benign\" (C.15.3). It is never a task kind."
