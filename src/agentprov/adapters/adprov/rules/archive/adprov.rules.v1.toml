# Rule catalogue `adprov` (docs/architecture D.5.1-D.5.4, D.7; C.15.3, C.16.2; J.3.2).
#
# Data, not code: loaded through importlib.resources by agentprov.aer.rules (no __init__.py in this directory).
# Rules are immutable once released: a change of statement, class or behaviour mints @n+1 and bumps `version`
# (AD-18). Nothing is released yet (v0.1 is in development), so this file is still version 1.
#
# The rule names are those of the D.5.4 index. Rules marked "added in phase 4" are not in the D.5.4 index; they were
# needed by the transcript/v1 mapping and are reported for the next spec round (AGENTS.md section 0).
#
# Code citations point at the frozen baseline nickjones39/agentdojo-prov @ 579a908 (AGENTS.md section 1). The
# released transcripts do not record the capture-code version that wrote them, so no rule here declares a `verified`
# assumption against a framework identity recorded in the AER (AER-V34): D rules rest on the writer code of the
# frozen baseline and on observations over the frozen trees (J-M1, J-M4), I rules state their assumption.

[catalogue]
id = "adprov"
version = 1
format = "agentprov-rule-catalogue/0.1"
issue_codes = [
  "tool_call_id_mismatch",
  "content_hash_mismatch",
  "upstream_link_unresolved",
  "v1_layout_unexpected_order",
  "v1_layout_unknown_member",
  "tool_timing_overwritten",
]
subtypes = []
types = []

# ---------------------------------------------------------------------------------------------- header and actors
[[rule]]
id = "adprov.v1_benchmark_is_agentdojo"
version = 1
class = "D"
status = "active"
statement = "A transcript/v1 file records an AgentDojo run: the generator drives AgentDojo task suites and the converter converts AgentDojo run logs, so task.benchmark is agentdojo."
premises = ["/adprov_schema", "/meta/suite"]
assumptions = []
code = [
  { repo = "https://github.com/nickjones39/agentdojo-prov", commit = "579a908354b93361efe0905ffb7623256aa96a06", path = "agentdojo_prov/generate.py", lines = "132-162", note = "_trace_meta" },
  { repo = "https://github.com/nickjones39/agentdojo-prov", commit = "579a908354b93361efe0905ffb7623256aa96a06", path = "agentdojo_prov/convert_runs.py", lines = "138-172", note = "run_to_meta" },
]
evidence = ["audit/capture.md §4.2.5"]
tests = ["tests/adapters/adprov/test_mapping.py::test_header_task_coordinates"]
since = "0.1.0"

[[rule]]
id = "adprov.release_undefended"
