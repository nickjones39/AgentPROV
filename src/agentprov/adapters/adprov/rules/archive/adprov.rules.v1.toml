# ---------------------------------------------------------------------------------------------- attempts and calls
[[rule]]
id = "adprov.single_attempt_from_call_count"
version = 1
class = "D"
status = "active"
statement = "If the harness's call counter (meta.model_config.usage.n_llm_calls) equals the assistant turns held, no earlier pass made a model call: the held turns are the only pass (index 0, or the index after the discarded attempts)."
premises = ["/meta/model_config/usage/n_llm_calls", "/turns"]
assumptions = []
evidence = ["audit/capture.md §4.2.4"]
tests = ["tests/adapters/adprov/test_mapping.py::test_attempt_structure_by_call_count"]
since = "0.1.0"

[[rule]]
id = "adprov.turns_hold_last_pass"
version = 1
class = "D"
status = "active"
statement = "Added in phase 4. The turns of a transcript/v1 file are the message list of the final, scored pipeline pass of its cell (the generator builds them from the final message list; the converter from a TraceLogger log, which keeps the last pass). Without a call counter, whether earlier passes ran is not recorded, so the pass index is unknown."
premises = ["/turns"]
assumptions = []
code = [
  { repo = "https://github.com/nickjones39/agentdojo-prov", commit = "579a908354b93361efe0905ffb7623256aa96a06", path = "agentdojo_prov/observer.py", lines = "272-305", note = "get_transcript_doc: turns from the final pass" },
  { repo = "https://github.com/nickjones39/agentdojo-prov", commit = "579a908354b93361efe0905ffb7623256aa96a06", path = "agentdojo_prov/convert_runs.py", lines = "186-209", note = "convert_run: turns from run['messages']" },
]
evidence = ["audit/capture.md §4.2.4", "audit/legacy_replay.md §2.2"]
tests = ["tests/adapters/adprov/test_mapping.py::test_attempt_structure_by_call_count"]
since = "0.1.0"

[[rule]]
id = "adprov.discarded_attempts_in_order"
version = 1
class = "D"
status = "active"
statement = "Added in phase 4. discarded_attempts holds the earlier pipeline passes AgentDojo re-ran past, oldest first: entry i is pass index i and the turns are the scored pass, index len(discarded_attempts)."
premises = ["/discarded_attempts", "/meta/n_attempts"]
assumptions = []
code = [
  { repo = "https://github.com/nickjones39/agentdojo-prov", commit = "579a908354b93361efe0905ffb7623256aa96a06", path = "agentdojo_prov/transcript.py", lines = "188-260", note = "build_transcript discarded_attempts" },
]
evidence = ["audit/capture.md §4.2.4", "audit/capture.md §4.9"]
tests = ["tests/adapters/adprov/test_synthetic.py::test_synthetic_multi_pass_round_trip"]
since = "0.1.0"

[[rule]]
id = "adprov.capture_environment_record"
version = 1
class = "D"
status = "active"
statement = "Added in phase 4. meta.capture.passes[k].environment is the envstate pass record of pass k: the before/after digests (envstate canonical JSON, adprov.envstate@1), whether the state changed and the capped diff."
premises = ["/meta/capture/passes"]
assumptions = []
code = [
  { repo = "https://github.com/nickjones39/agentdojo-prov", commit = "579a908354b93361efe0905ffb7623256aa96a06", path = "agentdojo_prov/envstate.py", lines = "28-95", note = "digest, diff_states, pass_record" },
]
evidence = ["audit/capture.md §4.4"]
tests = ["tests/adapters/adprov/test_synthetic.py::test_synthetic_multi_pass_round_trip"]
since = "0.1.0"

[[rule]]
id = "adprov.assistant_turn_one_call"
version = 1
class = "D"
status = "active"
statement = "Each assistant turn is the kept output of one agent model call (as agentdojo.assistant_msg_has_one_call)."
premises = ["/turns"]
assumptions = []
evidence = ["audit/capture.md §4.2.4"]
tests = ["tests/adapters/adprov/test_mapping.py::test_c16_2_vector_is_reproduced"]
since = "0.1.0"

[[rule]]
id = "adprov.call_id_unique_match"
version = 1
class = "D"
status = "active"
statement = "A tool turn answers the unique call of the preceding assistant turn whose non-empty id equals its tool_call_id (as agentdojo.call_id_unique_match)."
premises = ["/turns"]
assumptions = []
evidence = ["landscape/trace_formats.md §6.5"]
tests = ["tests/adapters/adprov/test_mapping.py::test_tool_linking_by_id_and_position"]
since = "0.1.0"

[[rule]]
id = "adprov.tool_turn_is_one_execution"
version = 1
class = "D"
status = "active"
statement = "A tool turn records one dispatch of the call it answers (as agentdojo.tool_msg_is_one_execution)."
premises = ["/turns"]
assumptions = []
evidence = ["audit/capture.md §3"]
tests = ["tests/adapters/adprov/test_mapping.py::test_c16_2_vector_is_reproduced"]
since = "0.1.0"

[[rule]]
id = "adprov.context_is_prefix"
version = 1
class = "I"
status = "active"
statement = "Each agent call's input was exactly the preceding turns of its pass (apv:FullContextResend). INFERRED for released v1: the transcripts do not record what was sent (AD-05)."
premises = ["/turns"]
assumptions = []
evidence = ["audit/capture.md §8 D7"]
tests = ["tests/adapters/adprov/test_mapping.py::test_context_membership_is_inferred"]
since = "0.1.0"

[[rule]]
id = "adprov.finish_reason_positional"
version = 1
class = "D"
status = "active"
statement = "Finish reasons are appended once per kept reply, in call order (RT-2): entry i belongs to agent call i (lost calls first) only when the list has one entry per call; otherwise they are not aligned and the list is kept verbatim."
premises = ["/meta/model_config/finish_reasons", "/meta/model_config/usage/n_llm_calls"]
assumptions = []
evidence = ["audit/capture.md §4.1"]
tests = ["tests/adapters/adprov/test_mapping.py::test_finish_reasons_alignment"]
since = "0.1.0"

[[rule]]
id = "adprov.lost_calls_from_count"
version = 1
class = "D"
status = "active"
statement = "Calls counted by the harness (n_llm_calls) but not held as assistant turns are earlier-pass calls: they are recorded as lost model calls in a non-scored attempt, and the held turns are a later, scored pass whose index is unknown (C.7.4)."
premises = ["/meta/model_config/usage/n_llm_calls", "/meta/model_config/finish_reasons", "/turns"]
assumptions = []
evidence = ["audit/capture.md §4.2.4"]
tests = ["tests/adapters/adprov/test_mapping.py::test_attempt_structure_by_call_count"]
since = "0.1.0"

[[rule]]
id = "adprov.release_null_as_empty"
version = 1
class = "D"
status = "active"
statement = "Before 2026-10-04 the generator stored a null assistant reply as \"\": an empty text in a released transcript without the post-June fields is ambiguous (null or empty)."
premises = ["/turns"]
assumptions = []
code = [
  { repo = "https://github.com/nickjones39/agentdojo-prov", commit = "579a908354b93361efe0905ffb7623256aa96a06", path = "agentdojo_prov/transcript.py", lines = "84", note = "the null-preserving branch added 2026-10-04 (97df4b5)" },
]
evidence = ["audit/capture.md §7 item 2"]
tests = ["tests/adapters/adprov/test_mapping.py::test_empty_texts_are_ambiguous"]
since = "0.1.0"

[[rule]]
id = "adprov.empty_assistant_text_ambiguous"
version = 1
class = "D"
status = "active"
statement = "Added in phase 4. An empty assistant text that adprov.release_null_as_empty does not cover (converted transcripts, and released ones written from 2026-10-04 on, which keep a null reply as null) is the producer's content \"\": whether the model returned an empty text block or no text is not recorded, so the empty text is declared ambiguous (C.7.1, C.19 item 4)."
premises = ["/turns"]
assumptions = []
evidence = ["audit/legacy_replay.md §2.4"]
tests = ["tests/adapters/adprov/test_mapping.py::test_empty_texts_are_ambiguous"]
since = "0.1.0"

[[rule]]
id = "adprov.additional_user_turn_unattributed"
version = 1
class = "I"
status = "active"
statement = "Added in phase 4. A user turn after the first is attributed to the simulated user by role only: defence elements (tool_filter, repeat_user_prompt) also write user-role turns, and the v1 importer does not identify them (D.6.6 'other later user'; J.4.4)."
premises = ["/turns"]
assumptions = []
evidence = ["sources/agentdojo.md §3.5"]
tests = ["tests/adapters/adprov/test_mapping.py::test_additional_user_turns_are_unattributed"]
since = "0.1.0"

[[rule]]
id = "adprov.reasoning_log_alignment"
version = 1
class = "I"
status = "active"
statement = "Reasoning text on an assistant turn was attached by position from the LLM element's side log (TR-3) or copied from native thinking blocks; which of the two is undecidable from the transcript."
premises = ["/turns"]
assumptions = []
evidence = ["audit/capture.md §4.3"]
tests = ["tests/adapters/adprov/test_synthetic.py::test_synthetic_reasoning_and_refusal_round_trip"]
since = "0.1.0"

[[rule]]
id = "adprov.refusal_log_alignment"
version = 1
class = "I"
status = "active"
statement = "Added in phase 4. Refusal text on an assistant turn was attached by position from the LLM element's per-call refusal log (TR-4), only when the log had one entry per assistant turn."
premises = ["/turns"]
assumptions = []
code = [
  { repo = "https://github.com/nickjones39/agentdojo-prov", commit = "579a908354b93361efe0905ffb7623256aa96a06", path = "agentdojo_prov/transcript.py", lines = "117-122", note = "_build_turns refusals" },
]
evidence = ["audit/capture.md §4.3"]
tests = ["tests/adapters/adprov/test_synthetic.py::test_synthetic_reasoning_and_refusal_round_trip"]
since = "0.1.0"

[[rule]]
id = "adprov.timing_keyed_by_call_id"
version = 1
class = "I"
status = "active"
statement = "Added in phase 4. When a tool_call_id repeats in a trace and its tool turns hold the same timing pair, the capture keyed per-call timing by id (one pair per id): only the last of those turns holds its own timing; the earlier turns' timing was overwritten."
premises = ["/turns"]
assumptions = []
code = [
  { repo = "https://github.com/nickjones39/agentdojo-prov", commit = "579a908354b93361efe0905ffb7623256aa96a06", path = "agentdojo_prov/transcript.py", lines = "131-142", note = "_build_turns: a single pair per id" },
]
evidence = ["baseline/golden/golden_index.json R07"]
tests = ["tests/adapters/adprov/test_mapping.py::test_duplicated_call_id_timing_is_overwritten"]
since = "0.1.0"

