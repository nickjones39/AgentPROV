since = "0.1.0"

[[rule]]
id = "adprov.v1_writer_layout"
version = 1
class = "D"
status = "active"
statement = "Added in phase 4. transcript/v1 files were written by the AgentDojo-PROV writer: json.dumps(doc, indent=2) with the J.3.2 member order of every object, and content_sha256 = \"sha256:\" + SHA-256 of the UTF-8 content. An order the layout does not allow, an unknown member or a content digest that differs is a seal issue."
premises = ["/"]
assumptions = []
code = [
  { repo = "https://github.com/nickjones39/agentdojo-prov", commit = "579a908354b93361efe0905ffb7623256aa96a06", path = "agentdojo_prov/transcript.py", lines = "23-105", note = "_sha256, _serialize_function_call, message_to_turn" },
