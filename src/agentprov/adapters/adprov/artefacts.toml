scope = { profiles = ["adprov-v1"], parts = ["release"] }
cause = "upstream_harness"
detector = { rule = "adprov.single_attempt_from_call_count@1", class = "I" }
handling = { class = "CR", rule = "adprov.single_attempt_from_call_count_unverified@1" }
