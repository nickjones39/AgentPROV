[[artefact]]
id = "adprov.art.rerun_passes_lost"
title = "Earlier passes of a silent re-run are lost (A1)"
description = "AgentDojo re-runs a pass up to three times when the final reply is empty and the transcript holds only the last pass. Where the harness call counter exceeds the held assistant turns, the earlier calls are emitted as lost model calls in a non-scored attempt; their content is unknown."
scope = { profiles = ["adprov-v1"], parts = ["release"] }
cause = "upstream_harness"
detector = { rule = "adprov.lost_calls_from_count@1", class = "D" }
handling = { class = "CR", rule = "adprov.lost_calls_from_count@1" }
expected = [
  { snapshot = "adprov-v1/release@579a908", count = 153, basis = "traces whose usage.n_llm_calls exceeds the assistant turns held (I.1.2 C07; EF F.2 item 5)", unit = "traces", status = "unverified" },
]
manuscript = true
refs = ["docs/architecture/D_adapters.md D.10.9 A1", "docs/architecture/C_data_model.md C.7.4", "audit/capture.md section 4.2.4"]

