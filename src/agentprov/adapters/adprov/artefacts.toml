# Artefact catalogue `adprov` (docs/architecture D.15.2, D.15.6; DECISIONS D-12): the AgentDojo-PROV transcript/v1 trees.
#
# Data, not code: loaded by agentprov.artefacts through importlib.resources (this directory's catalogue is found without
# importing any adapter module). It covers both trees of profile `adprov-v1`: the generated tree (registry part
# `release`, the 13 classes A1-A13 of D.10.9, found in the manuscript's corpus of 17,664 traces) and the converted tree
# (part `converted-legacy`, the compat oracle; the baseline converter's artefacts). `adprov.art.reported_calls_exceed`
# was found on 2026-10-08 by the full-scope gate run; `adprov.art.payload_not_reaching_agent` (the SEM-reading detector
# of D.15.8 item 11) on 2026-10-29 by the stats run over the sealed round-1 corpus, where it was unclassified.
#
# Handling follows D.15.1: evidence is never edited. CR states the fact truthfully in the engine's model, NR counts a loss
# that was never recorded, FO flags what cannot be corrected. No entry uses DR or RJ: this family reads recorded
# transcripts and reconstructs nothing beyond the rules of its rule catalogue.
#
# `expected` counts are the manuscript and audit figures quoted by the specification. Each is `unverified` until the
# first full-snapshot import has confirmed it (D.15.6, phase 13); none is a gate, and a mismatch is reported, never hidden.
# Where the specification gives no count, no `expected` row is written: nothing here is estimated.
#
# An entry accounts for a safety-net finding (agentprov.artefacts) when its `detector.rule` is the generic detector, or is
# the mapper rule that the finding's field-scoped rule references cite, or the finding is one of its `claims`, or it carries
# one of the entry's `recorded_as.issues` codes. Anything else the net finds is reported as artefact.unclassified.*.
#
# Rules named here exist in the `adprov`, `agentdojo` and `aer` rule catalogues (tests/unit/artefacts checks it). Code and
# audit locations behind each entry are in `refs`; the baseline is nickjones39/agentdojo-prov @ 579a908.

version = 1
family = "adprov"
namespaces = ["adprov"]

