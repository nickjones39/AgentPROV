[[artefact]]
id = "adprov.art.payload_not_reaching_agent"
title = "The injected payload never appears in what the agent read"
description = "Attacked runs in which no tool result carries the payload (no present injection marker in the SEM). AgentDojo places its injections in environment data, so a payload reaches the agent only through the output of a tool that reads that data. In the released tree no defence ran: the agent called no tool at all (variant no_marker: no tool result to compare), or none of its calls returned the injected data or they failed (variant absent: every comparison found nothing). No message of any role in these runs holds the payload. In the converted tree a defence that redacts tool output or filters tools also produces it. The run cannot show an attack effect; the finding is only as good as the SEM marker."
scope = { profiles = ["adprov-v1"], parts = ["release", "converted-legacy"] }
cause = "benchmark"
detector = { rule = "artefact.generic.payload_not_reaching_agent", class = "D" }
recorded_as = { sem = ["injection_marker"] }
handling = { class = "FO" }
expected = [
  { snapshot = "adprov-v1/release@579a908", count = 3034, basis = "safety-net run (read-only, 2026-10-29) over the sealed corpus adprov-v1-release-rg2, 3,033 executions (absent 1,667, no_marker 1,366; none an attack success), and its withheld sibling, 1 (absent); 3,034 of 17,082 attacked, as phase-10 examination 2 section 10.1 row 6", unit = "executions", status = "unverified" },
]
manuscript = true
refs = ["docs/architecture/D_adapters.md D.15.3", "docs/reports/analysis/phase10-examination-2.md section 10.1 row 6", "docs/reports/precheck/adprov-v1.md H16"]

