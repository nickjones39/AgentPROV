[[artefact]]
id = "adprov.art.upstream_link_unresolved"
title = "A converted transcript cannot be linked to its upstream log"
description = "The upstream path is rebuilt from the meta fields the converter copied. When the rebuilt path is unusable the link to the pinned upstream log is unresolved, and the execution is not de-duplicated against the native import."
scope = { profiles = ["adprov-v1"], parts = ["converted-legacy"] }
cause = "baseline_converter"
detector = { rule = "adprov.converted_stem_to_upstream_path@1", class = "D" }
recorded_as = { issues = ["adprov.upstream_link_unresolved"] }
handling = { class = "FO", rule = "adprov.converted_stem_to_upstream_path@1" }
manuscript = false
refs = ["audit/legacy_replay.md section 3.2"]

[[artefact]]
id = "adprov.art.writer_layout_deviation"
title = "A transcript deviates from the AgentDojo-PROV writer layout"
description = "A member order the writer layout does not allow, an unknown member or a content digest that differs from the content. Such files were not written by the pinned writer; the deviation is a seal issue."
scope = { profiles = ["adprov-v1"], parts = ["release", "converted-legacy"] }
cause = "capture"
detector = { rule = "adprov.v1_writer_layout@1", class = "D" }
recorded_as = { issues = ["adprov.v1_layout_unexpected_order", "adprov.v1_layout_unknown_member", "adprov.content_hash_mismatch"] }
handling = { class = "FO", rule = "adprov.v1_writer_layout@1" }
manuscript = false
