description = "The baseline builder asserted context-visibility used edges as PROV. The context of each call is inferred from the message prefix (class I), which is false for tool_filter, repeat_user_prompt and PI-detector pipelines, so it belongs in the inference bundle."
scope = { profiles = ["adprov-v1"], parts = ["release", "converted-legacy"] }
cause = "baseline_converter"
detector = { rule = "adprov.context_is_prefix@1", class = "I" }
handling = { class = "CR", rule = "adprov.context_is_prefix@1" }
manuscript = true
refs = ["docs/architecture/D_adapters.md D.15.5", "docs/architecture/C_data_model.md C.3.5"]

