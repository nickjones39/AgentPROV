class = "I"
status = "active"
statement = "A call's timestamp is when the adapter built the call record, immediately before dispatch: it is kept verbatim in t.raw.start and the typed start is declared ambiguous (an I-class typed time would become an inference-bundle entity the tier-4 validators refuse, D.16.18 correction 1)."
premises = ["/trace/steps/*/tool_calls/*/timestamp"]
assumptions = ["agentops:TimestampAtDispatch"]
verification = [{ assumption = "agentops:TimestampAtDispatch", status = "asserted" }]
code = []
evidence = ["snapshot:src/agentops_bench/schema.py ToolCall.timestamp (default_factory _utcnow)"]
tests = ["tests/adapters/agentops/test_mapper.py::test_time_model"]
since = "0.1.0"

[[rule]]
id = "agentops.duration_no_clock"
version = 1
class = "D"
status = "active"
statement = "wall_time_seconds and latency_ms are kept verbatim in ext.agentops and /t/dur_s is declared ambiguous: their clock rests on unverified code and an injected failure's latency is a constant; no start or end time is computed from them."
premises = ["/trace/wall_time_seconds", "/trace/steps/*/tool_results/*/latency_ms"]
assumptions = []
code = []
evidence = ["docs/reports/phase10i/README.md §3.3 (failure latencies 30000, 250, 100, 50, 10)"]
tests = ["tests/adapters/agentops/test_mapper.py::test_time_model"]
since = "0.1.0"

[[rule]]
id = "agentops.fault_injection_unverified"
version = 1
class = "I"
status = "active"
statement = "A result with injected_failure was fabricated by the server's failure injector without dispatching the call: a harness decision (verdict other, subtype agentops.fault_injection) on the call generated the result message, there is no tool execution and the call is unexecuted."
premises = ["/trace/steps/*/tool_results/*/injected_failure"]
assumptions = ["agentops:FaultFabricated"]
verification = [{ assumption = "agentops:FaultFabricated", status = "asserted" }]
code = []
evidence = ["snapshot:src/agentops_bench/tools.py InstrumentedToolServer.handle_call (failure injection returns before dispatch)", "snapshot:src/agentops_bench/injection.py FAILURE_MODES"]
tests = ["tests/adapters/agentops/test_mapper.py::test_injected_failure_is_a_decision_without_execution"]
since = "0.1.0"

