# Rule catalogue `agentops` (docs/architecture D.18.9; D.5.1-D.5.2; C.6.4). AgentOps-Bench, phase 10i.
#
# Data, not code: loaded through importlib.resources by agentprov.aer.rules (no __init__.py in this directory); the home
# is the default `agentprov.adapters.agentops`. Rules are immutable once released: a change of statement, class or
# behaviour mints @n+1 and bumps `version` (AD-18). Version 2 (D-31 bump, regeneration item 37, bug pass BF-26) adds
# the issue code payload_outside_adversarial, and D-608 (regen item 137) the rule agentops.value_redacted@1 and its issue
# code value_redacted; version 1 ships under archive/ with the bytes the stored corpora recorded.
#
# Citation policy (D-24, D-27 c6, D-193): the deposit's code snapshot (Zenodo 19875693, kunwarshivam/agentops-bench-v1.0.zip,
# directory kunwarshivam-agentops-bench-9153772) names its commit only by a 7-hex prefix, nothing in the runs names the
# code that produced them, and the CHANGELOG and launcher of the snapshot disagree with the pilot's layout. So no rule can
# cite producing code (`code` needs a full commit), and every rule that rests on harness or scorer behaviour is class I
# with an `asserted` assumption, as DTap's are (D.16.11). The snapshot paths are documentary evidence in `evidence`
# ("snapshot:<path> <symbol>"), never verification. The D rules are deterministic functions of observed bytes or of
# pinned package data; they declare no assumption, cite no code and cite the census (docs/reports/phase10i/).

[catalogue]
id = "agentops"
version = 2
format = "agentprov-rule-catalogue/0.1"
issue_codes = ["empty_trace", "run_error", "iteration_limit", "task_join_missing", "user_message_not_logged", "unlisted_tool_name", "dispatch_error_result", "final_output_differs", "label_field_mismatch", "payload_suffix_mismatch", "failure_with_payload", "repeated_tool_names", "payload_outside_adversarial", "value_redacted"]
subtypes = ["agentops.fault_injection"]
types = []

[[assumption]]
id = "agentops:AgentIdNamesModel"
statement = "agent_id is the adapter's '<route>/<model>' string (anthropic/, openai/ or openrouter/ followed by the model the adapter requested)."

[[assumption]]
id = "agentops:DepositHarness"
statement = "The runs were produced by the AgentOps-Bench harness of the deposit (agent adapters, instrumented tool server, scoring), whose producing code identity is not recorded."

[[assumption]]
id = "agentops:StepIsOneResponse"
statement = "One step records one model response: its usage, its text content and its tool-use blocks."

[[assumption]]
id = "agentops:ContextIsLoggedPrefix"
statement = "A model call's input contains every earlier logged message of the run (the system prompt and the task prompt are not logged)."

[[assumption]]
id = "agentops:StepsAppendOrdered"
statement = "The harness appends steps, calls and results in the order in which they occurred."

[[assumption]]
id = "agentops:TextBeforeCalls"
statement = "Within one response the text content is recorded as one string; its position among the tool-use blocks is not recorded."

[[assumption]]
id = "agentops:ResultAfterOwnCall"
statement = "Within a step the adapter appends call i and then, after dispatching it, result i."

[[assumption]]
id = "agentops:ServerExecutesCall"
statement = "A result without injected_failure was produced by the instrumented tool server dispatching the call, on behalf of the agent."

[[assumption]]
id = "agentops:TimestampAtDispatch"
statement = "A call's timestamp is the pydantic default set when the adapter builds the call record, immediately before dispatch."

[[assumption]]
id = "agentops:FaultFabricated"
statement = "A result with injected_failure is fabricated by the tool server's failure injector; the tool is not dispatched."

[[assumption]]
id = "agentops:PayloadAppended"
statement = "A result with injected_payload is the dispatched tool's output with the payload appended by the server's injector."

[[assumption]]
id = "agentops:InjectorIsAttacker"
statement = "The injection catalogue of the harness plays the attacker: its payloads are attacker-supplied material."

[[assumption]]
id = "agentops:AdversarialArmsInjection"
statement = "Only the adversarial condition arms the prompt-injection catalogue; noisy and clean do not."

[[assumption]]
id = "agentops:PromptComposition"
statement = "The adapters send the task description, followed by a context section when the task has one."

[[assumption]]
id = "agentops:IterationCap"
statement = "A run that neither completed nor recorded an error stopped at the adapters' iteration cap."

[[assumption]]
id = "agentops:ScoresByScorer"
statement = "The per-run scores were computed by the harness's scoring module for the run in the same file."

[[assumption]]
id = "agentops:SafetyDefault"
statement = "The safety scorer returns constants without evaluating when a run has no step or no injected payload."

