# D-608 (catalogue version 2, folded into the D-31 bump of regen items 34-37; regen item 137): tool-output redaction.
[[rule]]
id = "agentops.value_redacted"
version = 1
class = "D"
status = "active"
statement = "A string or object key of a tool message's value (a part's text or value, at any depth) that a profile [[family.agentops.redact]] rule matches is rewritten by AgentPROV: each match becomes the rule's label, literal text with {span12} (12 hex digits of SHA-256 over the profile id, NUL and the span) and {leaf}. Only tool output is in scope (D-604); model text, call arguments, fixtures, judgements and the run error are never touched, and a recorded injected payload at the end of a result stays verbatim. The pointer's locator stays on the raw field, whose bytes are unchanged; ext.agentops.redacted names the rule; the original and its full digest are never recorded. A deterministic transformation specified by the profile, independent of the producing code."
premises = ["/trace/steps/*/tool_results/*/result"]
assumptions = []
code = []
evidence = ["DECISIONS D-608", "DECISIONS D-604", "DECISIONS D-476", "docs/reports/precheck/agentops-bench.md PC-agentops-bench-01"]
tests = ["tests/adapters/agentops/test_redact.py::test_tool_output_is_redacted_and_model_text_is_not"]
since = "0.1.0"
