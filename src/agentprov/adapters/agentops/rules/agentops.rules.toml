class = "D"
status = "active"
statement = "The member label's facets (agent directory, model directory, condition, domain, task number, run) are compared with the in-record agent_id, condition, task_id and run_number; a difference is recorded (agentops.label_field_mismatch) and never corrected."
premises = ["origin /label", "/agent_id", "/condition", "/task_id", "/run_number"]
assumptions = []
code = []
evidence = ["docs/reports/phase10i/README.md §3.2 (7,202/7,202 agree)"]
tests = ["tests/adapters/agentops/test_mapper.py::test_label_and_record_fields_agree"]
since = "0.1.0"

