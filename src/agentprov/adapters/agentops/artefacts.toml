# Artefact catalogue `agentops` (docs/architecture D.18.11, D.15.2; DECISIONS D-199). Data, not code.
#
# Every source-data problem of the AgentOps-Bench pilot found by the phase-10i census, with the rule that detects it,
# how it is recorded and its handling class (D.15.1). The `expected` counts are the census's for the pinned snapshot,
# counted on the in-scope part (D-143) unless the unit says otherwise; they stay `unverified` until a full import of the
# part confirms them (D.15.6): a regression expectation, never a gate.
#
# Claims are specific (as for dtap, sample check §9.1 b1): an entry claims a safety-net finding only through a rule,
# `claims` item or issue code of its own case. Cases no AER field read by the net carries (the scope selection, non-run
# members, the superseded copies, the tar container) name a `reserved` detector rule of the agentops catalogue, so they
# claim nothing; the account path in tool output is redacted and claimed by its issue (D-608). The version stays 1: nothing is released.

version = 1
family = "agentops"
namespaces = ["agentops"]

[[artefact]]
id = "agentops.art.out_of_scope_runs"
title = "Runs outside the in-scope part"
description = "The clean and noisy runs of the code, data_analysis, research and tool_use domains are outside the corpus scope (D-143): excluded by the profile's globs and registered select.out_of_scope, never mapped or dropped silently."
scope = { sources = ["agentops-bench"], profiles = ["agentops-bench-pilot"], parts = ["pilot-v1-seeded"] }
cause = "benchmark"
detector = { rule = "agentops.scope_selection@1", class = "D" }
handling = { class = "FO", rule = "agentops.scope_selection@1" }
expected = [{ snapshot = "agentops-bench:pilot-v1-seeded", count = 3842, basis = "phase-10i census: 3,840 cells plus the 2 superseded copies", unit = "files", status = "unverified" }]
manuscript = true
refs = ["DECISIONS D-143, D-191", "docs/reports/phase10i/README.md §3.2"]

[[artefact]]
id = "agentops.art.non_execution_members"
