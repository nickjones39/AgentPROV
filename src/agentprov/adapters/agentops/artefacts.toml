[[artefact]]
id = "agentops.art.account_path_tool_output"
title = "Third-party account path in tool output (security)"
description = "Security finding (pre-check PC-agentops-bench-01, CC-11): run_python output (result text, stdout, stderr) names a third-party macOS workstation account in a /Users/<account>/ path; it is not the operator's (D-199's label was wrong). D-608 (principle D-604; amends D-199 and D-186 (c) for this source): the AER replaces the /Users/<account> prefix by a salted label in tool output only (agentops.value_redacted, info issue), model text stays verbatim, and the raw objects that hold the path (13 selected run objects and the tar, which also holds 29 unselected members with it) are withheld at object scope (personal_data); no execution is withheld. Never printed in reports and never in a fixture."
scope = { sources = ["agentops-bench"], profiles = ["agentops-bench-pilot"], parts = ["pilot-v1-seeded"] }
cause = "upstream_harness"
detector = { rule = "agentops.value_redacted@1", class = "D" }
recorded_as = { issues = ["agentops.value_redacted"] }
handling = { class = "CR", rule = "agentops.value_redacted@1" }
expected = [{ snapshot = "agentops-bench:pilot-v1-seeded", count = 13, basis = "D-608 census: 13 in-scope run files (42 raw files in all: 36 run files and 6 rollups)", unit = "executions", status = "unverified" }]
manuscript = false
refs = ["DECISIONS D-608", "DECISIONS D-604", "DECISIONS D-199", "docs/reports/precheck/agentops-bench.md §7", "docs/reports/phase10i/README.md §3.3"]

