class = "D"
status = "active"
statement = "The member label's facets (scaffold, model, mutation) are compared with the sibling verdict's agent, model and mutation_id; a difference is recorded (geminicli.label_field_mismatch) and never corrected."
premises = ["origin /label", "verdict /agent", "verdict /model", "verdict /mutation_id"]
assumptions = []
code = []
evidence = ["docs/reports/phase10o/README.md §5 (2,500/2,500 agree)"]
tests = ["tests/adapters/geminicli/test_mapper.py::test_header_task_and_facets", "tests/adapters/geminicli/test_mapper.py::test_label_field_mismatch_is_recorded"]
since = "0.1.0"

