# Rule catalogue `geminicli` (docs/architecture D.23.9; D.5.1-D.5.2; C.6.4). gemini-cli streams of Zenodo 20404563, phase 10o.
#
# Data, not code: loaded through importlib.resources by agentprov.aer.rules (no __init__.py in this directory); the home
# is the default `agentprov.adapters.geminicli`. Rules are immutable once released: a change of statement, class or
# behaviour mints @n+1 and bumps `version` (AD-18). Nothing is released yet, so this is version 1.
#
# Citation policy (D-334, user-approved 2026-10-13): the deposit names no gemini-cli version and its harness code was not
# fetched, so no rule cites producing code (`code` is empty everywhere) and every reading of gemini-cli or harness
# behaviour is class I with an `asserted` assumption, its name ending in `_unverified` where a D twin could exist once the
# code is verified (as D-172). The D rules are deterministic functions of observed bytes; they declare no assumption and
# cite the census (docs/reports/phase10o/).

[catalogue]
id = "geminicli"
version = 1
format = "agentprov-rule-catalogue/0.1"
issue_codes = ["label_field_mismatch", "sidecar_missing", "sidecar_unparseable", "cli_model_alias", "cli_error_result", "no_result_event", "events_after_result", "subagent_internals_unobserved", "cli_notice", "unmapped_event", "manifest_differs", "verdict_meta_disagree"]
subtypes = []
types = ["geminicli:cli_notice", "geminicli:notice_text", "geminicli:unmapped_event", "geminicli:event_payload"]

[[assumption]]
id = "geminicli:DepositHarness"
statement = "The rollouts were produced by the deposit's harness (a container entrypoint running gemini-cli in YOLO mode, then the deposit's detector); the producing code identity is not recorded in the deposit."

[[assumption]]
id = "geminicli:ToolIdNamesCall"
statement = "A tool_result event's tool_id is the tool_id of the tool_use event whose call it answers; gemini-cli writes both from one scheduled call."

[[assumption]]
id = "geminicli:DeltasComposeMessage"
statement = "Consecutive assistant message events with delta true are chunks of one streamed text, in order; their concatenation is the text the model produced."

[[assumption]]
id = "geminicli:BlockIsOneTurn"
statement = "The assistant deltas and tool_use events between two batches of tool results come from one model turn of the agent, kept by the CLI; the requests the CLI sent, its retries and its discarded responses are not logged."

[[assumption]]
id = "geminicli:ContextIsLoggedPrefix"
statement = "A model turn's input contains every earlier logged message of the run (the CLI's system prompt and tool declarations are not logged)."

[[assumption]]
id = "geminicli:StreamOrder"
statement = "gemini-cli writes the events in the order in which they occur."

[[assumption]]
id = "geminicli:TimestampAtEmission"
statement = "An event's timestamp is the CLI's UTC clock when it emitted the event, not the start or end of what the event reports."

[[assumption]]
id = "geminicli:PromptByHarness"
statement = "The user message is the harness's task prompt passed to the CLI; the harness acts as the principal on whose behalf the agent works."

[[assumption]]
id = "geminicli:CellModelRouted"
statement = "The harness routes the CLI's model requests through a LiteLLM proxy or sidecar to the model its verdict.json names; the stream's init.model is the CLI's configured model name, not the served model."

[[assumption]]
id = "geminicli:ResultIsExecution"
statement = "A tool_result reports that the CLI's tool scheduler ran the call on behalf of the agent (YOLO mode: no approval step)."

[[assumption]]
id = "geminicli:Exit143IsTermination"
statement = "A gemini_meta.json exit_code of 143 on a stream without a result event means the CLI was terminated (SIGTERM, the harness's time limit) before it finished."

[[assumption]]
id = "geminicli:DetectorRecorded"
statement = "verdict.json's elicited and n_misaligned are the deposit detector's result for the rollout of the same directory."

[[assumption]]
id = "geminicli:NoticeIsCli"
statement = "An error event (severity warning) is a notice the CLI wrote, not agent output and not a tool result."

[[assumption]]
id = "geminicli:SubagentHidden"
statement = "codebase_investigator runs a gemini-cli sub-agent whose own model and tool calls the stream does not log."

[[assumption]]
id = "geminicli:WorkspaceSeed"
statement = "fs_before.json is the harness's snapshot of the task workspace given to the agent before the CLI started."

[[assumption]]
id = "geminicli:UnmappedEventIsCli"
statement = "An event of a type outside the v1 vocabulary was written by the CLI as a harness step."

[[assumption]]
id = "geminicli:ToolTable"
statement = "The gemini-cli built-in tools act as their names and logged parameters state (shell execution, file reads and writes, directory listing, search, web search, a sub-agent)."

[[assumption]]
id = "geminicli:PromptPrincipal"
statement = "The harness's task prompt speaks for the principal; the workspace files and every tool output may carry the benchmark's pressure or third-party content."

[[assumption]]
id = "geminicli:ElicitedMeaning"
statement = "elicited true means the deposit's detector found the misaligned behaviour its mutation targets in the rollout's final workspace."

[[rule]]
