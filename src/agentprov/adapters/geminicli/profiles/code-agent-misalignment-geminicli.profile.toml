# Source profile `code-agent-misalignment-geminicli`: the gemini_cli part of the code-agent agentic-misalignment rollout
# bundle (Zenodo 20404563; docs/architecture D.23; DECISIONS D-330..D-337; docs/reports/phase10o/).
#
# Data, not code. No status lives here: the registry is the only status store (R-38, R-45). Any byte change bumps
# `version` (AD-18, D-31): version 2 adds the D-609 rules of [withhold]; version 1, which scratch corpora record, ships
# unchanged under profiles/archive/. The [family.geminicli] table is checked against
# ../family.schema.json (closed schema, D.4.1). Every count below is from the phase-10o census of the pinned archive,
# read in memory (docs/reports/phase10o/README.md).
#
# Scope (D-143, D-331): the corpus counts the 2,182 non-empty gemini_cli streams of 10,000 rollouts. The claude_code,
# codex_cli and openhands cells (7,500 rollouts) are not readable faithfully: each rollout is registered
# `select.out_of_scope` through its verdict.json. The 175 empty streams and the 143 gemini_cli rollouts without a stream
# are registered `select.not_execution_artefact` (details geminicli.empty_stream, geminicli.no_stream). Nothing is
# excluded for its outcome.
#
# Input: the rollouts are members of a top-level zstd tar, read as an archive input (D-200, D-240; RI-3). The profile's
# `include` selects every gemini_cli member (the streams and their siblings), the other cells' verdicts and the
# deposit's top-level files, so the `expand` stage stores exactly what the reader and the register need.

[profile]
id = "code-agent-misalignment-geminicli"
version = 2
format = "agentprov-source-profile/0.1"
source_id = "code-agent-misalignment-geminicli"
family = "geminicli"
parts = ["results-raw"]
title = "Code-agent agentic misalignment, gemini_cli streams: 5 models x 500 mutations (Zenodo 20404563), structured part"
evidence = ["docs/reports/systematic-search/candidates/phase10e-candidates.md §3.13", "docs/reports/phase10o/README.md"]

[source]
canonical_repo = "https://doi.org/10.5281/zenodo.20404563"
paper = "RESULTS_raw: Raw rollout bundle for code-agent agentic misalignment benchmark (10,000 rollouts, 20 cells), Zenodo 10.5281/zenodo.20404563 (concept 10.5281/zenodo.20404562); supplement to github.com/warmjademe/code_agent_agentic_misalignment"
package = { name = "gemini-cli", requirement = "not recorded in the deposit (D-334)", version_identifies_code = false }

# 63,384 regular members under RESULTS_build/: 20 cells x 500 rollout directories, plus README.md, cell_summary.csv and
# manifest.csv. The md5 equals the record's checksum; the sha256 equals the record's RESULTS_raw.tar.zst.sha256.
[[source.pins]]
role = "runs"
part = "results-raw"
primary = true
kind = "zenodo"
doi = "10.5281/zenodo.20404563"
file = "RESULTS_raw.tar.zst"
sha256 = "f7186010db235cbff10f40c3c2d98208328c6836792973621382b981d0acc3cf"
md5 = "c8f46f1eae55897fe55955f368d5da77"
size = 207950011
date = "2026-05-27"
note = "fetched 2026-10-12 (phase 10e, the user's yes); read in place by phase 10o (no new retrieval)"

[licence]
spdx = "CC-BY-4.0"
holders = ["the record's creators (Zenodo 20404563)"]
data_licence = "CC-BY-4.0"
policy = "include"
basis = "CC-BY-4.0 on the Zenodo record; the code repository it supplements is MIT (not imported)"
attribution = [
  "RESULTS_raw, Zenodo 10.5281/zenodo.20404563 (CC-BY-4.0)",
  "github.com/warmjademe/code_agent_agentic_misalignment @ 1dec4f17 (MIT; cited, not imported)",
]
unassessed = ["model-provider terms on redistributing model outputs", "web search results replayed inside tool outputs"]

[lineage]
built_on = []
vendored = []
duplicates = []
cited_by = []
content_dedup = "never"

[import]
dialect = "geminicli.stream_json"
mapper = "geminicli.stream_json"
variants = ["v1"]
rules = { aer = 1, geminicli = 1 }
include = [
  "RESULTS_build/cells/gemini_cli__*/*/*",
  "RESULTS_build/cells/claude_code__*/*/verdict.json",
  "RESULTS_build/cells/codex_cli__*/*/verdict.json",
  "RESULTS_build/cells/openhands__*/*/verdict.json",
  "RESULTS_build/manifest.csv",
  "RESULTS_build/README.md",
  "RESULTS_build/cell_summary.csv",
]
exclude = [
  { glob = "RESULTS_build/cells/claude_code__*/*/verdict.json", code = "select.out_of_scope", note = "D-143: claude_code transcripts not readable faithfully (EX-FMT); one row per rollout" },
  { glob = "RESULTS_build/cells/codex_cli__*/*/verdict.json", code = "select.out_of_scope", note = "D-143: codex_cli plain-text streams not readable faithfully (EX-FMT); one row per rollout" },
  { glob = "RESULTS_build/cells/openhands__*/*/verdict.json", code = "select.out_of_scope", note = "D-143: openhands transcript tails not readable faithfully (EX-FMT); one row per rollout" },
  { glob = "RESULTS_build/README.md", code = "select.not_execution_artefact", note = "the deposit's README" },
  { glob = "RESULTS_build/cell_summary.csv", code = "select.not_execution_artefact", note = "per-cell rates of the detector" },
]
auxiliary = ["verdict.json", "gemini_meta.json", "fs_before.json", "fs_after.json", "final_diff.patch", "events.jsonl", "gemini_stderr.log", "runner_stdout.log", "runner_stderr.log", "atoms.flat", "RESULTS_build/manifest.csv"]
layout = "RESULTS_build/cells/{scaffold}__{model}/{skeleton}__{variant}/{file}"

# D-336 (user-approved 2026-10-13): one tool output holds a value of the Google API key shape, also found in three
# claude_code files and in no task workspace: most likely a harness credential the agent printed. The rule withholds every
# stored object and derived file that holds such a value, and the executions citing it (1 in the census).
[withhold]
reason = "secret"
public_note = "a credential-shaped value printed by an agent in a tool output; value never recorded"
scan_rules = ["gcp-api-key"]

[[withhold.rules]]
id = "google-api-key-shape"
pattern = "AIza[0-9A-Za-z_\\-]{35}"
scope = "executions"

# D-609 (user decision 2026-10-21; pre-check PC-code-agent-misalignment-01, CC-11): the harness's `diff -r` header lines
# name a workstation account path (one third-party account, then `jss_agent_work`) in 272 `final_diff.patch` objects, and
# the deposit README names the same account's home once. Both are withheld at object level (reason personal_data,
# digests kept); no AER, SEM or PROV statement holds the path, so no execution is withheld. The patterns name the path by
# its structure, never the account: the census matched exactly those 272 patches and that README, in the stored objects,
# the derived files (0) and every member of the pinned tar decoded (docs/architecture DECISIONS D-609).
[[withhold.rules]]
id = "harness-account-path"
pattern = "/home/[a-z0-9_-]{1,32}/jss_agent_work"
scope = "object"
reason = "personal_data"
public_note = "a harness diff header naming a workstation account path; the patch is withheld, no execution is (D-609)"

[[withhold.rules]]
id = "deposit-readme-account-path"
pattern = "/home/[a-z0-9_-]{1,32}/[A-Z][a-z]{3}[A-Z][a-z]/"
scope = "object"
reason = "personal_data"
public_note = "the deposit README names a workstation account path; the README object is withheld, no execution is (D-609)"

[family.geminicli]
layout = "{root}/cells/{scaffold}__{model}/{skeleton}__{variant}/{file}"
scaffold = "gemini_cli"
models = ["MiniMax-M2", "claude-sonnet-4-6", "gemini-2.5-pro", "glm-4.7-probe", "gpt-5.3-codex"]
excluded_scaffolds = ["claude_code", "codex_cli", "openhands"]
tools = ["codebase_investigator", "glob", "google_web_search", "list_directory", "read_file", "read_many_files", "replace", "run_shell_command", "search_file_content", "write_file"]
pairing = "geminicli.tool_id_link_unverified@1"
semantics_profile = { id = "geminicli.tools", version = 1 }

