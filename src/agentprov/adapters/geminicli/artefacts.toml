# Artefact catalogue `geminicli` (docs/architecture D.23.10, D.15.2; DECISIONS D-330..D-337). Data, not code.
#
# Every source-data problem of the gemini_cli part of Zenodo 20404563 found by the phase-10o census, with the rule that
# detects it, how it is recorded and its handling class (D.15.1). The `expected` counts are the census's for the pinned
# archive, counted on the 2,182 mapped streams unless the unit says otherwise; they stay `unverified` until a full import
# confirms them (D.15.6): a regression expectation, never a gate.
#
# Claims are specific (as for agentops): an entry claims a safety-net finding only through a rule, `claims` item or issue
# code of its own case. Cases no AER field read by the net carries (the scope selection, rollouts without a stream, the
# credential-shaped value, stderr retries, the derived harness atoms, the missing route configuration) name a `reserved`
# detector rule of the geminicli catalogue, so they claim nothing. The version stays 1: nothing is released.

version = 1
family = "geminicli"
namespaces = ["geminicli"]

[[artefact]]
id = "geminicli.art.out_of_scope_scaffolds"
title = "Scaffolds outside the structured part"
description = "The claude_code (plain-string transcripts), codex_cli (plain-text streams) and openhands (transcript tails) cells are not readable faithfully (D-143): each rollout is registered select.out_of_scope through its verdict.json, never mapped or dropped silently."
scope = { sources = ["code-agent-misalignment-geminicli"], profiles = ["code-agent-misalignment-geminicli"], parts = ["results-raw"] }
cause = "benchmark"
detector = { rule = "geminicli.scope_selection@1", class = "D" }
handling = { class = "FO", rule = "geminicli.scope_selection@1" }
expected = [{ snapshot = "code-agent-misalignment-geminicli:results-raw", count = 7500, basis = "phase-10o census: 15 cells x 500 rollouts", unit = "rollouts", status = "unverified" }]
manuscript = true
refs = ["DECISIONS D-143, D-331", "docs/reports/phase10o/README.md §3"]

[[artefact]]
id = "geminicli.art.rollouts_without_stream"
title = "gemini_cli rollouts without a structured stream"
description = "175 rollouts wrote an empty gemini_stream.jsonl and 143 none at all (MiniMax-M2 97, gemini-2.5-pro 46; 141 of them hold harness atoms with calls but no results, a partial trajectory). They are registered select.not_execution_artefact (geminicli.empty_stream, geminicli.no_stream). The exclusion rests on format: 19 of the 318 are elicited, and the datasheet states both rates."
scope = { sources = ["code-agent-misalignment-geminicli"], profiles = ["code-agent-misalignment-geminicli"], parts = ["results-raw"] }
cause = "upstream_harness"
detector = { rule = "geminicli.no_stream_rollout@1", class = "D" }
handling = { class = "FO", rule = "geminicli.no_stream_rollout@1" }
expected = [{ snapshot = "code-agent-misalignment-geminicli:results-raw", count = 318, basis = "phase-10o census", unit = "rollouts", status = "unverified" }]
manuscript = true
refs = ["DECISIONS D-331", "docs/reports/phase10o/README.md §6 item 3"]

