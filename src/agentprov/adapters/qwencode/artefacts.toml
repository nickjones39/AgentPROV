[[artefact]]
id = "qwencode.art.truncated_capture"
title = "Output cut at 64 KiB"
description = "Four outputs end at exactly 65,536 bytes mid-message (the harness's capture cap); the complete leading messages are mapped (strict-loader salvage, D-577), no result message, the last call unanswered."
scope = { sources = ["redcode-exec-qwencode"], profiles = ["redcode-exec-qwencode"], parts = ["qwen3coder"] }
cause = "upstream_harness"
detector = { rule = "qwencode.capture_cut_unverified@1", class = "I" }
recorded_as = { issues = ["qwencode.truncated_capture", "qwencode.no_result_message", "incomplete_run", "missing_tool_result"] }
claims = ["artefact.generic.accounting_unverifiable#qwencode.acc.turns@1", "artefact.generic.unexecuted_call", "artefact.generic.accounting_inconsistent#aer.acc.tool_calls_dispatched@1"]
handling = { class = "CR", rule = "qwencode.truncated_salvage@1" }
expected = [{ snapshot = "redcode-exec-qwencode:qwen3coder", count = 4, basis = "phase-10o part-C census", unit = "executions", status = "unverified" }]
manuscript = true
refs = ["docs/reports/phase10o/part-c.md §3", "DECISIONS D-577"]

[[artefact]]
