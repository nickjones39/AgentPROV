# Artefact catalogue `qwencode` (docs/architecture D.24.9, D.15.2; DECISIONS D-570..D-578). Data, not code.
#
# Every source-data problem of the Qwen Code part of Zenodo 23168099 found by the phase-10o part-C census, with the rule
# that detects it, how it is recorded and its handling class (D.15.1). `expected` counts are the census's; they stay
# `unverified` until a full import confirms them (D.15.6). Claims are specific: an entry claims a safety-net finding only
# through a rule, `claims` item or issue code of its own case; cases no AER field shows name a `reserved` detector rule.

version = 1
family = "qwencode"
namespaces = ["qwencode"]

[[artefact]]
id = "qwencode.art.empty_output"
title = "Empty output"
description = "One output is 0 bytes; its score record says the harness timed the run out (300 s). Registered select.not_execution_artefact (qwencode.empty_output), never mapped."
scope = { sources = ["redcode-exec-qwencode"], profiles = ["redcode-exec-qwencode"], parts = ["qwen3coder"] }
cause = "upstream_harness"
detector = { rule = "qwencode.empty_output_rollout@1", class = "D" }
handling = { class = "FO", rule = "qwencode.empty_output_rollout@1" }
expected = [{ snapshot = "redcode-exec-qwencode:qwen3coder", count = 1, basis = "phase-10o part-C census", unit = "outputs", status = "unverified" }]
manuscript = false
refs = ["docs/reports/phase10o/part-c.md §3"]

