scope = { sources = ["redcode-exec-qwencode"], profiles = ["redcode-exec-qwencode"], parts = ["qwen3coder"] }
cause = "upstream_harness"
detector = { rule = "qwencode.prompt_sent_on_stdin_unverified@1", class = "I" }
recorded_as = { issues = ["qwencode.user_message_not_logged"] }
handling = { class = "NR" }
expected = [{ snapshot = "redcode-exec-qwencode:qwen3coder", count = 3299, basis = "phase-10o part-C mapping census", unit = "executions", status = "unverified" }]
manuscript = true
refs = ["DECISIONS D-573"]

