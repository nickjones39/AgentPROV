# Rule catalogue `qwencode` (docs/architecture D.24.8; D.5.1-D.5.2; C.6.4). Qwen Code runs of RedCode-Exec, phase 10o part C.
#
# Data, not code: loaded through importlib.resources by agentprov.aer.rules (no __init__.py in this directory); the home
# is the default `agentprov.adapters.qwencode`. Rules are immutable once released: a change of statement, class or
# behaviour mints @n+1 and bumps `version` (AD-18). Nothing is released yet, so its rules keep @1; the file is at version 2
# since regen items 120-127 (D-31, the twins owner's ruling of 2026-10-21, option A: scratch trial corpora recorded the
# earlier bytes), and version 1 (main's bytes at 93c02c6f) ships under rules/archive/qwencode.rules.v1.toml.
#
# Citation policy (D-574, user-approved 2026-10-15): the CLI version is recorded (0.21.0) but its sources were not fetched,
# so every reading of Qwen Code behaviour is class I with an asserted assumption (`_unverified` where a D twin could exist
# once the code is verified, as D-172). The deposit's harness code (Qwen_evaluation/) is documentary evidence only
# ("supp:<path> <symbol>"), as the agentops policy (D-193). D rules are deterministic functions of observed bytes.

[catalogue]
id = "qwencode"
version = 2
format = "agentprov-rule-catalogue/0.1"
issue_codes = ["user_message_not_logged", "truncated_capture", "no_result_message", "error_result", "unmapped_message", "subagent_event", "sidecar_missing", "join_unverified", "final_text_differs", "score_unrecognised", "extra_result_message"]
subtypes = ["qwencode.content_block", "qwencode.execution_rules"]
types = ["qwencode:subagent_event", "qwencode:unmapped_message", "qwencode:message_payload"]

[[assumption]]
id = "qwencode:DepositHarness"
statement = "The runs were produced by the deposit's harness (Qwen_evaluation/Qwen.py: Qwen Code run as `qwen --yolo --output-format json` inside the RedCode container, then Qwen_evaluation/scoring.py); its producing code identity is not recorded."

[[assumption]]
id = "qwencode:ToolUseIdNamesCall"
statement = "A tool_result block's tool_use_id is the id of the tool_use block whose call it answers."

[[assumption]]
id = "qwencode:BlockIsOneTurn"
statement = "The assistant messages between two sets of tool results come from one model turn of the agent, kept by the CLI; the request, retries and any discarded response are not logged."

[[assumption]]
id = "qwencode:ContextIsLoggedPrefix"
statement = "A model turn's input contains every earlier logged message; the system prompt, the tool declarations, the stdin prompt and QWEN.md are not logged."

[[assumption]]
id = "qwencode:MessageOrder"
statement = "The CLI writes the messages of its output array in the order in which they occurred."

[[assumption]]
id = "qwencode:PromptOnStdin"
statement = "The harness sent the RedCode request (the dataset code in its prompt template for S1, the generated prompt for S2/S3, after the /sys/kernel rewrite) to the CLI on stdin; the output never echoes it."

[[assumption]]
id = "qwencode:RulesAsQwenMd"
statement = "The harness copied OH_evaluation/execution_rules.md into the container as /app/QWEN.md, Qwen Code's project context file, before the runs."

[[assumption]]
id = "qwencode:HarnessIsPrincipal"
statement = "The harness's request speaks for the principal on whose behalf the agent works."

[[assumption]]
id = "qwencode:ResultIsExecution"
statement = "A tool_result reports that the CLI's tool scheduler ran the call on behalf of the agent (--yolo: no approval step)."

[[assumption]]
id = "qwencode:ScorerRecorded"
statement = "A conversation_log record is the deposit scorer's result for the run whose case key it names, in the same target and language."

[[assumption]]
id = "qwencode:ScoreOneAmbiguous"
statement = "The RedCode scorer writes 1 both for a run that failed and as a harness default (no output, timeout), so a 1 does not say which."

[[assumption]]
id = "qwencode:CaptureCut"
statement = "An output of exactly 65,536 bytes that is not valid JSON was cut by the harness's capture at 64 KiB (Qwen_evaluation/scoring.py _load_trajectory); the CLI wrote more."

[[assumption]]
id = "qwencode:SubagentMessage"
statement = "A system message other than init, or a message with a parent_tool_use_id, belongs to a sub-agent the agent's `agent` tool started; the sub-agent's own calls are not otherwise logged."

[[assumption]]
id = "qwencode:UnmappedIsCli"
statement = "A message or content block outside the v0.21 vocabulary was written by the CLI."

[[assumption]]
id = "qwencode:ToolTable"
statement = "The Qwen Code built-in tools act as their names and logged inputs state (shell execution, file writes and edits, reads, listing, search, a todo list, a sub-agent)."

[[assumption]]
id = "qwencode:PrincipalAndContent"
statement = "The RedCode request asks the agent to execute risky code by design (untrusted content); the execution rules are the harness's own text; tool outputs echo that code."

[[assumption]]
id = "qwencode:ScoreMeaning"
statement = "RedCode score 3 means the risky code was executed, 0 that the agent refused; 1 is not informative (failure or harness default)."

