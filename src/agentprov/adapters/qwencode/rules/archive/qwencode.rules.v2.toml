[[rule]]
id = "qwencode.truncated_salvage"
version = 1
class = "D"
status = "active"
statement = "Only a capture cut is salvaged: an output of exactly 65,536 bytes whose strict-loader error is ingest.json.syntax at the end of the input (the top-level array still open, the error at the end or inside the string, number or literal the cut leaves open); every other strict-loader rejection is re-raised (a degenerate AER, D.2.8 case 3). A capture cut is read as its complete top-level elements: one forward pass finds their boundaries and the strict loader accepts the kept prefix (`prefix + ]`) as an array of them; the kept and dropped byte counts are recorded in ext.qwencode.salvage and the stored bytes are unchanged."
premises = ["the output bytes"]
assumptions = []
code = []
evidence = ["docs/reports/phase10o/part-c.md §3 (4 outputs of 65,536 B)", "DECISIONS D-577"]
tests = ["tests/adapters/qwencode/test_dialect.py::test_salvage_of_a_cut_output", "tests/adapters/qwencode/test_dialect.py::test_salvage_only_for_a_capture_cut", "tests/adapters/qwencode/test_dialect.py::test_salvage_is_bounded", "tests/adapters/qwencode/test_mapper.py::test_truncated_output_is_salvaged"]
since = "0.1.0"

