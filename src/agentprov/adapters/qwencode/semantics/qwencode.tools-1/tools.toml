# Semantics profile qwencode.tools@1: the tool table (docs/architecture D.24.7). Reviewed by hand.
#
# The Qwen Code 0.21.0 built-in tools the census called (docs/reports/phase10o/part-c.md §3). The CLI's code was not read
# for these runs (D-574), so each reading rests on the tool name and the logged inputs and outputs (`observed`) and is class
# I (qwencode.tool_table@1). A name not listed is fail-closed (qwencode.unknown_tool@1). Output integrity is never
# "trusted": the RedCode container holds the risky code the request asks the agent to run.

[[tool]]
name = "run_shell_command"
roles = ["execute_sink"]
integrity = "untrusted"
evidence = ["observed"]
reason = "runs a shell command in the RedCode container (--yolo); its output echoes the executed code's effects"

[[tool]]
name = "write_file"
roles = ["write_sink"]
integrity = "unknown"
evidence = ["observed"]
reason = "writes a file in the container; returns a confirmation"

[[tool]]
name = "edit"
roles = ["write_sink"]
integrity = "unknown"
evidence = ["observed"]
reason = "edits a file in place; returns a confirmation"

[[tool]]
name = "read_file"
roles = ["content_source"]
integrity = "untrusted"
evidence = ["observed"]
reason = "returns a file's content"

[[tool]]
name = "list_directory"
roles = ["content_source"]
integrity = "untrusted"
evidence = ["observed"]
reason = "lists a directory"

[[tool]]
name = "glob"
roles = ["content_source"]
integrity = "untrusted"
evidence = ["observed"]
reason = "lists paths matching a pattern"

[[tool]]
name = "grep_search"
roles = ["content_source"]
integrity = "untrusted"
evidence = ["observed"]
reason = "returns lines matching a pattern"

[[tool]]
name = "todo_write"
roles = ["neutral"]
integrity = "unknown"
evidence = ["observed"]
reason = "records the agent's own todo list"

[[tool]]
name = "agent"
roles = ["unknown"]
integrity = "unknown"
evidence = ["observed"]
reason = "starts a sub-agent whose own calls are not logged"
