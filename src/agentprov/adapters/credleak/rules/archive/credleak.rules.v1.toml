# Rule catalogue `credleak` (docs/architecture D.19.8; D.5.1-D.5.2; C.6.4). Zenodo 22737462, phase 10k.
#
# Data, not code: loaded through importlib.resources by agentprov.aer.rules (no __init__.py in this directory); the home
# is the default `agentprov.adapters.credleak` (no CATALOGUE_HOMES entry). Rules are immutable once released: a change of
# statement, class or behaviour mints @n+1 and bumps `version` (AD-18). Nothing is released yet, so this is version 1.
#
# Citation policy (as for dtap, D-24, D-27 c6): the study's harness is not published in the deposit and no harness code
# is verified. Every rule that rests on harness behaviour is class I with an `asserted` assumption; the D rules are
# deterministic functions of observed fields (their names and structure), declare no assumption, cite no code and cite
# the census (docs/reports/phase10k/census.md) in `evidence`. The deposit's README never makes a rule D.

[catalogue]
id = "credleak"
version = 1
format = "agentprov-rule-catalogue/0.1"
issue_codes = ["path_outside_grammar", "turn_number_mismatch", "cell_run_disagree", "invocation_error"]
subtypes = []
types = []

[[assumption]]
id = "credleak:ScriptedUser"
statement = "The user message of a turn is issued by the harness from the scenario, on behalf of a simulated user."

[[assumption]]
id = "credleak:ScenarioPlantsInjection"
statement = "Every scenario of the study plants an indirect prompt injection in the channel its technique names (the attacker is the study's scenario author)."

[[assumption]]
id = "credleak:EntryIsModelCall"
statement = "A toolCalls entry records a tool call the agent model emitted (its tool name and input as the model wrote them)."

[[assumption]]
id = "credleak:ResponseIsModelText"
statement = "The assistantResponse of a turn is text the agent model wrote in that turn."

[[assumption]]
id = "credleak:EntryIsExecution"
statement = "A toolCalls entry's output records the result of one execution of that call by the harness's tool runtime."

[[assumption]]
id = "credleak:AutoExecution"
statement = "The harness's tool runtime executes the agent's calls without a human in the loop, on behalf of the agent."

[[assumption]]
id = "credleak:EntriesInOrder"
statement = "The harness appends a turn's toolCalls entries in the order in which the calls were executed, each after the previous call's result."

[[assumption]]
id = "credleak:TurnsInOrder"
statement = "The harness appends turns in the order in which they occurred; a turn's user message follows the end of the previous turn."

[[assumption]]
id = "credleak:ResponseAfterUser"
statement = "A turn's assistantResponse was written after that turn's user message was given to the agent."

[[assumption]]
id = "credleak:DetectorFields"
statement = "The run-level signal fields (hijackSucceeded, exfiltrationDetected, ...) are the outputs of the harness's detectors evaluated on that run."

[[assumption]]
id = "credleak:InvocationError"
statement = "A run whose invocationError is true ended because the model invocation failed."

[[assumption]]
id = "credleak:ToolRoleTable"
statement = "The tool table of credleak.tools@1 states the security roles and output labels of the harness's tools as the profile author reads their names; no tool implementation is verified."

[[assumption]]
id = "credleak:ScriptedUserTrusted"
statement = "The scripted user message carries the benign task; the study places its injections in tool-reachable channels, not in the user message."

# ---------------------------------------------------------------------------------------------- structure (D)
[[rule]]
id = "credleak.cell_field_roles"
version = 1
class = "D"
status = "active"
statement = "A cell names the task by its scenario, technique and defence fields; within a turn, userMessage is the user's message, assistantResponse the assistant's text and a toolCalls entry's output the tool's result (the fields' names and nesting)."
premises = ["/scenario", "/technique", "/defence", "/runs/*/turns/*/userMessage", "/runs/*/turns/*/assistantResponse", "/runs/*/turns/*/toolCalls/*/output"]
assumptions = []
code = []
evidence = ["docs/reports/phase10k/census.md §1, §2"]
tests = ["tests/adapters/credleak/test_rules.py::test_every_declared_rule_is_exercised"]
since = "0.1.0"

[[rule]]
id = "credleak.model_label_is_requested"
version = 1
class = "D"
status = "active"
statement = "The run's model field (equal to the cell's) is the harness's label of the model it was configured to call; it is the requested model, never a served one."
premises = ["/model", "/runs/*/model"]
assumptions = []
code = []
evidence = ["docs/reports/phase10k/census.md §3"]
tests = ["tests/adapters/credleak/test_rules.py::test_every_declared_rule_is_exercised"]
since = "0.1.0"

[[rule]]
id = "credleak.pair_same_entry"
version = 1
class = "D"
status = "active"
statement = "A tool result belongs to the call recorded in the same toolCalls entry: the entry holds the call's tool and input and its output together (no order inference)."
premises = ["/runs/*/turns/*/toolCalls/*/tool", "/runs/*/turns/*/toolCalls/*/input", "/runs/*/turns/*/toolCalls/*/output"]
assumptions = []
code = []
evidence = ["docs/reports/phase10k/census.md §2"]
tests = ["tests/adapters/credleak/test_mapper.py::test_each_result_is_linked_to_the_call_of_its_own_entry"]
since = "0.1.0"

[[rule]]
id = "credleak.turn_timestamp_role"
version = 1
class = "D"
status = "active"
statement = "A turn's timestamp is kept verbatim in ext.credleak; whether it marks the turn's start, its end or the time the harness wrote it is not determinable (runs of a cell overlap), so the turn scope's time is ambiguous."
premises = ["/runs/*/turns/*/timestamp"]
assumptions = []
code = []
evidence = ["docs/reports/phase10k/census.md §5"]
tests = ["tests/adapters/credleak/test_mapper.py::test_no_time_is_typed_and_the_turn_timestamp_is_kept_verbatim"]
since = "0.1.0"

[[rule]]
id = "credleak.duration_no_clock"
version = 1
class = "D"
status = "active"
statement = "A durationMs value is a duration of unrecorded clock and extent; it is kept verbatim in ext.credleak and gives no typed time (dur_s is ambiguous, start and end are not recorded)."
premises = ["/runs/*/durationMs", "/runs/*/turns/*/durationMs", "/runs/*/turns/*/toolCalls/*/durationMs"]
assumptions = []
code = []
evidence = ["docs/reports/phase10k/census.md §5"]
tests = ["tests/adapters/credleak/test_mapper.py::test_no_time_is_typed_and_the_turn_timestamp_is_kept_verbatim"]
since = "0.1.0"

[[rule]]
id = "credleak.model_calls_not_recorded"
version = 1
class = "D"
status = "active"
statement = "A cell records no model-call boundary (a turn may span several calls, up to the configured maxTurns), so no model_call is written and the generator of every agent message is not recorded."
premises = ["/config/maxTurns", "/runs/*/turns"]
assumptions = []
code = []
evidence = ["docs/reports/phase10k/census.md §2, §9 (Q1)"]
tests = ["tests/adapters/credleak/test_mapper.py::test_agent_messages_declare_no_generator"]
since = "0.1.0"

[[rule]]
id = "credleak.turn_number_index"
version = 1
class = "D"
status = "active"
statement = "A turn's turnNumber equal to its 0-based position in turns is the index of its agent_invocation scope; any other value leaves the index ambiguous."
premises = ["/runs/*/turns/*/turnNumber"]
assumptions = []
code = []
evidence = ["docs/reports/phase10k/census.md §2"]
tests = ["tests/adapters/credleak/test_rules.py::test_every_declared_rule_is_exercised"]
since = "0.1.0"

[[rule]]
id = "credleak.path_facets"
version = 1
class = "D"
status = "active"
statement = "The cell's path names its section, channel directory, model directory, layout class (roster, excluded-models, an underscore directory) and file-name prefix; these are facets, never the run's identity."
premises = ["/label", "/path"]
assumptions = []
code = []
evidence = ["docs/reports/phase10k/census.md §1"]
tests = ["tests/adapters/credleak/test_dialect.py::test_path_grammar"]
since = "0.1.0"

[[rule]]
id = "credleak.cell_run_agreement"
version = 1
class = "D"
status = "active"
statement = "Profile check: a run's model and scenarioId equal its cell's model and scenario (true for all 19,636 runs of v3)."
premises = ["/model", "/scenario", "/runs/*/model", "/runs/*/scenarioId"]
assumptions = []
code = []
evidence = ["docs/reports/phase10k/census.md §2, §3"]
tests = ["tests/adapters/credleak/test_mapper.py::test_cell_run_disagreement_is_an_issue"]
since = "0.1.0"

[[rule]]
id = "credleak.acc.tool_call_count"
version = 1
class = "D"
status = "active"
statement = "Profile accounting check: a run's toolCallCount, where recorded, equals the number of its toolCalls entries over all turns."
premises = ["/runs/*/toolCallCount", "/runs/*/turns/*/toolCalls"]
assumptions = []
code = []
evidence = ["docs/reports/phase10k/census.md §2"]
tests = ["tests/adapters/credleak/test_mapper.py::test_tool_call_count_check"]
since = "0.1.0"

