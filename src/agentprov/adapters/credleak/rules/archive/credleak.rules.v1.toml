[[rule]]
id = "credleak.turns_in_array_order_unverified"
version = 1
class = "I"
status = "active"
statement = "A turn's user message followed the end of the previous turn (its last tool result and its assistant text); turns array order is occurrence order."
premises = ["/runs/*/turns"]
assumptions = ["credleak:TurnsInOrder"]
verification = [{ assumption = "credleak:TurnsInOrder", status = "asserted" }]
code = []
evidence = ["docs/reports/phase10k/census.md §2, §5"]
tests = ["tests/adapters/credleak/test_rules.py::test_every_declared_rule_is_exercised"]
