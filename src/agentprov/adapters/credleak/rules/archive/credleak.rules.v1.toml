[[rule]]
id = "credleak.auto_execution_unverified"
version = 1
class = "I"
status = "active"
statement = "The tool runtime executes the agent's calls without a human in the loop, on behalf of the agent, and authors the results."
premises = ["/runs/*/turns/*/toolCalls/*/output"]
assumptions = ["credleak:AutoExecution"]
verification = [{ assumption = "credleak:AutoExecution", status = "asserted" }]
code = []
