[[rule]]
id = "credleak.tool_entry_is_execution_unverified"
version = 1
class = "I"
status = "active"
statement = "A toolCalls entry records one execution of its call by the tool runtime; the entry's output was generated by that execution."
premises = ["/runs/*/turns/*/toolCalls/*/output"]
assumptions = ["credleak:EntryIsExecution"]
verification = [{ assumption = "credleak:EntryIsExecution", status = "asserted" }]
code = []
