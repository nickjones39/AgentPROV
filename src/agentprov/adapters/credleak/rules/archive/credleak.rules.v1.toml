[[rule]]
id = "credleak.calls_in_entry_order_unverified"
version = 1
class = "I"
status = "active"
statement = "A turn's first call followed its user message, and each later call followed the previous call's result (toolCalls array order is occurrence order)."
premises = ["/runs/*/turns/*/toolCalls"]
assumptions = ["credleak:EntriesInOrder"]
verification = [{ assumption = "credleak:EntriesInOrder", status = "asserted" }]
code = []
evidence = ["docs/reports/phase10k/census.md §2"]
tests = ["tests/adapters/credleak/test_rules.py::test_every_declared_rule_is_exercised"]
