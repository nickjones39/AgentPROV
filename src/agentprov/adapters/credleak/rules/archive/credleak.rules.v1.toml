[[rule]]
id = "credleak.response_after_user_message_unverified"
version = 1
class = "I"
status = "active"
statement = "A turn's assistant text followed that turn's user message; its position relative to the turn's tool calls is not recorded, so no order is asserted between them."
premises = ["/runs/*/turns/*/assistantResponse"]
assumptions = ["credleak:ResponseAfterUser"]
verification = [{ assumption = "credleak:ResponseAfterUser", status = "asserted" }]
code = []
evidence = ["docs/reports/phase10k/census.md §2"]
tests = ["tests/adapters/credleak/test_mapper.py::test_the_response_is_ordered_after_the_user_message_only"]
since = "0.1.0"

[[rule]]
id = "credleak.detector_signal_unverified"
version = 1
class = "I"
status = "active"
statement = "A run-level signal field (hijackSucceeded, exfiltrationDetected, agentDetected, ...) is a verdict of the harness's detectors on that run, recorded verbatim; no detector code is verified (the deposit's later T-EMIT correction is not run data)."
premises = ["/runs/*/hijackSucceeded", "/runs/*/exfiltrationDetected", "/runs/*/agentDetected", "/runs/*/maliciousArtifactEmitted"]
assumptions = ["credleak:DetectorFields"]
verification = [{ assumption = "credleak:DetectorFields", status = "asserted" }]
code = []
evidence = ["docs/reports/phase10k/census.md §6"]
tests = ["tests/adapters/credleak/test_mapper.py::test_detector_signals_are_judgements"]
since = "0.1.0"

[[rule]]
id = "credleak.invocation_error_status"
version = 1
class = "I"
status = "active"
statement = "A run whose invocationError is true ended with an error (status error); errorDetail, where present, is its message."
premises = ["/runs/*/invocationError", "/runs/*/errorDetail"]
assumptions = ["credleak:InvocationError"]
verification = [{ assumption = "credleak:InvocationError", status = "asserted" }]
code = []
evidence = ["docs/reports/phase10k/census.md §2, §6"]
tests = ["tests/adapters/credleak/test_mapper.py::test_an_invocation_error_ends_the_run_with_status_error"]
since = "0.1.0"

# ---------------------------------------------------------------------------------------------- semantics profile (I)
[[rule]]
id = "credleak.tool_role_table"
version = 1
class = "I"
status = "active"
statement = "A tool call and its execution get the security roles the credleak.tools@1 tool table lists for the tool's name; an unlisted name (including the malformed names models emitted) gets unknown."
premises = ["/name", "/parts/*/name"]
assumptions = ["credleak:ToolRoleTable"]
verification = [{ assumption = "credleak:ToolRoleTable", status = "asserted" }]
code = []
evidence = ["docs/architecture/D_adapters.md D.19.9"]
tests = ["tests/adapters/credleak/test_semantics.py::test_roles_and_labels_follow_the_tables"]
since = "0.1.0"

[[rule]]
id = "credleak.tool_output_label_table"
version = 1
class = "I"
status = "active"
statement = "A tool result gets the integrity and channel the credleak.tools@1 tool table lists for the tool that generated it; an unlisted tool gives unknown."
premises = ["/name"]
assumptions = ["credleak:ToolRoleTable"]
verification = [{ assumption = "credleak:ToolRoleTable", status = "asserted" }]
code = []
evidence = ["docs/architecture/D_adapters.md D.19.9"]
tests = ["tests/adapters/credleak/test_semantics.py::test_roles_and_labels_follow_the_tables"]
since = "0.1.0"

[[rule]]
id = "credleak.observation_label_table"
version = 1
class = "I"
status = "active"
statement = "The scripted user message gets the integrity the credleak.tools@1 observation table lists for its actor."
premises = ["/actor", "/role"]
assumptions = ["credleak:ScriptedUserTrusted"]
verification = [{ assumption = "credleak:ScriptedUserTrusted", status = "asserted" }]
code = []
evidence = ["docs/architecture/D_adapters.md D.19.9"]
tests = ["tests/adapters/credleak/test_semantics.py::test_roles_and_labels_follow_the_tables"]
since = "0.1.0"

[[rule]]
id = "credleak.taint_sink_untrusted"
version = 1
class = "I"
status = "active"
statement = "Taint policy of credleak.tools@1: a request whose roles meet write, send, execute, egress-read or unknown is potentially influenced by a context member of untrusted or unknown integrity."
premises = ["/name"]
assumptions = ["credleak:ToolRoleTable"]
verification = [{ assumption = "credleak:ToolRoleTable", status = "asserted" }]
code = []
evidence = ["docs/architecture/D_adapters.md D.19.9"]
tests = ["tests/adapters/credleak/test_semantics.py::test_the_taint_policy"]
since = "0.1.0"

# ---------------------------------------------------------------------------------------------- reserved
# Detector names of artefact-catalogue entries (artefacts.toml) whose case no AER field read by the safety net carries:
# it is handled at sealing or by the semantics profile. They are never cited in an AER (a `reserved` rule is not
# citable), so the catalogue entries that name them claim no safety-net finding of another case (as in dtap).

[[rule]]
id = "credleak.planted_credential"
version = 1
class = "D"
status = "reserved"
statement = "Reserved: a cell or run whose bytes hold a planted credential (the study's tag or a key shape) is withheld at sealing by the profile's [withhold] policy (D-234, D-235, D-265); the mapper copies content verbatim and never detects it, so no AER record cites this rule."
premises = ["raw object bytes", "derived file bytes"]
assumptions = []
code = []
evidence = ["docs/reports/phase10k/census.md §7"]
tests = ["tests/adapters/credleak/test_artefacts.py::test_reserved_detectors_are_never_cited"]
since = "0.1.0"

[[rule]]
id = "credleak.malformed_tool_name"
version = 1
class = "D"
status = "reserved"
statement = "Reserved: a tool name the model emitted malformed (channel tokens, case variant, typo) is kept verbatim; the semantics profile gives it the role unknown and no AER field marks it (only an empty or placeholder name is declared ambiguous), so no AER record cites this rule."
premises = ["/runs/*/turns/*/toolCalls/*/tool"]
assumptions = []
code = []
evidence = ["docs/reports/phase10k/census.md §2"]
tests = ["tests/adapters/credleak/test_artefacts.py::test_reserved_detectors_are_never_cited"]
since = "0.1.0"
