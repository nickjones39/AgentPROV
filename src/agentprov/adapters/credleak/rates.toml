# Rate exclusions of the credleak family (docs/architecture D.19.10; DECISIONS D-260). Data, not code: stats reads which
# executions to leave out of a default rate from here, so stats names no credleak code. Nothing is deleted: every
# excluded execution stays in the corpus and is reported beside the rate with its count.

version = 1
family = "credleak"

[[exclusion]]
id = "credleak.rate.invocation_error"
profiles = ["credleak-p15b"]
issue_codes = ["map.credleak.invocation_error"]
judgement_origins = []
rates = ["outcome"]
basis = "D-260: the deposit excludes errored runs from every rate (README); runs whose run scope has status error (issue credleak.invocation_error) are counted separately."
