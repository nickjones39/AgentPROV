# Third-party account paths in tool output (D-605, applying D-604; redact.py). The harness's tool runtime printed
# workstation paths `home/<account>/` and `Users/<account>/` (with or without a leading slash) in the output of tool
# calls; the name after the prefix is replaced by a salted label (the span is the name; `{span12}` is SHA-256 over the
# profile id, NUL and the name). The name ends at the first character that cannot be part of one (trailing dots, as at
# the end of a sentence, stay outside). The generic, non-identifying names of tools/release_scan.py's ACCOUNT_ALLOWLIST
# (those within the name class) are never redacted, case-insensitively; a test keeps the two lists equal. Model-authored
# text (tool-call input, assistant text) is never redacted (D-604). Census (D-605, pinned v3 zip): 382 tool-output
# strings hold account #1's path; after the rule, 0 runs hold it in path form in tool output.
[[family.credleak.redact]]
id = "account_path"
scope = "tool_output"
pattern = '(?:(?<=home/)(?<![A-Za-z0-9._\-]home/)|(?<=Users/)(?<![A-Za-z0-9._\-]Users/))(?!(?i:admin|administrator|app|appveyor|circleci|codespace|default|docker|ec2-user|example|guest|jovyan|me|name|nobody|node|public|root|runner|runneradmin|shared|travis|ubuntu|user|username|users|vagrant|vscode|you)\.*(?![A-Za-z0-9._\-]))(?!\.+(?![A-Za-z0-9._\-]))[A-Za-z0-9._\-]{1,64}?(?=\.*(?![A-Za-z0-9._\-]))'
replacement = "acct-{span12}"
note = "the account name of a workstation path in tool output: home/<account> or Users/<account>"

# The same account without a path: the owner and group columns of `ls -l` lines in tool output (D-605 part 2, the
# D-607 labels approach). The patterns are structural (a mode string, a link count, then the owner, then the group);
# only a column whose salted label is listed in `labels` is replaced, so no other owner name is touched. The label is
# the `{span12}` of account #1, computed out of band from the pinned data (the name is never written anywhere); it is
# the same label the path rule writes into the AER. Census (pinned v3 zip): 22,986 owner and 22,985 group columns of
# account #1 in the tool output of 4,353 runs, all redacted; 0 other owner or group columns touched.
[[family.credleak.redact]]
id = "ls_long_owner"
scope = "tool_output"
pattern = '(?m)^[-dlcbps][-rwxsStT]{9}[@+.]?[ \t]+[0-9]+[ \t]+(?P<span>[A-Za-z0-9._\-]{1,64})(?=[ \t])'
replacement = "acct-{span12}"
labels = ["86fe70f091cd"]
note = "the owner column of an ls -l line, for the listed account only"

[[family.credleak.redact]]
id = "ls_long_group"
scope = "tool_output"
pattern = '(?m)^[-dlcbps][-rwxsStT]{9}[@+.]?[ \t]+[0-9]+[ \t]+[^ \t\n]+[ \t]+(?P<span>[A-Za-z0-9._\-]{1,64})(?=[ \t])'
replacement = "acct-{span12}"
labels = ["86fe70f091cd"]
note = "the group column of an ls -l line, for the listed account only"

# The withholding policy (D-234, D-265; HL H.4.5). Every planted value carries the study's tag inside it. `canary-tag`
# matches the tag followed by any character but `_`: two not-selected member labels of the collector log carry the
# tag between underscores, and raw/members.jsonl (released, D-231) lists every label, so the bare tag as a marker
# would fail the chain backstop (found by the part-C2 seal). `canary-tag-left` matches the tag after any character but
# `_` or `/` (one run holds the tag only after a letter and before `_`). Together they miss only the tag between `[_/]`
# and `_`, the form of the two labels: on the content the AER holds, every value-bearing run is hit and no released run
# holds the tag in any form (census step 15). The two shape rules also
# catch the 78 key-shaped strings that carry no tag (27 runs, 26 of them tagged as well). Scope
# `object`: a hit withholds the cell's bytes (and the deposit zip, basis container) while the runs of the cell whose
# derived records hold no hit stay released (D-235); a run whose AER, SEM, PROV or view holds a hit is withheld.
# Expected on the full v3 import: 325 cells and the zip withheld, 5,422 executions withheld, 14,214 released.
[withhold]
reason = "secret"
public_note = "planted canary credentials of the study (benchmark design); values never recorded"
scan_rules = ["aws-access-token", "anthropic-api-key", "openai-api-key", "stripe-access-token", "generic-api-key"]

[[withhold.rules]]
id = "canary-tag"
pattern = "CANARY[^_]"
scope = "object"

[[withhold.rules]]
id = "canary-tag-left"
pattern = "[^_/]CANARY"
scope = "object"

[[withhold.rules]]
id = "aws-key-shape"
pattern = "AKIA[0-9A-Z]{16}"
scope = "object"

[[withhold.rules]]
id = "sk-key-shape"
pattern = "sk-[A-Za-z0-9_\\-]{20,256}"
scope = "object"

# Third-party account paths (D-605 part 1, applying D-604; user decision 2026-10-21: the generic structural rule). The
# tool-output copies are redacted by the mapper ([[family.credleak.redact]] above), so a derived file that still holds
# such a path holds it in model-authored text (withheld through D-235), and a raw cell that holds one is withheld at
# object scope. The byte grammar cannot exclude generic names, so these rules are generic: any account name made of
# [A-Za-z0-9._] after `home/` or `Users/`, followed by a character that cannot be part of a name. The name class leaves
# out `-`, so the redaction labels (`acct-<12 hex>`) never match. Census (pinned v3 zip), beyond the 5,422 executions
# the four rules above withhold: 7 executions (2 of account #1's model-authored residue, 3 with another non-generic
# account path in model-authored text, 2 with a generic-name path only: a known collateral cost the user accepted) and
# 21 raw cells (18 holding account #1, 3 other).
[[withhold.rules]]
id = "account-path-home"
pattern = "home/[A-Za-z0-9._]{1,64}[^A-Za-z0-9._\\-]"
scope = "object"
reason = "personal_data"
public_note = "a workstation account path in model-authored text or raw tool output (D-604, D-605); never recorded"

[[withhold.rules]]
id = "account-path-users"
pattern = "Users/[A-Za-z0-9._]{1,64}[^A-Za-z0-9._\\-]"
scope = "object"
reason = "personal_data"
public_note = "a workstation account path in model-authored text or raw tool output (D-604, D-605); never recorded"
