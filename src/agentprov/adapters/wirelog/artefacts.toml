recorded_as = { issues = ["wirelog.meta_rewritten"] }
handling = { class = "FO", rule = "wirelog.meta_rewritten@1" }
expected = [{ snapshot = "what-surrounds:runs-named", count = 358, basis = "phase-10m census", unit = "executions", status = "unverified" }]
manuscript = true
refs = ["docs/reports/phase10m/README.md §A.3.5"]

[[artefact]]
id = "wirelog.art.final_texts_not_logged"
title = "No split of the final text"
description = "The earliest 154 runs predate the harness's split of the final text into user-facing text and reasoning (final_user_text.txt, final_reasoning.txt) and the token totals in meta.json: disclosed; the usage check is unverifiable for them (the counts are in the responses)."
scope = { sources = ["what-surrounds"], profiles = ["what-surrounds"], parts = ["runs-named"] }
cause = "upstream_harness"
detector = { rule = "wirelog.final_texts_not_logged@1", class = "D" }
recorded_as = { issues = ["wirelog.final_texts_not_logged"] }
claims = ["artefact.generic.accounting_unverifiable#wirelog.acc.usage_totals@1"]
handling = { class = "NR" }
expected = [{ snapshot = "what-surrounds:runs-named", count = 154, basis = "phase-10m census", unit = "executions", status = "unverified" }]
manuscript = false
refs = ["docs/reports/phase10m/README.md §A.3"]

[[artefact]]
id = "wirelog.art.outcome_at_save"
title = "Outcome labels written by the harness"
description = "outcome.txt is the harness's own label at save time (origin harness_rule) and outcome_v2.txt a later re-derivation (origin recomputed, revising it); the results table's columns are the deposit's scoring (origin checker). All are kept verbatim beside each other."
scope = { sources = ["what-surrounds"], profiles = ["what-surrounds"], parts = ["runs-named"] }
cause = "benchmark"
detector = { rule = "wirelog.outcome_file_unverified@1", class = "I" }
claims = ["artefact.generic.harness_imposed_outcome#harness_rule"]
handling = { class = "CR", rule = "wirelog.outcome_file_unverified@1" }
expected = [{ snapshot = "what-surrounds:runs-named", count = 1334, basis = "phase-10m census (358 with outcome_v2)", unit = "executions", status = "unverified" }]
manuscript = false
refs = ["docs/reports/phase10m/README.md §A.3"]

[[artefact]]
id = "wirelog.art.event_times_not_recorded"
title = "Only the save time is logged"
description = "No request, response or tool call carries a time; the only clock value is meta.json's save timestamp, kept verbatim in the run scope's t.raw.end with the typed end ambiguous (class I reading); provider latencies state no clock (t.dur_s ambiguous). Nothing is invented."
scope = { sources = ["what-surrounds"], profiles = ["what-surrounds"], parts = ["runs-named"] }
cause = "upstream_harness"
detector = { rule = "wirelog.save_timestamp_unverified@1", class = "I" }
claims = ["artefact.generic.sentinel_time#unknown_not_recorded", "artefact.generic.sentinel_time#unknown_ambiguous"]
handling = { class = "NR" }
expected = [{ snapshot = "what-surrounds:runs-named", count = 1334, basis = "phase-10m census", unit = "executions", status = "unverified" }]
manuscript = false
refs = ["docs/reports/phase10m/README.md §A.3 (time)"]

