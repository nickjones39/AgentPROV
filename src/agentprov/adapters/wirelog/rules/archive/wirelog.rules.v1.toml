# Rule catalogue `wirelog` (docs/architecture D.20.9; D.5.1-D.5.2; C.6.4). Wire-log runs, phase 10m.
#
# Data, not code: loaded through importlib.resources by agentprov.aer.rules (no __init__.py in this directory); the home
# is the default `agentprov.adapters.wirelog`. Rules are immutable once released: a change of statement, class or
# behaviour mints @n+1 and bumps `version` (AD-18). Nothing is released yet, so this is version 1.
#
# Citation policy (D-24, D-282): the deposit of the first source (Zenodo 21944598) ships its harness scripts without a
# commit, and the data show that not every run came from the scripts as shipped (renamed and rewritten first-batch
# meta.json files, 154 runs from an earlier run_trials.py, one request body no shipped script sends;
# docs/reports/phase10m/README.md §A.3.5). So no rule cites producing code, and every rule that rests on harness or
# scorer behaviour is class I; the scripts are documentary evidence ("deposit:<path> <symbol>"), never verification. The
# D rules are deterministic functions of the logged bytes or of pinned package data; they declare no assumption and cite
# the census.

[catalogue]
id = "wirelog"
version = 1
format = "agentprov-rule-catalogue/0.1"
issue_codes = ["label_field_mismatch", "context_diverges", "unknown_block", "payload_not_delivered", "payload_entry_missing", "final_texts_not_logged", "meta_rewritten", "task_prompt_unlisted", "results_row_missing", "unreadable_auxiliary", "turn_limit"]
subtypes = []
types = []

[[assumption]]
id = "wirelog:DepositHarness"
statement = "The runs were produced by the harness of the deposit (request loop, dispatcher, save and scoring scripts), whose producing code identity is not recorded."

[[assumption]]
id = "wirelog:RequestModelIsEndpointModel"
statement = "A logged request's model member is the model or inference-profile id the harness posted the body to on the provider's runtime endpoint."

[[assumption]]
id = "wirelog:TaskIsHarnessPrompt"
statement = "The first user message of a run is the harness's task prompt, sent on behalf of a simulated user."

[[assumption]]
id = "wirelog:SystemByHarness"
statement = "A request's system member is the operator prompt the harness sets for the arm."

[[assumption]]
id = "wirelog:SyntheticDispatcher"
statement = "Tool results are produced by the harness's synthetic dispatcher on behalf of the agent: read_file returns a document from the harness's own table and send_email sends nothing and returns a fixed text."

[[assumption]]
id = "wirelog:LockstepLists"
statement = "The harness appends a request body before the call and the decoded response after it, so the i-th response answers the i-th request."

[[assumption]]
id = "wirelog:LoopStopsAtFinalAnswer"
statement = "The harness stops a run at the first response whose stop reason is not tool_use, or after its request cap."

[[assumption]]
id = "wirelog:SaveTimestamp"
statement = "meta.json's timestamp is the UTC clock read when the run directory was saved, after the last response."

[[assumption]]
id = "wirelog:ArmAttacker"
statement = "An arm with an attack has an attacker who authored its payload; the payload table names the text the arm delivers."

[[assumption]]
id = "wirelog:CleanArmBenign"
statement = "An arm the profile lists as no_attack delivers no injected content."

[[assumption]]
id = "wirelog:ResultsScored"
statement = "results.csv was computed by the deposit's scoring scripts from the saved run directories."

[[assumption]]
id = "wirelog:OutcomeAtSave"
statement = "outcome.txt is the label the harness's own rule wrote when it saved the run."

[[assumption]]
id = "wirelog:Reclassified"
statement = "outcome_v2.txt is the label a later re-derivation (reclassify.py) wrote for the same run, superseding outcome.txt."

# ------------------------------------------------------------------------------------------------ deterministic (logged bytes)

[[rule]]
id = "wirelog.run_dir_layout"
version = 1
class = "D"
status = "active"
statement = "The run directory's name facets (short model, arm, number) are compared with the logged model, meta.json's run_id, model and arm, and the results row's arm; a difference is recorded (wirelog.label_field_mismatch) and never corrected."
premises = ["origin /label", "/0/model", "meta.json /run_id, /model, /attack|/variant", "results.csv arm"]
assumptions = []
code = []
evidence = ["docs/reports/phase10m/README.md §A.3 (1,334/1,334 agree)"]
tests = ["tests/adapters/wirelog/test_mapper.py::test_label_and_meta_fields_agree"]
since = "0.1.0"

[[rule]]
id = "wirelog.unreadable_run"
version = 1
class = "D"
status = "active"
statement = "A response log that cannot be mapped (refused by the strict loader, or its map job crashed or hit a limit) is one degenerate execution named by its label (task_id run:<label>); nothing of the run is mapped and the stored artefact is kept (D.2.8 case 3)."
premises = ["origin /label", "the loader's refusal or the job's failure code"]
assumptions = []
code = []
evidence = ["docs/architecture/D_adapters.md D.20", "D.2.8 case 3"]
tests = ["tests/adapters/wirelog/test_mapper.py::test_an_unreadable_response_log_is_one_degenerate_execution"]
since = "0.1.0"

[[rule]]
id = "wirelog.request_prefix"
version = 1
class = "D"
status = "active"
statement = "A conversation item of a request (a message, or the system member) is the record of an earlier request's item at the same position when the two are equal under JCS; an item equal to none starts a new record (and, where an earlier item was expected, wirelog.context_diverges)."
premises = ["/<i>/messages", "/<i>/system", "/<i-1>/messages"]
assumptions = []
code = []
evidence = ["docs/reports/phase10m/README.md §A.3 (the prefix property holds 1,857/1,857)"]
tests = ["tests/adapters/wirelog/test_mapper.py::test_request_items_resolve_to_earlier_records"]
since = "0.1.0"

[[rule]]
id = "wirelog.response_echo"
version = 1
class = "D"
status = "active"
statement = "Response i's message is the output of the model call of request i when request i+1 carries it, equal under JCS, right after request i's messages; the call's status is then kept (its output was sent on)."
premises = ["response /<i>/output/message (or the Anthropic response's role and content)", "/<i+1>/messages/<n_i>"]
assumptions = []
code = []
evidence = ["docs/reports/phase10m/README.md §A.3 (1,857/1,857)"]
tests = ["tests/adapters/wirelog/test_mapper.py::test_responses_link_by_echo"]
since = "0.1.0"

[[rule]]
id = "wirelog.last_response_by_position_unverified"
version = 1
class = "I"
status = "active"
statement = "The last response (no later request echoes it) is the output of the last request's model call, by position, and its call is kept."
premises = ["the response log's length and order"]
assumptions = ["wirelog:LockstepLists"]
verification = [{ assumption = "wirelog:LockstepLists", status = "asserted" }]
code = []
evidence = ["deposit:run_channels.py trial()", "deposit:run_trials.py trial()"]
tests = ["tests/adapters/wirelog/test_mapper.py::test_responses_link_by_echo"]
since = "0.1.0"

[[rule]]
id = "wirelog.call_id_unique_match"
version = 1
class = "D"
status = "active"
statement = "A tool result answers the tool call of the immediately preceding response whose provider call id (Converse toolUseId, Anthropic tool_use id) equals the result's, when exactly one call carries that id; its execution and its message are linked by that id, never by position."
premises = ["response tool_use id", "the next request's tool_result id"]
assumptions = []
code = []
evidence = ["C.5.4", "docs/reports/phase10m/README.md §A.3 (2,001/2,001 calls paired exactly once)"]
tests = ["tests/adapters/wirelog/test_mapper.py::test_calls_and_results_pair_by_id"]
since = "0.1.0"

[[rule]]
id = "wirelog.result_block_message"
version = 1
class = "D"
status = "active"
statement = "A wire message carrying several tool-result blocks becomes one AER message per block (a message has one generator, C.3.4), in block order, each keeping its wire position in ext.wirelog.wire_message."
premises = ["/<i>/messages/<k>/content"]
assumptions = []
code = []
evidence = ["DECISIONS D-281 (c)", "docs/reports/phase10m/README.md §A.3 (141 multi-result messages)"]
tests = ["tests/adapters/wirelog/test_mapper.py::test_calls_and_results_pair_by_id"]
since = "0.1.0"

[[rule]]
id = "wirelog.call_without_result"
version = 1
class = "D"
status = "active"
statement = "A tool call whose id no later request answers has no logged result and no recorded execution: it is listed in unexecuted_tool_call."
premises = ["response tool_use id", "every later request's tool_result ids"]
assumptions = []
code = []
evidence = ["docs/reports/phase10m/README.md §A.3 (0 in the snapshot)"]
tests = ["tests/adapters/wirelog/test_mapper.py::test_unanswered_call_is_listed"]
since = "0.1.0"

[[rule]]
id = "wirelog.tool_config_stable"
version = 1
class = "D"
status = "active"
statement = "A request's tool configuration is the tool_definitions fixture of an earlier request when the two are equal under JCS; each model call's tools names it."
premises = ["/<i>/toolConfig (or /<i>/tools)"]
assumptions = []
code = []
evidence = ["docs/reports/phase10m/README.md §A.3 (identical within every run, 3,191 requests)"]
tests = ["tests/adapters/wirelog/test_mapper.py::test_tool_config_is_one_fixture"]
since = "0.1.0"

[[rule]]
id = "wirelog.call_after_context"
version = 1
class = "D"
status = "active"
statement = "A model call occurs after every message its logged request carries (a request cannot hold content not yet produced)."
premises = ["/<i>/messages"]
assumptions = []
code = []
evidence = ["C.8.2"]
tests = ["tests/adapters/wirelog/test_mapper.py::test_model_call_after_its_context"]
since = "0.1.0"

[[rule]]
id = "wirelog.latency_no_clock"
version = 1
class = "D"
status = "active"
statement = "A response's metrics.latencyMs is a provider-reported duration with no stated clock: it is kept verbatim in ext.wirelog.latency_ms and the typed duration is ambiguous; no start or end is computed from it."
premises = ["response /<i>/metrics/latencyMs"]
assumptions = []
code = []
evidence = ["C.8.3", "docs/reports/phase10m/README.md §A.3 (time)"]
tests = ["tests/adapters/wirelog/test_mapper.py::test_latency_is_kept_without_clock"]
since = "0.1.0"

[[rule]]
id = "wirelog.unknown_block"
version = 1
class = "D"
status = "active"
statement = "A content block of a kind the variant does not name (not text, tool use or tool result) is kept verbatim as an other part with its own type and disclosed (wirelog.unknown_block)."
premises = ["the block's keys"]
assumptions = []
code = []
evidence = ["docs/reports/phase10m/README.md §A.3 (0 in the snapshot)"]
tests = ["tests/adapters/wirelog/test_mapper.py::test_unknown_block_is_kept_verbatim"]
since = "0.1.0"

[[rule]]
id = "wirelog.dispatch_logged"
version = 1
class = "D"
status = "active"
statement = "A tool execution exists where the harness's records show the dispatch: the next request carries a result with the call's id (and the dispatcher log lists the call, checked by wirelog.acc.dispatcher_log@1); its status, return value and time are not recorded."
premises = ["the next request's tool_result id", "tools_called.txt"]
assumptions = []
code = []
evidence = ["docs/reports/phase10m/README.md §A.3 (dispatcher log equals the logged calls in 1,334/1,334 runs)"]
tests = ["tests/adapters/wirelog/test_mapper.py::test_executions_are_logged_dispatches"]
since = "0.1.0"

[[rule]]
id = "wirelog.task_prompt_table"
version = 1
class = "D"
status = "active"
statement = "The task id is the profile's [family.wirelog] tasks row whose sha256 equals the SHA-256 of the first user message's text; an unlisted prompt gives the id sha256:<hex> and wirelog.task_prompt_unlisted."
premises = ["/0/messages/0", "profile tasks table"]
assumptions = []
code = []
evidence = ["docs/reports/phase10m/README.md §A.3 (3 distinct task prompts)"]
tests = ["tests/adapters/wirelog/test_mapper.py::test_task_id_from_prompt_table"]
since = "0.1.0"

[[rule]]
id = "wirelog.results_row_join"
version = 1
class = "D"
status = "active"
statement = "The run's row of the deposit's results table is the one whose run_id equals the run directory's name; none or several give wirelog.results_row_missing and no row is used."
premises = ["results.csv run_id", "origin /label"]
assumptions = []
code = []
evidence = ["docs/reports/phase10m/README.md §A.3 (1,334/1,334 join)"]
tests = ["tests/adapters/wirelog/test_mapper.py::test_results_row_join_and_judgements"]
since = "0.1.0"

[[rule]]
id = "wirelog.payload_table"
version = 1
class = "D"
status = "active"
statement = "An arm's payload is the attacks.json retargeted_payloads entry the profile's [family.wirelog] payloads table names for the arm; an arm or key without an entry gives wirelog.payload_entry_missing and no payload fixture."
premises = ["the arm", "profile payloads table", "attacks.json /retargeted_payloads"]
assumptions = []
code = []
evidence = ["docs/reports/phase10m/README.md §A.3 (payload located for every named arm)"]
tests = ["tests/adapters/wirelog/test_mapper.py::test_payload_fixture_and_location"]
since = "0.1.0"

[[rule]]
id = "wirelog.payload_located"
version = 1
class = "D"
status = "active"
statement = "The payload fixture's content is searched verbatim in the request log, first in each request's tool configuration, then in its tool-result blocks; the first hit's pointer and character offset are recorded, and no hit gives wirelog.payload_not_delivered."
premises = ["fixture content", "the request log"]
assumptions = []
code = []
evidence = ["docs/reports/phase10m/README.md §A.3 (975 located, 1 not delivered)"]
tests = ["tests/adapters/wirelog/test_mapper.py::test_payload_fixture_and_location"]
since = "0.1.0"

[[rule]]
id = "wirelog.meta_rewritten"
version = 1
class = "D"
status = "active"
statement = "A meta.json with a source_dir member names an earlier directory of the run: the file was rewritten after the run (renamed into the deposit's layout); disclosed as wirelog.meta_rewritten, its values kept verbatim."
premises = ["meta.json /source_dir"]
assumptions = []
code = []
evidence = ["docs/reports/phase10m/README.md §A.3.5 (358 first-batch runs)"]
tests = ["tests/adapters/wirelog/test_mapper.py::test_first_batch_disclosures"]
since = "0.1.0"

[[rule]]
id = "wirelog.final_texts_not_logged"
version = 1
class = "D"
status = "active"
statement = "A run directory without final_user_text.txt and final_reasoning.txt did not record the harness's split of the final text; disclosed as wirelog.final_texts_not_logged."
premises = ["the run directory's listing"]
assumptions = []
code = []
evidence = ["docs/reports/phase10m/README.md §A.3 (154 runs)"]
tests = ["tests/adapters/wirelog/test_mapper.py::test_first_batch_disclosures"]
since = "0.1.0"

[[rule]]
id = "wirelog.text_file_utf8"
version = 1
class = "D"
status = "active"
statement = "A text or JSON auxiliary that is not strict UTF-8 (or not valid JSON) is listed as an artefact but not read; disclosed as wirelog.unreadable_auxiliary with its role."
premises = ["the auxiliary's bytes"]
assumptions = []
code = []
evidence = ["docs/reports/phase10m/README.md §A.2 (0 in the snapshot)"]
tests = ["tests/adapters/wirelog/test_mapper.py::test_unreadable_auxiliary_is_disclosed"]
since = "0.1.0"

# ------------------------------------------------------------------------------------------------ accounting checks (profile)

[[rule]]
id = "wirelog.acc.dispatcher_log"
version = 1
class = "D"
status = "active"
statement = "Profile accounting check: the dispatcher log has one line '<name> <JSON input with sorted keys>' per logged tool call, in call order (lines written in text mode, LF as CRLF)."
premises = ["tools_called.txt", "the responses' tool_use blocks"]
assumptions = []
code = []
evidence = ["docs/reports/phase10m/README.md §A.3 (1,334/1,334)"]
tests = ["tests/adapters/wirelog/test_mapper.py::test_accounting_checks"]
since = "0.1.0"

[[rule]]
id = "wirelog.acc.usage_totals"
version = 1
class = "D"
status = "active"
statement = "Profile accounting check: meta.json's input_tokens and output_tokens equal the sums of the responses' usage; unverifiable where meta.json has no totals."
premises = ["meta.json /input_tokens, /output_tokens", "responses' usage"]
assumptions = []
code = []
evidence = ["docs/reports/phase10m/README.md §A.3 (1,180/1,180; 154 without totals)"]
tests = ["tests/adapters/wirelog/test_mapper.py::test_accounting_checks"]
since = "0.1.0"

[[rule]]
id = "wirelog.acc.recorded_hijack"
version = 1
class = "D"
status = "active"
statement = "Profile accounting check: the results row's hijack and meta.json's fired_attacker equal whether a logged call of the profile's send tool names the attacks.json attacker address in its recipient argument (case-folded substring)."
premises = ["results.csv hijack", "meta.json /fired_attacker", "attacks.json /attacker_address", "the responses' tool_use blocks"]
assumptions = []
code = []
evidence = ["docs/reports/phase10m/README.md §A.3 (1,334/1,334; 976/976)"]
tests = ["tests/adapters/wirelog/test_mapper.py::test_accounting_checks"]
since = "0.1.0"

[[rule]]
id = "wirelog.acc.final_text"
version = 1
class = "D"
status = "active"
statement = "Profile accounting check: final_message.txt equals the last non-empty response text (its text blocks joined by one space, stripped), written in text mode (LF as CRLF)."
premises = ["final_message.txt", "the responses' text blocks"]
assumptions = []
code = []
evidence = ["docs/reports/phase10m/README.md (1,334/1,334 after the newline translation)"]
tests = ["tests/adapters/wirelog/test_mapper.py::test_accounting_checks"]
since = "0.1.0"

