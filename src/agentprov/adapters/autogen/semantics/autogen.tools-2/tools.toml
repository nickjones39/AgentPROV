# Semantics profile autogen.tools@1: the tool table (docs/architecture D.19.8). Reviewed by hand.
#
# The harness's two tools (src/harness.py Run.make_tools: fetch_document returns the probe document; save_note records
# its argument and returns a constant) and the InjecAgent stub tools of phase 6 (InjecAgentRun.make_tools: a case's user
# tool returns the case's recorded response; an attacker tool records the call and returns a constant). The user and
# attacker sets are the deposit's InjecAgent selection (data/thirdparty/injecagent_dh.jsonl: 17 user tools, 30 attacker
# tools, disjoint). Readings rest on the deposit's harness code (I, autogen.tool_table@1); a name not listed is
# fail-closed (autogen.unknown_tool@1): role ["unknown"], output integrity "unknown". Output integrity is never
# "trusted". `kind` is the tool's place in the harness: harness, injecagent_user or injecagent_attacker.

