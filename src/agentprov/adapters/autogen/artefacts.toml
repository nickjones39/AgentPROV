[[artefact]]
id = "autogen.art.payload_outside_tool_results"
title = "Injection delivered outside tool results"
description = "The probe document enters by four routes: a tool result (entry tool), the task message (user), the ingest agent's turn (agent) or the memory content (memory). Injection markers apply to tool results only, so attack runs of the other entries carry no marker; the payload fixture and the document are recorded, and the task, ingest and memory content are labelled unknown or untrusted. A guard block can also remove the payload from a tool result."
scope = { sources = ["autogen-guard-placement"], profiles = ["autogen-guard-placement"], parts = ["v1.0"] }
cause = "benchmark"
detector = { rule = "autogen.payload_marker@1", class = "D" }
claims = ["artefact.generic.payload_not_reaching_agent#absent", "artefact.generic.payload_not_reaching_agent#no_marker"]
handling = { class = "NR" }
manuscript = true
refs = ["DECISIONS D-306"]

