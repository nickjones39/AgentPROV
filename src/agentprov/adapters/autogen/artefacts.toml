cause = "provider"
detector = { rule = "autogen.response_text_equal@1", class = "D" }
claims = ["artefact.generic.text_encoded_call"]
handling = { class = "NR" }
manuscript = false
refs = ["docs/reports/phase10n/README.md §4"]

