scope = { sources = ["autogen-guard-placement"], profiles = ["autogen-guard-placement"], parts = ["v1.0"] }
cause = "provider"
detector = { rule = "autogen.tool_body_not_entered_unverified@1", class = "I" }
recorded_as = { issues = ["autogen.tool_error_result"] }
handling = { class = "CR", rule = "autogen.tool_body_not_entered_unverified@1" }
expected = [{ snapshot = "autogen-guard-placement:v1.0", count = 4, basis = "phase-10n census", unit = "tool_results", status = "unverified" }]
manuscript = false
refs = ["docs/reports/phase10n/README.md §2.3"]

[[artefact]]
id = "autogen.art.times_in_ext"
