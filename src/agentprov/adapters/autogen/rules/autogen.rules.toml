[[rule]]
id = "autogen.event_attempt"
version = 1
class = "D"
status = "active"
statement = "A run's event rows are those whose run_id equals the row's; where seq restarts at 1 the rows form several attempts, and the row belongs to the last one, whose function-call ids equal the row's request ids in order and whose response texts include every agent text of the row."
premises = ["events /run_id", "events /seq", "events /content", "/messages"]
assumptions = []
code = []
evidence = ["docs/reports/phase10n/README.md §2.3 (3 retried runs; 1,080/1,080 last attempts agree)"]
tests = ["tests/adapters/autogen/test_mapper.py::test_the_last_attempt_is_mapped"]
since = "0.1.0"

[[rule]]
id = "autogen.request_seq"
version = 1
class = "D"
status = "active"
statement = "An llm_response's request_seq names the llm_request it answers (same run, same agent); the pair is one model call, kept because a response was logged."
premises = ["events /request_seq", "events /seq", "events /agent"]
assumptions = []
code = []
evidence = ["docs/reports/phase10n/README.md §2.3 (3,280/3,280 resolve)"]
tests = ["tests/adapters/autogen/test_mapper.py::test_model_calls_pair_by_request_seq"]
since = "0.1.0"

[[rule]]
