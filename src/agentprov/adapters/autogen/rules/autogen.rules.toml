[[rule]]
id = "autogen.task_template_digest"
version = 1
class = "D"
status = "active"
statement = "The composed task text is checked: it equals the recorded task message, or, where the task message is the withheld constant, its digest is a bus guard row's digest of the start message."
premises = ["/messages/0/text", "events /text_sha"]
assumptions = []
code = []
evidence = ["docs/reports/phase10n/README.md §4"]
tests = ["tests/adapters/autogen/test_mapper.py::test_probe_join_and_fixtures"]
since = "0.1.0"

[[rule]]
id = "autogen.guard_text_digest"
version = 1
class = "D"
status = "active"
statement = "A guard row's subject is the one recorded text whose SHA-256 begins with the row's 16 hex digits (64 bits; computed over recorded texts only, never inverted); a message is preferred to a fixture or artefact with the same text, and on the bus, among equal messages, the one the row's agent sent; with no or several remaining candidates the subject is the run, the digest and the candidate count stay in ext."
premises = ["events /text_sha", "recorded texts"]
assumptions = []
code = []
evidence = ["docs/reports/phase10n/README.md §2.3 (20,781 of 20,865 rows match)", "DECISIONS D-304"]
tests = ["tests/adapters/autogen/test_mapper.py::test_guard_judgements_join_by_digest"]
since = "0.1.0"

[[rule]]
id = "autogen.guard_raw_join"
version = 1
class = "D"
status = "active"
statement = "A verdict's detail is the guard log row of the same guard and digest whose own text re-hashes to that digest."
premises = ["guard_raw /guard", "guard_raw /text_sha", "guard_raw /text"]
assumptions = []
code = []
evidence = ["docs/reports/phase10n/README.md §2.3 (7,283/7,283 verify)"]
tests = ["tests/adapters/autogen/test_mapper.py::test_guard_judgements_join_by_digest"]
since = "0.1.0"

[[rule]]
id = "autogen.no_model_call"
version = 1
class = "D"
status = "active"
statement = "A run whose event attempt holds no llm_request made no model call: no agent acted, so the run is outcome_only (40 phase-10 runs stopped by the keyword before any agent spoke)."
premises = ["events /kind"]
assumptions = []
code = []
evidence = ["docs/reports/phase10n/README.md §2.2"]
tests = ["tests/adapters/autogen/test_mapper.py::test_a_run_stopped_before_any_agent_is_outcome_only"]
