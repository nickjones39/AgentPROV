# Rule catalogue `autogen` (docs/architecture D.19.9; D.5.1-D.5.2; C.6.4). AutoGen guard placement (Zenodo 23025259),
# phase 10n.
#
# Data, not code: loaded through importlib.resources by agentprov.aer.rules (no __init__.py in this directory); the home
# is the default `agentprov.adapters.autogen`. Rules are immutable once released: a change of statement, class or
# behaviour mints @n+1 and bumps `version` (AD-18). Nothing is released yet, so this is version 1.
#
# Citation policy (D-24, D-303): three D rules read AutoGen library behaviour from microsoft/autogen at tag python-v0.7.5
# (commit 83afbf5857aac683340d4c692194e548b1e8edda; 21 files fetched with the user's yes, 2026-10-13) and have
# `_unverified` twins; the profile's verified_code names that commit, on the basis of the deposit's requirements.txt pin
# and the phase-0 capture of installed versions. The deposit's own harness (src/harness.py, src/run_experiment.py) is
# documentary evidence ("deposit:<path> <symbol>"): the runs name no commit and the phases ran over days, so every rule
# that rests on harness behaviour is class I with an asserted assumption (as D-193). The other D rules are deterministic
# functions of observed bytes (an id join, a text or digest comparison) and cite the census (docs/reports/phase10n/).

[catalogue]
id = "autogen"
version = 1
format = "agentprov-rule-catalogue/0.1"
issue_codes = ["aborted_attempt_events", "arguments_not_json", "block_effect_in_request_log", "block_subject_not_recorded", "guard_text_unjoined", "passage_not_in_document", "probe_join_missing", "response_unmatched", "task_template_mismatch", "tool_error_result"]
subtypes = ["autogen.probe_document"]
types = ["autogen:memory_query", "autogen:memory_content"]

[[assumption]]
id = "autogen:DepositHarness"
statement = "The runs were produced by the deposit's harness (an AutoGen 0.7.5 RoundRobinGroupChat or SelectorGroupChat of a researcher and a writer, with an optional model-less ingest agent), whose producing code identity is not recorded."

[[assumption]]
id = "autogen:AutoGenVersion"
statement = "The AutoGen packages that produced the runs are the version the deposit pins in requirements.txt and records in the phase-0 capture (0.7.5)."

[[assumption]]
id = "autogen:ConfigModel"
statement = "Every agent and the language-model guard requested the model config.json names, served by a local LM Studio server; one configuration served all phases."

[[assumption]]
id = "autogen:RunSettings"
statement = "A run's placement modes and block guard are the row's modes and block_guard, or, where the row omits them, the values the phase's code sets (every placement observing; the keyword guard in phase 10, the language-model guard in phases 12 and 13)."

[[assumption]]
id = "autogen:TaskTemplate"
statement = "The task is the harness's template for the entry point (the probe document placed in it for the user entry, after the phase-12 prompt defence), or the InjecAgent case's user instruction; the harness, not a person, wrote it."

[[assumption]]
id = "autogen:IngestAgent"
statement = "The ingest agent is the harness's model-less retrieval stage: its one turn is the probe document, not model output."

[[assumption]]
id = "autogen:RequestLogIsInput"
statement = "A logged llm_request lists the messages the guarded model client handed to the model, after any model-placement redaction."

[[assumption]]
id = "autogen:GuardRow"
statement = "A guard row records each guard's verdict on the text one placement handed it; only the block guard's verdict can change a text."

[[assumption]]
id = "autogen:BlockReplaces"
statement = "In block mode a flagged text is replaced by the harness constant '[content withheld by guard]' where the placement holds it (model input, delivered bus message, tool output); the bus never changes its output-stream copies."

[[assumption]]
id = "autogen:ToolBlockOrder"
statement = "Within one agent's tool calls, the tool placement's flagged scans and the withheld results correspond one to one in order."

[[assumption]]
id = "autogen:BodyLogsEntry"
statement = "Every tool body of the harness logs a tool_call event when it is entered; a result with is_error and no such event did not enter the body."

[[assumption]]
id = "autogen:MemoryByHarness"
statement = "A MemoryQueryEvent records the agent's ListMemory adding its stored content to the model context before the call; nothing in the run chose what was stored."

[[assumption]]
id = "autogen:StopReason"
statement = "A stop_reason 'Maximum number of messages ...' is the team's configured message limit; 'Text ... mentioned' is the text-mention termination."

[[assumption]]
id = "autogen:PassageAuthor"
statement = "The inserted passage of an attack probe (AgentDojo injection templates) or an InjecAgent attacker instruction is attacker-supplied material."

[[assumption]]
id = "autogen:WallClock"
statement = "Message created_at and event t are wall-clock instants of object construction and log writing on one host; neither is a dispatch or completion time of a typed activity."

[[assumption]]
id = "autogen:TaskResultOrder"
statement = "TaskResult.messages lists the team's output stream in the order it was emitted."

# ------------------------------------------------------------------------------------------------ D rules on observed bytes
[[rule]]
id = "autogen.label_facets"
version = 1
class = "D"
status = "active"
statement = "The run file's label names its phase and (phase 6) its arm, results/phase<N>[/<arm>]/runs.jsonl; the environment of the task is that phase and arm."
