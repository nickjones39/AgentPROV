tests = ["tests/adapters/autogen/test_mapper.py::test_side_list_check"]
since = "0.1.0"

# ------------------------------------------------------------------------------------------------ D rules on AutoGen code
[[rule]]
id = "autogen.call_id_link"
version = 1
class = "D"
status = "active"
statement = "A FunctionExecutionResult answers the FunctionCall whose id equals its call_id: AutoGen sets call_id from the call on every path, so the result's tool message answers that call and its execution ran that call."
premises = ["/messages/*/raw/content/*/call_id", "/messages/*/raw/content/*/id"]
assumptions = []
code = [
  { repo = "https://github.com/microsoft/autogen", commit = "83afbf5857aac683340d4c692194e548b1e8edda", path = "python/packages/autogen-agentchat/src/autogen_agentchat/agents/_assistant_agent.py", lines = "1536-1620", note = "_execute_tool_call: FunctionExecutionResult(call_id=tool_call.id) on every path" },
]
evidence = ["docs/reports/phase10n/README.md §2.2 (1,120 results, every call_id resolves)"]
tests = ["tests/adapters/autogen/test_mapper.py::test_results_answer_their_calls"]
since = "0.1.0"

[[rule]]
id = "autogen.execution_result_status"
version = 1
class = "D"
status = "active"
statement = "Each FunctionExecutionResult of a ToolCallExecutionEvent records one execution of its call by the agent's workbench; the event is written after all calls of the request returned; is_error false means the tool's run_json returned (status ok); is_error true means undecodable arguments, an unknown tool or an exception in run_json, including argument validation before the tool body."
premises = ["/messages/*/type", "/messages/*/raw/content/*/is_error"]
assumptions = []
code = [
  { repo = "https://github.com/microsoft/autogen", commit = "83afbf5857aac683340d4c692194e548b1e8edda", path = "python/packages/autogen-agentchat/src/autogen_agentchat/agents/_assistant_agent.py", lines = "1183-1240", note = "ToolCallRequestEvent, asyncio.gather of the calls, then one ToolCallExecutionEvent" },
  { repo = "https://github.com/microsoft/autogen", commit = "83afbf5857aac683340d4c692194e548b1e8edda", path = "python/packages/autogen-core/src/autogen_core/tools/_static_workbench.py", lines = "94-124", note = "call_tool: is_error True on any exception of run_json" },
  { repo = "https://github.com/microsoft/autogen", commit = "83afbf5857aac683340d4c692194e548b1e8edda", path = "python/packages/autogen-core/src/autogen_core/tools/_base.py", lines = "179-198", note = "run_json validates the arguments, then runs the tool" },
]
evidence = ["docs/reports/phase10n/README.md §5.5"]
tests = ["tests/adapters/autogen/test_mapper.py::test_results_answer_their_calls"]
since = "0.1.0"

[[rule]]
id = "autogen.arguments_decoded"
version = 1
class = "D"
status = "active"
statement = "A call's args are its arguments string decoded as JSON, the value AutoGen passes to the tool (json.loads before dispatch); the string is kept as args_raw."
premises = ["/messages/*/raw/content/*/arguments"]
assumptions = []
code = [
  { repo = "https://github.com/microsoft/autogen", commit = "83afbf5857aac683340d4c692194e548b1e8edda", path = "python/packages/autogen-agentchat/src/autogen_agentchat/agents/_assistant_agent.py", lines = "1545-1558", note = "arguments = json.loads(tool_call.arguments)" },
]
evidence = ["docs/reports/phase10n/README.md §5.5"]
tests = ["tests/adapters/autogen/test_mapper.py::test_results_answer_their_calls"]
since = "0.1.0"

[[rule]]
id = "autogen.call_id_link_unverified"
version = 1
class = "I"
status = "active"
statement = "The reading of autogen.call_id_link@1 where the code that wrote the record is not among the commits it cites (D-24), so it is inferred, not derived (D.5.4 \"Citation of D rules\"): A FunctionExecutionResult answers the FunctionCall whose id equals its call_id: AutoGen sets call_id from the call on every path, so the result's tool message answers that call and its execution ran that call."
premises = ["/messages/*/raw/content/*/call_id", "/messages/*/raw/content/*/id"]
assumptions = []
code = []
evidence = ["docs/reports/phase10n/README.md §2.2", "D.5.4", "DECISIONS D-24"]
tests = ["tests/adapters/autogen/test_rules.py::test_every_twin_restates_its_d_rule"]
since = "0.1.0"

[[rule]]
id = "autogen.execution_result_status_unverified"
version = 1
class = "I"
status = "active"
statement = "The reading of autogen.execution_result_status@1 where the code that wrote the record is not among the commits it cites (D-24), so it is inferred, not derived (D.5.4 \"Citation of D rules\"): Each FunctionExecutionResult of a ToolCallExecutionEvent records one execution of its call by the agent's workbench; the event is written after all calls of the request returned; is_error false means the tool's run_json returned (status ok); is_error true means undecodable arguments, an unknown tool or an exception in run_json, including argument validation before the tool body."
premises = ["/messages/*/type", "/messages/*/raw/content/*/is_error"]
assumptions = []
code = []
evidence = ["docs/reports/phase10n/README.md §5.5", "D.5.4", "DECISIONS D-24"]
tests = ["tests/adapters/autogen/test_rules.py::test_every_twin_restates_its_d_rule"]
since = "0.1.0"

[[rule]]
id = "autogen.arguments_decoded_unverified"
version = 1
class = "I"
status = "active"
statement = "The reading of autogen.arguments_decoded@1 where the code that wrote the record is not among the commits it cites (D-24), so it is inferred, not derived (D.5.4 \"Citation of D rules\"): A call's args are its arguments string decoded as JSON, the value AutoGen passes to the tool (json.loads before dispatch); the string is kept as args_raw."
premises = ["/messages/*/raw/content/*/arguments"]
assumptions = []
code = []
evidence = ["docs/reports/phase10n/README.md §5.5", "D.5.4", "DECISIONS D-24"]
tests = ["tests/adapters/autogen/test_rules.py::test_every_twin_restates_its_d_rule"]
since = "0.1.0"

