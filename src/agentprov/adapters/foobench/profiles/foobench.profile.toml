# Source profile `foobench`: the self-authored toy format of the future-framework test (docs/architecture D.4, D.12).
#
# Data, not code. No status lives here: the registry is the only status store (R-38, R-45). Any byte change bumps
# `version` (AD-18); nothing is released yet, so it is still 1.

[profile]
id = "foobench"
version = 1
format = "agentprov-source-profile/0.1"
source_id = "foobench"
family = "foobench"
parts = ["fixture"]
title = "FooBench JSONL traces (self-authored toy format for the future-framework test)"
evidence = ["docs/architecture/D_adapters.md D.12"]

[source]
canonical_repo = "https://github.com/nickjones39/AgentPROV"
paper = "none (self-authored test format; not a real framework)"
note = "FooBench does not exist outside this repository. Its fixtures are synthetic and generated by tools/gen_foobench_fixture.py."

[licence]
spdx = "MIT"
holders = ["AgentPROV authors"]
data_licence = "MIT"
policy = "include"
restrictions = []
basis = "self-authored synthetic fixture; the licence of the AgentPROV repository"
attribution = []
unassessed = []

[lineage]
built_on = []
vendored = []
duplicates = []
cited_by = []
content_dedup = "never"

[import]
dialect = "foobench.jsonl"
mapper = "foobench.jsonl"
variants = ["v1"]
include = ["**/*.jsonl"]
exclude = [
  { glob = "**/.DS_Store", code = "select.not_execution_artefact" },
  { glob = "**/._*", code = "select.not_execution_artefact" },
]
# A hand-off writes the sub-agent's events into a second file; it joins the parent's execution unit (role `supporting`).
auxiliary = ["**/sub-*.jsonl"]
# The screenshots are blob payloads: stored with their pinned origins and referenced by digest (`$blob`; D-203).
blobs = ["**/*.png"]

[family.foobench]
main_thread = "main"

# Guard verdicts and approval decisions: the closed tables behind `foobench.verdict_table@1`.
[family.foobench.guard_verdicts]
pass = "allow"
block = "deny"

[family.foobench.approval_decisions]
approve = "allow"
edit = "modify"

# Who an approval's `approver` label is: an actor-table key.
[family.foobench.approvers]
human = "user"

# The actor table behind `foobench.actor_table@1`, keyed by actor id (the labels FooBench events use).
[family.foobench.actors.agent]
kind = "llm_agent"
model_from = "agent_model"

[family.foobench.actors.planner]
kind = "llm_agent"
role = "planner"
model_from = "planner_model"
call_role = "auxiliary"

[family.foobench.actors.researcher]
kind = "llm_agent"
role = "subagent"
model_from = "agent_model"
model_file = "sub"

[family.foobench.actors.user]
kind = "user"

[family.foobench.actors.env]
kind = "tool_runtime"
on_behalf_of = "agent"

[family.foobench.actors.harness]
kind = "harness"
