tests = ["tests/adapters/mcphunt/test_mapper.py::test_runtime_actors_per_server"]
since = "0.1.0"

[[rule]]
id = "mcphunt.canary_flagged"
version = 1
class = "D"
status = "active"
statement = "A trace with any event whose canary_in_args or canary_in_result is true gets one seal issue mcphunt.canary_flagged listing those events' tool executions (detail: a count, never a value): the source's own record that a planted credential was exposed, and the D-289 withholding trigger (RW-1 selects executions by this issue code)."
