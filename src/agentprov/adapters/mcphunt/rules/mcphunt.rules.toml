# Rule catalogue `mcphunt` (docs/architecture D.21.9; D.5.1-D.5.2; C.6.4). MCPHunt, phase 10m.
#
# Data, not code: loaded through importlib.resources by agentprov.aer.rules (no __init__.py in this directory).
# Rules are immutable once released. Version 2 (D-31 bump, regeneration item 40, bug pass BF-30) adds the issue code
# unplaced_message and its rule; version 1 ships under archive/ with the bytes the stored corpora recorded.
#
# Citation policy (D-24): the documents name their producing pipeline only by a 7-hex commit (four distinct), and the
# pipeline code is not part of the dataset, so no rule cites producing code: every rule about harness behaviour is
# class I with an asserted assumption; D rules are deterministic functions of the recorded bytes. Census:
# docs/reports/phase10m/README.md part B. Generated by the phase-10m scratch script g1_mcphunt_rules.py, then reviewed.

[catalogue]
id = "mcphunt"
version = 2
format = "agentprov-rule-catalogue/0.1"
issue_codes = ["canary_flagged", "task_prompt_differs", "args_unparsed", "result_truncated_in_message", "result_differs", "unknown_server", "turn_misaligned", "unplaced_message"]
subtypes = []
types = []

[[assumption]]
id = "mcphunt:DepositHarness"
statement = "The traces were produced by the MCPHunt pipeline (agent loop, MCP servers, labeler), whose producing code is identified only by a 7-hex commit."

[[assumption]]
id = "mcphunt:ModelLabel"
statement = "A trace's model field names the model the pipeline requested."

[[assumption]]
id = "mcphunt:TaskIsUser"
statement = "The user message is the task prompt the pipeline sends for a simulated user."

[[assumption]]
id = "mcphunt:SystemByHarness"
statement = "The system message is the pipeline's system prompt."

[[assumption]]
id = "mcphunt:ContextIsPrefix"
statement = "A model call's input is every message logged before its output."

[[assumption]]
id = "mcphunt:ToolSetOffered"
statement = "Every model call is offered the trace's recorded tool set."

[[assumption]]
id = "mcphunt:EventsInCallOrder"
statement = "Within a turn the pipeline dispatches the calls in order and logs one event per call, in call order."

[[assumption]]
id = "mcphunt:ServerPackages"
statement = "An event's server label names the MCP server package the profile's table lists for it."

[[assumption]]
id = "mcphunt:EventTime"
statement = "An event's timestamp is an epoch-seconds reading taken around the dispatch; whether at its start or end is not recorded."

[[assumption]]
id = "mcphunt:CollectionTime"
statement = "collection_timestamp is when the pipeline recorded the trace, after the run."

[[assumption]]
id = "mcphunt:LoopEnd"
statement = "The last turn's finish reason tells how the loop ended: stop normally, length or tool_calls at a cap, error on an API error."

[[assumption]]
id = "mcphunt:TaintGuard"
statement = "In the taint-tracking arms, sanitized_args is the runtime guard's rewrite of the call's arguments before dispatch."

[[assumption]]
id = "mcphunt:LabelsByLabeler"
statement = "The outcome and risk labels were computed by the pipeline's labeler (rules version in the envelope) for the trace in the same element."

# ------------------------------------------------------------------------------------------------ deterministic (recorded bytes)

[[rule]]
id = "mcphunt.tool_call_id_match"
version = 1
class = "D"
status = "active"
statement = "A tool message answers the tool call whose id equals its tool_call_id; a tool message no call names is an orphan."
premises = ["/messages[]/tool_call_id"]
assumptions = []
code = []
evidence = ["docs/reports/phase10m/README.md §B.3 (129,175/129,175)"]
tests = ["tests/adapters/mcphunt/test_mapper.py::test_calls_events_and_messages_link"]
since = "0.1.0"

[[rule]]
id = "mcphunt.turn_alignment"
version = 1
class = "D"
status = "active"
statement = "turn_log entry k is the model call that produced assistant message k when every entry's n_tool_calls and has_text agree with its message; an extra last entry produced final_message. Disagreement gives mcphunt.turn_misaligned and the links fall back to I."
premises = ["/turn_log"]
assumptions = []
code = []
evidence = ["docs/reports/phase10m/README.md §B.3 (6,786/6,786 agree)"]
tests = ["tests/adapters/mcphunt/test_mapper.py::test_turns_align_with_assistant_messages"]
since = "0.1.0"

[[rule]]
id = "mcphunt.task_prompt_copy"
version = 1
class = "D"
status = "active"
statement = "The user message equals task_prompt; a difference is recorded (mcphunt.task_prompt_differs)."
premises = ["/task_prompt"]
assumptions = []
code = []
evidence = ["docs/reports/phase10m/README.md §B.3 (6,786/6,786)"]
tests = ["tests/adapters/mcphunt/test_mapper.py::test_header_and_task"]
since = "0.1.0"

[[rule]]
id = "mcphunt.defence_label"
version = 1
class = "D"
status = "active"
statement = "defense_id is the trace's defense when it is not 'none', else 'mitigation_prompt:<level>' when mitigation_level is not 'none', else null."
premises = ["/defense, /mitigation_level"]
assumptions = []
code = []
evidence = ["docs/reports/phase10m/README.md §B.3"]
tests = ["tests/adapters/mcphunt/test_mapper.py::test_header_and_task"]
since = "0.1.0"

[[rule]]
id = "mcphunt.result_full_vs_message"
version = 1
class = "D"
status = "active"
statement = "An event's result_full is the execution's returned value; the paired tool message is what the model saw: equal, or a truncated prefix (result_truncated; mcphunt.result_truncated_in_message)."
premises = ["/events[]/result_full, /messages[]/content"]
assumptions = []
code = []
evidence = ["docs/reports/phase10m/README.md §B.3 (128,096 equal, 669 truncated, 410 differ)"]
tests = ["tests/adapters/mcphunt/test_mapper.py::test_calls_events_and_messages_link"]
since = "0.1.0"

[[rule]]
id = "mcphunt.result_message_differs"
version = 1
class = "D"
status = "active"
statement = "A tool message that differs from its event's result_full other than as a truncated prefix is recorded (mcphunt.result_differs); both texts are kept verbatim."
premises = ["/events[]/result_full, /messages[]/content"]
assumptions = []
code = []
evidence = ["docs/reports/phase10m/README.md §B.3 (410 events)"]
tests = ["tests/adapters/mcphunt/test_mapper.py::test_calls_events_and_messages_link"]
since = "0.1.0"

[[rule]]
id = "mcphunt.unreadable_document"
version = 1
class = "D"
status = "active"
statement = "A trace document the streaming reader refuses (any defect, or an element over the limit) is one degenerate execution named by its label (task_id document:<label>); none of its traces is mapped, because the reader fails closed (D-242)."
premises = ["origin /label", "the reader's refusal code"]
assumptions = []
code = []
evidence = ["docs/architecture/D_adapters.md D.21.2", "DECISIONS D-242, D-288"]
tests = ["tests/adapters/mcphunt/test_mapper.py::test_an_unreadable_document_is_one_degenerate_execution"]
since = "0.1.0"

[[rule]]
id = "mcphunt.args_unparsed"
