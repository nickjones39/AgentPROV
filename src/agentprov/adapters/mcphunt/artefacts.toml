# Artefact catalogue `mcphunt` (docs/architecture D.21.11, D.15.2; DECISIONS D-286..D-289). Data, not code.
#
# Every source-data problem of the MCPHunt traces found by the phase-10m census, with its detector, how it is recorded
# and its handling class (D.15.1). Expected counts are the census's; they stay `unverified` until an import confirms
# them. Cases no AER field carries (non-trace files, oversized traces) name a `reserved` rule and claim nothing.

version = 1
family = "mcphunt"
namespaces = ["mcphunt"]

[[artefact]]
id = "mcphunt.art.non_trace_members"
title = "Files that are not traces"
description = "README, croissant.json, crs_audit/, meta/ and recall_evaluation/ are aggregates and documentation outside the include globs; never mapped."
scope = { sources = ["mcphunt"], profiles = ["mcphunt"], parts = ["head"] }
cause = "benchmark"
detector = { rule = "mcphunt.non_trace_member@1", class = "D" }
handling = { class = "FO", rule = "mcphunt.non_trace_member@1" }
expected = [{ snapshot = "mcphunt:head", count = 12, basis = "phase-10m census", unit = "files", status = "unverified" }]
manuscript = false
refs = ["docs/reports/phase10m/README.md part B"]

[[artefact]]
id = "mcphunt.art.oversized_traces"
title = "Traces over the default element limit"
description = "Four traces of 20.5-46.9 MB exceed the 16 MiB element limit; the profile declares 64 MiB (D-288); under the default the four documents (1,977 traces) are refused whole by the streaming reader, which fails closed."
scope = { sources = ["mcphunt"], profiles = ["mcphunt"], parts = ["head"] }
cause = "benchmark"
detector = { rule = "mcphunt.oversized_trace@1", class = "D" }
handling = { class = "FO", rule = "mcphunt.oversized_trace@1" }
expected = [{ snapshot = "mcphunt:head", count = 4, basis = "phase-10m census", unit = "traces", status = "unverified" }]
manuscript = false
refs = ["docs/reports/phase10m/README.md part B"]

[[artefact]]
id = "mcphunt.art.canary_exposure"
title = "Planted credential exposed"
description = "An event whose canary_in_args or canary_in_result is true: the source's own record that a synthetic, credential-shaped canary reached a call or a result. Listed in the seal (mcphunt.canary_flagged) as the D-289 withholding basis; values are never printed or written outside the AER content that must hold them."
scope = { sources = ["mcphunt"], profiles = ["mcphunt"], parts = ["head"] }
cause = "benchmark"
detector = { rule = "mcphunt.canary_flagged@1", class = "D" }
recorded_as = { issues = ["mcphunt.canary_flagged"] }
handling = { class = "FO", rule = "mcphunt.canary_flagged@1" }
expected = [{ snapshot = "mcphunt:head", count = 4595, basis = "phase-10m census", unit = "executions", status = "unverified" }]
manuscript = true
refs = ["docs/reports/phase10m/README.md part B"]

[[artefact]]
id = "mcphunt.art.run_not_ok"
title = "Run ended at a cap or on an error"
description = "The last turn's finish reason is length or tool_calls (the loop's caps) or error (an API error): run status limit or error (class I), incomplete_run disclosed; the finish reason itself is kept on the model call."
scope = { sources = ["mcphunt"], profiles = ["mcphunt"], parts = ["head"] }
cause = "provider"
detector = { rule = "mcphunt.run_end_unverified@1", class = "I" }
recorded_as = { issues = ["incomplete_run"] }
claims = ["artefact.generic.abnormal_finish#length", "artefact.generic.abnormal_finish#error", "artefact.generic.abnormal_finish#tool_calls"]
handling = { class = "CR", rule = "mcphunt.run_end_unverified@1" }
expected = [{ snapshot = "mcphunt:head", count = 545, basis = "phase-10m census", unit = "executions", status = "unverified" }]
manuscript = false
refs = ["docs/reports/phase10m/README.md part B"]

[[artefact]]
id = "mcphunt.art.args_unparsed"
title = "Call arguments the pipeline could not parse"
description = "The pipeline kept args_raw and args_parse_error; the execution's args are ambiguous, the call's arguments string is kept verbatim (args_raw)."
scope = { sources = ["mcphunt"], profiles = ["mcphunt"], parts = ["head"] }
cause = "provider"
detector = { rule = "mcphunt.args_unparsed@1", class = "D" }
recorded_as = { issues = ["mcphunt.args_unparsed"] }
handling = { class = "FO", rule = "mcphunt.args_unparsed@1" }
expected = [{ snapshot = "mcphunt:head", count = 2392, basis = "phase-10m census", unit = "events", status = "unverified" }]
manuscript = false
refs = ["docs/reports/phase10m/README.md part B"]

[[artefact]]
id = "mcphunt.art.result_truncated_in_message"
title = "Tool result truncated for the model"
description = "The tool message is a truncated prefix of the event's result_full (result_truncated): the execution returns the full result, the message holds what the model saw."
scope = { sources = ["mcphunt"], profiles = ["mcphunt"], parts = ["head"] }
cause = "upstream_harness"
detector = { rule = "mcphunt.result_full_vs_message@1", class = "D" }
recorded_as = { issues = ["mcphunt.result_truncated_in_message"] }
handling = { class = "CR", rule = "mcphunt.result_full_vs_message@1" }
expected = [{ snapshot = "mcphunt:head", count = 669, basis = "phase-10m census", unit = "events", status = "unverified" }]
manuscript = false
refs = ["docs/reports/phase10m/README.md part B"]

[[artefact]]
id = "mcphunt.art.result_differs"
title = "Tool message differs from the event result"
description = "The tool message differs from result_full in another way: both kept verbatim, disclosed."
scope = { sources = ["mcphunt"], profiles = ["mcphunt"], parts = ["head"] }
cause = "upstream_harness"
detector = { rule = "mcphunt.result_message_differs@1", class = "D" }
recorded_as = { issues = ["mcphunt.result_differs"] }
handling = { class = "FO", rule = "mcphunt.result_message_differs@1" }
expected = [{ snapshot = "mcphunt:head", count = 410, basis = "phase-10m census", unit = "events", status = "unverified" }]
manuscript = false
refs = ["docs/reports/phase10m/README.md part B"]

[[artefact]]
id = "mcphunt.art.unknown_server"
title = "Call to no known server"
description = "The model named a tool no server offers; the pipeline logged server 'unknown': a runtime actor without code, the tool fail-closed."
scope = { sources = ["mcphunt"], profiles = ["mcphunt"], parts = ["head"] }
cause = "provider"
detector = { rule = "mcphunt.unknown_server@1", class = "D" }
recorded_as = { issues = ["mcphunt.unknown_server"] }
handling = { class = "FO", rule = "mcphunt.unknown_server@1" }
expected = [{ snapshot = "mcphunt:head", count = 11, basis = "phase-10m census", unit = "events", status = "unverified" }]
manuscript = false
refs = ["docs/reports/phase10m/README.md part B"]

[[artefact]]
id = "mcphunt.art.turn_misaligned"
title = "turn_log and messages disagree"
description = "turn_log entries and assistant messages disagree on calls or text: the generator links fall back to class I. None in the snapshot."
scope = { sources = ["mcphunt"], profiles = ["mcphunt"], parts = ["head"] }
cause = "upstream_harness"
detector = { rule = "mcphunt.turn_alignment@1", class = "D" }
recorded_as = { issues = ["mcphunt.turn_misaligned"] }
handling = { class = "FO", rule = "mcphunt.turn_alignment@1" }
manuscript = false
refs = ["docs/reports/phase10m/README.md part B"]

[[artefact]]
id = "mcphunt.art.event_times_ambiguous"
title = "Event and collection times kept raw"
description = "Event timestamps (epoch seconds) and collection_timestamp are kept verbatim; whether a timestamp is a start or an end is not recorded, so typed times are ambiguous; latencies and durations state no clock."
scope = { sources = ["mcphunt"], profiles = ["mcphunt"], parts = ["head"] }
cause = "upstream_harness"
detector = { rule = "mcphunt.event_timestamp_unverified@1", class = "I" }
claims = ["artefact.generic.sentinel_time#unknown_not_recorded", "artefact.generic.sentinel_time#unknown_ambiguous"]
handling = { class = "NR" }
expected = [{ snapshot = "mcphunt:head", count = 6786, basis = "phase-10m census", unit = "executions", status = "unverified" }]
manuscript = false
refs = ["docs/reports/phase10m/README.md part B"]
