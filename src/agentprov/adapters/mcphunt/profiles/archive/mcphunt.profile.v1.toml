# Source profile `mcphunt`: MCPHunt agent traces (HF lihaonan0716/mcphunt-agent-traces @ c4c69322bf9e; docs/architecture
# D.21; DECISIONS D-286..D-289; docs/reports/phase10m/ part B).
#
# Data, not code. No status lives here: the registry is the only status store. Any byte change bumps `version`
# (AD-18); nothing is released yet, so it is still 1. [family.mcphunt] is checked against ../family.schema.json.
#
# 6,786 traces in 20 documents: main 3,615 (5 models x 723), mitigation 2,706 (prompt mitigation M0-M3), live-guard 387
# and browser replication 78 (the runtime taint guard and its baseline). One execution per trace (D-286): the runner
# streams each document and maps one unit per element of /traces (D-323, RB-1), under the raised element limit of
# [import] limits (D-288; D-323, RB-2); tool results over 1 MiB are carved from the trace's byte range (D-218, RB-3).
# The environments plant synthetic credentials: executions with a canary-flagged event are withheld by the issue rule
# (D-289, RW-1/D-311), and the [withhold] shape patterns below are the backstop scan (scope object: the trace documents
# stay private, unflagged executions stay releasable).

[profile]
id = "mcphunt"
version = 1
format = "agentprov-source-profile/0.1"
source_id = "mcphunt"
family = "mcphunt"
parts = ["head"]
title = "MCPHunt agent traces: cross-boundary data propagation in multi-server MCP agents (HF lihaonan0716/mcphunt-agent-traces)"
evidence = ["docs/reports/systematic-search/candidates/phase10e-candidates.md §3.11", "docs/reports/phase10m/README.md"]

