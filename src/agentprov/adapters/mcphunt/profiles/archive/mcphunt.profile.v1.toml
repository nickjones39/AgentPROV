[licence]
spdx = "CC-BY-4.0"
holders = ["Haonan Li, Tianjun Sun, Yongqing Wang, Qisheng Zhang (the dataset's authors)"]
data_licence = "CC-BY-4.0"
policy = "include"
basis = "CC-BY-4.0 in the dataset card at the pinned revision"
attribution = ["Li, H., Sun, T., Wang, Y., Zhang, Q. (2026). MCPHunt Agent Traces. Hugging Face lihaonan0716/mcphunt-agent-traces (CC BY 4.0); arXiv:2604.27819"]
unassessed = ["model-provider terms on redistributing model outputs", "third-party web content in fetch and browser results"]

[lineage]
built_on = []
vendored = []
duplicates = []
cited_by = []
content_dedup = "never"

[import]
dialect = "mcphunt.traces"
mapper = "mcphunt.trace"
variants = ["v2.0.0"]
rules = { aer = 1, mcphunt = 1 }
include = ["main/*.json", "mitigation/*.json", "live_guard_defense/*.json", "browser_replication/*.json"]
layout = "<split>/<model or arm>.json, one execution per element of /traces"
# four traces of 20.5-46.9 MB (D-288): the element limit raised to the calibrated ceiling (D-323)
limits = { max_json_element_bytes = 67108864 }

[family.mcphunt]
streamed_arrays = ["/traces"]
splits = ["main", "mitigation", "live_guard_defense", "browser_replication"]
semantics_profile = { id = "mcphunt.tools", version = 1 }
withhold_basis = "mcphunt.canary_flagged"

# MCP server label -> the package names measurement.mcp_versions uses for it (the memory server was renamed during the
# study: 465 traces name @modelcontextprotocol/server-memory, 6,321 mcp-server-memory).
[family.mcphunt.server_packages]
filesystem = ["@modelcontextprotocol/server-filesystem"]
shell = ["shell-command-mcp"]
sqlite = ["mcp-server-sqlite"]
git = ["mcp-server-git"]
memory = ["mcp-server-memory", "@modelcontextprotocol/server-memory"]
time = ["mcp-server-time"]
fetch = ["mcp-server-fetch"]
browser = ["@playwright/mcp"]

[[family.mcphunt.quirk]]
id = "mcphunt.canary_flagged"
rules = ["mcphunt.canary_flagged@1"]
note = "the D-289 withholding basis; values never printed or written"
observed = { traces = 4595, events_in_result = 14143, events_in_args = 2172 }

[[family.mcphunt.quirk]]
id = "mcphunt.oversized_trace"
rules = []
note = "four traces of 20.5-46.9 MB need max_json_element_bytes = 64 MiB ([import] limits; D-288, D-323)"
observed = { traces = 4, documents = 4 }

[[family.mcphunt.quirk]]
id = "mcphunt.large_tool_result"
rules = []
note = "tool results over 1 MiB (events/*/result_full, up to 43.6 MB) are carved from the trace's byte range (D-218, RB-3)"
observed = { strings = 15, traces = 8, documents = 7 }

[[family.mcphunt.quirk]]
id = "mcphunt.args_unparsed"
rules = ["mcphunt.args_unparsed@1"]
observed = { events = 2392 }

[[family.mcphunt.quirk]]
id = "mcphunt.result_truncated_in_message"
rules = ["mcphunt.result_full_vs_message@1"]
observed = { events = 669, differs = 410 }

[[family.mcphunt.quirk]]
id = "mcphunt.guard_rewrite"
rules = ["mcphunt.taint_guard_unverified@1"]
observed = { events = 245 }

# D-289 option (c), seal-issue trigger (RW-1, D-311): every execution whose AER seal carries mcphunt.canary_flagged (one per
# trace with a canary-flagged event) is withheld with its derived files. The bounded shape patterns below (never a value)
# are the backstop at scope `object`: a hit withholds the raw document, which is kept private in any case.
[withhold]
reason = "secret"
public_note = "planted canary credential (MCPHunt benchmark design); the value is never recorded in a public release"

[[withhold.rules]]
id = "canary-flagged"
issue = "mcphunt.canary_flagged"

[[withhold.rules]]
id = "stripe-live-key"
pattern = "sk_live_[A-Za-z0-9]{16}"
scope = "object"

[[withhold.rules]]
id = "stripe-test-key"
pattern = "sk_test_[A-Za-z0-9]{16}"
scope = "object"

[[withhold.rules]]
id = "aws-access-key-id"
pattern = "AKIA[0-9A-Z]{16}"
scope = "object"

[[withhold.rules]]
id = "slack-token"
pattern = "xox[abpors]-[A-Za-z0-9\\-]{10}"
scope = "object"

[[withhold.rules]]
id = "github-token"
pattern = "gh[pousr]_[A-Za-z0-9]{30}"
scope = "object"

[[withhold.rules]]
id = "private-key-block"
marker = "PRIVATE KEY-----"
scope = "object"
