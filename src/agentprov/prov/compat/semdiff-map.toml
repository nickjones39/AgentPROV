# The semantic diff adprov-v2.3-compat -> agentprov-prov/0.1 (docs/architecture EF E.8.4, J.3.6; R-33). Owner: EF.
#
# Data, not code: read through importlib.resources by agentprov.migration.semdiff (load_map), which checks the closed
# schema below. Gate E (J.3.6), the generated tables of docs/compat/semantic-diff.md (tools/gen_semdiff_tables.py) and
# the manuscript's tab:semdiff (O.4.4, from the gate-E reports) all come from this one file; none is edited by hand.
#
# One [[row]] per v2.3 element (a relation of the builder's rule set R1-R8 of audit/provenance.md §4.1, a node class, a
# node or relation attribute) and one per group of agentprov-prov/0.1 elements that have no v2.3 counterpart (`new`).
#
# Row keys (closed):
#   id             unique row id
#   section        relation | node | attribute: the E.8.4 table the row belongs to
#   v23_element    the v2.3 element as E.8.4 / audit/provenance.md name it
#   one matcher    how gate E counts the row: exactly one of
#                    rule      = R1..R8 | ACT      (a compat edge classified by the recomputed builder predicate)
#                    node      = ag_llm | e_user_query | a_k | e_k | ag_src
#                    attribute = "<name>" (+ optional on = [node classes / relation types]; absent = everywhere)
#                    measure   = an AER measure (agentprov.migration.semdiff.AER_MEASURES) or "statements" (the
#                                agentprov-prov/0.1 statements of the row's targets in the derivation)
#   frozen         {released, converted}: frozen counts from `frozen_source` (absent key = the source records none;
#                  gate E reports the measured value and the full scope reconciles every recorded one, J.3.6)
#   frozen_extra   {<measure> = {released, converted}}: more frozen counts of the row (taint_pairs, overlaps,
#                  entailed_not_asserted, value:<v> = instances whose attribute value is <v>)
#   frozen_source  citation of the frozen counts;  frozen_note: a count the source states only in words
#   recompute      "phase 13": the row's class changed under AD-05 (or differs from the spec text, see note), so its
#                  counts and classes are re-derived at full scope in phase 13 (E.8.4)
#   disposition    J's closed vocabulary: kept | reclassified | moved | replaced | moved-to-assessment | dropped | new
#   targets        agentprov-prov/0.1 catalogue rule ids (engine catalogue `aprov`) that state the counterpart
#   assumptions    adapter catalogue rule ids whose assumptions the counterpart rests on for the two v2.3 trees
#   mentions       rule ids the spec names in the row's text that are not statement-producing targets here
#   bundle         where the counterpart statements land for the two v2.3 trees: core | inference | assessment | none
#   evidence_class the classes they carry there: O | D | I (empty iff bundle = ["none"])
#   content_status the apv: content status the counterpart states (R-08)
#   counterpart    the prose of the generated tables;  note: implementation notes and spec disagreements
#   ef / j         the label of the corresponding row of the E.8.4 table (<table>:<first-cell prefix>) / J.3.6 table

[map]
format = "agentprov-semdiff-map/0.1"
version = 1
from = "adprov-v2.3-compat"
to = "agentprov-prov/0.1"
catalogue = "aprov@1"
trees = ["release", "converted"]

