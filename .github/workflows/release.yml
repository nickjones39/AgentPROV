name: release
# D-1065: the GitHub Release draft of a tag, on manual dispatch only (never push, pull_request or a schedule). It
# gathers the six bundles of a bundles.yml run at that tag (each bundle-report.json must name the tag's version and
# commit with a clean tree, and the package's sha256), builds the sdists and wheels and the source archive from the tag,
# and writes SHA256SUMS over every file (tools/release_assets.py: <sha256>  <name>, LF, sorted), which agentprov update
# reads. The `publish` job, in the environment `release` (the maintainer approves it in the Actions tab), signs
# SHA256SUMS with the secret RELEASE_SIGNING_KEY when it is set (ssh-keygen -Y sign -n file), checks the signature
# against the tag's src/agentprov/update/data/allowed_signers, and creates a **draft** release; the maintainer
# publishes it. Without the secret the release is unsigned, which is refused when the tag's package lists a key.
#
# One-time setup of the signing key (the maintainer, never a session; no private key is ever committed):
#   1. ssh-keygen -t ed25519 -C agentprov-release -N "" -f agentprov-release   (on your own machine)
#   2. GitHub, nickjones39/AgentPROV > Settings > Environments > `release` (required reviewer: you) > Environment
#      secrets > add RELEASE_SIGNING_KEY with the contents of the file agentprov-release (the private key)
#   3. add the line `agentprov-release namespaces="file" <contents of agentprov-release.pub>` to
#      src/agentprov/update/data/allowed_signers and commit it (it ships in the next release's package)
#   4. keep the private key offline (a password manager) or delete it; a lost key is replaced by repeating 1-3
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "the release tag (vX.Y.Z)"
        required: true
      bundles_run_id:
        description: "the id of the bundles.yml run that built the six bundles at this tag (from the run's URL)"
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash  # -eo pipefail

jobs:
  assemble:
    name: assemble (bundles, sdists, wheels, source archive, SHA256SUMS)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # the bundles run's artifacts
    steps:
      - name: The inputs are a release tag and a run id
        env:
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.bundles_run_id }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG"; exit 1; }
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "not a run id: $RUN_ID"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: The checked-out commit is the tag's
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [ "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")" ] \
            || { echo "HEAD is not the commit of tag $TAG"; exit 1; }
          [ "$(git describe --tags --exact-match HEAD)" = "$TAG" ] || { echo "HEAD is not exactly tag $TAG"; exit 1; }
          [ -f "docs/release-notes/$TAG.md" ] || { echo "no docs/release-notes/$TAG.md"; exit 1; }
      - name: The bundles of the given run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: agentprov-gui-*
          path: ${{ runner.temp }}/bundles
          run-id: ${{ inputs.bundles_run_id }}
          github-token: ${{ github.token }}
      - name: Build the sdists, wheels and source archive from the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          uv build --package agentprov-capture --out-dir "$RUNNER_TEMP/dist"
          uv build --package agentprov --out-dir "$RUNNER_TEMP/dist"
          uv build --package agentprov-zenodo --out-dir "$RUNNER_TEMP/dist"
          git archive --format=tar.gz --prefix="AgentPROV-$version/" -o "$RUNNER_TEMP/AgentPROV-$version-source.tar.gz" "$TAG"
      - name: Assemble the release files and SHA256SUMS
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 tools/release_assets.py --tag "$TAG" --commit "$(git rev-parse HEAD)" \
            --bundles "$RUNNER_TEMP/bundles" --dist "$RUNNER_TEMP/dist" \
            --source "$RUNNER_TEMP/AgentPROV-${TAG#v}-source.tar.gz" --out "$RUNNER_TEMP/release/files"
          cp "docs/release-notes/$TAG.md" "$RUNNER_TEMP/release/notes.md"
          cp src/agentprov/update/data/allowed_signers "$RUNNER_TEMP/release/allowed_signers"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: ${{ runner.temp }}/release/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: sign and draft the release (after the maintainer's approval)
    if: github.event_name == 'workflow_dispatch'
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write  # the draft release; nothing else
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
          path: ${{ runner.temp }}/release
      - name: Sign SHA256SUMS when the signing key is configured
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          cd "$RUNNER_TEMP/release"
          keys=$(grep -cvE '^[[:space:]]*(#|$)' allowed_signers || true)
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            if [ "$keys" != "0" ]; then
              echo "the tag's package lists release keys, but RELEASE_SIGNING_KEY is not set: agentprov update would refuse an unsigned release"
              exit 1
            fi
            echo "no signing key configured: SHA256SUMS is published unsigned"
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/release-signing-key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          ssh-keygen -q -Y sign -f "$key" -n file files/SHA256SUMS
          rm -f "$key"
          principal=$(ssh-keygen -Y find-principals -s files/SHA256SUMS.sig -f allowed_signers | head -n 1) \
            || { echo "the signing key is not in the tag's allowed_signers"; exit 1; }
          ssh-keygen -Y verify -f allowed_signers -I "$principal" -n file -s files/SHA256SUMS.sig < files/SHA256SUMS
      - name: Every file matches SHA256SUMS
        run: cd "$RUNNER_TEMP/release/files" && sha256sum --check --strict SHA256SUMS
      - name: The draft release
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/release"
          gh release create "$TAG" --draft --verify-tag --repo "$GITHUB_REPOSITORY" --title "AgentPROV $TAG" \
            --notes-file notes.md files/*
