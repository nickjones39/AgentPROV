[project]
name = "agentprov-zenodo"
version = "0.2.1"
description = "AgentPROV's draft-only Zenodo uploader (D-790, D-870, D-880): unpublished drafts, communities, reserved DOIs and cross-links from deposit drafts made by `agentprov package --deposit`. Never publishes. Standard library for the network; outside the agentprov package (HL H.10.1(1))."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Nicholas Jones" }]
dependencies = ["agentprov==0.2.1"]   # verify, ingest and the keychain client; agentprov never imports this package

[project.scripts]
agentprov-zenodo-draft = "agentprov_zenodo.draft:main"

[project.urls]
Homepage = "https://w3id.org/agentprov/"
Documentation = "https://w3id.org/agentprov/docs/"
Source = "https://github.com/nickjones39/AgentPROV"

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
agentprov = { workspace = true }
