# Corpus spec of `rope` (HL H.1.6; D-44): the data-free build input. `agentprov package` copies this file, CARD.md
# and CHANGES.toml into the sealed corpus's rules/ (a record, AD-14). Identity and selection come from here and from the
# in-package source profile `rope@2` ([import] include/exclude, used because this spec names none); counts are
# computed at sealing, never written here (H.2.1(3)). The origin is the pin the import recorded (D-33).

corpus_id = "rope"
corpus_version = "0.1.0"
title = "ROPE defence-evaluation TraceLogger run logs, including the AutoDojo-attack slice (xhOwenMa/ROPE)"
mode = "import"

[[sources]]
source_id = "rope"
profile = "rope@2"  # D-31: version 1 is archived (profiles/archive/)
parts = ["head"]

[[sources.snapshots]]
snapshot_id = "head"
origin = { kind = "git", repo = "https://github.com/xhOwenMa/ROPE", commit = "64495e16e640d687e06e6b1b6cee6dccc5b9b7cb", subtree = "", subtree_sha1 = "c4df12c3afe361b1923c33a1e6f26c763462dff8" }
alt_origins = []
raw_policy = "include"

[derive]
sem_profiles = ["agentdojo.suites@2"]  # D-31 and item 1
prov_specs = ["agentprov-prov/0.1"]
views = []
options = { context_encoding = "members" }

# LICENSE is ROPE's at the pinned commit (MIT); not in the raw store, supplied at sealing with --licence-file.
[licence]
derived = "inherit"
decided_by = "user, 2026-10-11 (D-44: derived licence inherit for every corpus)"
files = ["LICENSE"]

[layout]
shard_depth = 1

# D-810: persona files this corpus's release scan reads (digests only, never addresses; corpora/personas/). upstream-data:
# addresses in the benchmark's own published data at its pinned commit (synthetic-benchmark). <corpus>.observed: by where an
# address first appears in this corpus's executions: benchmark-input (synthetic-benchmark), model-generated (kept, its own
# triage) and withhold (model output at a public mail provider: sealing withholds the executions that hold one).
# file-name: strings with the shape of an address (a file name) that a person reviewed (false-positive). Observed and
# file-name groups apply to this corpus only.
[scan]
personas = [
  { path = "../personas/agentdojo.personas.toml", sha256 = "sha256:6f11d2054854b6d280c7061829ee941c1fd7e1e58f456cbeeff3ff62606c289a" },
  { path = "../personas/autodojo.personas.toml", sha256 = "sha256:e3844d7d39dd98b1aa35aa05c1c88953c42e45f9a3ba4d21685bc9c85797cb4f" },
  { path = "../personas/rope.personas.toml", sha256 = "sha256:0ce8ba0699a7e6ad08685c4d98a8de689a23299da6afb06804b1bb508b28f6b0" },
  { path = "../personas/rope.observed.personas.toml", sha256 = "sha256:99b9c28ce5aed50252a73ade4ad085174a135642e267a5fd80c6757811c6752c" },
]
