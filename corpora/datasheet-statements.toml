[[statement]]
id = "mcphunt-recompute-needs-d1001"
item = "D-1001 (recompute rebuilds a sealed corpus's ingest-limit overrides from the recorded profile)"
corpora = ["mcphunt"]
section = "known_issues"
decided = "user, D-1001 (2026-10-30, \"Yes to both\"); wording approved by the user 2026-10-30 (\"Yes approve the known issue\", typed in the orchestrator's window)"
source = "docs/architecture/DECISIONS.md D-1001; docs/reports/release/wave-2-pre-release-checks.md, check 7"
text = "Recomputing this corpus needs agentprov with D-1001 or later: the sealed `corpus.json` does not record `mcphunt@3`'s raised ingest limit (`max_json_element_bytes` = {{f:limit}}), so earlier versions, including its building commit `f8b5d62b`, refuse with `corpus.derive.limits_mismatch`; D-1001 rebuilds the limit from the profile and accepts it only when it matches the recorded `limits_sha256`."

[statement.figures]
limit = { value = "64 MiB", source = "profile mcphunt@3 [import] limits (max_json_element_bytes = 67108864; D-288, D-323)" }

