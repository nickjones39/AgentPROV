[[statement]]
id = "agentdyn-suite-fixture-key"
item = "datasheet-items.md row 19"
corpora = ["agentdyn-a", "rope"]
section = "known_issues"
decided = "user, corpus pre-check CC-02 (2026-10-15)"
source = "docs/reports/precheck/cross-cutting.md CC-02; docs/reports/phase10l/routing.md RT-10"
text = "The environment data of the AgentDyn suites holds a private-key-shaped string, a fictional benchmark fixture rather than a real secret. It appears verbatim in the AER and PROV documents of executions whose tools read it ({{f:files}} files across AgentDyn's variants and ROPE's runs of the AgentDyn suites). Release scans report it; each finding is triaged as a synthetic benchmark value, and no execution is withheld for it."

[statement.figures]
