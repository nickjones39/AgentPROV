source = "docs/architecture/DECISIONS.md D-604 item 6 and D-182; docs/architecture/G_security.md G.9.6"
text = "Where this corpus replaces a workstation or cluster account name with a label in its derived records, the label is a short deterministic digest of the name salted with the public profile id, so one name always maps to one label. It hides the name from a reader but not from someone who guesses it: a short or common name can be recovered by trying candidates."

