# Decided datasheet statements (HL H.9; docs/reports/analysis/datasheet-items.md; phase 11 U3).
#
# Data only: `agentprov package` renders into DATASHEET.md exactly the statements whose `corpora` name the corpus being
# sealed (`["*"]`: every corpus), in the named section, followed by their decision and source. A new row, or a row for a
# new corpus, is added here; no code changes (agentprov.corpus.datasheet). The table is a build input beside the corpus
# specs; the sealed manifest records the ids it emitted and this file's sha256 (corpus.json datasheet).
#
# Rules (checked at load and at sealing): every key below is required except `figures`; `section` is one of motivation,
# composition, collection, preprocessing, uses, evidence, integrity, known_issues, distribution, maintenance; the text
# passes the card lint (no digit outside a placeholder except the allow-list of version ids, dates, DOIs, arXiv ids,
# commit SHAs and section numbers; identifiers such as model names go in code spans; no unqualified "reproducible", no
# "lossless"). A number the build cannot compute from corpus.json is a figure `{{f:<name>}}` declared under `figures`
# with its value and the analysis that measured it; it is rendered with that source, never recomputed. `{{v:<pointer>}}`
# inserts a value of corpus.json.
#
# Corpus ids: the analyses' names map to the v0.1 corpora as head -> agentdojo-upstream-head, 2024-06 ->
# agentdojo-upstream-2024-06, ROPE -> rope, AgentDyn -> agentdyn-a, survey -> ast-survey-agentdojo, AgentHarm ->
# ast-survey-agentharm, Mandate -> mandate-agentdojo-eval, adprov-v1 -> adprov-v1-release (D-35, D-44).
#
# TODO(dtap corpus id): phase 10b has not fixed the DTap-Bench corpus id yet; the DTap rows below use `dtap-bench` and
# must be renamed when its corpus spec is committed.

[table]
version = 1

# ---------------------------------------------------------------------------------------------------- items 1 to 4
[[statement]]
id = "core-only-consumers"
item = "datasheet-items.md row 1"
corpora = ["rope", "agentdyn-a", "ast-survey-agentdojo"]
section = "uses"
decided = "user, C4 (2026-10-11)"
source = "docs/reports/analysis/phase10-corpus-analysis.md §9.3 (C4), §4.2"
text = "This corpus uses a profile whose structural rules are inferred (class I): model calls, tool executions and their generation and usage statements sit in the inference bundles, so the core bundle alone is mostly unconnected entities. Analyses of relations must load the core and the inference bundles (and the assessment bundle for policy claims); no union view is shipped."

[[statement]]
id = "agentdyn-gemini-undefended-baseline"
item = "datasheet-items.md row 2 (D-27 c1; examination 2 N3)"
corpora = ["agentdyn-a"]
section = "known_issues"
decided = "user, D-27 c1 (2026-10-11)"
source = "docs/reports/analysis/phase10-examination-2.md §8.3"
text = "In AgentDyn, the three prompt-injection-detector arms of `gemini-2.5-flash` were generated under conditions in which the model answered identical context identically (the arms diverge only where the detectors' decisions differ; {{f:identical}} of {{f:cells}} cells are identical between `PIGuard` and `PromptGuard-2`, including {{f:both_redacted}} where both redacted the same tool outputs). The undefended arm of the same model was run in a separate {{f:window}} window and differs from every detector arm already at the first reply in all {{f:cells}} cells despite identical recorded inputs. Detector-versus-undefended differences for this model therefore combine the defence effect with an unrecorded difference in generation conditions; detector-arm comparisons are paired, and the undefended baseline is flagged."

[statement.figures]
identical = { value = "425", source = "phase10-examination-2.md §8.1" }
cells = { value = "648", source = "phase10-examination-2.md §8.1" }
both_redacted = { value = "174", source = "phase10-examination-2.md §8.1" }
window = { value = "52-minute", source = "phase10-examination-2.md §8.2" }

