[[statement]]
id = "benchmark-and-model-home-paths"
item = "datasheet-items.md row 22 (amended: pre-release checks 2026-10-28, checks 3 and 4c)"
corpora = ["ast-survey-agentharm", "agentdyn-a"]
section = "known_issues"
decided = "user (2026-10-22); amended by the user 2026-10-28 (pre-release checks item 3, approved in the session window)"
source = "docs/reports/bugpass/home-paths-classification.md; docs/reports/release/pre-release-checks.md checks 3 and 4c (counts and ordinals only); DECISIONS D-604 (model text verbatim)"
text = "Some derived records hold home-directory-shaped paths (`/home/<name>`, and once a Windows profile path `C:\\Users\\<name>`). None names a real account. In ast-survey-agentharm, {{f:benchmark}} of the {{f:names}} path names come from the benchmark itself (its public prompts and dataset, or the output of its offline stub tools) and {{f:model}} were invented by the model. In agentdyn-a, the model builds such paths from the suites' fictional user and environment names ({{f:dyn_bench}} of the {{f:dyn_names}} names in the derived records, all supplied by the suite data) or invents them ({{f:dyn_model}}); {{f:dyn_raw}} further names occur only in raw run files of variants this corpus does not import. They are kept verbatim, as all benchmark and model text is, and the release scan triages them as synthetic-benchmark or false-positive findings."

