# Corpus spec of `agentdyn-a` (HL H.1.6; D-44): the data-free build input. `agentprov package` copies this file, CARD.md
# and CHANGES.toml into the sealed corpus's rules/ (a record, AD-14). Identity and selection come from here and from the
# in-package source profile `agentdyn@3` ([import] include/exclude, used because this spec names none); counts are
# computed at sealing, never written here (H.2.1(3)). The origin is the pin the import recorded (D-33).

corpus_id = "agentdyn-a"
corpus_version = "0.1.0"
title = "AgentDyn run logs, variant A (SaFo-Lab/AgentDyn runs/ at 5353cf76)"
mode = "import"

[[sources]]
source_id = "agentdyn"
profile = "agentdyn@3"  # D-31: versions 1 and 2 are archived (profiles/archive/); 3 adds the part history (item 95)
parts = ["a"]

[[sources.snapshots]]
snapshot_id = "a"
origin = { kind = "git", repo = "https://github.com/SaFo-Lab/AgentDyn", commit = "5353cf7615b135cace8d07c8f12dac53a16b6db3", subtree = "runs", subtree_sha1 = "90d6d50d31e14f65b83a59478ceaa9a09badfbd8" }
alt_origins = []
raw_policy = "include"

[derive]
sem_profiles = ["agentdojo.suites@3"]  # regeneration-batch item 27 (b)
prov_specs = ["agentprov-prov/0.1"]
views = []
options = { context_encoding = "members" }

# LICENSE is AgentDyn's at the pinned commit (MIT, the AgentDojo authors' line); supplied at sealing with --licence-file.
[licence]
derived = "inherit"
decided_by = "user, 2026-10-11 (D-44: derived licence inherit for every corpus)"
files = ["LICENSE"]

[layout]
shard_depth = 1

# D-810: persona files this corpus's release scan reads (digests only, never addresses; corpora/personas/). upstream-data:
# addresses in the benchmark's own published data at its pinned commit (synthetic-benchmark). <corpus>.observed: by where an
# address first appears in this corpus's executions: benchmark-input (synthetic-benchmark), model-generated (kept, its own
# triage) and withhold (model output at a public mail provider: sealing withholds the executions that hold one).
# file-name: strings with the shape of an address (a file name) that a person reviewed (false-positive). Observed and
# file-name groups apply to this corpus only.
[scan]
personas = [
  { path = "../personas/agentdyn-a.file-names.personas.toml", sha256 = "sha256:6b0e5811d0123f46693ebe11fd2f1c740a8187985c95c01ddd0eb8b28ab6dbd7" },
  { path = "../personas/agentdojo.personas.toml", sha256 = "sha256:6f11d2054854b6d280c7061829ee941c1fd7e1e58f456cbeeff3ff62606c289a" },
  { path = "../personas/agentdyn.personas.toml", sha256 = "sha256:69d8fe5b1ba00e83a8a352fa1dd6ab812408dd8d01a201ad2e44596d3d8fa3f0" },
  { path = "../personas/agentdyn-a.observed.personas.toml", sha256 = "sha256:7882533f532a1c9a9260e0300ff58768af6c16e0525bd0fbc396a4e25b4f9e0b" },
]
