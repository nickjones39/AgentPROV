[project]
name = "agentprov-capture"
version = "0.1.0"
description = "AgentPROV capture/0.1 raw-evidence event log: model, writer, hash-chain verifier, redaction. Stdlib + rfc8785 only; shared by the AgentPROV core (reader) and the isolated live backends (writer)."
requires-python = ">=3.12"           # live backends run Python 3.12 (AgentDojo 0.1.35 baseline parity)
license = "MIT"
authors = [{ name = "Nicholas Jones" }]
dependencies = ["rfc8785>=0.1.4"]

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"
